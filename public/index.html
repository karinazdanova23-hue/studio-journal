<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Единый журнал · Свободное Пространство</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#20344F">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Единый журнал">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC;
    --paper-line:#E4DCC8;
    --card:#FFFFFF;
    --ink:#2A2822;
    --ink-soft:#79735F;
    --indigo:#33507D;
    --indigo-dark:#20344F;
    --ochre:#B9862B;
    --ochre-bg:#FBF0DC;
    --teal:#3E7D6B;
    --teal-bg:#E4F1EC;
    --brick:#A23E3E;
    --brick-bg:#F7E7E3;
    --plum:#7C5C9E;
    --plum-bg:#EEE7F3;
    --sky:#2E8B9E;
    --sky-bg:#E1F0F2;
    --rose:#C15C7C;
    --rose-bg:#F6E4EA;
    --shadow: 0 1px 2px rgba(42,40,34,0.06), 0 8px 24px rgba(42,40,34,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:
      linear-gradient(var(--paper) 0%, var(--paper) 100%);
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 20px 80px;
  }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
  .wrap{max-width:980px;margin:0 auto;}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}
  .brand h1{font-family:'Space Grotesk',sans-serif;font-size:26px;margin:0;color:var(--indigo-dark);font-weight:700;}
  .icon-btn{
    background:var(--card);border:1px solid var(--paper-line);border-radius:8px;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-soft);font-size:16px;box-shadow:var(--shadow);
  }
  .icon-btn:hover{color:var(--indigo);border-color:var(--indigo);}
  .bell-badge{
    position:absolute;top:-5px;right:-5px;background:var(--brick);color:#fff;font-family:'IBM Plex Mono',monospace;
    font-size:10px;font-weight:600;min-width:16px;height:16px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  }
  .reminder-panel{
    position:absolute;right:20px;top:64px;width:340px;max-width:90vw;background:#fff;border:1px solid var(--paper-line);
    border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,0.18);z-index:60;padding:18px;max-height:70vh;overflow-y:auto;
  }
  .reminder-panel h4{font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:14px 0 8px;}
  .reminder-panel h4:first-child{margin-top:0;}
  .search-cat-label{font-family:'Space Grotesk',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:16px 0 8px;}
  .search-cat-label:first-child{margin-top:0;}
  .reminder-row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #F0EDE3;font-size:13px;cursor:pointer;}
  .reminder-row:last-child{border-bottom:none;}
  .reminder-row:hover{color:var(--indigo);}
  .reminder-row .tag{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .reminder-empty{color:var(--ink-soft);font-size:13px;padding:6px 0;}
  .notify-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--paper-line);font-size:12.5px;}
  .switch{position:relative;width:38px;height:22px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--paper-line);border-radius:20px;cursor:pointer;transition:.15s;}
  .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--indigo);}
  .switch input:checked + .slider:before{transform:translateX(16px);}

  /* Folder tabs */
  nav.tabs{display:flex;gap:4px;margin-top:6px;}
  .tab-btn{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;
    padding:11px 20px 12px;border:1px solid var(--paper-line);border-bottom:none;
    background:#EFEADA;color:var(--ink-soft);cursor:pointer;
    border-radius:10px 10px 0 0;position:relative;top:1px;
    transition:background .15s,color .15s;
  }
  .tab-btn .count{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:rgba(42,40,34,0.08);
    padding:1px 6px;border-radius:20px;margin-left:7px;
  }
  .tab-btn.active{background:var(--card);color:var(--indigo-dark);border-color:var(--paper-line);z-index:2;}
  .tab-btn:not(.active):hover{background:#F3EFE1;color:var(--ink);}

  main.card{
    background:var(--card);border:1px solid var(--paper-line);border-radius:0 12px 12px 12px;
    box-shadow:var(--shadow);min-height:420px;padding:26px;position:relative;
  }
  .ruled{
    background-image: repeating-linear-gradient(var(--card) 0 37px, var(--paper-line) 37px 38px);
  }

  h2.section-title{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 4px;color:var(--indigo-dark);}
  .subtitle{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px;}

  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:9px 16px;
    border-radius:8px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer;
  }
  .btn:hover{background:var(--indigo-dark);}
  .btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--paper-line);}
  .btn.ghost:hover{border-color:var(--indigo);}
  .btn.danger{background:transparent;color:var(--brick);border:1px solid var(--brick-bg);}
  .btn.danger:hover{background:var(--brick-bg);}
  .btn.small{padding:5px 10px;font-size:12.5px;border-radius:6px;}
  select,input,textarea{
    font-family:'Inter',sans-serif;font-size:13.5px;padding:8px 10px;border-radius:7px;
    border:1px solid var(--paper-line);background:#fff;color:var(--ink);width:100%;
  }
  select.invalid,input.invalid,textarea.invalid{
    border-color:var(--brick);box-shadow:0 0 0 3px var(--brick-bg);
  }
  input.mono,textarea.mono{font-family:'IBM Plex Mono',monospace;}
  label{font-size:12px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  .field{margin-bottom:14px;}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;}
  .field-row .field{flex:1;min-width:150px;}

  /* Calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head .month-label{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:var(--indigo-dark);}
  .cal-nav{display:flex;gap:6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:11px;text-align:center;color:var(--ink-soft);font-weight:600;text-transform:uppercase;padding-bottom:4px;}
  .cal-cell{
    border:1px solid var(--paper-line);border-radius:8px;height:84px;padding:6px;cursor:pointer;
    background:#fff;display:flex;flex-direction:column;gap:3px;transition:border-color .15s;overflow:hidden;
  }
  .cal-cell:hover{border-color:var(--indigo);}
  .cal-cell.empty{background:transparent;border:none;cursor:default;}
  .cal-cell.today{background:var(--ochre-bg);border-color:var(--ochre);}
  .cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);flex:none;}
  .cal-cell.today .cal-daynum{color:var(--ochre);font-weight:600;}
  .cal-evt{
    font-size:10.5px;background:var(--indigo);color:#fff;border-radius:4px;padding:2px 5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:none;max-width:100%;
  }
  .cal-evt.cat-work{background:var(--indigo);}
  .cal-evt.cat-personal{background:var(--plum);}
  .cal-evt.cat-vacation{background:var(--sky);}
  .cal-evt.cat-birthday{background:var(--rose);}
  .cal-bday{font-size:10px;font-weight:700;color:var(--rose);background:var(--rose-bg);border-radius:4px;padding:1px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:100%;}
  .cal-evt.cal-task{
    background:#fff;border:1.5px dashed var(--ink-soft);font-weight:600;
  }
  .cal-evt.cal-task.is-done{text-decoration:line-through;opacity:.6;border-style:solid;}
  .cal-more{font-size:10px;color:var(--ink-soft);flex:none;}

  /* Lists */
  .item-list{display:flex;flex-direction:column;gap:10px;}
  .item{
    border:1px solid var(--paper-line);border-radius:9px;padding:12px 14px;display:flex;
    justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;
  }
  .item .main{flex:1;min-width:0;}
  .item .title{font-weight:600;font-size:14.5px;margin-bottom:3px;overflow-wrap:anywhere;word-break:break-word;}
  .item .meta{font-size:12px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere;}
  .item .desc{font-size:13px;color:var(--ink-soft);margin-top:5px;overflow-wrap:anywhere;word-break:break-word;white-space:pre-line;}
  button.is-busy{opacity:.55;cursor:progress;}
  #scrollTopBtn{position:fixed;right:18px;bottom:22px;width:46px;height:46px;border-radius:50%;border:none;background:var(--indigo,#33507d);color:#fff;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.28);z-index:40;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s;}
  #scrollTopBtn.show{opacity:.92;pointer-events:auto;transform:none;}
  #scrollTopBtn:hover{opacity:1;}
  #fabAddTask{position:fixed;right:18px;bottom:80px;height:46px;padding:0 20px;border-radius:23px;border:none;background:var(--teal,#2f7d74);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.28);z-index:40;display:none;}
  #fabAddTask.show{display:block;}
  #fabAddTask:hover{filter:brightness(1.08);}
  textarea.autogrow{min-height:60px;max-height:60vh;resize:vertical;overflow-y:auto;}
  .item .actions{display:flex;gap:6px;flex-wrap:wrap;}
  .task-check{width:19px;height:19px;flex:none;margin-top:2px;accent-color:var(--teal);cursor:pointer;}
  .task-check-locked{opacity:.45;cursor:not-allowed;}
  .task-toggle{
    background:none;border:none;padding:0 5px 0 0;margin:0;cursor:pointer;color:var(--ink-soft);
    font-size:11px;vertical-align:middle;line-height:1;
  }
  .task-toggle:hover{color:var(--indigo);}
  .item.is-done .title{text-decoration:line-through;color:var(--ink-soft);}
  .item.is-done{opacity:.72;}
  .badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .badge.progress{background:var(--ochre-bg);color:var(--ochre);}
  .badge.approval{background:var(--rose-bg);color:var(--rose);}
  .badge.review{background:rgba(51,80,125,0.12);color:var(--indigo);}
  .badge.done{background:var(--teal-bg);color:var(--teal);}
  .badge.prio-high{background:var(--brick-bg);color:var(--brick);}
  .badge.prio-med{background:var(--ochre-bg);color:var(--ochre);}
  .badge.prio-low{background:var(--paper-line);color:var(--ink-soft);}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filters select{width:auto;min-width:150px;}
  .cat-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .cat-filters.block-row{
    background:var(--rose-bg);border:1px solid var(--rose);border-radius:10px;
    padding:10px 12px;margin-bottom:12px;align-items:center;
  }
  .cat-chip{
    display:flex;align-items:center;gap:7px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;
    padding:6px 13px;border-radius:20px;border:1px solid var(--paper-line);background:#fff;color:var(--ink);
    cursor:pointer;transition:opacity .15s,border-color .15s;
  }
  .cat-chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .cat-chip.off{opacity:.4;border-style:dashed;}
  .cat-chip:hover{border-color:var(--indigo);}

  .subtabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--paper-line);padding-bottom:10px;}
  .subtab-btn{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:6px 14px;
    border-radius:20px;border:1px solid var(--paper-line);background:transparent;color:var(--ink-soft);cursor:pointer;
  }
  .subtab-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}

  /* Funds ledger - receipt style */
  .ledger-summary{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .sum-card{
    flex:1;min-width:150px;border:1px solid var(--paper-line);border-radius:10px;padding:14px 16px;background:#fff;
  }
  .sum-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
  .sum-card .val{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;}
  .sum-card.balance{background:var(--indigo);border-color:var(--indigo);}
  .sum-card.balance .label{color:#cdd8e8;}
  .sum-card.balance .val{color:#fff;}
  .sum-card.issued .val{color:var(--teal);}
  .sum-card.spent .val{color:var(--brick);}

  .ledger{border:1px solid var(--paper-line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative;}
  .ledger::before{
    content:"";display:block;height:7px;
    background:
      conic-gradient(var(--paper) 0 25%, transparent 0 50%) 0 0/16px 14px;
  }

  /* Analytics */
  .an-table{border:1px solid var(--paper-line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.an-table-inner{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;}
  table.an-table-inner th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ink-soft);padding:8px 12px;background:#FAF8F2;border-bottom:1px solid var(--paper-line);
  }
  table.an-table-inner td{padding:10px 12px;border-bottom:1px solid #F0EDE3;vertical-align:middle;overflow-wrap:anywhere;}
  table.an-table-inner tr:last-child td{border-bottom:none;}
  .an-name{font-weight:600;}
  .an-num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .an-bar-wrap{display:flex;align-items:center;gap:8px;}
  .an-bar-track{flex:1;height:6px;background:var(--paper-line);border-radius:4px;overflow:hidden;min-width:50px;}
  .an-bar-fill{height:100%;border-radius:4px;}
  table.ledger-table{width:100%;min-width:560px;border-collapse:collapse;font-size:13px;}
  table.ledger-table th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ink-soft);padding:8px 12px;background:#FAF8F2;border-bottom:1px solid var(--paper-line);
  }
  table.ledger-table td{padding:9px 12px;border-bottom:1px solid #F0EDE3;vertical-align:top;overflow-wrap:anywhere;}
  table.ledger-table tr:last-child td{border-bottom:none;}
  .amt-issue{color:var(--teal);font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .amt-expense{color:var(--brick);font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .amt-balance{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .ledger-actions{display:flex;gap:4px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:17px;color:var(--ink);margin-bottom:6px;}

  .saving-spinner{
    display:inline-block;width:11px;height:11px;border-radius:50%;
    border:2px solid var(--paper-line);border-top-color:var(--indigo);
    animation:saving-spin .7s linear infinite;
  }
  @keyframes saving-spin{ to{ transform:rotate(360deg); } }

  .drag-handle{
    cursor:grab;color:var(--ink-soft);font-size:16px;line-height:1;
    padding:4px 2px;touch-action:none;user-select:none;align-self:flex-start;margin-top:2px;
  }
  .drag-handle:active{cursor:grabbing;}
  .item.dragging{opacity:.45;}
  .item.drag-over-top{border-top:3px solid var(--indigo);}
  .item.drag-over-bottom{border-bottom:3px solid var(--indigo);}

  .overdue-reason-box{
    margin-top:8px;padding:10px 12px;border-radius:8px;
    background:rgba(178,58,42,0.08);border:1px solid rgba(178,58,42,0.25);
  }
  .overdue-reason-label{font-size:12.5px;font-weight:600;color:var(--brick);margin-bottom:5px;}
  .overdue-reason-box textarea{width:100%;font-family:inherit;font-size:13px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(32,30,25,0.45);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal{
    background:#fff;border-radius:14px;padding:24px;max-width:460px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);max-height:88vh;overflow-y:auto;
  }
  .modal h3{font-family:'Space Grotesk',sans-serif;margin:0 0 16px;color:var(--indigo-dark);font-size:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  /* Верхняя панель окна: заголовок + главные кнопки. Закреплена сверху, чтобы кнопки были под рукой
     даже когда внутри длинный список задач/полей — не нужно листать вниз. */
  .modal-topbar{position:sticky;top:0;z-index:3;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-24px -24px 16px;padding:16px 24px 12px;border-bottom:1px solid var(--paper-line);border-radius:14px 14px 0 0;}
  .modal-topbar h3{margin:0;}
  .modal-topbar-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .lock-icon{font-size:34px;text-align:center;margin-bottom:10px;}
  .note{font-size:12px;color:var(--ink-soft);background:#FAF8F2;border:1px solid var(--paper-line);border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.5;}

  #toastRoot{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;
    display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .toast{
    background:var(--indigo-dark);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:12px;max-width:min(90vw,480px);
  }
  .toast-retry-btn{
    background:rgba(255,255,255,0.16);color:#fff;border:1px solid rgba(255,255,255,0.4);
    border-radius:6px;padding:4px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none;
  }
  .toast-retry-btn:hover{ background:rgba(255,255,255,0.28); }
  .toast-retry-btn:disabled{ opacity:.6;cursor:default; }

  .lock-screen{text-align:center;padding:60px 20px;}
  .lock-screen .lock-icon{font-size:40px;}
  .lock-screen h3{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:6px 0 4px;}
  .lock-screen p{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px;}
  .lock-screen input{max-width:240px;margin:0 auto 10px;}
  .err-msg{color:var(--brick);font-size:12.5px;margin-top:8px;}

  select[multiple]{min-height:84px;}
  .emp-checklist{
    border:1px solid var(--paper-line);border-radius:8px;padding:6px 10px;max-height:190px;
    overflow-y:auto;display:flex;flex-direction:column;gap:1px;background:#fff;
  }
  .emp-checklist label{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:6px 2px;cursor:pointer;}

<script>
/* ---------------- storage helpers ---------------- */
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }
let pendingSaveCount = 0;
// Сервер отклоняет запись, которая заменяет непустой список (≥5 элементов) пустым — защита от случайного
// стирания. Если человек САМ осознанно делает такое действие (восстановление из файла, удаление целой
// серии), оно выполняется внутри withConfirmEmpty — запросы получают заголовок X-Confirm-Empty.
let confirmEmptyDepth = 0;
async function withConfirmEmpty(fn){
  confirmEmptyDepth++;
  try{ return await fn(); } finally { confirmEmptyDepth--; }
}
function updateSavingIndicator(){
  const el = document.getElementById('savingIndicator');
  if(!el) return;
  el.style.display = pendingSaveCount > 0 ? 'inline-flex' : 'none';
}
// Чтение с ЯВНЫМ статусом — главное, чтобы «ключа нет» и «не удалось прочитать» не путались:
//   {status:'ok', value}   — прочитали;
//   {status:'missing'}     — на сервере такого значения точно нет (404) или оно закрыто для роли (403);
//   {status:'unauth'}      — сессия истекла (показан экран входа);
//   {status:'failed'}      — не удалось прочитать (сервер перезапускается, сеть, 5xx) — это НЕ «пусто».
// Раньше в обоих случаях возвращался null, и при сбое чтения страница принимала это за «данных нет» и
// сама записывала пустые списки поверх настоящих (так 7 октября пропал весь календарь).
let readsInFlight = 0;
async function sGetState(key, shared){
  readsInFlight++;
  try{ return await sGetStateInner(key, shared); } finally { readsInFlight--; }
}
async function sGetStateInner(key, shared){
  if(shared === false){
    try{
      const v = window.localStorage.getItem('lj:'+key);
      return v===null ? {status:'missing'} : {status:'ok', value:v};
    }catch(e){ return {status:'missing'}; }
  }
  const maxAttempts = 3;
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    try{
      const r = await fetch('/api/storage/'+encodeURIComponent(key), {credentials:'include'});
      if(r.status===404 || r.status===403) return {status:'missing'};
      if(r.status===401){ handleSessionExpired(); return {status:'unauth'}; }
      if(r.ok){ const data = await r.json(); return {status:'ok', value:data.value}; }
      if(attempt<maxAttempts){ await sleep(400*attempt); continue; }
      return {status:'failed'};
    }catch(e){
      if(attempt<maxAttempts){ await sleep(400*attempt); continue; }
      return {status:'failed'};
    }
  }
  return {status:'failed'};
}
async function sGet(key, shared){
  const r = await sGetState(key, shared);
  return r.status==='ok' ? r.value : null;
}
async function sSet(key, value, shared){
  if(shared === false){
    try{ window.localStorage.setItem('lj:'+key, value); return true; }catch(e){ return false; }
  }
  pendingSaveCount++; updateSavingIndicator();
  try{
    const maxAttempts = 3;
    for(let attempt=1; attempt<=maxAttempts; attempt++){
      try{
        const r = await fetch('/api/storage/'+encodeURIComponent(key), {
          method:'PUT', credentials:'include',
          headers: confirmEmptyDepth>0 ? {'Content-Type':'application/json','X-Confirm-Empty':'1'} : {'Content-Type':'application/json'},
          body: JSON.stringify({value}),
        });
        if(r.status===401){ handleSessionExpired(); return false; }
        if(r.ok) return true;
        if(r.status===409){
          // Сервер отклонил запись, которая стирает целый список (похоже на случайную потерю данных).
          let msg = 'Изменение отклонено: оно стёрло бы весь список целиком. Обновите страницу и повторите.';
          try{ const j = await r.json(); if(j && j.error) msg = j.error; }catch(e){}
          toast('⚠️ '+msg);
          return false;
        }
        if(r.status>=500 && attempt<maxAttempts){ await sleep(400*attempt); continue; }
        return false;
      }catch(e){
        if(attempt<maxAttempts){ await sleep(400*attempt); continue; }
        console.error('storage set failed', key, e);
        return false;
      }
    }
    return false;
  } finally {
    pendingSaveCount--; updateSavingIndicator();
  }
}
async function sDelete(key, shared){
  if(shared === false){
    try{ window.localStorage.removeItem('lj:'+key); }catch(e){}
    return true;
  }
  pendingSaveCount++; updateSavingIndicator();
  try{
    const maxAttempts = 3;
    for(let attempt=1; attempt<=maxAttempts; attempt++){
      try{
        const r = await fetch('/api/storage/'+encodeURIComponent(key), {method:'DELETE', credentials:'include'});
        if(r.status===401){ handleSessionExpired(); return false; }
        if(r.ok) return true;
        if(r.status>=500 && attempt<maxAttempts){ await sleep(400*attempt); continue; }
        return false;
      }catch(e){
        if(attempt<maxAttempts){ await sleep(400*attempt); continue; }
        return false;
      }
    }
    return false;
  } finally {
    pendingSaveCount--; updateSavingIndicator();
  }
}
function handleSessionExpired(){
  if(state.sessionExpiredHandled) return;
  state.sessionExpiredHandled = true;
  state.loggedInEmployee = null;
  // Закрываем любое открытое модальное окно (форму задачи и т.п.) — иначе человек может не
  // заметить экран входа под ним и продолжать жать «Сохранить», которое будет молча не работать.
  const modalRoot = document.getElementById('modalRoot');
  if(modalRoot) modalRoot.innerHTML = '';
  renderLoginScreen('Сессия истекла — войдите снова. Несохранённые изменения нужно будет повторить после входа.');
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; } // местная дата (не UTC)
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-');
  const months=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
// Дедлайн задачи: дата обязательна, время — необязательное уточнение (task.deadlineTime, "ЧЧ:ММ").
// Принимает объект с полями .deadline/.deadlineTime (задача, либо {deadline, deadlineTime}).
function fmtDeadline(t){
  if(!t || !t.deadline) return '';
  return fmtDate(t.deadline) + (t.deadlineTime ? `, ${t.deadlineTime}` : '');
}
function fmtMoney(n){
  const num = Number(n)||0;
  return num.toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2}) + ' ₽';
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Экранирует текст и превращает ссылки (http/https/www.) в кликабельные <a> — безопасно от XSS,
// т.к. экранирование происходит ДО оборачивания в теги.
function linkifyEscaped(s){
  const escaped = escapeHtml(s);
  const urlRe = /((https?:\/\/|www\.)[^\s<]+)/gi;
  return escaped.replace(urlRe, (match) => {
    // Не захватываем случайную завершающую пунктуацию вроде точки или запятой на конце ссылки
    let url = match;
    let trailing = '';
    while(url.length && /[.,!?;:)\]]$/.test(url)){
      trailing = url.slice(-1) + trailing;
      url = url.slice(0, -1);
    }
    const href = url.startsWith('http') ? url : 'https://' + url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;">${url}</a>${trailing}`;
  });
}
function truncate(str, max){
  if(!str) return '';
  return str.length > max ? str.slice(0, Math.max(1,max-1)).trimEnd()+'…' : str;
}
function isMobileView(){ return window.innerWidth <= 640; }
function calMaxShown(){ return isMobileView() ? 2 : 3; }
function calChipLen(){ return isMobileView() ? 13 : 22; }
// opts.retry — необязательная async-функция: если передана, в уведомлении появляется кнопка
// «Повторить», уведомление держится дольше (чтобы успели заметить и нажать), и по клику заново
// вызывается та же самая функция, что и делала попытку сохранения изначально (со всеми её шагами —
// подтянуть свежие данные с сервера, пересчитать, сохранить), а не просто «отправить тот же запрос».
function toast(msg, opts){
  const el=document.createElement('div');
  el.className='toast';
  const textSpan=document.createElement('span');
  textSpan.textContent=msg;
  el.appendChild(textSpan);
  let timeoutMs=2400;
  if(opts && opts.retry){
    timeoutMs=12000;
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='toast-retry-btn';
    btn.textContent='Повторить';
    btn.onclick=async ()=>{
      btn.disabled=true; btn.textContent='Повтор…';
      try{ await opts.retry(); }finally{ el.remove(); }
    };
    el.appendChild(btn);
  }
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>el.remove(),timeoutMs);
}

/* Custom confirm/prompt dialogs — native window.confirm()/prompt() are blocked
   inside this sandboxed environment, so we render our own. */
function showConfirm(message, confirmLabel){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.className='overlay'; ov.style.zIndex=200;
    ov.innerHTML=`
      <div class="modal" style="max-width:360px;">
        <h3>Подтвердите действие</h3>

          <button class="btn ghost" id="cfNo">Отмена</button>
          <button class="btn danger" id="cfYes">${escapeHtml(confirmLabel||'Удалить')}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const finish=(val)=>{ ov.remove(); resolve(val); };
    ov.querySelector('#cfNo').onclick=()=>finish(false);
    ov.querySelector('#cfYes').onclick=()=>finish(true);
    ov.onclick=(e)=>{ if(e.target===ov) finish(false); };
    document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ finish(false); document.removeEventListener('keydown', esc); } });
  });
}
function showPrompt(title, defaultValue){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.className='overlay'; ov.style.zIndex=200;
    ov.innerHTML=`
      <div class="modal" style="max-width:360px;">

          <button class="btn" id="pmOk">Сохранить</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const input=ov.querySelector('#pmInput');
    setTimeout(()=>{ input.focus(); input.select(); },0);
    const finish=(val)=>{ ov.remove(); resolve(val); };
    ov.querySelector('#pmCancel').onclick=()=>finish(null);
    ov.querySelector('#pmOk').onclick=()=>finish(input.value.trim());
    input.onkeydown=(e)=>{ if(e.key==='Enter') finish(input.value.trim()); if(e.key==='Escape') finish(null); };
    ov.onclick=(e)=>{ if(e.target===ov) finish(null); };
  });
}

/* ---------------- crypto helpers (personal tasks) ---------------- */
function bytesToB64(bytes){ return btoa(String.fromCharCode(...bytes)); }
function b64ToBytes(b64){ return new Uint8Array(atob(b64).split('').map(c=>c.charCodeAt(0))); }

async function deriveKey(password, saltB64){
  const salt = b64ToBytes(saltB64);
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encryptPersonal(tasks, password, saltB64){
  const key = await deriveKey(password, saltB64);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(tasks)));
  return JSON.stringify({iv:bytesToB64(iv), data:bytesToB64(new Uint8Array(ct))});
}
async function decryptPersonal(blobStr, password, saltB64){
  const blob = JSON.parse(blobStr);
  const key = await deriveKey(password, saltB64);
  const iv = b64ToBytes(blob.iv);
  const data = b64ToBytes(blob.data);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function performTaskDeletion(personal, targetTask){
  if(!canDeleteTask(targetTask, personal)){
    toast(whyCantDelete(targetTask));
    return false;
  }
  // Задачи — общий список, и его правят одновременно с разных устройств (см. refreshTasksFromServer).
  // Подтягиваем актуальную версию перед удалением, иначе можем затереть чужие изменения, сделанные
  // за время, пока это устройство ничего не сохраняло.
  await refreshTasksFromServer(personal);
  const all = tasksFor(personal);
  function idsToDelete(rootId){
    let ids=[rootId];
    all.filter(t=>t.parentId===rootId).forEach(c=>{ ids = ids.concat(idsToDelete(c.id)); });
    return ids;
  }
  let idsSet;
  if(targetTask.seriesId){
    const choice = await showSeriesDeleteChoice();
    if(!choice) return false;
    if(choice==='one'){
      idsSet = idsToDelete(targetTask.id);
    } else {
      const seriesTasks = all.filter(t=>t.seriesId===targetTask.seriesId);
      idsSet = [];
      seriesTasks.forEach(st=>{ idsSet = idsSet.concat(idsToDelete(st.id)); });
      idsSet = [...new Set(idsSet)];
    }
  } else {
    const single = idsToDelete(targetTask.id);
    const msg = single.length>1 ? `Удалить задачу вместе с подзадачами (${single.length-1})?` : 'Удалить задачу?';
    if(!(await showConfirm(msg))) return false;
    idsSet = single;
  }
  for(const tid of idsSet){
    const doomed = all.find(x=>x.id===tid);
    if(doomed) await moveToTrash(personal, 'task', doomed);
  }
  // Подтверждение и перенос в корзину уже сделаны выше и не должны повторяться — «хвост»
  // (собственно удаление из списка задач) вынесен отдельно, чтобы кнопка «Повторить» при
  // неудачном сохранении просто пересохраняла его, не показывая диалоги заново.
  async function saveTaskDeletionTail(){
    await refreshTasksFromServer(personal);
    const beforeTasks = tasksFor(personal);
    setTasksFor(personal, beforeTasks.filter(t=>!idsSet.includes(t.id)));
    const ok = await withConfirmEmpty(()=>persistTasksFor(personal)); // человек сам подтвердил удаление
    if(!ok){ setTasksFor(personal, beforeTasks); saveFailedToast(saveTaskDeletionTail); return false; }
    if(!personal) logAudit('task_deleted', `«${targetTask.title}»${idsSet.length>1?` (вместе с подзадачами, всего ${idsSet.length})`:''}`);
    return true;
  }
  return await saveTaskDeletionTail();
}
async function restoreTrashItem(personal, trashId){
  await refreshTrashFromServer(personal);
  const trash = trashFor(personal);
  const entry = trash.find(t=>t.trashId===trashId);
  if(!entry) return false;
  // Восстановление ретраебельно целиком: каждый шаг добавления обратно в свой список — с
  // проверкой «уже там есть?», чтобы повторный вызов (после сбоя на более позднем шаге) не
  // создавал дубликат, а окончательное удаление записи из корзины — последним шагом.
  async function saveRestore(){
    if(entry.type==='task'){
      await refreshTasksFromServer(personal);
      const list = tasksFor(personal);
      if(!list.some(t=>t.id===entry.data.id)) setTasksFor(personal, list.concat([entry.data]));
      const ok = await persistTasksFor(personal);
      if(!ok){ saveFailedToast(saveRestore); return false; }
    } else if(entry.type==='project'){
      await refreshProjectsAndBlocksFromServer(personal);
      const list = projectsFor(personal);
      if(!list.some(p=>p.id===entry.data.id)) setProjectsFor(personal, list.concat([entry.data]));
      const ok = await persistProjectsFor(personal);
      if(!ok){ saveFailedToast(saveRestore); return false; }
    } else if(entry.type==='event'){
      await refreshEventsFromServer(personal);
      const list = eventsFor(personal);
      if(!list.some(e=>e.id===entry.data.id)) setEventsFor(personal, list.concat([entry.data]));
      const ok = await persistEventsFor(personal);
      if(!ok){ saveFailedToast(saveRestore); return false; }
    } else if(entry.type==='fund'){
      const fscope = personal ? 'personal' : 'work';
      await refreshFundsFromServer(fscope);
      const list = fundsFor(fscope);
      if(!list.some(f=>f.id===entry.data.id)) setFundsFor(fscope, list.concat([entry.data]));
      const ok = await persistFundsFor(fscope);
      if(!ok){ saveFailedToast(saveRestore); return false; }
    } else if(entry.type==='idea' && !personal){
      await refreshIdeaBankFromServer();
      if(!state.ideaBankWork.some(i=>i.id===entry.data.id)) state.ideaBankWork = state.ideaBankWork.concat([entry.data]);
      const ok = await saveIdeaBank();
      if(!ok){ saveFailedToast(saveRestore); return false; }
    } else if(entry.type==='employee' && !personal){
      await refreshEmployeesFromServer();
      if(!state.employees.some(e=>e.id===entry.data.id)) state.employees = state.employees.concat([entry.data]);
      const ok = await saveEmployees();
      if(!ok){ saveFailedToast(saveRestore); return false; }
    }
    await refreshTrashFromServer(personal);
    const beforeTrash = trashFor(personal);
    setTrashFor(personal, beforeTrash.filter(t=>t.trashId!==trashId));
    const okTrash = await persistTrashFor(personal);
    if(!okTrash){ setTrashFor(personal, beforeTrash); saveFailedToast(saveRestore); return false; }
    toast('Восстановлено');
    return true;
  }
  return await saveRestore();
}

/* ---------------- export / import ---------------- */
function csvEscape(val){
  const s = String(val==null?'':val);
  return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadTextFile(filename, mime, text){
  const blob = new Blob([text], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportFundsCSV(scope){
  let entries;
  let label;
  if(scope==='all'){
    entries = state.fundsEntries.concat(personalAccessAllowed() ? state.personalFundsEntries : []);
    label = 'все';
  } else {
    entries = fundsFor(scope).slice();
    label = scope==='personal' ? 'личные' : 'рабочие';
  }
  const sorted = entries.sort((a,b)=> a.date===b.date ? a.createdAt-b.createdAt : a.date.localeCompare(b.date));
  let running = 0;
  const header = ['Дата','Тип','Категория','Сумма','Назначение','Комментарий','Чек','Остаток'];
  const lines = [header.map(csvEscape).join(';')];
  sorted.forEach(f=>{
    running += (f.type==='issue' ? Number(f.amount) : -Number(f.amount));
    lines.push([
      f.date,
      f.type==='issue'?'Доход':'Расход',
      (f.scope||'work')==='personal'?'Личные':'Рабочие',
      f.amount,
      f.purpose||'',
      f.comment||'',
      f.receiptUrl||'',
      running.toFixed(2),
    ].map(csvEscape).join(';'));
  });
  const csv = '\uFEFF' + lines.join('\r\n');
  downloadTextFile(`finansy-${label}-${todayISO()}.csv`, 'text/csv;charset=utf-8', csv);
}

// Точечное безопасное восстановление: добавляет блоки/проекты по названию (payload:
// {type:'studio-journal-blocks-projects', blocks:[name,...], projects:[{name, block}, ...]}),
// пропуская те, что уже есть по имени (без учёта регистра/пробелов) — чтобы не плодить дубли и
// не трогать ничего другого (задачи, сотрудников, календарь, финансы остаются как есть).
// Безопасный точечный импорт ТОЛЬКО событий календаря (общих, не личных): сначала подтягивает
// актуальный календарь с сервера, затем ДОБАВЛЯЕТ события из файла, которых там ещё нет (по id или по
// сочетанию дата+время+название — дублей не будет). Ничего не удаляет и не перезаписывает; задач,
// сотрудников, проектов и финансов не касается. При неудаче записи откатывает изменение.
async function importEventsOnly(payload){
  await refreshEventsFromServer(false);
  const before = state.events;
  const sig = e => [e.date, e.startTime||'', (e.title||'').trim().toLowerCase()].join('|');
  const haveIds = new Set(before.map(e=>e.id));
  const haveSigs = new Set(before.map(sig));
  const toAdd = [];
  let skipped = 0;
  (payload.events||[]).forEach(e=>{
    if(!e || !e.id || !e.title || !e.date) return;
    if(haveIds.has(e.id) || haveSigs.has(sig(e))){ skipped++; return; }
    toAdd.push(normEvents([e])[0]); haveIds.add(e.id); haveSigs.add(sig(e));
  });
  if(!toAdd.length) return { added:0, skipped };
  state.events = before.concat(toAdd);
  const ok = await saveEvents();
  if(!ok){ state.events = before; throw new Error('save-failed'); }
  return { added: toAdd.length, skipped };
}
async function importProjectsAndBlocksOnly(payload){
  const norm = s => (s||'').trim().toLowerCase();
  const existingBlockNames = new Set(state.blocksWork.map(b=>norm(b.name)));
  const nameToBlockId = {};
  state.blocksWork.forEach(b=>{ nameToBlockId[norm(b.name)] = b.id; });

  let addedBlocks = 0, addedProjects = 0, skipped = 0;
  const newBlocks = [];
  (payload.blocks||[]).forEach(name=>{
    const key = norm(name);
    if(!key || existingBlockNames.has(key)){ if(key) skipped++; return; }
    const b = {id:uid(), name:String(name).trim()};
    newBlocks.push(b);
    existingBlockNames.add(key);
    nameToBlockId[key] = b.id;
    addedBlocks++;
  });
  state.blocksWork = state.blocksWork.concat(newBlocks);

  const existingProjectNames = new Set(state.projectsWork.map(p=>norm(p.name)));
  const newProjects = [];
  (payload.projects||[]).forEach(p=>{
    const key = norm(p.name);
    if(!key || existingProjectNames.has(key)){ if(key) skipped++; return; }
    const blockId = p.block ? (nameToBlockId[norm(p.block)] || null) : null;
    newProjects.push({id:uid(), name:String(p.name).trim(), blockId});
    existingProjectNames.add(key);
    addedProjects++;
  });
  state.projectsWork = state.projectsWork.concat(newProjects);

  await saveBlocksWork();
  await saveProjectsWork();
  return { addedBlocks, addedProjects, skipped };
}

function generateRecurrenceDates(startISO, repeatType, weekdaySet, untilISO, maxCount){
  maxCount = maxCount || 300;
  const dates = [];
  const until = new Date((untilISO||startISO)+'T00:00:00');
  if(repeatType==='daily' || repeatType==='weekly'){
    let cur = new Date(startISO+'T00:00:00');
    while(cur<=until && dates.length<maxCount){
      const isoWd = cur.getDay()===0?7:cur.getDay();
      if(weekdaySet.has(isoWd)) dates.push(dateToISO(cur));
      cur.setDate(cur.getDate()+1);
    }
  } else if(repeatType==='monthly'){
    let cur = new Date(startISO+'T00:00:00');
    const day = cur.getDate();
    while(cur<=until && dates.length<maxCount){
      dates.push(dateToISO(cur));
      const y = cur.getFullYear(), mo = cur.getMonth()+1;
      const daysInNext = new Date(y, mo+1, 0).getDate();
      cur = new Date(y, mo, Math.min(day, daysInNext));
    }
  } else if(repeatType==='yearly'){
    let cur = new Date(startISO+'T00:00:00');
    const day = cur.getDate();
    while(cur<=until && dates.length<maxCount){
      dates.push(dateToISO(cur));
      const y = cur.getFullYear()+1, mo = cur.getMonth();
      const daysInMonth = new Date(y, mo+1, 0).getDate();
      cur = new Date(y, mo, Math.min(day, daysInMonth));
    }
  }
  return dates;
}

function showLoadProblem(attempt){

  if(!root) return;

    <h3>Загружаем данные…</h3>

    <p class="subtitle" style="margin:0;">Пробуем снова автоматически. Пока данные не загрузятся, ничего не сохраняется и не стирается.</p>
  </div></div>`;
}
function hideLoadProblem(){
  const root = document.getElementById('modalRoot');
  if(root && root.querySelector('#loadProblem')) root.innerHTML = '';
}
// Читает всё нужное при запуске и НЕ возвращается, пока каждое значение не прочитано надёжно (есть
// значение или сервер подтвердил, что его нет). Если сервер недоступен — повторяет попытки, ничего не
// записывая: нельзя принимать сбой чтения за «данных нет» (так пропал календарь 7 октября).
// Возвращает массив значений в порядке LOAD_KEYS (null — значения нет) либо null, если истекла сессия.
async function loadValuesReliably(){
  let attempt = 0;
  while(true){
    attempt++;
    const res = await Promise.all(LOAD_KEYS.map(([k, shared])=>sGetState(k, shared)));
    if(res.some(r=>r.status==='unauth')) return null;
    if(!res.some(r=>r.status==='failed')){
      hideLoadProblem();
      return res.map(r=>r.status==='ok' ? r.value : null);
    }
    showLoadProblem(attempt);
    await sleep(Math.min(2000*attempt, 15000));
  }
}

  state.quickIdeasWork = quickIdeasRaw ? JSON.parse(quickIdeasRaw) : [];
  {

  state.archiveTasks = archTasksRaw ? JSON.parse(archTasksRaw) : [];

async function runArchiveSweep(){
  const cutoffDate = new Date(); cutoffDate.setDate(cutoffDate.getDate()-180);
  const cutoffISO = dateToISO(cutoffDate);
  const toArchiveTasks = state.tasksWork.filter(t=>
    t.status==='done' && t.completedAt && t.completedAt<cutoffISO &&
    !state.tasksWork.some(x=>x.parentId===t.id)
  );
  if(toArchiveTasks.length){
    state.archiveTasks = state.archiveTasks.concat(toArchiveTasks);
    state.tasksWork = state.tasksWork.filter(t=>!toArchiveTasks.includes(t));
    await saveTasksWork();
    await sSet('archive:tasks', JSON.stringify(state.archiveTasks), true);
  }
  const toArchiveEvents = state.events.filter(e=>e.date<cutoffISO);
  if(toArchiveEvents.length){
    state.archiveEvents = state.archiveEvents.concat(toArchiveEvents);
    state.events = state.events.filter(e=>!toArchiveEvents.includes(e));
    await saveEvents();
    await sSet('archive:events', JSON.stringify(state.archiveEvents), true);
  }
}

// Выполнение всех задач проект в архив автоматически не отправляет.
function projectTasksFor(personal, projectId){
  return tasksFor(personal).filter(t=>t.projectId===projectId);
}
function isProjectCompleted(personal, projectId){
  const p = projectsFor(personal).find(x=>x.id===projectId);
  return !!(p && p.archived);
}
function activeProjectsFor(personal){

/* ---------------- blocks (уровень выше проектов; только для рабочих) ---------------- */
function projectsInBlock(blockId){

}
// Проекты без блока — просто blockId нет или он не совпадает ни с одним существующим блоком.
function projectsWithoutBlock(){
  const blockIds = new Set(state.blocksWork.map(b=>b.id));
  return state.projectsWork.filter(p=>!p.blockId || !blockIds.has(p.blockId));
}
// Все задачи блока: и те, что привязаны к нему напрямую, и те, что попадают через проект внутри блока.
function tasksInBlock(blockId){

  return state.tasksWork.filter(t=> t.blockId===blockId || (t.projectId && projIds.has(t.projectId)));
}

// Ручная отправка проекта/блока в архив и возврат обратно.
async function setProjectArchived(personal, projectId, archived){
  await refreshProjectsAndBlocksFromServer(personal);
  const before = projectsFor(personal);
  setProjectsFor(personal, before.map(p=>p.id===projectId ? {...p, archived: archived||undefined} : p));
  const ok = await persistProjectsFor(personal);
  if(!ok){ setProjectsFor(personal, before); saveFailedToast(()=>setProjectArchived(personal, projectId, archived)); return false; }
  const pr = projectsFor(personal).find(p=>p.id===projectId);
  if(!personal && pr) logAudit(archived?'project_archived':'project_unarchived', `«${pr.name}»`);
  toast(archived ? 'Проект отправлен в архив' : 'Проект возвращён из архива');
  return true;
}
async function setBlockArchived(blockId, archived){
  await refreshProjectsAndBlocksFromServer();
  const before = state.blocksWork;
  state.blocksWork = before.map(b=>b.id===blockId ? {...b, archived: archived||undefined} : b);
  const ok = await saveBlocksWork();
  if(!ok){ state.blocksWork = before; saveFailedToast(()=>setBlockArchived(blockId, archived)); return false; }
  const bl = state.blocksWork.find(b=>b.id===blockId);
  if(bl) logAudit(archived?'block_archived':'block_unarchived', `«${bl.name}»`);
  toast(archived ? 'Блок отправлен в архив' : 'Блок возвращён из архива');
  return true;
}

// Разовая синхронизация для УЖЕ существующих задач (созданных до появления блоков или подзадач с наследованием):
// 1) если у задачи есть проект, но нет блока — подставляем блок этого проекта;
// 2) если у задачи есть родитель — подтягиваем актуальные проект и блок от родителя (вверх по всей цепочке).
// Возвращает {changed: число обновлённых задач} или null при сбое сохранения.
async function syncTaskBlocksAndProjects(){
  await refreshTasksFromServer(false);
  const before = state.tasksWork;
  const byId = {};
  before.forEach(t=>{ byId[t.id]=t; });

  // Шаг 1: у корневых задач с проектом, но без блока — подставляем блок проекта.
  let step1 = before.map(t=>{
    if(!t.parentId && t.projectId && !t.blockId){
      const proj = state.projectsWork.find(p=>p.id===t.projectId);
      if(proj && proj.blockId) return {...t, blockId: proj.blockId};
    }
    return t;
  });
  const step1ById = {};
  step1.forEach(t=>{ step1ById[t.id]=t; });

  // Шаг 2: у подзадач (любой глубины) — берём проект/блок от самого верхнего предка.
  function resolveRoot(t){
    let current = t;
    const seen = new Set();
    while(current.parentId && step1ById[current.parentId] && !seen.has(current.parentId)){
      seen.add(current.parentId);
      current = step1ById[current.parentId];
    }
    return current;
  }
  let changed = 0;
  const step2 = step1.map(t=>{
    if(!t.parentId) return t;
    const root = resolveRoot(t);
    if(root.id===t.id) return t;
    if(t.projectId!==root.projectId || t.blockId!==root.blockId){
      changed++;
      return {...t, projectId: root.projectId||null, blockId: root.blockId||null};
    }
    return t;
  });
  // Считаем и изменения из шага 1 (корневые задачи, которым подставили блок)
  step1.forEach((t,i)=>{ if(!t.parentId && t.blockId!==before[i].blockId) changed++; });

  if(!changed) return {changed:0};
  setTasksFor(false, step2);
  const ok = await saveTasksWork();
  if(!ok){ setTasksFor(false, before); return null; }
  logAudit('sync_blocks_projects', `Обновлено задач: ${changed}`);
  return {changed};
}

// Ищет конфликт дедлайна с отпуском сотрудника: попадает ли дедлайн на сам отпуск,
// или отпуск начинается в течение недели после дедлайна (рискованно — не успеет доделать/сдать).
// Возвращает текст предупреждения или null, если конфликта нет.
// Непрерывные периоды отпуска сотрудника (подряд идущие дни склеиваются)
function vacationBlocksOf(empId){
  const vacationDates = state.events
    .filter(e=>e.category==='vacation' && e.employeeIds && e.employeeIds.includes(empId))
    .map(e=>e.date).filter(Boolean).sort();
  const blocks = [];
  vacationDates.forEach(d=>{
    const last = blocks[blocks.length-1];
    if(last){
      const diffDays = Math.round((new Date(d)-new Date(last.end))/86400000);
      if(diffDays<=1){ if(d>last.end) last.end = d; return; }
    }
    blocks.push({start:d, end:d});
  });
  return blocks;
}
function vacationBlockOn(empId, iso){
  return vacationBlocksOf(empId).find(b=>iso>=b.start && iso<=b.end) || null;
}
function dayAfterISO(iso){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+1); return dateToISO(d); }
// Информация об отпуске исполнителя относительно дедлайна: {inside, start, end, after, text} или null.
function findVacationInfo(assigneeId, deadline){
  if(!assigneeId || !deadline) return null;
  for(const b of vacationBlocksOf(assigneeId)){
    if(deadline>=b.start && deadline<=b.end) return {inside:true, start:b.start, end:b.end, after:dayAfterISO(b.end)};
    if(deadline<b.start){
      const diffDays = Math.round((new Date(b.start)-new Date(deadline))/86400000);
      if(diffDays<=7) return {inside:false, start:b.start, end:b.end, text:`Через ${diffDays} дн. после дедлайна сотрудник уходит в отпуск (с ${fmtDate(b.start)}) — может не успеть.`};
    }
  }
  return null;
}

// Пересекаются ли по времени два интервала. Событие без времени окончания считаем «точкой» —
// конфликт только если она попадает внутрь чужого интервала (или совпадает с чужой точкой).
function timeRangesOverlap(aStart, aEnd, bStart, bEnd){
  const as = aStart || '00:00', ae = aEnd || aStart || '23:59';
  const bs = bStart || '00:00', be = bEnd || bStart || '23:59';
  const aIsPoint = as===ae, bIsPoint = bs===be;
  if(aIsPoint && bIsPoint) return as===bs;
  if(aIsPoint) return as>=bs && as<be;
  if(bIsPoint) return bs>=as && bs<ae;
  return as<be && bs<ae;
}
function canSeeEvent(e){
  // Отпуска — видны всем (информационно, не требует участия).
  if(e.category==='vacation') return true;
  // Дни рождения — тоже видны всем, чтобы никто не забыл поздравить.
  if(e.category==='birthday') return true;
  // Личные дела Карины — уже отдельно защищены (personalAccessAllowed), доступ не по участникам.
  if(e.category==='personal') return true;
  // Руководитель может включить полное расписание — видит все планёрки/встречи/события.
  if(state.calendarFullView && hasRole('Руководитель')) return true;
  const participants = e.employeeIds || [];
  // Сам участник встречи всегда видит её.
  if(state.currentUserId && participants.includes(state.currentUserId)) return true;
  // Ассистент дополнительно всегда видит всё, где участвует Руководитель.
  if(hasRole('Ассистент')){
    const leaderIds = state.employees.filter(emp=>emp.role==='Руководитель').map(emp=>emp.id);
    if(participants.some(id=>leaderIds.includes(id))) return true;
  }
  return false;
}
function allVisibleEvents(){
  const sharedVisible = state.events.filter(e=>e.category!=='personal' && canSeeEvent(e));

// События для календаря и окна дня. Если выбраны сотрудники — показываем события, где участвует
// любой из них (даже если вы сами не участник); отпуска и дни рождения видны всем как и раньше.

  const ids = selectedEventOwnerIds();

  const shared = state.events.filter(e=>{
    if(e.category==='personal') return false;
    if(e.category==='vacation' || e.category==='birthday') return true;
    return (e.employeeIds||[]).some(id=>ids.includes(id));
  });
  return shared.concat(personalAccessAllowed() ? state.personalEvents : []);
}

async function refreshPersonalArchiveFromServer(){
  const [tRaw, eRaw] = await Promise.all([
    sGet('personal:archiveTasks', true),
    sGet('personal:archiveEvents', true),
  ]);
  if(tRaw !== null){ try{ state.personalArchiveTasks = JSON.parse(tRaw); }catch(e){} }
  if(eRaw !== null){ try{ state.personalArchiveEvents = JSON.parse(eRaw); }catch(e){} }
}
async function pruneAndArchivePersonal(){
  await refreshTrashFromServer(true);
  await refreshTasksFromServer(true);
  await refreshEventsFromServer(true);
  await refreshPersonalArchiveFromServer();
  let trashChanged = false, tasksChanged = false, eventsChanged = false;
  const cutoff = Date.now() - 30*24*60*60*1000;
  const beforeTrash = state.personalTrash.length;
  state.personalTrash = state.personalTrash.filter(t=>t.deletedAt>=cutoff);
  if(state.personalTrash.length!==beforeTrash) trashChanged = true;

  const cutoffDate = new Date(); cutoffDate.setDate(cutoffDate.getDate()-180);
  const cutoffISO = dateToISO(cutoffDate);
  const toArchiveTasks = state.personalTasks.filter(t=>
    t.status==='done' && t.completedAt && t.completedAt<cutoffISO &&
    !state.personalTasks.some(x=>x.parentId===t.id)
  );
  if(toArchiveTasks.length){
    state.personalArchiveTasks = state.personalArchiveTasks.concat(toArchiveTasks);
    state.personalTasks = state.personalTasks.filter(t=>!toArchiveTasks.includes(t));
    tasksChanged = true;
  }
  const toArchiveEvents = state.personalEvents.filter(e=>e.date<cutoffISO);
  if(toArchiveEvents.length){
    state.personalArchiveEvents = state.personalArchiveEvents.concat(toArchiveEvents);
    state.personalEvents = state.personalEvents.filter(e=>!toArchiveEvents.includes(e));
    eventsChanged = true;
  }
  if(trashChanged) await savePersonalTrash();
  if(tasksChanged){ await savePersonalTasks(); await savePersonalArchiveTasks(); }
  if(eventsChanged){ await savePersonalEvents(); await savePersonalArchiveEvents(); }
}

async function attemptPersonalMigration(password){
  try{
    const blobRaw = await sGet('tasks:personal:blob', true);
    if(!blobRaw){
      state.personalMigrationNeeded = false;
      await sSet('settings:personalMigrated', 'yes', true);
      return true;
    }
    const parsed = await decryptPersonal(blobRaw, password, state.personalSalt);
    if(Array.isArray(parsed)){
      state.personalTasks = parsed;
    } else {
      state.personalTasks = parsed.tasks||[];
      state.personalProjects = parsed.projects||[];
      state.personalTrash = parsed.trash||[];
      state.personalFundsEntries = parsed.funds||[];
      state.personalEvents = parsed.events||[];
      state.personalArchiveTasks = parsed.archiveTasks||[];
      state.personalArchiveEvents = parsed.archiveEvents||[];
    }
    await savePersonalData();
    state.personalMigrationNeeded = false;
    await sSet('settings:personalMigrated', 'yes', true);
    await migrateLegacyPersonalFunds();
    await migrateLegacyPersonalEvents();
    await pruneAndArchivePersonal();
    return true;
  }catch(e){
    return false;
  }
}
async function skipPersonalMigration(){
  state.personalMigrationNeeded = false;
  await sSet('settings:personalMigrated', 'yes', true);
  await migrateLegacyPersonalFunds();
  await migrateLegacyPersonalEvents();
  await pruneAndArchivePersonal();
}

// Есть ли у задачи подзадача, которая ещё не в статусе "Готово" — в том числе вернувшаяся
// исполнителю на доработку (это тоже статус "progress", просто с reworkNote). Пока такая
// подзадача не закрыта, саму задачу нельзя отмечать выполненной.
function hasOpenSubtasks(t, personal){
  if(!t || !t.id) return false;
  return tasksFor(personal).some(c=>c.parentId===t.id && c.status!=='done' && c.status!=='review');
}
// Значок «есть подзадачи»: показывает, сколько подзадач ещё не закрыто (пока они открыты,
// саму задачу отметить выполненной нельзя).
// Пометка «чек-лист» у задач и подзадач, созданных из чек-листа.
function checklistBadgeHtml(t){
  if(t && t.b2bLeadId) return `<span class="badge" style="background:rgba(60,120,110,0.14);color:var(--teal);" title="Задача по заявке B2B — этап меняется во вкладке B2B">🤝 B2B</span>`;
  return (t && t.fromChecklist) ? `<span class="badge" style="background:rgba(51,80,125,0.12);color:var(--indigo);" title="Создана из чек-листа">📋 чек-лист</span>` : '';
}
function subtasksBadgeHtml(t, personal){
  if(!t || !t.id) return '';
  const kids = tasksFor(personal).filter(c=>c.parentId===t.id);
  if(!kids.length) return '';
  const open = kids.filter(c=>c.status!=='done').length;
  return open
    ? `<span class="badge" style="background:rgba(176,74,46,0.12);color:var(--brick);" title="Пока подзадачи не выполнены, задачу нельзя отметить выполненной">🧩 подзадачи: не выполнено ${open} из ${kids.length}</span>`
    : `<span class="badge" style="background:rgba(46,125,110,0.12);color:var(--teal);">🧩 подзадачи выполнены (${kids.length})</span>`;
}
function canCompleteTask(t, personal){
  if(!t) return true;
  if(hasOpenSubtasks(t, personal)) return false;
  if(personal) return true;
  if(!t.assigneeId) return true;
  return !!state.currentUserId && state.currentUserId === t.assigneeId;
}
function canDeleteTask(t, personal){
  if(personal) return true;
  if(!t || !t.creatorId) return true;
  return !!state.currentUserId && state.currentUserId === t.creatorId;
}
// Прикреплённые к задаче ссылки. Раньше было одно поле `link` — старые задачи так и хранятся;
// новые сохраняются в массиве `links`, куда попадает даже одна ссылка. Эта функция читает оба
// варианта, чтобы старые задачи не потеряли свою единственную ссылку после обновления.
function taskLinks(t){
  if(!t) return [];
  if(Array.isArray(t.links) && t.links.length) return t.links;
  return t.link ? [t.link] : [];
}
// Готовый HTML-блок со всеми прикреплёнными ссылками задачи — используется во всех местах,
// где показываются задачи (Обзор, список задач, отчёты), чтобы вёрстка была одинаковой.
function taskLinksHtml(t){
  const links = taskLinks(t);
  if(!links.length) return '';
  const items = links.map((l,i)=>`📎 <a href="${escapeHtml(l)}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;" onclick="event.stopPropagation()">${links.length>1?`Файл ${i+1}`:'Прикреплённый файл'}</a>`).join('&nbsp;&nbsp;');
  return `<div class="desc">${items}</div>`;
}
function whyCantDelete(t){
  if(!state.currentUserId) return 'Сначала укажите, кто вы — кнопка «🙋 Кто я?» в шапке.';
  return `Удалить задачу может только тот, кто её поставил — ${empName(t.creatorId)}.`;
}
function canEditTask(t, personal){
  if(personal) return true;
  if(!t) return true;
  if(!state.currentUserId) return false;
  // Руководитель и Ассистент могут редактировать любую рабочую задачу — например, чтобы
  // разнести существующие задачи по блокам и проектам, даже если ставил их не он.
  if(hasRole('Руководитель','Ассистент')) return true;
  // Любой постановщик может редактировать задачу, которую сам поставил (в том числе после сохранения).
  if(t.creatorId && state.currentUserId === t.creatorId) return true;
  // Исполнитель может править только «самостоятельно поставленные» задачи.
  return !!t.selfAssigned && state.currentUserId === t.assigneeId;
}
function whyCantEdit(t){
  if(!state.currentUserId) return 'Сначала укажите, кто вы — кнопка «🙋 Кто я?» в шапке.';
  return `Редактировать задачу может только тот, кто её поставил${t&&t.creatorId?' — '+empName(t.creatorId):''}, либо Руководитель/Ассистент.`;
}
function whyCantComplete(t, personal){
  if(!state.currentUserId) return 'Сначала укажите, кто вы — кнопка «🙋 Кто я?» в шапке.';
  if(t && t.assigneeId && !(state.currentUserId === t.assigneeId)) return `Отметить выполненной может только исполнитель — ${empName(t.assigneeId)}.`;
  if(hasOpenSubtasks(t, personal)) return 'Внутри есть незавершённая подзадача (или подзадача, вернувшаяся на доработку) — сначала выполните её и отправьте на проверку.';
  return `Отметить выполненной может только исполнитель — ${empName(t&&t.assigneeId)}.`;
}
function withStatus(t, newStatus, comment, completionLink, overdueReason){
  if(newStatus==='done' && t.status!=='done') return {...t, status:newStatus, completedAt: todayISO(), submittedAt: todayISO(), completionComment: comment||t.completionComment||'', completionLink: completionLink!==undefined ? completionLink : (t.completionLink||''), overdueReason: overdueReason!==undefined ? overdueReason : (t.overdueReason||'')};
  if(newStatus!=='done') return {...t, status:newStatus, completedAt:null, submittedAt:null, completionComment:'', completionLink:''};
  return {...t, status:newStatus};
}
// Исполнитель отмечает "сделано" -> обычно уходит не сразу в "Готово", а на проверку постановщику.
// Исключение: если человек поставил задачу сам себе (постановщик = исполнитель), проверять
// самого себя бессмысленно — задача сразу становится "Готово".
function withStatusReview(t, comment, completionLink, overdueReason){
  const kidsOnReview = state.tasksWork.concat(state.personalTasks).some(c=>c.parentId===t.id && c.status==='review');
  if(t.creatorId && t.assigneeId && t.creatorId===t.assigneeId && !kidsOnReview){
    return withStatus(t, 'done', comment, completionLink, overdueReason);
  }
  return {...t, status:'review', submittedAt: todayISO(), completionComment: comment||t.completionComment||'', completionLink: completionLink!==undefined ? completionLink : (t.completionLink||''), overdueReason: overdueReason!==undefined ? overdueReason : (t.overdueReason||''), reworkNote:''};
}
function canReviewTask(t, personal){
  if(personal) return true;
  if(!t || !t.creatorId) return true;
  return !!state.currentUserId && state.currentUserId === t.creatorId;
}
function whyCantReview(t){
  if(!state.currentUserId) return 'Сначала укажите, кто вы — кнопка «🙋 Кто я?» в шапке.';
  return `Принять или вернуть на доработку может только тот, кто поставил задачу — ${empName(t.creatorId)}.`;
}
async function approveTask(personal, id){
  const target0 = tasksFor(personal).find(t=>t.id===id);
  if(!target0 || !canReviewTask(target0, personal)){ toast(whyCantReview(target0||{})); return; }
  // Подтягиваем свежий список перед сохранением — иначе «Принять» с телефона/вкладки, которая давно
  // висела открытой, может затереть изменения, сохранённые кем-то другим в это же время.
  await refreshTasksFromServer(personal);
  const before = tasksFor(personal);
  const target = before.find(t=>t.id===id);
  if(!target || !canReviewTask(target, personal)){ toast(whyCantReview(target||{})); return; }
  if(before.some(c=>c.parentId===id && c.status!=='done')){ toast('Сначала примите все подзадачи — потом можно принять главную задачу.'); return; }
  const updated = before.map(t=>t.id===id?{...t, status:'done', completedAt:todayISO(), submittedAt: t.submittedAt || todayISO(), reworkNote:'', approvedAt:todayISO(), approvedBy:state.currentUserId}:t);
  setTasksFor(personal, updated);
  const ok = await persistTasksFor(personal);
  if(!ok){ setTasksFor(personal, before); saveFailedToast(()=>approveTask(personal, id)); return; }
  await maybeOfferPurchaseExpense(updated.find(t=>t.id===id), personal);
  toast('Задача принята и закрыта');
  render();
}
async function reworkTask(personal, id){
  const target0 = tasksFor(personal).find(t=>t.id===id);
  if(!target0 || !canReviewTask(target0, personal)){ toast(whyCantReview(target0||{})); return; }
  const details = await requestReworkDetails(target0);
  if(details===null) return;
  // Дедлайн необязательно менять — если оставили пустым/как было, работаем со старым.
  const newDeadline = details.deadline || target0.deadline;
  if(newDeadline && target0.createdDate && newDeadline < target0.createdDate){
    toast('Дедлайн не может быть раньше даты постановки');
    return;
  }
  if(target0.parentId){
    const parentTask = tasksFor(personal).find(t=>t.id===target0.parentId);
    if(parentTask && parentTask.deadline && newDeadline && newDeadline > parentTask.deadline){
      toast(`Дедлайн подзадачи не может быть позже дедлайна задачи (до ${fmtDeadline(parentTask)})`);
      return;
    }
  }
  const childTasks = tasksFor(personal).filter(c=>c.parentId===target0.id);
  const violatingChild = childTasks.find(c=>c.deadline && newDeadline && c.deadline > newDeadline);
  if(violatingChild){
    toast(`Дедлайн задачи не может быть раньше дедлайна подзадачи «${violatingChild.title}» (до ${fmtDeadline(violatingChild)})`);
    return;
  }
  await reworkTaskSave(personal, id, details.note, newDeadline);
}
// Отдельно от reworkTask — чтобы кнопка «Повторить» при неудачном сохранении не переспрашивала
// текст доработки и дедлайн заново, а просто пересохраняла уже введённые.
async function reworkTaskSave(personal, id, note, deadline){
  await refreshTasksFromServer(personal);
  const before = tasksFor(personal);
  const target = before.find(t=>t.id===id);
  if(!target || !canReviewTask(target, personal)){ toast(whyCantReview(target||{})); return; }
  const newDeadline = deadline || target.deadline;
  const reworkText = note || 'Постановщик вернул задачу на доработку';
  const updated = before.map(t=>{
    if(t.id===id) return {...t, status:'progress', completedAt:null, submittedAt:null, deadline:newDeadline,
      // Если дедлайн при возврате на доработку поменялся — старая причина просрочки больше не актуальна.
      overdueReason: newDeadline!==t.deadline ? '' : (t.overdueReason||''),
      reworkNote: reworkText};
    // Не приняли подзадачу — главная задача (если она сдана на проверку) тоже возвращается на доработку.
    if(target.parentId && t.id===target.parentId && (t.status==='review' || t.status==='done')){
      return {...t, status:'progress', completedAt:null, submittedAt:null, approvedAt:null, approvedBy:null, reworkNote:`Подзадача «${target.title}» возвращена на доработку: ${reworkText}`};
    }
    // Не приняли главную задачу — её подзадачи, ещё стоящие на проверке, тоже возвращаются на доработку.
    if(t.parentId===id && t.status==='review'){
      return {...t, status:'progress', completedAt:null, submittedAt:null, reworkNote:`Главная задача возвращена на доработку: ${reworkText}`};
    }
    return t;
  });
  setTasksFor(personal, updated);
  const ok = await persistTasksFor(personal);
  if(!ok){ setTasksFor(personal, before); saveFailedToast(()=>reworkTaskSave(personal, id, note, deadline)); return; }
  toast('Задача возвращена на доработку' + (newDeadline!==target.deadline ? ' с новым дедлайном' : ''));
  render();
}
// retryFn (необязательно) — та же функция, что выполняла сохранение; если передать её, в
// уведомлении появится кнопка «Повторить», которая заново попробует именно это действие.
function saveFailedToast(retryFn){
  toast('⚠️ Не удалось сохранить — проверьте подключение к интернету и попробуйте ещё раз', retryFn?{retry:retryFn}:undefined);
}
function wireOverdueReasonInputs(el){
  el.querySelectorAll('[data-save-overdue-reason]').forEach(btn=>{
    btn.onclick = async function retry(e){
      if(e) e.stopPropagation();
      const id = btn.dataset.saveOverdueReason;
      const personal = state.personalTasks.some(pt=>pt.id===id);
      const input = el.querySelector(`[data-overdue-reason-input="${id}"]`);
      const text = input ? input.value.trim() : '';
      if(!text){ toast('Опишите причину задержки'); return; }
      await refreshTasksFromServer(personal);
      const before = tasksFor(personal);
      const updated = before.map(t=>t.id===id?{...t, overdueReason:text}:t);
      setTasksFor(personal, updated);
      const ok = await persistTasksFor(personal);
      if(!ok){ setTasksFor(personal, before); saveFailedToast(retry); return; }
      render();
    };
  });
  el.querySelectorAll('[data-edit-overdue-reason]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.editOverdueReason;
      const personal = state.personalTasks.some(pt=>pt.id===id);
      const task = tasksFor(personal).find(t=>t.id===id);
      const box = btn.closest('.overdue-reason-box');
      if(!box || !task) return;
      box.innerHTML = `
        <div class="overdue-reason-label">⚠️ Причина задержки</div>
        <textarea rows="2" data-overdue-reason-input="${id}">${escapeHtml(task.overdueReason||'')}</textarea>
        <button type="button" class="btn small" data-save-overdue-reason="${id}" style="margin-top:6px;">Сохранить причину</button>
      `;
      wireOverdueReasonInputs(box);
    };
  });
}

// Перед изменением статуса задачи подтягиваем самую свежую версию списка с сервера —
// это уменьшает риск затереть изменение, которое кто-то успел сохранить с другого устройства
// в промежутке между вашей загрузкой страницы и этим кликом.
async function refreshTasksFromServer(personal){
  const raw = await sGet(personal ? 'personal:tasks' : 'tasks:work', true);
  if(raw === null) return null;
  try{
    const arr = JSON.parse(raw);
    if(personal) state.personalTasks = arr; else state.tasksWork = arr;
    return arr;
  }catch(e){ return null; }
}
// Проекты и блоки хранятся общими ключами (tasks:projects, tasks:blocks) для всей команды.
// Если два человека одновременно держат открытым журнал (например, Карина и Ассистент),
// а каждое изменение (добавить/переименовать/удалить блок или проект) сохраняет ВЕСЬ массив
// целиком из памяти браузера — тот, кто сохранит вторым, незаметно затирает свежее изменение
// первого (проект то появляется, то пропадает, в зависимости от того, чья версия сохранилась
// последней). Поэтому перед каждым изменением сначала подтягиваем актуальные версии с сервера,
// и уже поверх них применяем правку — как это давно сделано для задач в refreshTasksFromServer.
// personal=true — подтягиваем личные проекты Карины (personal:projects, свой ключ, без блоков —
// у личных дел их нет); personal=false (по умолчанию) — общие проекты и блоки, как раньше.
async function refreshProjectsAndBlocksFromServer(personal){
  if(personal){
    const raw = await sGet('personal:projects', true);
    if(raw !== null){ try{ state.personalProjects = JSON.parse(raw); }catch(e){} }
    return;
  }
  const [projRaw, blockRaw] = await Promise.all([
    sGet('tasks:projects', true),
    sGet('tasks:blocks', true),
  ]);
  if(projRaw !== null){ try{ state.projectsWork = JSON.parse(projRaw); }catch(e){} }
  if(blockRaw !== null){ try{ state.blocksWork = JSON.parse(blockRaw); }catch(e){} }
}
// Та же защита от потери данных при параллельной работе — для бухгалтерии: две записи о доходе/
// расходе, добавленные примерно одновременно с двух устройств, иначе рискуют затереть друг друга
// (последнее сохранение полностью перезаписывает весь список записей). scope: 'work' (по умолчанию)
// или 'personal' — личные финансы Карины хранятся отдельным ключом (personal:funds).
async function refreshFundsFromServer(scope){
  if(scope==='personal'){
    const raw = await sGet('personal:funds', true);
    if(raw !== null){ try{ state.personalFundsEntries = JSON.parse(raw); }catch(e){} }
    return;
  }
  const raw = await sGet('funds:ledger', true);
  if(raw !== null){ try{ state.fundsEntries = JSON.parse(raw); }catch(e){} }
}
// И для календаря — то же самое: два события (например, два отпуска или встречи), добавленные
// почти одновременно, не должны стирать друг друга. personal=true — личный календарь Карины.
async function refreshEventsFromServer(personal){
  if(personal){
    const raw = await sGet('personal:events', true);
    if(raw !== null){ try{ state.personalEvents = JSON.parse(raw); }catch(e){} }
    return;
  }
  const raw = await sGet('calendar:events', true);
  if(raw !== null){ try{ state.events = normEvents(JSON.parse(raw)); }catch(e){} }
}
// Та же защита — для остальных общих (не личных) списков: банк идей, чек-листы, быстрые идеи,
// корзина и список сотрудников. Каждый из них тоже сохраняется целиком поверх ключа на сервере,

async function maybeOfferPurchaseExpense(task, personal){
  if(!task || personal) return;
  if(!task.projectId || !task.purchaseAmount || task.purchaseExpenseId) return;
  const proj = state.projectsWork.find(p=>p.id===task.projectId);
  if(!proj || !isPurchasesProjectName(proj.name)) return;
  const label = `${fmtMoney(task.purchaseAmount)}${task.purchaseStore?` (${task.purchaseStore})`:''}`;
  const ok = await showConfirm(`Задача «${task.title}» выполнена. Создать расход в Финансах на ${label}?`, 'Создать расход');
  if(!ok) return;
  const entry = {
    id: uid(),
    type: 'expense',
    scope: 'work',
    date: todayISO(),
    amount: task.purchaseAmount,
    purpose: task.purchaseStore ? `${task.title} — ${task.purchaseStore}` : task.title,
    receiptUrl: '',
    comment: `Автоматически создано из задачи «${task.title}» (проект «${PURCHASES_PROJECT_NAME}»).`,
    createdAt: Date.now(),
  };
  await refreshFundsFromServer();
  state.fundsEntries = state.fundsEntries.concat([entry]);
  await saveFunds();
  await refreshTasksFromServer(false);
  state.tasksWork = state.tasksWork.map(t=>t.id===task.id?{...t, purchaseExpenseId:entry.id}:t);
  await saveTasksWork();
  toast('Расход добавлен в Финансы');
}

/* ---------------- render root ---------------- */
function empName(id){
  const e = state.employees.find(x=>x.id===id);
  return e ? e.name : '—';
}

function renderTabs(){
  const nav = document.getElementById('tabsNav');
  nav.innerHTML = TABS.filter(t=>!t.roles || hasRole(...t.roles)).map(t=>{
    let count = '';
    if(t.id==='tasks'){
      const openCount = state.tasksWork.filter(x=>x.status!=='done').length;
      count = `<span class="count">${openCount}</span>`;
    }
    if(t.id==='calendar'){
      const upcoming = state.events.filter(e=>e.date>=todayISO()).length;
      count = `<span class="count">${upcoming}</span>`;
    }
    return `<button class="tab-btn ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}${count}</button>`;
  }).join('');
  nav.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.onclick=()=>{ state.tab=btn.dataset.tab; render(); };
  });
}

/* ---------------- reminders ---------------- */
function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function computeReminders(filterAssigneeId){
  const today = todayISO();
  let allTasks = state.tasksWork.concat(personalAccessAllowed() ? state.personalTasks : []);
  if(filterAssigneeId){ allTasks = allTasks.filter(t=>t.assigneeId===filterAssigneeId); }
  // «Открытая» задача = в работе или на согласовании (так же, как в списке задач в Обзоре).
  const isOpenT = t=>t.status==='progress' || t.status==='approval';
  const overdueTasks = allTasks.filter(t=>t.deadline && t.deadline<today && isOpenT(t));
  const dueTodayTasks = allTasks.filter(t=>t.deadline===today && isOpenT(t));
  // При просмотре конкретного сотрудника считаем только события, в которых он действительно
  // участвует (employeeIds) — иначе (например, у Руководителя с полным расписанием) счётчик
  // показывал вообще все видимые события дня, даже те, где этот сотрудник не задействован.
  let eventsInScope = allVisibleEvents();
  if(filterAssigneeId){ eventsInScope = eventsInScope.filter(e=>e.employeeIds && e.employeeIds.includes(filterAssigneeId)); }
  const todayEvents = eventsInScope.filter(e=>e.date===today).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
  const soon = new Date(); soon.setDate(soon.getDate()+3);
  const soonISO = dateToISO(soon);
  const upcomingEvents = eventsInScope.filter(e=>e.date>today && e.date<=soonISO).sort((a,b)=>a.date.localeCompare(b.date));
  const dueSoonTasks = allTasks.filter(t=>t.deadline && t.deadline>today && t.deadline<=soonISO && isOpenT(t)).sort((a,b)=>a.deadline.localeCompare(b.deadline));
  return {overdueTasks, dueTodayTasks, todayEvents, upcomingEvents, dueSoonTasks};
}
// Задачи, поставленные (созданные) текущему пользователю за последние 3 дня —
// то, что показывается в окне колокольчика и что считает бейдж на нём.
function computeNewlyAssignedTasks(){
  if(!state.currentUserId) return [];
  const cutoff = (() => { const d=new Date(); d.setDate(d.getDate()-3); return d.toISOString().slice(0,10); })();
  return state.tasksWork
    .filter(t=>t.assigneeId===state.currentUserId && t.createdDate && t.createdDate>=cutoff)
    .sort((a,b)=>(b.createdDate||'').localeCompare(a.createdDate||''));
}
function renderBellBadge(){

  if(!badge) return;

  else badge.style.display='none';
}

function notifySelfSaved(title, body){

function checkNotificationsTick(){
  if(!state.browserNotify || !('Notification' in window) || Notification.permission!=='granted') return;
  const today = todayISO();
  const nowMin = nowHHMM();
  // За 1 час до начала — только события, где текущий пользователь указан участником
  state.events.filter(e=> e.date===today && e.startTime && e.employeeIds && e.employeeIds.includes(state.currentUserId)).forEach(e=>{
    const key = e.id+'|'+e.date;
    if(state.notifiedEventKeys.has(key)) return;
    const [eh,em] = e.startTime.split(':').map(Number);
    const [nh,nm] = nowMin.split(':').map(Number);
    const diff = (eh*60+em) - (nh*60+nm);
    if(diff>=0 && diff<=60){
      new Notification('Через час: '+e.title, {body:(e.startTime||'')+' · '+(catLabel(e.category))});
      state.notifiedEventKeys.add(key);
    }
  });
  const {overdueTasks, dueTodayTasks, dueSoonTasks} = computeReminders();
  if((overdueTasks.length || dueTodayTasks.length || dueSoonTasks.length) && state.lastSummaryDate!==today){
    new Notification('Задачи на сегодня', {body:`Просрочено: ${overdueTasks.length} · На сегодня: ${dueTodayTasks.length} · Через 1–3 дня: ${dueSoonTasks.length}`});
    state.lastSummaryDate = today;
    sSet('settings:notifySummaryDate', today, false);
  }
}
