            <input type="number" id="f-agreed-price" value="${ev.agreedPrice!==undefined && ev.agreedPrice!==null ? ev.agreedPrice : ''}" min="0" step="100" placeholder="Например: 10000">
            <div id="awaiting-hint" style="font-size:12px;margin-top:6px;font-family:var(--font-mono);"></div>
          </div>
          <div class="field">
            <label>Себестоимость материалов <span style="font-weight:400;color:var(--ink-soft);">— по каждому материалу: сколько стоит и кто его предоставил</span></label>
            <div id="materials-estimate-hint" style="display:none;font-size:12.5px;background:var(--paper-2);border-radius:var(--radius);padding:8px 10px;margin-bottom:10px;color:var(--ink-soft);"></div>
            <div id="materials-items-list">${renderMaterialsItemRows(ev.materialsItems||[])}</div>
            <datalist id="materials-catalog-suggestions">${state.materialsCatalog.map(m=>`<option value="${escapeHtml(m.name)}">`).join('')}</datalist>
            <button type="button" class="add-evt-btn" id="btn-add-material">+ добавить материал</button>
            <div id="materials-total-hint" style="font-size:12px;margin-top:8px;font-family:var(--font-mono);color:var(--ink-soft);"></div>
            <div id="profit-estimate-hint" style="font-size:13px;margin-top:10px;font-family:var(--font-mono);font-weight:600;"></div>
            ${(()=>{
              const linkedExpenses = state.expenses.filter(x=>x.eventId===ev.id);
              if(linkedExpenses.length === 0) return '';
              const sum = linkedExpenses.reduce((s,x)=> s+((x.amount!==undefined&&x.amount!==null&&!isNaN(x.amount))?Number(x.amount):0), 0);
              return `<div style="margin-top:10px;padding:8px 10px;background:var(--paper-2);border-radius:var(--radius);font-size:12px;color:var(--ink-soft);">
                🧾 В «Расходах» привязано записей: ${linkedExpenses.length} на сумму ${formatMoney(sum)}
                <div style="margin-top:4px;">${linkedExpenses.map(x=>`${formatDateText(x.date)} · ${escapeHtml(x.category)} · ${formatMoney(x.amount||0)} · ${escapeHtml(x.source)}`).join('<br>')}</div>
              </div>`;
            })()}
          </div>
          <div class="field">
            <label>Заметки</label>
            <textarea id="f-notes" placeholder="Доп. детали и т.п.">${escapeHtml(ev.notes||'')}</textarea>
          </div>
          <div class="field" style="border-top:1px solid var(--line); padding-top:16px;">
            <label style="font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--ink);margin-bottom:10px;">Отчёт мастера</label>
          </div>
          <div class="field">
            <label>1. Откуда гости узнали про СП</label>
            <input type="text" id="f-report-source" value="${escapeHtml((ev.masterReport&&typeof ev.masterReport==='object')?(ev.masterReport.source||''):'')}" placeholder="Например: Инста" list="f-report-source-options">
            <datalist id="f-report-source-options">${LEAD_SOURCES.map(s=>`<option value="${escapeHtml(s)}">`).join('')}</datalist>
          </div>
          <div class="field">
            <label>2. Профессии гостей</label>
            <input type="text" id="f-report-professions" value="${escapeHtml((ev.masterReport&&typeof ev.masterReport==='object')?(ev.masterReport.professions||''):'')}" placeholder="Например: врач, дизайнер, студентка">
          </div>
          <div class="field">
            <label>3. Уникальное на МК <span style="font-weight:400;color:var(--ink-soft);">— необязательно</span></label>
            <textarea id="f-report-unique" placeholder="Сообщили о беременности, сделали предложение и т.д.">${escapeHtml((ev.masterReport&&typeof ev.masterReport==='object')?(ev.masterReport.unique||''):'')}</textarea>
          </div>
          <div class="field">
            <label>4. Оценка МК по 5-балльной шкале</label>
            <div class="rating-scale">
              ${[1,2,3,4,5].map(n=>`<button type="button" class="rating-btn f-rating-btn" data-rating="${n}" ${((ev.masterReport&&typeof ev.masterReport==='object'&&ev.masterReport.rating===n))?'style="background:var(--ink);color:var(--white);border-color:var(--ink);"':''}>${n}</button>`).join('')}
            </div>
            <input type="hidden" id="f-report-rating" value="${(ev.masterReport&&typeof ev.masterReport==='object')?(ev.masterReport.rating||''):''}">
          </div>
          <div class="field">
            <label>5. Расшифровка оценки <span style="font-weight:400;color:var(--ink-soft);">— обязательно, если оценка ниже 5</span></label>
            <textarea id="f-report-rating-comment" placeholder="Что именно было некомфортно...">${escapeHtml((ev.masterReport&&typeof ev.masterReport==='object')?(ev.masterReport.ratingComment||''):'')}</textarea>
          </div>
          <div class="modal-actions">
            <div style="display:flex;gap:8px;">
              ${!isNew ? `<button class="btn-danger" id="btn-del">Удалить</button>` : ''}
              ${!isNew ? `<button class="btn btn-ghost" id="btn-duplicate">🔁 Повторить</button>` : ''}
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-ghost" id="btn-cancel">Отмена</button>
              <button class="btn btn-primary" id="btn-save">Сохранить</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function attachEventModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const titleInput = overlay.querySelector('#f-title');
    const durationInput = overlay.querySelector('#f-duration');
    if(titleInput && durationInput){
      titleInput.addEventListener('input', ()=>{
        const match = state.eventTypes.find(t=>t.name.toLowerCase() === titleInput.value.trim().toLowerCase());
        if(match){ durationInput.value = match.duration; }
        const itemsField = overlay.querySelector('#items-count-field');
        if(itemsField){
          const show = isCeramicsEvent(titleInput.value);
          itemsField.style.display = show ? 'block' : 'none';
          if(show){
            const itemsInput = overlay.querySelector('#f-items-count');
            if(itemsInput && itemsInput.dataset.auto === 'true' && itemsInput.value === ''){
              const guestsInputEl = overlay.querySelector('#f-guests');
              itemsInput.value = guestsInputEl ? guestsInputEl.value : '';
            }
          }
        }
        const pickupField = overlay.querySelector('#pickup-field');
        if(pickupField) pickupField.style.display = isPickupTrackedEvent(titleInput.value) ? 'block' : 'none';
      });
    }

    const guestsInput = overlay.querySelector('#f-guests');
    const masterPayInput = overlay.querySelector('#f-master-pay');
    const spaceSelect = overlay.querySelector('#f-space');
    const hostInputEl = overlay.querySelector('#f-host');
    if(guestsInput && masterPayInput){
      guestsInput.addEventListener('input', ()=>{
        if(masterPayInput.dataset.auto === 'true'){
          masterPayInput.value = masterPayForGuests(guestsInput.value, hostInputEl ? hostInputEl.value : '');
        }
        overlay.querySelectorAll('#additional-hosts-list [data-ah-idx]').forEach(row=>{
          const inp = row.querySelector('.ah-pay');
          const nameInp = row.querySelector('.ah-name');
          if(inp && inp.dataset.auto === 'true'){ inp.value = masterPayForGuests(guestsInput.value, nameInp?nameInp.value:''); }
        });
        overlay.querySelectorAll('#materials-items-list [data-mi-idx]').forEach(row=>{
          const costInput = row.querySelector('.mi-cost');
          const nameInput = row.querySelector('.mi-name');
          if(costInput && costInput.dataset.auto === 'true' && nameInput){
            const match = findMaterialsCatalogMatch(nameInput.value);
            if(match){
              const g = parseInt(guestsInput.value) || 1;
              costInput.value = match.cost * g;
            }
          }
        });
        const itemsInput = overlay.querySelector('#f-items-count');
        if(itemsInput && itemsInput.dataset.auto === 'true'){
          itemsInput.value = guestsInput.value;
        }
        if(typeof syncMaterialsItemsFromInputs === 'function') syncMaterialsItemsFromInputs();
        if(typeof updateMaterialsTotalHint === 'function') updateMaterialsTotalHint();
      });
      masterPayInput.addEventListener('input', ()=>{
        masterPayInput.dataset.auto = 'false'; // менеджер поправил вручную — больше не пересчитываем автоматически
      });
      if(hostInputEl){
        hostInputEl.addEventListener('input', ()=>{
          if(masterPayInput.dataset.auto === 'true'){
            masterPayInput.value = masterPayForGuests(guestsInput.value, hostInputEl.value);
          }
        });
      }
    }

    const itemsCountInput = overlay.querySelector('#f-items-count');
    if(itemsCountInput){
      itemsCountInput.addEventListener('input', ()=>{
        itemsCountInput.dataset.auto = 'false'; // менеджер поправил вручную (например, кто-то сделал 2 изделия)
      });
    }

    // предупреждение о вместимости — только предупреждает, никогда не блокирует ввод
    function checkSpaceCapacity(){
      if(!guestsInput || !spaceSelect) return;
      const guests = parseInt(guestsInput.value);
      if(!guests || guests <= 0) return;
      const capacity = SPACE_CAPACITY[spaceSelect.value];
      if(capacity === null || capacity === undefined) return; // без ограничений (напр. "Выезд")
      if(guests > capacity){
        const sp = getSpace(spaceSelect.value);
        showCapacityConfirmPopup(sp.name, capacity, guests);
      }
    }
    if(guestsInput) guestsInput.addEventListener('change', checkSpaceCapacity);
    if(spaceSelect) spaceSelect.addEventListener('change', checkSpaceCapacity);

    if(spaceSelect) spaceSelect.addEventListener('change', ()=>{
      if(spaceSelect.value === 's5'){
        const offsiteOpt = overlay.querySelector('.status-opt[data-status="offsite"]');
        if(offsiteOpt && !offsiteOpt.classList.contains('active')){
          overlay.querySelectorAll('.status-opt').forEach(o=>o.classList.remove('active'));
          offsiteOpt.classList.add('active');
          overlay.querySelector('#f-status').value = 'offsite';
          const dishesField = overlay.querySelector('#dishes-field');
          if(dishesField) dishesField.style.display = showsDishesAndRental('offsite') ? 'block' : 'none';
          const rentalField = overlay.querySelector('#rental-field');
          if(rentalField) rentalField.style.display = showsDishesAndRental('offsite') ? 'block' : 'none';
        }
      }
    });

    // дополнительные ведущие
    let additionalHostsDraft = (state.modal.event.additionalHosts || []).map(h=>({...h}));
    function syncAdditionalHostsFromInputs(){
      overlay.querySelectorAll('#additional-hosts-list [data-ah-idx]').forEach(row=>{
        const i = parseInt(row.dataset.ahIdx);
        const nameInput = row.querySelector('.ah-name');
        const payInput = row.querySelector('.ah-pay');
        if(additionalHostsDraft[i]){
          additionalHostsDraft[i] = { name: nameInput.value, masterPay: payInput.value!==''?parseInt(payInput.value):null, masterPayAuto: payInput.dataset.auto === 'true' };
        }
      });
    }
    function refreshAdditionalHostsUI(){
      const container = overlay.querySelector('#additional-hosts-list');
      container.innerHTML = renderAdditionalHostRows(additionalHostsDraft, guestsInput ? guestsInput.value : null);
      attachAdditionalHostsRowEvents();
    }
    function attachAdditionalHostsRowEvents(){
      overlay.querySelectorAll('.ah-pay').forEach(inp=>{
        inp.addEventListener('input', ()=>{ inp.dataset.auto = 'false'; });
      });
      overlay.querySelectorAll('#additional-hosts-list [data-ah-idx]').forEach(row=>{
        const nameInp = row.querySelector('.ah-name');
        const payInp = row.querySelector('.ah-pay');
        if(nameInp && payInp){
          nameInp.addEventListener('input', ()=>{
            if(payInp.dataset.auto === 'true'){
              payInp.value = masterPayForGuests(guestsInput ? guestsInput.value : null, nameInp.value);
            }
          });
        }
      });
      overlay.querySelectorAll('.ah-del').forEach(btn=>{
        btn.onclick = ()=>{
          syncAdditionalHostsFromInputs();
          additionalHostsDraft.splice(parseInt(btn.dataset.idx), 1);
          refreshAdditionalHostsUI();
        };
      });
    }
    attachAdditionalHostsRowEvents();
    const addHostBtn = overlay.querySelector('#btn-add-host');
    if(addHostBtn) addHostBtn.onclick = ()=>{
      syncAdditionalHostsFromInputs();
      additionalHostsDraft.push({ name:'', masterPay:null, masterPayAuto:true });
      refreshAdditionalHostsUI();
    };

    // себестоимость материалов — построчно, с указанием источника (студия/мастер)
    let materialsItemsDraft = (state.modal.event.materialsItems || []).map(m=>({...m}));
    function syncMaterialsItemsFromInputs(){
      overlay.querySelectorAll('#materials-items-list [data-mi-idx]').forEach(row=>{
        const i = parseInt(row.dataset.miIdx);
        const nameInput = row.querySelector('.mi-name');
        const costInput = row.querySelector('.mi-cost');
        const qtyInput = row.querySelector('.mi-qty');
        const sourceActive = row.querySelector('.mi-source-opt.active');
        const payToInput = row.querySelector('.mi-payto');
        if(materialsItemsDraft[i]){
          materialsItemsDraft[i] = {
            name: nameInput.value,
            cost: costInput.value !== '' ? parseInt(costInput.value) : null,
            qty: qtyInput && qtyInput.value !== '' ? parseFloat(qtyInput.value) : null,
            source: sourceActive ? sourceActive.dataset.source : 'studio',
            payTo: payToInput ? payToInput.value : '',
          };
        }
      });
    }
    function updateMaterialsTotalHint(){
      const studioTotal = materialsItemsDraft.reduce((s,m)=> s + (m.source!=='master' ? (Number(m.cost)||0) : 0), 0);
      const masterTotal = materialsItemsDraft.reduce((s,m)=> s + (m.source==='master' ? (Number(m.cost)||0) : 0), 0);
      const hint = overlay.querySelector('#materials-total-hint');
      if(hint) hint.textContent = `От студии (влияет на прибыль): ${formatMoney(studioTotal)}${masterTotal>0 ? ' · Приносит мастер (для сведения): '+formatMoney(masterTotal) : ''}`;
    }
    function refreshMaterialsItemsUI(){
      const container = overlay.querySelector('#materials-items-list');
      container.innerHTML = renderMaterialsItemRows(materialsItemsDraft);
      attachMaterialsItemsRowEvents();
      updateMaterialsTotalHint();
    }
    function attachMaterialsItemsRowEvents(){
      overlay.querySelectorAll('#materials-items-list [data-mi-idx]').forEach(row=>{
        const costInput = row.querySelector('.mi-cost');
        if(costInput) costInput.addEventListener('input', ()=>{
          costInput.dataset.auto = 'false'; // менеджер поправил вручную — больше не пересчитываем по справочнику
          syncMaterialsItemsFromInputs();
          updateMaterialsTotalHint();
          updateEstimateAndProfit();
        });
        const nameInput = row.querySelector('.mi-name');
        if(nameInput) nameInput.addEventListener('input', ()=>{
          const match = findMaterialsCatalogMatch(nameInput.value);
          if(match && costInput && costInput.dataset.auto !== 'false'){
            const guests = parseInt(guestsInput ? guestsInput.value : 0) || 1;
            costInput.value = match.cost * guests;
            costInput.dataset.auto = 'true';
          }
          syncMaterialsItemsFromInputs();
          updateMaterialsTotalHint();
          updateEstimateAndProfit();
        });
        row.querySelectorAll('.mi-source-opt').forEach(opt=>{
          opt.onclick = ()=>{
            row.querySelectorAll('.mi-source-opt').forEach(o=>o.classList.remove('active'));
            opt.classList.add('active');
            const payToInput = row.querySelector('.mi-payto');
            if(payToInput) payToInput.style.display = (opt.dataset.source === 'master') ? 'block' : 'none';
            syncMaterialsItemsFromInputs();
            updateMaterialsTotalHint();
            updateEstimateAndProfit();
          };
        });
      });
      overlay.querySelectorAll('.mi-del').forEach(btn=>{
        btn.onclick = ()=>{
          syncMaterialsItemsFromInputs();
          materialsItemsDraft.splice(parseInt(btn.dataset.idx), 1);
          refreshMaterialsItemsUI();
        };
      });
    }
    attachMaterialsItemsRowEvents();
    updateMaterialsTotalHint();
    const addMaterialBtn = overlay.querySelector('#btn-add-material');
    if(addMaterialBtn) addMaterialBtn.onclick = ()=>{
      syncMaterialsItemsFromInputs();
      materialsItemsDraft.push({ name:'', cost:null, source:'studio' });
      refreshMaterialsItemsUI();
    };

    // выдача изделий (смола, тафтинг) — изготовили сегодня, забирают позже
    let pickupItemsDraft = (state.modal.event.pickupItems || []).map(p=>({...p}));
    function syncPickupItemsFromInputs(){
      overlay.querySelectorAll('#pickup-items-list [data-pk-idx]').forEach(row=>{
        const i = parseInt(row.dataset.pkIdx);
        if(!pickupItemsDraft[i]) return;
        const statusActive = row.querySelector('.pk-status-opt.active');
        pickupItemsDraft[i] = {
          guestName: row.querySelector('.pk-guest').value,
          readyDate: row.querySelector('.pk-ready').value,
          status: statusActive ? statusActive.dataset.pkstatus : 'waiting',
          pickupDate: row.querySelector('.pk-pickup-date').value,
        };
      });
    }
    function refreshPickupItemsUI(){
      const container = overlay.querySelector('#pickup-items-list');
      container.innerHTML = renderPickupItemRows(pickupItemsDraft);
      attachPickupItemsRowEvents();
    }
    function attachPickupItemsRowEvents(){
      overlay.querySelectorAll('#pickup-items-list [data-pk-idx]').forEach(row=>{
        row.querySelectorAll('.pk-guest, .pk-ready, .pk-pickup-date').forEach(inp=>{
          inp.addEventListener('input', syncPickupItemsFromInputs);
        });
        row.querySelectorAll('.pk-status-opt').forEach(opt=>{
          opt.onclick = ()=>{
            row.querySelectorAll('.pk-status-opt').forEach(o=>o.classList.remove('active'));
            opt.classList.add('active');
            const pickupDateInput = row.querySelector('.pk-pickup-date');
            if(pickupDateInput){
              pickupDateInput.style.display = (opt.dataset.pkstatus === 'picked_up') ? 'block' : 'none';
              if(opt.dataset.pkstatus === 'picked_up' && !pickupDateInput.value) pickupDateInput.value = todayStr();
            }
            syncPickupItemsFromInputs();
          };
        });
      });
      overlay.querySelectorAll('.pk-del').forEach(btn=>{
        btn.onclick = ()=>{
          syncPickupItemsFromInputs();
          pickupItemsDraft.splice(parseInt(btn.dataset.idx), 1);
          refreshPickupItemsUI();
        };
      });
    }
    attachPickupItemsRowEvents();
    const addPickupBtn = overlay.querySelector('#btn-add-pickup');
    if(addPickupBtn) addPickupBtn.onclick = ()=>{
      syncPickupItemsFromInputs();
      const defaultReady = state.modal.event.date ? fmtDate(new Date(parseDate(state.modal.event.date).getTime() + 7*86400000)) : '';
      pickupItemsDraft.push({ guestName:'', readyDate: defaultReady, status:'waiting', pickupDate:'' });
      refreshPickupItemsUI();
    };

    // подсказка себестоимости по справочнику "Себес" (цена за гостя × количество гостей)
    const priceInput = overlay.querySelector('#f-price');
    const estimateHintEl = overlay.querySelector('#materials-estimate-hint');
    const profitHintEl = overlay.querySelector('#profit-estimate-hint');

    function updateEstimateAndProfit(){
      const guests = parseInt(guestsInput ? guestsInput.value : 0) || 0;
      const match = findMaterialsCatalogMatch(titleInput ? titleInput.value : '');
      if(match && guests > 0){
        const total = match.cost * guests;
        estimateHintEl.style.display = 'block';
        estimateHintEl.innerHTML = `По справочнику «${escapeHtml(match.name)}»: ${formatMoney(match.cost)}/чел × ${guests} чел = <b>${formatMoney(total)}</b> <button type="button" id="btn-substitute-materials" style="margin-left:8px;border:1px solid var(--ink-soft);background:var(--white);border-radius:var(--radius);padding:3px 10px;font-size:12px;cursor:pointer;">Подставить</button>`;
        const subBtn = estimateHintEl.querySelector('#btn-substitute-materials');
        if(subBtn) subBtn.onclick = ()=>{
          syncMaterialsItemsFromInputs();
          materialsItemsDraft.push({ name: match.name, cost: total, source: 'studio' });
          refreshMaterialsItemsUI();
        };
      } else {
        estimateHintEl.style.display = 'none';
        estimateHintEl.innerHTML = '';
      }

      // ориентировочная прибыль по текущим данным формы (ещё до сохранения)
      syncMaterialsItemsFromInputs();
      syncAdditionalHostsFromInputs();
      const revenue = parseInt(priceInput ? priceInput.value : 0) || 0;
      const studioMaterials = materialsItemsDraft.reduce((s,m)=> s + (m.source!=='master' ? (Number(m.cost)||0) : 0), 0);
      const primaryPay = masterPayInput ? (parseInt(masterPayInput.value)||0) : 0;
      const extraPay = additionalHostsDraft.reduce((s,h)=> s + (h.masterPay!==undefined&&h.masterPay!==null?Number(h.masterPay):0), 0);
      const estProfit = revenue - studioMaterials - primaryPay - extraPay;
      if(profitHintEl){
        profitHintEl.style.color = estProfit >= 0 ? 'var(--status-green)' : 'var(--status-red)';
        profitHintEl.textContent = `Ориентировочная прибыль: ${formatMoney(estProfit)}`;
      }
    }
    if(titleInput) titleInput.addEventListener('input', updateEstimateAndProfit);
    if(guestsInput) guestsInput.addEventListener('input', updateEstimateAndProfit);
    if(priceInput) priceInput.addEventListener('input', updateEstimateAndProfit);
    if(masterPayInput) masterPayInput.addEventListener('input', updateEstimateAndProfit);
    overlay.querySelector('#materials-items-list').addEventListener('input', updateEstimateAndProfit);
    overlay.querySelector('#additional-hosts-list').addEventListener('input', updateEstimateAndProfit);
    updateEstimateAndProfit();

    overlay.querySelectorAll('.f-rating-btn').forEach(btn=>{
      btn.onclick = ()=>{
        overlay.querySelectorAll('.f-rating-btn').forEach(b=>{ b.style.background=''; b.style.color=''; b.style.borderColor=''; });
        btn.style.background = 'var(--ink)'; btn.style.color = 'var(--white)'; btn.style.borderColor = 'var(--ink)';
        overlay.querySelector('#f-report-rating').value = btn.dataset.rating;
      };
    });

    // журнал платежей ("быстро добавить сумму" к выручке)
    const PAYMENT_TYPE_LABEL = { advance: 'Предоплата', balance: 'Остаток' };
    const paymentsHidden = overlay.querySelector('#f-payments');
    const paymentsLogEl = overlay.querySelector('#payments-log');
    let paymentsArr = [];
    try{ paymentsArr = JSON.parse(paymentsHidden.value || '[]'); }catch(e){ paymentsArr = []; }

    function renderPaymentsLog(){
      if(!paymentsLogEl) return;
      paymentsLogEl.innerHTML = paymentsArr.map((p,i)=>`
        <div class="payment-log-row" data-idx="${i}" style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);">
          <span>+${formatMoney(p.amount)}${p.source?' · '+escapeHtml(p.source):''}${p.type?' · '+(PAYMENT_TYPE_LABEL[p.type]||p.type):''}${p.ts?' · '+new Date(p.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</span>
          <button type="button" class="payment-del" data-idx="${i}" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px;font-family:var(--font-body);">убрать</button>
        </div>
      `).join('');
      paymentsLogEl.querySelectorAll('.payment-del').forEach(btn=>{
        btn.onclick = ()=>{
          const idx = parseInt(btn.dataset.idx);
          const removed = paymentsArr.splice(idx,1)[0];
          if(removed){
            const priceInput = overlay.querySelector('#f-price');
            priceInput.value = Math.max(0, (parseInt(priceInput.value)||0) - removed.amount);
            updateAwaitingHint();
          }
          paymentsHidden.value = JSON.stringify(paymentsArr);
          renderPaymentsLog();
        };
      });
    }
    renderPaymentsLog();

    function updateAwaitingHint(){
      const hint = overlay.querySelector('#awaiting-hint');
      if(!hint) return;
      const priceVal = parseInt(overlay.querySelector('#f-price').value) || 0;
      const agreedVal = parseInt(overlay.querySelector('#f-agreed-price').value) || 0;
      if(agreedVal > 0){
        const remain = agreedVal - priceVal;
        if(remain > 0){ hint.textContent = `Ждём ещё: ${formatMoney(remain)}`; hint.style.color = 'var(--status-red)'; }
        else if(remain < 0){ hint.textContent = `Переплата: ${formatMoney(-remain)}`; hint.style.color = 'var(--status-blue)'; }
        else { hint.textContent = 'Оплачено полностью'; hint.style.color = 'var(--status-green)'; }
      } else {
        hint.textContent = '';
      }
    }
    updateAwaitingHint();
    const agreedPriceInput = overlay.querySelector('#f-agreed-price');
    if(agreedPriceInput) agreedPriceInput.addEventListener('input', updateAwaitingHint);

    const addPaymentBtn = overlay.querySelector('#btn-add-payment');
    const paymentAmountInput = overlay.querySelector('#payment-add-amount');
    const paymentSourceSelect = overlay.querySelector('#payment-source');
    const paymentTypeSelect = overlay.querySelector('#payment-type');
    if(addPaymentBtn && paymentAmountInput){
      const doAdd = ()=>{
        const amount = parseInt(paymentAmountInput.value) || 0;
        if(amount <= 0) return;
        paymentsArr.push({
          amount,
          source: paymentSourceSelect ? paymentSourceSelect.value : '',
          type: paymentTypeSelect ? paymentTypeSelect.value : '',
          ts: new Date().toISOString(),
        });
        paymentsHidden.value = JSON.stringify(paymentsArr);
        const priceInput = overlay.querySelector('#f-price');
        priceInput.value = (parseInt(priceInput.value)||0) + amount;
        priceInput.style.borderColor = '';
        paymentAmountInput.value = '';
        renderPaymentsLog();
        updateAwaitingHint();
      };
      addPaymentBtn.onclick = doAdd;
      paymentAmountInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } };
    }

    overlay.querySelectorAll('.status-opt').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('.status-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#f-status').value = opt.dataset.status;
        const dishesField = overlay.querySelector('#dishes-field');
        if(dishesField) dishesField.style.display = showsDishesAndRental(opt.dataset.status) ? 'block' : 'none';
        const rentalField = overlay.querySelector('#rental-field');
        if(rentalField) rentalField.style.display = showsDishesAndRental(opt.dataset.status) ? 'block' : 'none';
        if(opt.dataset.status === 'offsite' && spaceSelect && state.spaces.find(s=>s.id==='s5')){
          spaceSelect.value = 's5'; // выездные мероприятия по умолчанию идут в пространство "Выезд"
        }
      };
    });

    overlay.querySelectorAll('.dishes-opt').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('.dishes-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#f-dishes').value = opt.dataset.dishes;
      };
    });

    overlay.querySelectorAll('.payer-opt').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('.payer-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#f-payer-type').value = opt.dataset.payer;
        const legalField = overlay.querySelector('#legal-field');
        if(legalField) legalField.style.display = (opt.dataset.payer === 'legal') ? 'block' : 'none';
      };
    });

    const delBtn = overlay.querySelector('#btn-del');
    if(delBtn) delBtn.onclick = ()=>{
      showConfirmDeletePopup(`Удалить мероприятие «${escapeHtml(state.modal.event.title||'без названия')}»? Это уберёт и все связанные данные (платежи, себестоимость, привязанные сертификаты). Действие необратимо.`, async ()=>{
      const eventToDelete = state.modal.event;
      state.events = state.events.filter(x=>x.id !== eventToDelete.id);
      // восстанавливаем остатки материалов, списанных этим мероприятием
      let catalogChanged = false;
      (eventToDelete.materialsItems||[]).forEach(m=>{
        if(m.qty===undefined || m.qty===null || isNaN(m.qty)) return;
        const catItem = state.materialsCatalog.find(c=>c.name.trim().toLowerCase()===(m.name||'').trim().toLowerCase());
        if(!catItem || !catItem.trackStock) return;
        catItem.stock = (catItem.stock!==undefined&&catItem.stock!==null&&!isNaN(catItem.stock)?Number(catItem.stock):0) + Number(m.qty);
        catalogChanged = true;
      });
      if(catalogChanged) await saveMaterialsCatalog();
      await saveEvents();
      state.modal = null; overlay.remove(); render();
      });
    };

    const duplicateBtn = overlay.querySelector('#btn-duplicate');
    if(duplicateBtn) duplicateBtn.onclick = ()=>{
      const src = state.modal.event;
      const nextWeek = new Date(parseDate(src.date).getTime() + 7*86400000);
      const clonedMaterials = (src.materialsItems||[]).map(m=>({name:m.name, cost:m.cost, qty: undefined, source:m.source, costAuto:false}));
      const clonedHosts = (src.additionalHosts||[]).map(h=>({...h}));
      const clone = {
        id: uid(),
        spaceId: src.spaceId,
        date: fmtDate(nextWeek),
        time: src.time,
        duration: src.duration,
        guests: src.guests,
        itemsCount: null,
        itemsCountAuto: true,
        host: src.host,
        masterPay: null,
        masterPayAuto: true,
        additionalHosts: clonedHosts.map(h=>({...h, masterPay:null, masterPayAuto:true})),
        guestName: '',
        price: null,
        agreedPrice: null,
        materialsItems: clonedMaterials,
        pickupItems: [],
        payments: [],
        title: src.title,
        product: src.product,
        status: src.status === 'slot' ? 'slot' : 'confirmed',
        dishes: '',
        rentalBefore: null,
        rentalAfter: null,
        payerType: 'individual',
        companyName: '',
        documents: {contract:false, paymentOrder:false, act:false},
        masterReport: null,
        notes: '',
      };
      state.modal = {type:'event', isNew:true, event:clone};
      render();
    };

    const saveBtn = overlay.querySelector('#btn-save');
    saveBtn.onclick = async ()=>{
      // сброс подсветки ошибок с прошлой попытки
      ['f-title','f-product','f-host','f-date','f-time','f-duration','f-guests','f-price','f-notes'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dishesFieldEl = overlay.querySelector('#dishes-field');
      if(dishesFieldEl) dishesFieldEl.style.boxShadow = '';
      const rentalFieldEl = overlay.querySelector('#rental-field');
      if(rentalFieldEl) rentalFieldEl.style.boxShadow = '';

      const title = overlay.querySelector('#f-title').value.trim();
      const productVal = overlay.querySelector('#f-product').value;
      const hostVal = overlay.querySelector('#f-host').value.trim();
      const dateVal = overlay.querySelector('#f-date').value;
      const timeVal = overlay.querySelector('#f-time').value;
      const durationVal = parseInt(overlay.querySelector('#f-duration').value) || 0;
      const guestsRaw = overlay.querySelector('#f-guests').value;
      const priceRaw = overlay.querySelector('#f-price').value;
      const statusVal = overlay.querySelector('#f-status').value || 'confirmed';
      const dishesVal = overlay.querySelector('#f-dishes').value;
      const rentalBeforeRaw = overlay.querySelector('#f-rental-before').value;
      const rentalAfterRaw = overlay.querySelector('#f-rental-after').value;
      const notesVal = overlay.querySelector('#f-notes').value.trim();
      const guestNameVal = overlay.querySelector('#f-guest-name').value.trim();
      syncMaterialsItemsFromInputs();
      const cleanedMaterialsItems = materialsItemsDraft
        .map(m=>({name:(m.name||'').trim(), cost:(m.cost!==undefined&&m.cost!==null&&!isNaN(m.cost))?Number(m.cost):null, qty:(m.qty!==undefined&&m.qty!==null&&!isNaN(m.qty))?Number(m.qty):null, source:m.source==='master'?'master':'studio', payTo:m.source==='master'?(m.payTo||'').trim():''}))
        .filter(m=>m.name && m.cost!==null);
      const materialsMissing = cleanedMaterialsItems.length === 0;
      syncPickupItemsFromInputs();
      const cleanedPickupItems = pickupItemsDraft
        .map(p=>({guestName:(p.guestName||'').trim(), readyDate:p.readyDate||'', status:p.status==='picked_up'?'picked_up':'waiting', pickupDate:p.pickupDate||''}))
        .filter(p=>p.guestName || p.readyDate);
      const rentalBeforeVal = showsDishesAndRental(statusVal) ? (parseInt(rentalBeforeRaw) || 0) : 0;
      const rentalAfterVal = showsDishesAndRental(statusVal) ? (parseInt(rentalAfterRaw) || 0) : 0;

      // для статуса "Слот" поля необязательны — во всех остальных случаях обязательны все графы
      if(statusVal !== 'slot'){
        let firstInvalid = null;
        const markInvalid = (id)=>{
          const el = overlay.querySelector('#'+id);
          if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
        };
        if(!title) markInvalid('f-title');
        if(!hostVal) markInvalid('f-host');
        if(!dateVal) markInvalid('f-date');
        if(!timeVal) markInvalid('f-time');
        if(!durationVal || durationVal<=0) markInvalid('f-duration');
        if(guestsRaw === '') markInvalid('f-guests');
        if(priceRaw === '') markInvalid('f-price');
        if(!notesVal) markInvalid('f-notes');
        if(!guestNameVal) markInvalid('f-guest-name');
        if(materialsMissing){
          const materialsListEl = overlay.querySelector('#materials-items-list');
          if(materialsListEl){ materialsListEl.style.boxShadow = 'inset 0 0 0 1.5px var(--danger)'; materialsListEl.style.borderRadius = 'var(--radius)'; if(!firstInvalid) firstInvalid = materialsListEl; }
        }
        let dishesMissing = false, rentalMissing = false;
        if(showsDishesAndRental(statusVal)){
          if(!dishesVal){ dishesMissing = true; if(dishesFieldEl) dishesFieldEl.style.boxShadow = 'inset 0 0 0 1.5px var(--danger)'; if(!firstInvalid) firstInvalid = dishesFieldEl; }
          if(rentalBeforeRaw === '' || rentalAfterRaw === ''){ rentalMissing = true; if(rentalFieldEl) rentalFieldEl.style.boxShadow = 'inset 0 0 0 1.5px var(--danger)'; if(!firstInvalid) firstInvalid = rentalFieldEl; }
        }
        if(!title || !hostVal || !dateVal || !timeVal || !durationVal || durationVal<=0 || guestsRaw==='' || priceRaw==='' || !notesVal || !guestNameVal || materialsMissing || dishesMissing || rentalMissing){
          showGapWarningBanner('Заполните все поля перед сохранением (для статуса «Слот» это необязательно). Себестоимость: добавьте хотя бы один материал с названием и суммой.');
          if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
          return;
        }
      } else if(!title){
        // даже у "Слота" нужно хоть какое-то название, чтобы отличать события в календаре
        overlay.querySelector('#f-title').style.borderColor = 'var(--danger)';
        return;
      }

      syncAdditionalHostsFromInputs();
      const finalAdditionalHosts = additionalHostsDraft
        .map(h=>({ name: (h.name||'').trim(), masterPay: h.masterPay, masterPayAuto: h.masterPayAuto }))
        .filter(h=>h.name);
      const allNamesForThisEvent = [hostVal, ...finalAdditionalHosts.map(h=>h.name)].filter(Boolean);

      if(allNamesForThisEvent.length){
        const newStart = timeToMinutes(timeVal);
        const newEnd = timeToMinutes(timeVal) + durationVal;
        let conflict = null, conflictName = null;
        for(const name of allNamesForThisEvent){
          conflict = state.events.find(e=>{
            if(e.id === state.modal.event.id) return false; // не сравниваем событие само с собой при редактировании
            if(e.date !== dateVal) return false;
            const names = eventHostsWithPay(e).map(h=>h.name.toLowerCase());
            if(!names.includes(name.toLowerCase())) return false;
            const s = timeToMinutes(e.time);
            const en = s + (Number(e.duration)||0);
            return newStart < en && s < newEnd;
          });
          if(conflict){ conflictName = name; break; }
        }
        if(conflict){
          const csp = getSpace(conflict.spaceId);
          const conflictEnd = timeToMinutes(conflict.time) + (Number(conflict.duration)||0);
          const endH = String(Math.floor(conflictEnd/60)).padStart(2,'0');
          const endM = String(conflictEnd%60).padStart(2,'0');
          showHostConflictPopup(
            `<b>${escapeHtml(conflictName)}</b> уже занят(а) в это время — ведёт «${escapeHtml(conflict.title)}» с ${conflict.time} до ${endH}:${endM} в пространстве «${escapeHtml(csp.name)}» (${formatDateText(dateVal)}).<br><br>Выберите другое время или другого мастера.`
          );
          return; // блокируем сохранение
        }
      }

      const updated = {
        id: state.modal.event.id,
        spaceId: overlay.querySelector('#f-space').value,
        host: hostVal,
        date: dateVal,
        time: timeVal,
        duration: durationVal,
        guests: overlay.querySelector('#f-guests').value !== '' ? parseInt(overlay.querySelector('#f-guests').value) : null,
        itemsCount: (overlay.querySelector('#f-items-count') && overlay.querySelector('#f-items-count').value !== '') ? parseInt(overlay.querySelector('#f-items-count').value) : null,
        itemsCountAuto: overlay.querySelector('#f-items-count') ? (overlay.querySelector('#f-items-count').dataset.auto === 'true') : true,
        masterPay: overlay.querySelector('#f-master-pay').value !== '' ? parseInt(overlay.querySelector('#f-master-pay').value) : null,
        masterPayAuto: overlay.querySelector('#f-master-pay').dataset.auto === 'true',
        additionalHosts: finalAdditionalHosts,
        guestName: overlay.querySelector('#f-guest-name').value.trim(),
        price: overlay.querySelector('#f-price').value !== '' ? parseInt(overlay.querySelector('#f-price').value) : null,
        agreedPrice: overlay.querySelector('#f-agreed-price').value !== '' ? parseInt(overlay.querySelector('#f-agreed-price').value) : null,
        materialsItems: cleanedMaterialsItems,
        pickupItems: cleanedPickupItems,
        payerType: overlay.querySelector('#f-payer-type').value || 'individual',
        companyName: overlay.querySelector('#f-company-name').value.trim(),
        documents: {
          contract: overlay.querySelector('#f-doc-contract').checked,
          paymentOrder: overlay.querySelector('#f-doc-payment').checked,
          act: overlay.querySelector('#f-doc-act').checked,
        },
        payments: (()=>{ try{ return JSON.parse(overlay.querySelector('#f-payments').value || '[]'); }catch(e){ return []; } })(),
        title: title,
        product: overlay.querySelector('#f-product').value || '',
        status: overlay.querySelector('#f-status').value || 'confirmed',
        dishes: overlay.querySelector('#f-dishes').value || '',
        rentalBefore: rentalBeforeVal || null,
        rentalAfter: rentalAfterVal || null,
        notes: overlay.querySelector('#f-notes').value.trim(),
        masterReport: (()=>{
          const source = overlay.querySelector('#f-report-source').value.trim();
          const professions = overlay.querySelector('#f-report-professions').value.trim();
          const unique = overlay.querySelector('#f-report-unique').value.trim();
          const ratingRaw = overlay.querySelector('#f-report-rating').value;
          const ratingComment = overlay.querySelector('#f-report-rating-comment').value.trim();
          if(!source && !professions && !unique && !ratingRaw && !ratingComment) return state.modal.event.masterReport || null;
          return { source, professions, unique, rating: ratingRaw?parseInt(ratingRaw):null, ratingComment };
        })(),
      };
      const idx = state.events.findIndex(x=>x.id===updated.id);
      const previousMaterialsItems = idx >= 0 ? (state.events[idx].materialsItems || []) : [];
      if(idx >= 0) state.events[idx] = updated; else state.events.push(updated);
      if(!state.modal.keepAll) state.activeSpaceId = updated.spaceId;

      // списание/восстановление остатков материалов — по разнице количества между старой и новой версией мероприятия
      const oldQtyByName = {};
      previousMaterialsItems.forEach(m=>{
        if(m.qty!==undefined && m.qty!==null && !isNaN(m.qty)){
          const key = (m.name||'').trim().toLowerCase();
          oldQtyByName[key] = (oldQtyByName[key]||0) + Number(m.qty);
        }
      });
      const newQtyByName = {};
      cleanedMaterialsItems.forEach(m=>{
        if(m.qty!==undefined && m.qty!==null && !isNaN(m.qty)){
          const key = m.name.trim().toLowerCase();
          newQtyByName[key] = (newQtyByName[key]||0) + Number(m.qty);
        }
      });
      const affectedMaterialKeys = new Set([...Object.keys(oldQtyByName), ...Object.keys(newQtyByName)]);
      let catalogChanged = false;
      affectedMaterialKeys.forEach(key=>{
        const catItem = state.materialsCatalog.find(m=>m.name.trim().toLowerCase()===key);
        if(!catItem || !catItem.trackStock) return; // материал не найден в справочнике или остатки по нему не отслеживаются (переменный расходник)
        const delta = (newQtyByName[key]||0) - (oldQtyByName[key]||0);
        if(delta !== 0){
          catItem.stock = (catItem.stock!==undefined&&catItem.stock!==null&&!isNaN(catItem.stock)?Number(catItem.stock):0) - delta;
          catalogChanged = true;
        }
      });
      if(catalogChanged) await saveMaterialsCatalog();

      await saveEvents();
      const dayEvts = state.events.filter(e=>e.date===updated.date && e.spaceId===updated.spaceId);
      const warns = computeGapWarnings(dayEvts);
      state.modal = null; overlay.remove(); render();
      if(warns[updated.id]){
        const w = warns[updated.id];
        showGapWarningBanner(w.gap < 0
          ? `Внимание: «${updated.title}» накладывается по времени на «${w.prevTitle}» (${Math.abs(w.gap)} мин)`
          : `Внимание: перерыв между «${w.prevTitle}» и «${updated.title}» — всего ${w.gap} мин (меньше ${MIN_GAP_MINUTES})`);
      }
    };
  }

  function showConfirmDeletePopup(message, onConfirm){
    let existing = document.getElementById('confirm-delete-popup');
    if(existing) existing.remove();
    const wrap = document.createElement('div');
    wrap.id = 'confirm-delete-popup';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(42,37,32,0.5);display:flex;align-items:center;justify-content:center;z-index:220;padding:20px;';
    wrap.innerHTML = `
      <div style="background:var(--white);border-radius:4px;max-width:400px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.3);font-family:var(--font-body);">
        <div style="font-family:var(--font-display);font-weight:600;font-size:16px;margin-bottom:10px;color:var(--danger);">Подтвердите удаление</div>
        <div style="font-size:13.5px;color:var(--ink);line-height:1.55;margin-bottom:18px;">${message}</div>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button id="confirm-del-no" style="border:1px solid var(--line-strong);background:var(--white);color:var(--ink);padding:9px 18px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:var(--font-body);">Отмена</button>
          <button id="confirm-del-yes" style="border:none;background:var(--danger);color:#fff;padding:9px 18px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:var(--font-body);">Удалить</button>
        </div>
      </div>
    `;
    document.body.appendChild(wrap);
    wrap.querySelector('#confirm-del-yes').onclick = ()=>{ wrap.remove(); onConfirm(); };
    wrap.querySelector('#confirm-del-no').onclick = ()=> wrap.remove();
    wrap.addEventListener('click', (e)=>{ if(e.target===wrap) wrap.remove(); });
  }

      <div style="background:var(--white);border-radius:4px;max-width:400px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.3);font-family:var(--font-body);">

        </div>
      </div>

  }

  function showCapacityConfirmPopup(spaceName, capacity, guests){
    let existing = document.getElementById('capacity-confirm-popup');
    if(existing) existing.remove();
    const wrap = document.createElement('div');
    wrap.id = 'capacity-confirm-popup';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(42,37,32,0.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';
    wrap.innerHTML = `
      <div style="background:var(--white);border-radius:4px;max-width:400px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.3);font-family:var(--font-body);">
        <div style="font-family:var(--font-display);font-weight:600;font-size:17px;margin-bottom:10px;color:#8A5A1E;">⚠ Много гостей для пространства</div>
        <div style="font-size:13.5px;color:var(--ink); line-height:1.55;margin-bottom:18px;">Вы указали <b>${guests}</b> человек в пространстве «${escapeHtml(spaceName)}», обычная вместимость которого — до <b>${capacity}</b>. Вы уверены, что гости войдут?</div>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button id="capacity-no" style="border:1px solid var(--line-strong);background:var(--white);color:var(--ink);padding:9px 18px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:var(--font-body);">Нет</button>
          <button id="capacity-yes" style="border:none;background:var(--ink);color:#fff;padding:9px 18px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:var(--font-body);">Да</button>
        </div>
      </div>
    `;
    document.body.appendChild(wrap);
    // оба ответа просто закрывают предупреждение — количество гостей остаётся тем, что ввёл менеджер
    wrap.querySelector('#capacity-yes').onclick = ()=> wrap.remove();
    wrap.querySelector('#capacity-no').onclick = ()=> wrap.remove();
    wrap.addEventListener('click', (e)=>{ if(e.target===wrap) wrap.remove(); });
  }

  function showGapWarningBanner(text){
    let banner = document.getElementById('gap-warning-banner');
    if(banner) banner.remove();
    banner = document.createElement('div');
    banner.id = 'gap-warning-banner';
    banner.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#8A5A1E;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;font-family:var(--font-body);z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.25);display:flex;gap:12px;align-items:center;max-width:90vw;';
    banner.innerHTML = `⚠ ${escapeHtml(text)} <button style="background:transparent;border:1px solid rgba(255,255,255,0.6);color:#fff;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:12px;flex-shrink:0;">Ок</button>`;
    banner.querySelector('button').onclick = ()=> banner.remove();
    document.body.appendChild(banner);
    setTimeout(()=>{ if(banner && banner.parentNode) banner.remove(); }, 8000);
  }

  loadData();
})();
</script>
