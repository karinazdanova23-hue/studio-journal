    if(!(await showConfirm('Удалить запись?'))) return;
    const fscope = b.dataset.fundScope;
    const before = fundsFor(fscope);
    const doomed = before.find(f=>f.id===b.dataset.delFund);
    if(doomed) await moveToTrash(fscope==='personal', 'fund', doomed);
    setFundsFor(fscope, before.filter(f=>f.id!==b.dataset.delFund));
    const ok = await persistFundsFor(fscope);
    if(!ok){ setFundsFor(fscope, before); saveFailedToast(); return; }
    render();
  });
}

function openFundModal(id, scope){
  scope = scope || 'work';
  const existing = id ? fundsFor(scope).find(f=>f.id===id) : null;
  if(existing) scope = existing.scope || 'work';
  const initialType = existing ? existing.type : 'expense';
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal">
        <h3>${existing?'Изменить запись':'Новая запись'} · ${scope==='personal'?'🔒 личная':'рабочая'}</h3>
        <div class="field-row">
          <div class="field"><label>Тип</label>
            <select id="fn_type">
              <option value="issue" ${initialType==='issue'?'selected':''}>Доход</option>
              <option value="expense" ${initialType==='expense'?'selected':''}>Расход</option>
            </select>
          </div>
          <div class="field"><label>Дата</label><input type="date" id="fn_date" value="${existing?existing.date:todayISO()}"></div>
          <div class="field"><label>Сумма, ₽</label><input type="number" min="0" step="0.01" class="mono" id="fn_amount" value="${existing?existing.amount:''}"></div>
        </div>

          <input id="fn_receipt" value="${existing?escapeHtml(existing.receiptUrl||''):''}" placeholder="https://...">
        </div>
        <div class="field"><label>Комментарий</label><textarea id="fn_comment" rows="2">${existing?escapeHtml(existing.comment||''):''}</textarea></div>
        <div class="modal-actions">
          <button class="btn ghost" id="cancelFund">Отмена</button>
          <button class="btn" id="saveFund">Сохранить</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelFund').onclick=closeModal;
  document.getElementById('ov').onclick=(ev)=>{ if(ev.target.id==='ov') closeModal(); };
  document.getElementById('fn_type').onchange=(e)=>{
    document.getElementById('fn_receipt_wrap').style.display = e.target.value==='expense' ? '' : 'none';
  };
  document.getElementById('saveFund').onclick=async ()=>{
    const amount = parseFloat(document.getElementById('fn_amount').value);
    if(!amount || amount<=0){ toast('Укажите сумму'); return; }
    const type = document.getElementById('fn_type').value;
    const data = {
      id: existing?existing.id:uid(),
      type,
      scope,
      date: document.getElementById('fn_date').value || todayISO(),
      amount,
      purpose: document.getElementById('fn_purpose').value.trim(),
      receiptUrl: type==='expense' ? document.getElementById('fn_receipt').value.trim() : '',
      comment: document.getElementById('fn_comment').value.trim(),
      createdAt: existing?existing.createdAt:Date.now(),
    };
    const before = fundsFor(scope);
    if(existing) setFundsFor(scope, before.map(f=>f.id===existing.id?data:f));
    else setFundsFor(scope, before.concat([data]));
    const ok = await persistFundsFor(scope);
    if(!ok){ setFundsFor(scope, before); saveFailedToast(); return; }
    closeModal(); render();
    toast('Запись сохранена');
  };
}

async function openTaskFromSearch(taskId, personal){
  if(personal && !personalAccessAllowed()) return false;
  const t = tasksFor(personal).find(x=>x.id===taskId);
  if(!t) return false;
  if(!canEditTask(t, personal)){ toast(whyCantEdit(t)); return false; }
  state.tab='tasks'; state.taskSubtab = personal?'personal':'work';
  render();
  setTimeout(()=>openTaskModal(taskId, personal), 50);
  return true;
}
function performGlobalSearch(query){
  const q = query.trim().toLowerCase();
  if(q.length<2) return null;
  const match = (s)=> s && String(s).toLowerCase().includes(q);
  const allTasks = state.tasksWork.map(t=>({...t, __personal:false}))
    .concat(personalAccessAllowed() ? state.personalTasks.map(t=>({...t, __personal:true})) : []);
  const tasks = allTasks.filter(t=> match(t.title) || match(t.description) || match(t.purchaseStore)).slice(0,8);

  const allEvents = allVisibleEvents().map(e=>({...e, __personal: isPersonalEvent(e.id)}));
  const events = allEvents.filter(e=> match(e.title) || match(e.notes) || match(e.location)).slice(0,8);

  const allFunds = hasRole('Руководитель','Ассистент')
    ? state.fundsEntries.map(f=>({...f, __personal:false})).concat(personalAccessAllowed() ? state.personalFundsEntries.map(f=>({...f, __personal:true})) : [])
    : [];
  const funds = allFunds.filter(f=> match(f.purpose) || match(f.comment)).slice(0,8);

  const allProjects = state.projectsWork.map(p=>({...p, __personal:false}))
    .concat(personalAccessAllowed() ? state.personalProjects.map(p=>({...p, __personal:true})) : []);
  const projects = allProjects.filter(p=> match(p.name)).slice(0,8);

  const ideas = state.ideaBankWork.filter(i=> match(i.name)).slice(0,8);

  return {tasks, events, funds, projects, ideas};
}
function openSearchModal(){
  const ov = document.createElement('div');
  ov.className='overlay'; ov.style.zIndex=150;
  ov.innerHTML = `
    <div class="modal" style="max-width:560px;">
      <h3>Поиск по всему приложению</h3>
      <input type="text" id="globalSearchInput" placeholder="Задача, проект, событие, расход..." autocomplete="off">
      <div id="globalSearchResults" style="margin-top:16px;max-height:55vh;overflow-y:auto;"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="closeSearch">Закрыть</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const finish=()=>ov.remove();
  ov.querySelector('#closeSearch').onclick=finish;
  ov.onclick=(e)=>{ if(e.target===ov) finish(); };
  const input = ov.querySelector('#globalSearchInput');
  const resultsEl = ov.querySelector('#globalSearchResults');
  setTimeout(()=>input.focus(),0);

  function renderResults(){
    const q = input.value;
    if(q.trim().length<2){
      resultsEl.innerHTML = `<p class="subtitle" style="margin:0;">Введите минимум 2 символа</p>`;
      return;
    }
    const res = performGlobalSearch(q);
    const totalCount = res.tasks.length+res.events.length+res.funds.length+res.projects.length+res.ideas.length;
    if(!totalCount){
      resultsEl.innerHTML = `<div class="empty-state"><div class="big">Ничего не найдено</div></div>`;
      return;
    }
    let html = '';
    if(res.tasks.length){
      html += `<div class="search-cat-label">Задачи</div><div class="item-list" style="margin-bottom:8px;">`;
      html += res.tasks.map(t=>`
        <div class="item" style="cursor:pointer;" data-sr-task="${t.id}" data-sr-personal="${t.__personal?'1':'0'}">
          <div class="main"><div class="title">${t.__personal?'🔒 ':''}${escapeHtml(t.title)}</div>
          <div class="meta"><span class="badge ${t.status||'progress'}">${STATUSES[t.status]||''}</span>${t.deadline?`<span>до ${fmtDate(t.deadline)}</span>`:''}</div></div>
        </div>`).join('');
      html += `</div>`;
    }
    if(res.events.length){
      html += `<div class="search-cat-label">Календарь</div><div class="item-list" style="margin-bottom:8px;">`;
      html += res.events.map(e=>`
        <div class="item" style="cursor:pointer;" data-sr-day="${e.date}">
          <div class="main"><div class="title">${e.__personal?'🔒 ':''}${escapeHtml(e.title)}</div>
          <div class="meta"><span>${CATEGORIES[e.category]||''}</span><span>${fmtDate(e.date)}</span></div></div>
        </div>`).join('');
      html += `</div>`;
    }
    if(res.funds.length){
      html += `<div class="search-cat-label">Финансы</div><div class="item-list" style="margin-bottom:8px;">`;
      html += res.funds.map(f=>`
        <div class="item" style="cursor:pointer;" data-sr-fund="${f.id}" data-sr-fund-scope="${f.__personal?'personal':'work'}">
          <div class="main"><div class="title">${f.__personal?'🔒 ':''}${escapeHtml(f.purpose||(f.type==='issue'?'Доход':'Расход'))}</div>
          <div class="meta"><span class="${f.type==='issue'?'amt-issue':'amt-expense'}">${f.type==='issue'?'+':'−'}${fmtMoney(f.amount)}</span><span>${fmtDate(f.date)}</span></div></div>
        </div>`).join('');
      html += `</div>`;
    }
    if(res.projects.length){
      html += `<div class="search-cat-label">Проекты</div><div class="item-list" style="margin-bottom:8px;">`;
      html += res.projects.map(p=>`
        <div class="item" style="cursor:pointer;" data-sr-project="${p.id}" data-sr-project-personal="${p.__personal?'1':'0'}">
          <div class="main"><div class="title">${p.__personal?'🔒 ':''}${escapeHtml(p.name)}</div></div>
        </div>`).join('');
      html += `</div>`;
    }
    if(res.ideas.length){
      html += `<div class="search-cat-label">Банк идей-проектов</div><div class="item-list" style="margin-bottom:8px;">`;
      html += res.ideas.map(i=>`
        <div class="item" style="cursor:pointer;" data-sr-idea="${i.id}">
          <div class="main"><div class="title">${escapeHtml(i.name)}</div><div class="meta"><span>${(i.tasks||[]).length} задач(и) в плане</span></div></div>
        </div>`).join('');
      html += `</div>`;
    }
    resultsEl.innerHTML = html;

    resultsEl.querySelectorAll('[data-sr-task]').forEach(row=>row.onclick=async ()=>{
      const ok = await openTaskFromSearch(row.dataset.srTask, row.dataset.srPersonal==='1');
      if(ok) finish();
    });
    resultsEl.querySelectorAll('[data-sr-day]').forEach(row=>row.onclick=()=>{
      finish();
      state.tab='calendar'; render();
      setTimeout(()=>openDayModal(row.dataset.srDay), 50);
    });
    resultsEl.querySelectorAll('[data-sr-fund]').forEach(row=>row.onclick=()=>{
      finish();
      const fscope = row.dataset.srFundScope;
      state.fundsScope = fscope; state.tab='funds'; render();
      setTimeout(()=>openFundModal(row.dataset.srFund, fscope), 50);
    });
    resultsEl.querySelectorAll('[data-sr-project]').forEach(row=>row.onclick=()=>{
      finish();
      const personal = row.dataset.srProjectPersonal==='1';
      state.tab='tasks'; state.taskSubtab = personal?'personal':'work';
      state.selectedProject[personal?'personal':'work'] = row.dataset.srProject;
      render();
    });
    resultsEl.querySelectorAll('[data-sr-idea]').forEach(row=>row.onclick=()=>{
      finish();
      state.tab='tasks'; state.taskSubtab='work'; render();
      setTimeout(()=>openProjectsModal(false), 50);
    });
  }
  input.oninput = renderResults;
  input.onkeydown = (e)=>{ if(e.key==='Escape') finish(); };
  renderResults();
}

  function wire(){
    document.getElementById('closeStaff').onclick=closeModal;
    document.getElementById('ov').onclick=(ev)=>{ if(ev.target.id==='ov') closeModal(); };
    document.getElementById('addEmp').onclick=async ()=>{
      const name = document.getElementById('emp_name').value.trim();
      if(!name){ toast('Введите имя'); return; }
      const role = document.getElementById('emp_role').value.trim();
      const before = state.employees;
      state.employees = before.concat([{id:uid(), name, role}]);
      const ok = await saveEmployees();
      if(!ok){ state.employees = before; saveFailedToast(); return; }
      modal.innerHTML = body(); wire(); render();
    };
    modal.querySelectorAll('[data-view-tasks]').forEach(b=>b.onclick=()=>{
      const empId = b.dataset.viewTasks;
      closeModal();
      state.tab='tasks'; state.taskSubtab='work';
      state.taskFilterEmployee=empId;
      state.selectedProject.work='all';
      render();
    });
    modal.querySelectorAll('[data-edit-emp]').forEach(b=>b.onclick=()=>{
      openEditEmployeeModal(b.dataset.editEmp, ()=>{ modal.innerHTML = body(); wire(); render(); });
    });
    modal.querySelectorAll('[data-pw-emp]').forEach(b=>b.onclick=()=>{
      openEmployeePasswordModal(b.dataset.pwEmp, ()=>{ refreshAndRender(); }, pwStatus[b.dataset.pwEmp]);
    });
    modal.querySelectorAll('[data-del-emp]').forEach(b=>b.onclick=async ()=>{
      if(!(await showConfirm('Удалить сотрудника? Задачи и события останутся, но без привязки к нему. Можно будет вернуть через корзину (🗄️).'))) return;
      const before = state.employees;
      const doomedEmp = before.find(e=>e.id===b.dataset.delEmp);
      if(doomedEmp) await moveToTrash(false, 'employee', doomedEmp);
      state.employees = before.filter(e=>e.id!==b.dataset.delEmp);
      const ok = await saveEmployees();
      if(!ok){ state.employees = before; saveFailedToast(); return; }
      modal.innerHTML = body(); wire(); render();
    });
  }
  function refreshAndRender(){
    fetchPublicEmployees().then(({employees})=>{
      pwStatus = {};
      employees.forEach(e=>{ pwStatus[e.id] = e.hasPassword; });
      modal.innerHTML = body(); wire(); render();
    });
  }
  fetchPublicEmployees().then(({employees})=>{
    pwStatus = {};
    employees.forEach(e=>{ pwStatus[e.id] = e.hasPassword; });
    modal.innerHTML = body(); wire();
  });
  wire();
}
function openEditEmployeeModal(empId, onDone){
  const emp = state.employees.find(e=>e.id===empId);
  if(!emp) return;
  const ov = document.createElement('div');
  ov.className='overlay'; ov.style.zIndex=200;
  ov.innerHTML = `
    <div class="modal" style="max-width:380px;">
      <h3>Изменить сотрудника</h3>
      <div class="field"><label>Имя</label><input id="edit_emp_name" value="${escapeHtml(emp.name)}"></div>
      <div class="field"><label>Роль</label><input id="edit_emp_role" value="${escapeHtml(emp.role||'')}"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="editEmpCancel">Отмена</button>
        <button class="btn" id="editEmpSave">Сохранить</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const nameInput = ov.querySelector('#edit_emp_name');
  setTimeout(()=>{ nameInput.focus(); nameInput.select(); }, 0);
  const finish = ()=>ov.remove();
  ov.querySelector('#editEmpCancel').onclick = finish;
  ov.onclick = (e)=>{ if(e.target===ov) finish(); };
  ov.querySelector('#editEmpSave').onclick = async ()=>{
    const name = nameInput.value.trim();
    if(!name){ toast('Введите имя'); return; }
    const role = ov.querySelector('#edit_emp_role').value.trim();
    const before = state.employees;
    state.employees = before.map(e=>e.id===empId?{...e, name, role}:e);
    const ok = await saveEmployees();
    if(!ok){ state.employees = before; saveFailedToast(); return; }
    toast('Сотрудник обновлён');
    finish();
    if(onDone) onDone();
  };
}

/* ---------------- modal helpers ---------------- */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

function staffAccessAllowed(){
  return hasRole('Руководитель','Ассистент');
}
document.getElementById('staffBtn').onclick = ()=>{
  if(!staffAccessAllowed()){
    toast('Доступ к разделу «Сотрудники» есть только у Руководителя и Ассистента');
    return;
  }
  openStaffModal();
};
document.getElementById('dataBtn').onclick = ()=>{
  if(!hasRole('Руководитель','Ассистент')){
    toast('Резервная копия, экспорт и импорт доступны только Руководителю и Ассистенту');
    return;
  }
  openDataModal();
};
document.getElementById('whoAmIBtn').onclick = openWhoAmIModal;
document.getElementById('searchBtn').onclick = openSearchModal;
document.getElementById('bellBtn').onclick = (e)=>{ e.stopPropagation(); toggleReminderPanel(); };

let calResizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(calResizeTimer);
  calResizeTimer = setTimeout(()=>{ if(state.loaded && state.tab==='calendar') render(); }, 200);
});

/* ---------------- init ---------------- */
async function startApp(){
  await loadAll();
  if(!state.taskFilterEmployee && state.currentUserId) state.taskFilterEmployee = state.currentUserId;
  state.knownTaskIds = new Set(state.tasksWork.map(t=>t.id));
  state.knownEventIds = new Set(state.events.map(e=>e.id));
  render();
  if(state.browserNotify && 'Notification' in window && Notification.permission==='granted'){
    checkNotificationsTick();
  }
  if(!state.notifyIntervalSet){
    state.notifyIntervalSet = true;
    setInterval(checkNotificationsTick, 60000);
    setInterval(checkNewTasksTick, 60000);
    setInterval(checkNewEventsTick, 60000);
  }
}
(async function init(){
  const emp = await checkSession();
  if(!emp){
    renderLoginScreen();
    return;
  }
  state.currentUserId = emp.id;
  await startApp();
})();
</script>
