<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#EDE7DC;
    --paper-2:#E3DBCC;
    --ink:#2A2520;
    --ink-soft:#6B6156;
    --line: rgba(42,37,32,0.14);
    --line-strong: rgba(42,37,32,0.28);
    --accent:#3D4F5C;
    --accent-2:#3D4F5C;
    --white:#FBF9F4;
    --danger:#A34A3E;

    --glaze-1:#C08A3E;
    --glaze-2:#8B5D6B;
    --glaze-3:#6E8B6A;
    --glaze-4:#4A7C82;

    --status-green:#5C7A4A;
    --status-green-bg:#5C7A4A;
    --status-red:#A3402F;
    --status-red-bg:#A3402F;
    --status-blue:#3D6FA8;
    --status-purple:#7A5296;
    --status-cyan:#4FA8C9;

    --radius: 3px;
    --font-display: 'Fraunces', serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .app{ max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }

  /* ---------- header ---------- */
  .app-header{
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 18px; margin-bottom: 22px;
    flex-wrap: wrap; gap: 16px;
  }
  .daily-alerts-banner{
    display:flex; flex-wrap:wrap; gap: 8px 16px;
    background: #FBEFD9; border: 1px solid #E8CE9C; border-radius: var(--radius);
    padding: 10px 14px; margin: -8px 0 22px; font-size: 12.5px; color: #6B4A1E;
  }
  .daily-alert-item.clickable{ cursor:pointer; text-decoration: underline; text-decoration-style: dotted; }
  .app-title{
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin:0;
  }
  .app-sub{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 4px;
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
  }

  .view-switch{
    display:flex; gap: 2px; background: var(--paper-2);
    border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 3px;
  }
  .view-switch button{
    border:none; background: transparent; padding: 8px 16px;
    font-family: var(--font-body); font-size: 13px; font-weight: 500;
    color: var(--ink-soft); cursor:pointer; border-radius: 2px;
    transition: all .15s ease;
  }
  .view-switch button.active{ background: var(--ink); color: var(--white); }
  .view-switch button:not(.active):hover{ color: var(--ink); }

  .lock-btn{
    border: 1px solid var(--line-strong); background: var(--white);
    padding: 9px 14px; border-radius: var(--radius); font-size: 12.5px;
    font-family: var(--font-mono); color: var(--ink-soft); cursor:pointer;
  }
  .lock-btn:hover{ border-color: var(--ink); color: var(--ink); }
  .lock-btn.unlocked{ background: var(--status-green); border-color: var(--status-green); color: var(--white); }

  /* ---------- analytics ---------- */
  .analytics-summary{ display:flex; gap:14px; margin-bottom: 26px; flex-wrap: wrap; }
  .summary-card{
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    padding: 14px 20px; background: var(--white); min-width: 120px;
  }
  .summary-card .num{ font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height:1; }
  .summary-card .label{ font-size: 11px; color: var(--ink-soft); font-family: var(--font-mono); margin-top: 6px; letter-spacing:0.02em; }
  .summary-card.green .num{ color: var(--status-green); }
  .summary-card.red .num{ color: var(--status-red); }

  .analytics-section{ margin-bottom: 30px; }
  .analytics-section h4{
    font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0 0 14px;
  }
  .stat-row{ display:flex; align-items:center; gap: 12px; margin-bottom: 9px; cursor:default; }
  .stat-row.clickable{ cursor:pointer; }
  .stat-row .stat-label{ width: 170px; font-size: 13px; flex-shrink:0; display:flex; align-items:center; gap:6px; }
  .stat-row .stat-bar-track{ flex:1; background: var(--paper-2); height: 10px; border-radius: 3px; overflow:hidden; }
  .stat-row .stat-bar-fill{ height:100%; border-radius:3px; }
  .stat-row .stat-count{ width: 30px; text-align:right; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); flex-shrink:0; }
  .stat-row:hover.clickable .stat-label{ text-decoration: underline; }

  .host-expand{
    margin: 2px 0 14px 182px; padding: 10px 14px; background: var(--paper-2);
    border-radius: var(--radius); font-size: 12.5px;
  }
  .host-expand-row{ display:flex; justify-content:space-between; padding: 3px 0; }
  .host-expand-row .n{ color: var(--ink-soft); font-family: var(--font-mono); }

  .analytics-empty{ color: var(--ink-soft); font-size: 13.5px; padding: 10px 0 30px; }

  /* ---------- space tabs (glaze swatches) ---------- */
  .space-tabs{ display:flex; gap:10px; margin-bottom: 22px; flex-wrap: wrap; }
  .space-tab{
    display:flex; align-items:center; gap:9px;
    border: 1px solid var(--line-strong); background: var(--white);
    border-radius: var(--radius); padding: 9px 14px 9px 11px;
    cursor:pointer; transition: all .15s ease;
  }
  .space-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width: 18px; height:18px; padding:0 3px;
    border-radius: 4px; font-family: var(--font-mono); font-size: 11px; font-weight:600;
    color: var(--white); line-height:1; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    flex-shrink:0;
  }
  .space-badge.sm{ min-width:14px; height:14px; font-size:9px; border-radius:3px; }
  .space-badge.xs{ min-width:12px; height:12px; font-size:8px; border-radius:3px; }
  .swatch-multi{ display:flex; gap:2px; flex-shrink:0; }
  .space-tab.active .space-badge{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15), 0 0 0 2px var(--ink); }
  .space-tab .name{ font-size: 13.5px; font-weight: 500; }
  .space-tab.active{ background: var(--ink); border-color: var(--ink); }
  .space-tab.active .name{ color: var(--white); }
  .space-tab:not(.active):hover{ border-color: var(--ink); }
  .space-tab input.rename{
    font-family: var(--font-body); font-size: 13.5px; font-weight: 500;
    border: none; background: transparent; color: inherit; width: 110px;
    outline: none; border-bottom: 1px dashed currentColor;
  }

  /* ---------- calendar ---------- */
  .cal-nav{
    display:flex; align-items:center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav .month-label{
    font-family: var(--font-display); font-size: 21px; font-weight: 600;
    text-transform: capitalize;
  }
  .cal-nav-btns{ display:flex; gap:8px; align-items:center;}
  .nav-btn{
    border: 1px solid var(--line-strong); background: var(--white);
    width: 32px; height: 32px; border-radius: var(--radius);
    cursor:pointer; font-size: 15px; display:flex; align-items:center; justify-content:center;
    color: var(--ink);
  }
  .nav-btn:hover{ background: var(--ink); color: var(--white); }
  .today-btn{
    border: 1px solid var(--line-strong); background: var(--white);
    padding: 7px 12px; border-radius: var(--radius); font-size: 12.5px;
    cursor:pointer; font-family: var(--font-mono); color: var(--ink-soft);
  }
  .today-btn:hover{ color: var(--ink); border-color: var(--ink);}

  .cal-grid{
    display:grid; grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid var(--line-strong); border-left: 1px solid var(--line-strong);
    background: var(--line-strong);
    gap: 1px;
    border-radius: var(--radius);
    overflow: hidden;
  }
  .cal-dow{
    background: var(--paper-2); padding: 7px 9px; font-size: 11px;
    font-family: var(--font-mono); color: var(--ink-soft); letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .cal-cell{
    background: var(--white); min-height: 104px; padding: 7px 8px;
    cursor:pointer; position:relative; transition: background .12s ease;
    display:flex; flex-direction:column; gap:4px;
  }
  .cal-cell:hover{ background: #F5F1E8; }
  .cal-cell.other-month{ background: var(--paper); opacity: 0.55; }
  .cal-cell.today{ box-shadow: inset 0 0 0 2px var(--ink); }
  .cal-daynum{ font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); }
  .cal-cell.today .cal-daynum{ color: var(--ink); font-weight: 600; }
  .cal-warn-icon{ font-size: 11px; margin-left: 3px; }
  .cal-hostess{
    font-size: 10px; color: var(--ink-soft); font-family: var(--font-mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin: -1px 0 3px;
  }
  .cal-events{ display:flex; flex-direction:column; gap: 3px; overflow:hidden; }
  .cal-evt-chip{
    font-size: 11px; padding: 2.5px 5px; border-radius: 2px;
    color: var(--white); font-weight: 500;
    white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
    display:flex; gap:5px; align-items:baseline;
  }
  .cal-evt-chip .t{ font-family: var(--font-mono); font-size: 10px; opacity: 0.9; }
  .cal-more{ font-size: 10.5px; color: var(--ink-soft); font-family: var(--font-mono); padding-left: 2px; }
  .chip-dot{
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,0.85);
  }
  .status-legend{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom: 10px; }
  .status-legend .item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); font-family: var(--font-mono); }
  .status-legend .sw{ width:10px; height:10px; border-radius:3px; }
  .status-select-wrap{ display:flex; gap:10px; flex-wrap:wrap; }
  .status-opt{
    flex: 1 1 calc(50% - 5px); border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size: 13.5px; background: var(--paper);
  }
  .status-opt .dot{ width:10px; height:10px; border-radius:50%; }
  .status-opt.active{ border-color: var(--ink); background: var(--white); font-weight:500; }
  .dishes-opt{
    flex: 1 1 calc(50% - 5px); border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size: 13.5px; background: var(--paper);
  }
  .dishes-opt .dot{ width:10px; height:10px; border-radius:50%; }
  .dishes-opt.active{ border-color: var(--ink); background: var(--white); font-weight:500; }
  .payer-opt{
    flex: 1 1 calc(50% - 5px); border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size: 13.5px; background: var(--paper);
  }
  .payer-opt .dot{ width:10px; height:10px; border-radius:50%; }
  .payer-opt.active{ border-color: var(--ink); background: var(--white); font-weight:500; }
  .certkind-opt{
    flex: 1 1 calc(50% - 5px); border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size: 13.5px; background: var(--paper);
  }
  .certkind-opt .dot{ width:10px; height:10px; border-radius:50%; }
  .certkind-opt.active{ border-color: var(--ink); background: var(--white); font-weight:500; }
  .certpurpose-opt{
    flex: 1 1 calc(50% - 5px); border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size: 13.5px; background: var(--paper);
  }
  .certpurpose-opt .dot{ width:10px; height:10px; border-radius:50%; }
  .certpurpose-opt.active{ border-color: var(--ink); background: var(--white); font-weight:500; }

  /* all-spaces mini legend */
  .legend-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; flex-shrink:0; }

  /* ---------- host view ---------- */
  .host-picker{ margin-bottom: 22px; }
  .host-picker label{ display:block; font-size: 12px; color: var(--ink-soft); font-family: var(--font-mono); margin-bottom:8px; letter-spacing:0.02em;}
  .host-chips{ display:flex; flex-wrap:wrap; gap: 8px; }
  .host-chip{
    border: 1px solid var(--line-strong); background: var(--white);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor:pointer;
    font-weight: 500;
  }
  .host-chip.active{ background: var(--ink); color: var(--white); border-color: var(--ink); }
  .host-chip:not(.active):hover{ border-color: var(--ink); }

  .host-empty{ color: var(--ink-soft); font-size: 14px; padding: 40px 0; text-align:center; }

  .host-list{ display:flex; flex-direction:column; gap: 0; border-top: 1px solid var(--line); }
  .host-row{
    display:grid; grid-template-columns: 92px 84px 1fr auto;
    align-items:center; gap: 16px; padding: 14px 4px;
    border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .host-row:hover{ background: var(--white); }
  .host-row .date{ font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
  .host-row .time{ font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
  .host-row .info .title{ font-size: 14.5px; font-weight: 500; }
  .host-row .info .space{ font-size: 12px; color: var(--ink-soft); margin-top:2px; display:flex; align-items:center;}
  .host-row .duration{ font-size: 11.5px; color: var(--ink-soft); font-family: var(--font-mono); }
  .host-row.past{ opacity: 0.5; }

  /* ---------- certificates ---------- */
  .cert-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .cert-list{ display:flex; flex-direction:column; border-top: 1px solid var(--line); }
  .cert-row{
    display:grid; grid-template-columns: 46px 90px 100px 100px 100px 110px 1fr;
    align-items:center; gap: 12px; padding: 12px 4px;
    border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .cert-row:hover{ background: var(--white); }
  .cert-row .num{ font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
  .cert-row .cell{ font-size: 13px; }
  .cert-row .amount{ font-family: var(--font-mono); font-size: 13px; }
  .cert-row .comment{ font-size: 12px; color: var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cert-badge{
    display:inline-flex; align-items:center; justify-content:center; padding: 3px 8px;
    border-radius: 999px; font-size: 11px; font-family: var(--font-mono); font-weight:500;
  }
  .cert-badge.in_progress{ background: #FBEFD9; color: #8A5A1E; }
  .cert-badge.partial{ background: #DCE7F0; color: var(--accent); }
  .cert-badge.used{ background: #E3EEE0; color: var(--status-green); }
  .cert-badge.refunded{ background: #E3EEE0; color: var(--status-green); }

  .cert-subtabs{ display:flex; flex-wrap:wrap; gap:2px; background: var(--paper-2); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 3px; margin-bottom: 18px; width:100%; max-width:fit-content; }
  .cert-subtabs button{ border:none; background:transparent; padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--ink-soft); cursor:pointer; border-radius:2px; }
  .cert-subtabs button.active{ background: var(--ink); color: var(--white); }

  .refund-row{
    display:grid; grid-template-columns: 100px 100px 100px 110px 90px 1fr;
    align-items:center; gap: 12px; padding: 12px 4px;
    border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .refund-row:hover{ background: var(--white); }
  .refund-row .cell{ font-size: 13px; }
  .refund-row .amount{ font-family: var(--font-mono); font-size: 13px; }
  .refund-row .reason{ font-size: 12px; color: var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .lead-row{
    display:grid; grid-template-columns: 90px 90px 90px 80px 90px 80px 90px 40px;
    align-items:center; gap: 10px; padding: 12px 4px;
    border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .lead-row:hover{ background: var(--white); }
  .lead-row .cell{ font-size: 12.5px; }
  .lead-row .amount{ font-family: var(--font-mono); font-size: 13px; }
  .lead-row .sold-mark{ font-size: 16px; text-align:center; }

  .expense-row{
    display:grid; grid-template-columns: 90px 100px 90px 90px 100px 1fr;
    align-items:center; gap: 10px; padding: 12px 4px;
    border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .expense-row:hover{ background: var(--white); }
  .expense-row .cell{ font-size: 12.5px; }
  .expense-row .amount{ font-family: var(--font-mono); font-size: 13px; }
  .expense-row .comment{ font-size: 12px; color: var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  @media (max-width: 720px){
    .cert-row{ grid-template-columns: 1fr 1fr; grid-auto-rows:auto; row-gap:4px; }
    .cert-row .comment{ grid-column: 1 / -1; white-space:normal; }
    .refund-row{ grid-template-columns: 1fr 1fr; grid-auto-rows:auto; row-gap:4px; }
    .refund-row .reason{ grid-column: 1 / -1; white-space:normal; }
    .lead-row{ grid-template-columns: 1fr 1fr; grid-auto-rows:auto; row-gap:4px; }
    .expense-row{ grid-template-columns: 1fr 1fr; grid-auto-rows:auto; row-gap:4px; }
    .expense-row .comment{ grid-column: 1 / -1; white-space:normal; }
  }

  .host-group-label{
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 18px 4px 6px;
  }

  /* ---------- modal ---------- */
  .overlay{
    position: fixed; inset: 0; background: rgba(42,37,32,0.45);
    display:flex; align-items:center; justify-content:center; z-index: 50;
    padding: 20px;
  }
  .modal{
    background: var(--white); border-radius: var(--radius);
    width: 100%; max-width: 460px; max-height: 88vh; overflow-y:auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--line);
  }
  .modal-head h3{ margin:0; font-family: var(--font-display); font-weight:600; font-size: 18px; }
  .modal-close{
    border:none; background:transparent; font-size: 20px; cursor:pointer; color: var(--ink-soft);
    width: 28px; height: 28px; display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ color: var(--ink); }
  .modal-body{ padding: 18px 20px 20px; display:flex; flex-direction:column; gap: 14px;}

  .field label{ display:block; font-size: 11.5px; font-family: var(--font-mono); color: var(--ink-soft); margin-bottom: 6px; letter-spacing: 0.02em;}
  .field input, .field select, .field textarea{
    width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius);
    padding: 9px 10px; font-family: var(--font-body); font-size: 14px; color: var(--ink);
    background: var(--paper); outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--ink); background: var(--white); }
  .field textarea{ resize: vertical; min-height: 56px; font-family: var(--font-body); }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .modal-actions{ display:flex; justify-content: space-between; align-items:center; margin-top: 4px; }
  .btn{
    border: none; padding: 10px 18px; border-radius: var(--radius);
    font-family: var(--font-body); font-size: 13.5px; font-weight: 500; cursor:pointer;
  }
  .btn-primary{ background: var(--ink); color: var(--white); }
  .btn-primary:hover{ background: #171310; }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border: 1px solid var(--line-strong); }
  .btn-ghost:hover{ color: var(--ink); border-color: var(--ink); }
  .btn-danger{ background: transparent; color: var(--danger); font-size: 13px; }
  .btn-danger:hover{ text-decoration: underline; }

  /* day panel (list within modal for a date) */
  .day-evt{
    border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px;
    display:flex; justify-content:space-between; align-items:center; gap: 10px; cursor:pointer;
    margin-bottom: 8px;
  }
  .day-evt:hover{ border-color: var(--ink); }
  .day-evt .left{ flex:1; min-width:0; }
  .day-evt .left .time{ font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); }
  .day-evt .left .title{ font-size: 14px; font-weight: 500; margin-top: 2px; }
  .day-evt .left .host{ font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .quick-host-btn{
    flex-shrink:0; border: 1px solid var(--line-strong); background: var(--white);

<script>
  // Замена Claude-артефактного window.storage на обращения к собственному серверу.
  // Интерфейс (get/set/delete/list, флаг shared) полностью совпадает — остальной код ниже не менялся.
  (function(){
    function getDeviceId(){
      try{
        let id = localStorage.getItem('sp-device-id');
        if(!id){
          id = 'dev-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
          localStorage.setItem('sp-device-id', id);
        }
        return id;
      }catch(e){ return 'dev-fallback'; }
    }
    const DEVICE_ID = getDeviceId();
    const API_BASE = new URL('/api/storage', window.location.origin).toString();

    window.storage = {
      async get(key, shared){
        const res = await fetch(`${API_BASE}/${encodeURIComponent(key)}?shared=${!!shared}`, {
          headers: { 'X-Device-Id': DEVICE_ID }
        });
        if(res.status === 404) return null;
        if(!res.ok) throw new Error('storage.get failed: ' + res.status);
        return res.json();
      },
      async set(key, value, shared){
        const res = await fetch(`${API_BASE}/${encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Device-Id': DEVICE_ID },
          body: JSON.stringify({ value, shared: !!shared })
        });
        if(!res.ok) throw new Error('storage.set failed: ' + res.status);
        return res.json();
      },
      async delete(key, shared){
        const res = await fetch(`${API_BASE}/${encodeURIComponent(key)}?shared=${!!shared}`, {
          method: 'DELETE',
          headers: { 'X-Device-Id': DEVICE_ID }
        });
        if(!res.ok) throw new Error('storage.delete failed: ' + res.status);
        return res.json();
      },
      async list(prefix, shared){
        const res = await fetch(`${API_BASE}?prefix=${encodeURIComponent(prefix||'')}&shared=${!!shared}`, {
          headers: { 'X-Device-Id': DEVICE_ID }
        });
        if(!res.ok) throw new Error('storage.list failed: ' + res.status);
        return res.json();
      }
    };
  })();
</script>

    const DURATIONS = [60,90,120];
    const SPACE_IDS = ['s1','s2','s3','s4'];
    const GUEST_RANGE = {
      'День рождения': [6,12],
      'Свидание': [2,2],
      'Девичник': [5,9],
      'Корпоратив': [10,20],
      'Детский МК': [6,10],
      'Мастер-класс': [4,8],
    };
    function guestsFor(product, seed){
      const range = GUEST_RANGE[product] || [4,8];
      const span = range[1]-range[0];
      return span<=0 ? range[0] : range[0] + (seed % (span+1));
    }

    const out = [];
    for(let i=0;i<100;i++){
      const dayIndex = Math.floor(i / 4);      // 25 дней, по 4 события в каждый
      const offset = dayIndex - 10;            // 10 дней назад .. 14 дней вперёд
      const spaceId = SPACE_IDS[i % 4];
      const titles = TITLES[spaceId];

      const host = HOSTS[i % HOSTS.length];
      const time = TIMES[i % TIMES.length];
      const duration = DURATIONS[i % DURATIONS.length];
      const guests = guestsFor(entry.p, i);
      // ровно 40 из 100 — tentative (красный), 60 — confirmed (зелёный)
      const status = (i % 5 < 2) ? 'tentative' : 'confirmed';
      out.push({
        id: uid(),

        date: demoDate(offset),
        time,
        duration,
        guests,
        title: entry.t,
        product: entry.p,
        host,
        status,
        notes: '',
      });
    }
    return out;
  }

  function formatDuration(minutes){
    const m = Number(minutes) || 0;

    const rem = m % 60;
    if(h === 0) return `${rem} мин`;
    if(rem === 0) return h === 1 ? '1 час' : (h < 5 ? `${h} часа` : `${h} часов`);
    return `${h} ч ${rem} мин`;
  }

  function buildDemoEvents30(){
    const typesPool = (state.eventTypes && state.eventTypes.length) ? state.eventTypes : DEFAULT_EVENT_TYPES;
    const spaceIds = ['s1','s2','s3','s4'];
    const times = ['10:00','11:00','12:30','14:00','15:30','17:00','18:30','19:30'];

    const statusSeq = [];
    for(let i=0;i<14;i++) statusSeq.push('confirmed');
    for(let i=0;i<8;i++) statusSeq.push('tentative');
    for(let i=0;i<4;i++) statusSeq.push('marketing');
    for(let i=0;i<4;i++) statusSeq.push('offsite');
    // лёгкое перемешивание, чтобы статусы не шли блоками подряд по датам
    for(let i=statusSeq.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [statusSeq[i], statusSeq[j]] = [statusSeq[j], statusSeq[i]];
    }

    const out = [];
    for(let i=0;i<30;i++){
      const status = statusSeq[i];
      const type = pick(typesPool);
      const spaceId = spaceIds[i % 4];
      const offset = i - 10; // 10 дней в прошлом .. 19 дней в будущем
      const host = pick(state.hostsList);
      const time = times[i % times.length];

      let guests, price, product = '', dishes = '', rentalBefore = null, rentalAfter = null;

      if(status === 'confirmed'){
        guests = randInt(3, 9);
        price = roundTo(randInt(2000, 7000), 100);
      } else if(status === 'tentative'){
        guests = randInt(4, 18);
        product = pick(PRODUCTS.filter(p=>p!=='Мастер-класс'));
        price = roundTo(randInt(6000, 22000), 100);
        dishes = Math.random() < 0.5 ? 'needed' : 'not_needed';
        if(Math.random() < 0.4){ rentalBefore = pick([15,30,45]); }
        if(Math.random() < 0.4){ rentalAfter = pick([15,30,60]); }
      } else if(status === 'marketing'){
        guests = randInt(2, 5);
        price = 0;
        dishes = Math.random() < 0.3 ? 'needed' : 'not_needed';
        if(Math.random() < 0.3){ rentalBefore = 15; }
      } else { // offsite
        guests = randInt(8, 25);
        product = Math.random() < 0.6 ? 'Корпоратив' : '';
        price = roundTo(randInt(12000, 35000), 500);
      }

      out.push({
        id: uid(),
        spaceId,
        date: demoDate(offset),
        time,
        duration: type.duration,
        guests,
        price,
        title: type.name,
        product,
        host,
        status,
        dishes,
        rentalBefore,
        rentalAfter,
        notes: '',
      });
    }
    return out;
  }

  async function autoDeductCanvasesForPastPaintingEvents(){
    // 1 гость = 1 холст, только для уже прошедших мероприятий по рисованию — будущие не трогаем.
    // Пере-проверяется при каждой загрузке (не разовая миграция), т.к. мероприятия со временем "переходят" из будущих в прошедшие.
    const canvasCatalog = state.materialsCatalog.find(m=>m.name.trim().toLowerCase()==='холст');
    if(!canvasCatalog) return; // в справочнике "Себес" нет материала "Холст" — списывать нечего

    const today = todayStr();
    let eventsChanged = false;
    let catalogChanged = false;
    state.events.forEach(e=>{
      if(!isPaintingEvent(e.title)) return;
      if(!e.date || e.date > today) return; // будущие даты не трогаем
      if(!Array.isArray(e.materialsItems)) e.materialsItems = [];
      if(e.materialsItems.some(m=>m.autoCanvas)) return; // это мероприятие уже обработано ранее
      const guests = (e.guests!==undefined && e.guests!==null && !isNaN(e.guests)) ? Number(e.guests) : 0;
      if(guests <= 0) return;
      e.materialsItems.push({ name: canvasCatalog.name, cost: canvasCatalog.cost * guests, qty: guests, source: 'studio', autoCanvas: true });
      eventsChanged = true;
      if(canvasCatalog.trackStock){
        canvasCatalog.stock = (canvasCatalog.stock!==undefined && canvasCatalog.stock!==null && !isNaN(canvasCatalog.stock) ? Number(canvasCatalog.stock) : 0) - guests;
        catalogChanged = true;
      }
    });
    if(eventsChanged) await saveEvents();
    if(catalogChanged) await saveMaterialsCatalog();
  }

  async function autoApplyMaterialRulesForPastEvents(){
    // для видов мероприятий со статьями расхода материалов (настраивается в "Виды мероприятий", может быть несколько статей на вид) —
    // после того как мероприятие прошло, каждая статья сама добавляется строкой в его себестоимость.
    // "Студия" — просто известная цена материала. "Мастер" — компенсация конкретному человеку (не обязательно ведущему),
    // попадает и в его зарплату, и в себестоимость — через тот же механизм, что и при ручном добавлении строки с "Кому платить".
    // Будущие мероприятия не трогаем. Пере-проверяется при каждой загрузке, каждая статья на каждое мероприятие — один раз.
    const typesWithRules = state.eventTypes.filter(t=>Array.isArray(t.materialRules) && t.materialRules.length>0);
    if(typesWithRules.length === 0) return;
    const today = todayStr();
    let eventsChanged = false;
    state.events.forEach(e=>{
      if(!e.date || e.date > today) return;
      const title = (e.title||'').trim().toLowerCase();
      const matchedType = typesWithRules.find(t=>t.name.trim().toLowerCase() === title);
      if(!matchedType) return;
      const guests = (e.guests!==undefined && e.guests!==null && !isNaN(e.guests)) ? Number(e.guests) : 0;
      if(guests <= 0) return;
      if(!Array.isArray(e.materialsItems)) e.materialsItems = [];
      matchedType.materialRules.forEach(rule=>{
        if(!rule.name || !rule.ratePerGuest || rule.ratePerGuest<=0) return;
        if(rule.policy==='master' && !rule.payeeMaster) return;
        const tag = 'autorule:' + rule.name.trim().toLowerCase() + ':' + rule.policy;
        const already = e.materialsItems.some(m=>m.autoRuleTag === tag);
        if(already) return;
        const amount = guests * rule.ratePerGuest;
        if(rule.policy === 'master'){
          e.materialsItems.push({ name: rule.name, cost: amount, source: 'master', payTo: rule.payeeMaster, autoRuleTag: tag });
        } else {
          e.materialsItems.push({ name: rule.name, cost: amount, qty: guests, source: 'studio', autoRuleTag: tag });
        }
        eventsChanged = true;
      });
    });
    if(eventsChanged) await saveEvents();
  }

  async function storageSetWithRetry(key, value, attempts=3){
    let lastErr = null;
    for(let i=0;i<attempts;i++){
      try{
        const res = await window.storage.set(key, value, true);
        if(res){
          if(key !== 'sync-token') bumpSyncToken(); // не ждём — не критично для основного сохранения
          return true;
        }
        lastErr = new Error('empty result');
      }catch(e){
        lastErr = e;
      }
      if(i < attempts-1) await sleep(500 * (i+1));
    }
    console.error('storage save failed after retries:', key, lastErr);
    showSaveError();
    return false;
  }

  // "токен синхронизации" — общий на всех; меняется при каждом сохранении кем угодно.
  // Если у нас на руках токен старее — значит, кто-то ещё поменял данные, пока мы были здесь.
  async function bumpSyncToken(){
    try{
      const token = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      await window.storage.set('sync-token', token, true);
      state.syncToken = token;
    }catch(e){ /* не критично, просто пропустим */ }
  }

        state.syncWarningShown = true;

  const MIN_GAP_MINUTES = 30;
  function timeToMinutes(t){
    if(!t) return 0;
    const parts = t.split(':').map(Number);
    return (parts[0]||0)*60 + (parts[1]||0);
  }
  // Фактическое время занятости пространства с учётом доп. аренды до/после (актуально для частников)
  function effectiveStart(e){ return timeToMinutes(e.time) - (Number(e.rentalBefore)||0); }
  function effectiveEnd(e){ return timeToMinutes(e.time) + (Number(e.duration)||0) + (Number(e.rentalAfter)||0); }

  // Возвращает { eventId: gapMinutes } для событий, у которых перерыв с предыдущим
  // мероприятием в ТОМ ЖЕ пространстве меньше MIN_GAP_MINUTES (может быть отрицательным при наложении)
  function computeGapWarnings(evts){
    const bySpace = {};
    evts.forEach(e=>{ (bySpace[e.spaceId] = bySpace[e.spaceId] || []).push(e); });
    const warnMap = {};
    Object.values(bySpace).forEach(list=>{
      const sorted = [...list].sort((a,b)=> effectiveStart(a) - effectiveStart(b));
      for(let i=1;i<sorted.length;i++){
        const prev = sorted[i-1], cur = sorted[i];
        const prevEnd = effectiveEnd(prev);
        const curStart = effectiveStart(cur);
        const gap = curStart - prevEnd;
        if(gap < MIN_GAP_MINUTES){
          warnMap[cur.id] = { gap, prevTitle: prev.title, prevEndMinutes: prevEnd };
        }
      }
    });
    return warnMap;
  }

  }

  function render(){
    const app = document.getElementById('app');
    if(!state.loaded){ app.innerHTML = '<div class="loading-note">Загружаю расписание…</div>'; return; }

    if(!canAccessView(state.view)){
      state.view = 'calendar';
    }

    if(state.view === 'today'){
      app.innerHTML = renderTodayView();
      attachTodayViewEvents();
      if(state.modal){ renderModal(); }
      return;
    }

    let html = '';
    html += renderHeader();
    if(state.view === 'calendar'){
      html += renderSpaceTabs();
      html += renderCalendar();
    } else if(state.view === 'host'){
      html += renderHostView();
    } else if(state.view === 'analytics'){
      html += renderAnalytics();
    } else if(state.view === 'certificates'){
      html += renderCertificatesView();
    } else if(state.view === 'book'){
      html += renderBookView();
    }
    app.innerHTML = html;
    attachHeaderEvents();
    if(state.view === 'calendar'){ attachCalendarEvents(); }
    else if(state.view === 'host'){ attachHostEvents(); }
    else if(state.view === 'analytics'){ attachAnalyticsEvents(); }
    else if(state.view === 'certificates'){ attachCertificatesEvents(); }
    else if(state.view === 'book'){ attachBookEvents(); }

    if(state.modal){ renderModal(); }
  }

  function computeDailyAlerts(){
    const alerts = [];
    const today = todayStr();

    // просроченная выдача изделий (смола, тафтинг)
    let overduePickups = 0;
    state.events.forEach(e=>{
      (e.pickupItems||[]).forEach(p=>{
        if(p.status!=='picked_up' && p.readyDate && p.readyDate < today) overduePickups++;
      });
    });
    if(overduePickups > 0 && roleCanAccessManagersTab(state.currentRole)) alerts.push({icon:'📦', text:`Просрочено выдач: ${overduePickups}`, view:'certificates', certView:'pickups'});

    // закончились отслеживаемые материалы
    const outOfStock = state.materialsCatalog.filter(m=>m.trackStock && (m.stock===undefined||m.stock===null||m.stock<=0));
    if(outOfStock.length > 0) alerts.push({icon:'🧱', text:`Закончился материал: ${outOfStock.map(m=>m.name).join(', ')}`});

    // несданные отчёты мастеров за последние 14 дней
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-14);
    const cutoffStr = fmtDate(cutoff);
    const missingReports = state.events.filter(e=> e.host && e.host.trim() && e.date && e.date>=cutoffStr && e.date<=today && !hasMasterReport(e)).length;
    if(missingReports > 0) alerts.push({icon:'📝', text:`Не сдано отчётов за 2 недели: ${missingReports}`});

    return alerts;
  }

  function renderCalendar(){
    const cursor = state.cursor;
    const year = cursor.getFullYear(), month = cursor.getMonth();
    const first = new Date(year, month, 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday=0
    const gridStart = new Date(year, month, 1 - startOffset);
    const isAll = state.activeSpaceId === 'all';
    const space = getSpace(state.activeSpaceId);
    const monthLabel = MONTHS[month] + ' ' + year;

    let cells = '';
    for(let i=0;i<42;i++){
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
      const dStr = fmtDate(d);
      const inMonth = d.getMonth() === month;
      const isToday = dStr === todayStr();
      const evts = eventsFor(state.activeSpaceId, dStr);
      const shown = evts.slice(0,3);
      const extra = evts.length - shown.length;
      const hasWarning = Object.keys(computeGapWarnings(evts)).length > 0;
      const hostessLine = shiftSummaryShort(dStr);
      cells += `
        <div class="cal-cell ${inMonth?'':'other-month'} ${isToday?'today':''}" data-date="${dStr}">
          <div class="cal-daynum">${d.getDate()}${hasWarning?' <span class="cal-warn-icon" title="Перерыв между мероприятиями меньше 30 минут">⚠</span>':''}</div>
          ${hostessLine ? `<div class="cal-hostess" title="Хостес: ${escapeHtml(hostessLine)}">🧑 ${escapeHtml(hostessLine)}</div>` : ''}
          <div class="cal-events">
            ${shown.map(e=>`<div class="cal-evt-chip" style="background:${statusColor(e.status)}">${isAll?spaceBadge(getSpace(e.spaceId),'xs'):''}<span class="t">${e.time}</span><span>${escapeHtml(e.title)}</span></div>`).join('')}
            ${extra>0?`<div class="cal-more">+${extra} ещё</div>`:''}
          </div>
        </div>
      `;
      if(i%7===6 && i > 34) break;
    }

    const scopedEvts = state.events.filter(e=> isAll || e.spaceId===state.activeSpaceId);
    const legend = `
      <div class="status-legend">
        ${Object.keys(STATUS_LABEL).map(key=>{
          const count = scopedEvts.filter(e=>(e.status||'confirmed')===key).length;
          return `<span class="item"><span class="sw" style="background:${statusColor(key)}"></span>${STATUS_LABEL[key]} (${count})</span>`;
        }).join('')}
      </div>
      ${isAll ? `
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;">
        ${state.spaces.map(s=>`<span style="font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);display:inline-flex;align-items:center;gap:6px;">${spaceBadge(s,'sm')}${escapeHtml(s.name)}</span>`).join('')}
      </div>` : ''}
    `;

    return `
      <div class="cal-nav">
        <div class="month-label">${monthLabel}</div>
        <div class="cal-nav-btns">
          <button class="today-btn" id="btn-today">сегодня</button>
          <button class="nav-btn" id="btn-prev">‹</button>
          <button class="nav-btn" id="btn-next">›</button>
        </div>
      </div>
      ${legend}
      <div class="cal-grid">
        ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    `;
  }

      const chips = `<div class="host-chips">${hosts.map(h=>`<div class="host-chip ${h===state.activeHost?'active':''}" data-host="${escapeHtml(h)}">${escapeHtml(h)}</div>`).join('')}</div>`;

      const evts = state.events.filter(e => {
        const names = eventHostsWithPay(e).map(h=>h.name);
        return names.includes(state.activeHost);
      }).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));

      const today = todayStr();
      const upcoming = evts.filter(e=> e.date >= today);
      const past = evts.filter(e=> e.date < today);

      function row(e){
        const sp = getSpace(e.spaceId);
        const dLabel = formatDateText(e.date);
        const isPast = e.date < today;
        return `
          <div class="host-row ${isPast?'past':''}" data-eid="${e.id}">

  function renderCertificatesListView(){
    // сводка по месяцам (на основе даты продажи) — продажи и маркетинг считаются раздельно
    const salesTotals = {};
    const marketingTotals = {};
    state.certificates.forEach(c=>{
      if(!c.saleDate) return;
      const ym = c.saleDate.slice(0,7); // YYYY-MM
      const amt = (c.amount!==undefined && c.amount!==null && !isNaN(c.amount)) ? Number(c.amount) : 0;
      if(c.purpose === 'marketing'){ marketingTotals[ym] = (marketingTotals[ym]||0) + amt; }
      else { salesTotals[ym] = (salesTotals[ym]||0) + amt; }
    });
    const allMonths = Array.from(new Set([...Object.keys(salesTotals), ...Object.keys(marketingTotals)])).sort((a,b)=> b.localeCompare(a));
    const monthlyHtml = allMonths.length ? `
      <div class="analytics-section" style="margin-bottom:20px;">
        <h4>Сумма сертификатов по месяцам</h4>
        <div style="font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">Сумма — только продажи; маркетинговые сертификаты в неё не входят и показаны отдельно.</div>
        ${allMonths.map(ym=>{
          const [y,m] = ym.split('-').map(Number);
          const label = MONTHS[m-1] + ' ' + y;
          const sales = salesTotals[ym] || 0;
          const marketing = marketingTotals[ym] || 0;
          return `<div class="stat-row">
            <div class="stat-label" style="width:140px;text-transform:capitalize;">${label}</div>
            <div style="flex:1;font-family:var(--font-mono);font-size:13px;">${formatMoney(sales)}${marketing>0?` <span style="color:var(--status-blue);">· маркетинг: ${formatMoney(marketing)}</span>`:''}</div>
          </div>`;
        }).join('')}
      </div>
    ` : '';

    const query = (state.certSearchQuery||'').trim();
    let certs = [...state.certificates].sort((a,b)=> (Number(b.number)||0) - (Number(a.number)||0));

  function renderConversionView(){
    const leads = [...state.leads].sort((a,b)=> (b.requestDate||'').localeCompare(a.requestDate||''));
    const total = state.leads.length;
    const soldCount = state.leads.filter(l=>l.sold).length;
    const conversionPct = total>0 ? Math.round(soldCount/total*100) : 0;
    const soldRevenue = state.leads.filter(l=>l.sold).reduce((s,l)=> s+((l.revenue!==undefined&&l.revenue!==null&&!isNaN(l.revenue))?Number(l.revenue):0), 0);
    const soldWithoutEventCount = state.leads.filter(l=>l.sold && !l.eventId).length;

    // средний срок продажи: сколько дней в среднем проходит от заявки до продажи
    const salesCycleDays = state.leads
      .filter(l=> l.sold && l.requestDate && l.saleDate)
      .map(l=> Math.round((parseDate(l.saleDate) - parseDate(l.requestDate)) / 86400000))
      .filter(d=> d >= 0);
    const avgSalesCycle = salesCycleDays.length ? Math.round(salesCycleDays.reduce((s,d)=>s+d,0) / salesCycleDays.length * 10) / 10 : null;

    function avgCycleDays(list){
      const days = list
        .filter(l=> l.sold && l.requestDate && l.saleDate)
        .map(l=> Math.round((parseDate(l.saleDate) - parseDate(l.requestDate)) / 86400000))
        .filter(d=> d >= 0);
      return days.length ? Math.round(days.reduce((s,d)=>s+d,0) / days.length * 10) / 10 : null;
    }
    function breakdown(keyFn, list){
      const map = {};
      list.forEach(l=>{
        const k = keyFn(l);
        if(!map[k]) map[k] = {total:0, sold:0, items:[]};
        map[k].total++;
        if(l.sold) map[k].sold++;
        map[k].items.push(l);
      });
      return Object.entries(map).map(([k,v])=>({name:k, total:v.total, sold:v.sold, pct: v.total>0?Math.round(v.sold/v.total*100):0, avgDays: avgCycleDays(v.items)}))
        .sort((a,b)=>b.total-a.total);
    }
    const bySource = breakdown(l=>l.source||'—', state.leads);
    const byProduct = breakdown(l=>l.product||'—', state.leads);
    const maxSourceTotal = Math.max(1, ...bySource.map(x=>x.total));
    const maxProductTotal = Math.max(1, ...byProduct.map(x=>x.total));

    const byMonthRaw = breakdown(l=> l.requestDate ? l.requestDate.slice(0,7) : 'Без даты', state.leads);
    const byMonth = byMonthRaw
      .map(x=>{
        if(x.name === 'Без даты') return {...x, label: 'Без даты'};
        const [y,m] = x.name.split('-').map(Number);
        return {...x, label: MONTHS[m-1].charAt(0).toUpperCase()+MONTHS[m-1].slice(1)+' '+y};
      })
      .sort((a,b)=> b.name.localeCompare(a.name));
    const maxMonthTotal = Math.max(1, ...byMonth.map(x=>x.total));

    // ежедневная конверсия по продажам
    const byDayRaw = breakdown(l=> l.requestDate || 'Без даты', state.leads);
    const byDay = byDayRaw
      .map(x=>{
        if(x.name === 'Без даты') return {...x, label: 'Без даты'};
        return {...x, label: `${formatDateText(x.name)}, ${weekdayFromDate(x.name)}`};
      })
      .sort((a,b)=> b.name.localeCompare(a.name));
    const maxDayTotal = Math.max(1, ...byDay.map(x=>x.total));

    // насколько заранее планируют: месяц мероприятия совпадает с текущим / это будущий месяц / неизвестно
    const currentMonthName = MONTHS[new Date().getMonth()].charAt(0).toUpperCase()+MONTHS[new Date().getMonth()].slice(1);
    const planningGroups = { 'На текущий месяц': 0, 'На будущий месяц': 0, 'Неизвестно': 0 };
    const planningSoldGroups = { 'На текущий месяц': 0, 'На будущий месяц': 0, 'Неизвестно': 0 };
    state.leads.forEach(l=>{
      let key;
      if(!l.eventMonth || l.eventMonth === 'Нет информации') key = 'Неизвестно';
      else if(l.eventMonth === currentMonthName) key = 'На текущий месяц';
      else key = 'На будущий месяц';
      planningGroups[key]++;
      if(l.sold) planningSoldGroups[key]++;
    });
    const planningList = Object.entries(planningGroups).map(([name,cnt])=>({
      name, total:cnt, sold: planningSoldGroups[name], pct: cnt>0?Math.round(planningSoldGroups[name]/cnt*100):0
    }));
    const maxPlanning = Math.max(1, ...planningList.map(x=>x.total));

    return `
      <div class="analytics-summary" style="margin-bottom:20px;">
        <div class="summary-card"><div class="num">${total}</div><div class="label">Всего заявок</div></div>
        <div class="summary-card"><div class="num" style="color:var(--status-green);">${soldCount}</div><div class="label">Продано</div></div>
        <div class="summary-card" style="border-left:4px solid var(--accent);"><div class="num">${conversionPct}%</div><div class="label">Конверсия</div></div>
        <div class="summary-card"><div class="num" style="font-size:20px;">${formatMoney(soldRevenue)}</div><div class="label">Выручка проданных</div></div>
        <div class="summary-card"><div class="num" style="font-size:20px;">${avgSalesCycle!==null?avgSalesCycle+' дн.':'—'}</div><div class="label">Средний срок продажи</div></div>
      </div>
      ${soldWithoutEventCount>0 ? `<div style="font-size:12.5px;color:var(--status-red);margin-bottom:16px;">⚠ ${soldWithoutEventCount} «проданных» заявок без привязки к мероприятию — откройте заявку и укажите, какое мероприятие создано.</div>` : ''}

      ${total>0 ? `
      <div class="analytics-section">
        <h4>Насколько заранее планируют мероприятие</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">Сравнение поля «Месяц мероприятия» с текущим месяцем (${escapeHtml(currentMonthName)}).</div>
        ${planningList.map(x=>`
          <div class="stat-row">
            <div class="stat-label" style="width:140px;">${escapeHtml(x.name)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.total/maxPlanning*100)}%;background:${x.name==='Неизвестно'?'var(--ink-soft)':'var(--accent)'};"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${x.total}${x.total>0?' · продано '+x.sold+' ('+x.pct+'%)':''}</div>
          </div>
        `).join('')}
      </div>
      <div class="analytics-section">
        <h4>Заявки по месяцам</h4>
        ${byMonth.map(x=>`
          <div class="stat-row">
            <div class="stat-label" style="width:140px;text-transform:capitalize;">${escapeHtml(x.label)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.total/maxMonthTotal*100)}%;background:var(--ink);"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${x.total} заявок · продано ${x.sold} (${x.pct}%)</div>
          </div>
        `).join('')}
      </div>
      <div class="analytics-section">
        <h4>Ежедневная конверсия</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">По дате заявки. Показывает, в какие дни приходят заявки и как они конвертируются в продажу.</div>
        ${byDay.map(x=>`
          <div class="stat-row">
            <div class="stat-label" style="width:170px;text-transform:capitalize;">${escapeHtml(x.label)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.total/maxDayTotal*100)}%;background:${x.pct>=50?'var(--status-green)':'var(--accent)'};"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${x.total} · продано ${x.sold} (${x.pct}%)</div>
          </div>
        `).join('')}
      </div>
      <div class="analytics-section">
        <h4>Конверсия по источникам</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">Средний срок — от даты заявки до даты продажи, только по проданным с обеими датами.</div>
        ${bySource.map(x=>`
          <div class="stat-row">
            <div class="stat-label">${escapeHtml(x.name)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.total/maxSourceTotal*100)}%;background:var(--accent);"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${x.sold}/${x.total} · ${x.pct}%${x.avgDays!==null?' · ~'+x.avgDays+' дн.':''}</div>
          </div>
        `).join('')}
      </div>
      <div class="analytics-section">
        <h4>Конверсия по продуктам</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:8px;">Средний срок — от даты заявки до даты продажи, только по проданным с обеими датами.</div>
        ${byProduct.map(x=>`
          <div class="stat-row">
            <div class="stat-label">${escapeHtml(x.name)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(x.total/maxProductTotal*100)}%;background:var(--ink);"></div></div>
            <div class="stat-count" style="width:auto;font-size:12px;">${x.sold}/${x.total} · ${x.pct}%${x.avgDays!==null?' · ~'+x.avgDays+' дн.':''}</div>
          </div>
        `).join('')}
      </div>
      ` : ''}

      <div class="cert-toolbar">
        <div style="font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);">Список заявок</div>
        <button class="btn btn-primary" id="btn-add-lead">+ Добавить заявку</button>
      </div>
      ${leads.length === 0 ? `<div class="host-empty">Заявок пока нет</div>` : `
        <div class="cert-list">
          ${leads.map(l=>`
            <div class="lead-row" data-lid="${l.id}">
              <div class="cell">${l.requestDate ? formatDateText(l.requestDate) : '—'}${l.contact?'<br><span style="color:var(--ink-soft);font-size:11px;">'+escapeHtml(l.contact)+'</span>':''}</div>
              <div class="cell" style="text-transform:capitalize;">${escapeHtml(weekdayFromDate(l.requestDate))}</div>
              <div class="cell">${escapeHtml(l.eventMonth||'')}</div>
              <div class="cell">${escapeHtml(l.source||'')}</div>
              <div class="cell">${escapeHtml(l.product||'')}</div>
              <div class="cell">${l.location==='offsite'?'Выезд':'В СП'}</div>
              <div class="amount">${l.revenue!==undefined&&l.revenue!==null ? formatMoney(l.revenue) : ''}</div>
              <div class="sold-mark">${l.sold?'✅':'—'}${l.sold&&l.saleDate?'<br><span style="font-size:10px;color:var(--ink-soft);">'+formatDateText(l.saleDate)+'</span>':''}${l.eventId?'<br><span style="font-size:10px;color:var(--status-green);">🔗</span>':''}</div>
            </div>
          `).join('')}
        </div>
      `}
    `;
  }

  function renderItemSalesView(){
    const items = [...state.itemSales].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    const totalRevenue = state.itemSales.reduce((s,x)=> s + ((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0), 0);
    const totalMasterShare = Math.round(totalRevenue * ITEM_SALE_MASTER_PCT / 100);
    const totalStudioShare = totalRevenue - totalMasterShare;

    const byMaster = {};
    state.itemSales.forEach(x=>{
      const name = (x.masterName||'').trim() || 'Без мастера';
      const rev = (x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0;
      byMaster[name] = (byMaster[name]||0) + rev;
    });
    const byMasterList = Object.entries(byMaster).sort((a,b)=>b[1]-a[1]);
    const maxMaster = Math.max(1, ...byMasterList.map(x=>x[1]));

    return `
      <div class="analytics-summary" style="margin-bottom:20px;">
        <div class="summary-card"><div class="num" style="font-size:20px;">${formatMoney(totalRevenue)}</div><div class="label">Выручка от продажи изделий</div></div>
        <div class="summary-card"><div class="num" style="font-size:20px;color:var(--accent);">${formatMoney(totalMasterShare)}</div><div class="label">Мастерам (${ITEM_SALE_MASTER_PCT}%)</div></div>
        <div class="summary-card" style="border-left:4px solid var(--status-green);"><div class="num" style="font-size:20px;color:var(--status-green);">${formatMoney(totalStudioShare)}</div><div class="label">В прибыль студии (${ITEM_SALE_STUDIO_PCT}%)</div></div>
      </div>

  function renderPickupsView(){
    // собираем все изделия на выдачу со всех мероприятий (смола, тафтинг)
    const allPickups = [];
    state.events.forEach(ev=>{
      (ev.pickupItems||[]).forEach((p,i)=>{
        allPickups.push({ ...p, eventId: ev.id, eventTitle: ev.title, eventDate: ev.date, spaceId: ev.spaceId, idx: i });
      });
    });

    const waiting = allPickups.filter(p=>p.status!=='picked_up').sort((a,b)=> (a.readyDate||'').localeCompare(b.readyDate||''));
    const pickedUp = allPickups.filter(p=>p.status==='picked_up').sort((a,b)=> (b.pickupDate||'').localeCompare(a.pickupDate||''));
    const today = todayStr();
    const overdueCount = waiting.filter(p=>p.readyDate && p.readyDate < today).length;

    function pickupRow(p, showPickupDate){
      const sp = getSpace(p.spaceId);
      const overdue = p.status!=='picked_up' && p.readyDate && p.readyDate < today;
      return `
        <div class="refund-row" data-pickup-event="${p.eventId}" data-pickup-idx="${p.idx}">
          <div class="cell">${p.readyDate ? formatDateText(p.readyDate) : '—'}${overdue?' <span style="color:var(--status-red);font-weight:600;">просрочено</span>':''}</div>
          <div class="cell">${escapeHtml(p.guestName||'без имени')}</div>
          <div class="cell">${escapeHtml(p.eventTitle||'')} ${spaceBadge(sp,'xs')} · ${formatDateText(p.eventDate)}</div>
          <div class="cell">${showPickupDate && p.pickupDate ? 'выдано '+formatDateText(p.pickupDate) : ''}</div>
          <div class="reason">${!showPickupDate ? `<button type="button" class="btn btn-ghost pickup-mark-btn" data-event="${p.eventId}" data-idx="${p.idx}" style="font-size:11.5px;padding:4px 10px;">Отметить выдано</button>` : ''}</div>
        </div>
      `;
    }

    return `
      <div class="analytics-summary" style="margin-bottom:20px;">
        <div class="summary-card"><div class="num">${waiting.length}</div><div class="label">Ожидают выдачи</div></div>
        <div class="summary-card" style="border-left:4px solid ${overdueCount>0?'var(--status-red)':'var(--status-green)'};"><div class="num" style="color:${overdueCount>0?'var(--status-red)':'var(--status-green)'};">${overdueCount}</div><div class="label">Просрочено</div></div>
        <div class="summary-card"><div class="num">${pickedUp.length}</div><div class="label">Уже выдано</div></div>
      </div>
      <div class="cert-toolbar">
        <div style="font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);">Изделия со «Смолы» и «Тафтинга» — добавляются внутри карточки мероприятия</div>
      </div>
      <div class="analytics-section">
        <h4 style="color:${overdueCount>0?'var(--status-red)':'inherit'};">Ожидают выдачи</h4>
        ${waiting.length ? `<div class="cert-list">${waiting.map(p=>pickupRow(p,false)).join('')}</div>` : `<div class="host-empty">Все изделия выданы</div>`}
      </div>
      ${pickedUp.length ? `
      <div class="analytics-section">
        <h4>Уже выдано</h4>
        <div class="cert-list">${pickedUp.slice(0,20).map(p=>pickupRow(p,true)).join('')}</div>
      </div>
      ` : ''}
    `;
  }

  function attachLeadModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-lead');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const dateInput = overlay.querySelector('#l-date');
    const weekdayHint = overlay.querySelector('#l-weekday-hint');
    if(dateInput && weekdayHint){
      dateInput.addEventListener('input', ()=>{ weekdayHint.textContent = weekdayFromDate(dateInput.value); });
    }

    overlay.querySelectorAll('[data-leadloc]').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('[data-leadloc]').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#l-location').value = opt.dataset.leadloc;
      };
    });

    const soldCheckbox = overlay.querySelector('#l-sold');
    const saleDateField = overlay.querySelector('#lead-saledate-field');
    const leadEventField = overlay.querySelector('#lead-event-field');
    if(soldCheckbox && saleDateField){
      soldCheckbox.addEventListener('change', ()=>{
        saleDateField.style.display = soldCheckbox.checked ? 'block' : 'none';
        if(leadEventField) leadEventField.style.display = soldCheckbox.checked ? 'block' : 'none';
        if(soldCheckbox.checked){
          const saleDateInput = overlay.querySelector('#l-sale-date');
          if(saleDateInput && !saleDateInput.value) saleDateInput.value = todayStr();
        }
      });
    }

    const leadEventOptions = eventSelectOptions();
    const leadLabelToId = {};
    leadEventOptions.forEach(o=>{ leadLabelToId[o.label] = o.id; });
    const leadEventSearchInput = overlay.querySelector('#l-event-search');
    const leadEventHidden = overlay.querySelector('#l-event');
    if(leadEventSearchInput && leadEventHidden){
      leadEventSearchInput.addEventListener('input', ()=>{
        const val = leadEventSearchInput.value.trim();
        if(val === ''){ leadEventHidden.value = ''; leadEventSearchInput.style.borderColor = ''; return; }
        if(leadLabelToId[val]){ leadEventHidden.value = leadLabelToId[val]; leadEventSearchInput.style.borderColor = ''; }
      });
      leadEventSearchInput.addEventListener('blur', ()=>{
        const val = leadEventSearchInput.value.trim();
        if(val !== '' && !leadLabelToId[val]){
          leadEventSearchInput.value = '';
          leadEventHidden.value = '';
        }
      });
    }

    const delBtn = overlay.querySelector('#btn-del-lead');
    if(delBtn) delBtn.onclick = ()=>{
      showConfirmDeletePopup('Удалить эту заявку? Действие необратимо.', async ()=>{
        state.leads = state.leads.filter(x=>x.id !== state.modal.lead.id);
        await saveLeads();
        state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-lead').onclick = async ()=>{
      ['l-date','l-contact','l-month','l-source','l-product','l-revenue','l-sale-date'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dateVal = overlay.querySelector('#l-date').value;
      const contactVal = overlay.querySelector('#l-contact').value.trim();
      const monthVal = overlay.querySelector('#l-month').value;
      const sourceVal = overlay.querySelector('#l-source').value;
      const productVal = overlay.querySelector('#l-product').value;
      const locationVal = overlay.querySelector('#l-location').value || 'in_studio';
      const revenueRaw = overlay.querySelector('#l-revenue').value;
      const soldVal = overlay.querySelector('#l-sold').checked;
      const saleDateVal = overlay.querySelector('#l-sale-date').value;

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!dateVal) markInvalid('l-date');
      if(!contactVal) markInvalid('l-contact');
      if(!monthVal) markInvalid('l-month');
      if(!sourceVal) markInvalid('l-source');
      if(!productVal) markInvalid('l-product');
      if(revenueRaw === '') markInvalid('l-revenue');
      const saleDateMissing = soldVal && !saleDateVal;
      if(saleDateMissing) markInvalid('l-sale-date');
      if(!dateVal || !contactVal || !monthVal || !sourceVal || !productVal || revenueRaw==='' || saleDateMissing){
        showGapWarningBanner(saleDateMissing ? 'Заявка отмечена как «Продано» — укажите дату продажи.' : 'Заполните все поля перед сохранением заявки — включая номер/ник гостя.');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const updated = {
        id: state.modal.lead.id,
        requestDate: dateVal,
        contact: contactVal,
        eventMonth: monthVal,
        source: sourceVal,
        product: productVal,
        location: locationVal,
        revenue: parseInt(revenueRaw),
        sold: soldVal,
        saleDate: soldVal ? saleDateVal : '',
        eventId: soldVal ? (overlay.querySelector('#l-event').value || '') : '',
      };
      const idx = state.leads.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.leads[idx] = updated; else state.leads.push(updated);
      await saveLeads();
      state.modal = null; overlay.remove(); render();
    };
  }

  function attachSalaryAdjModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-adj');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const eventOptions = eventSelectOptions();
    const labelToId = {};
    eventOptions.forEach(o=>{ labelToId[o.label] = o.id; });
    const eventSearchInput = overlay.querySelector('#adj-event-search');
    const eventHidden = overlay.querySelector('#adj-event');
    if(eventSearchInput && eventHidden){
      eventSearchInput.addEventListener('input', ()=>{
        const val = eventSearchInput.value.trim();
        if(val === ''){ eventHidden.value = ''; eventSearchInput.style.borderColor = ''; return; }
        if(labelToId[val]){ eventHidden.value = labelToId[val]; eventSearchInput.style.borderColor = ''; }
      });
      eventSearchInput.addEventListener('blur', ()=>{
        const val = eventSearchInput.value.trim();
        if(val !== '' && !labelToId[val]){
          eventSearchInput.value = '';
          eventHidden.value = '';
        }
      });
    }

    const amountInput = overlay.querySelector('#adj-amount');
    overlay.querySelector('#adj-preset-plus').onclick = ()=>{
      amountInput.value = Math.abs(parseInt(amountInput.value) || 0) || '';
    };
    overlay.querySelector('#adj-preset-minus').onclick = ()=>{
      amountInput.value = -Math.abs(parseInt(amountInput.value) || 250);
    };

    const delBtn = overlay.querySelector('#btn-del-adj');
    if(delBtn) delBtn.onclick = ()=>{
      const hasLink = !!state.modal.adj.eventId;
      showConfirmDeletePopup(`Удалить эту корректировку ЗП?${hasLink ? ' Она также уберётся из себестоимости привязанного мероприятия.' : ' Действие необратимо.'}`, async ()=>{
      const adjToDelete = state.modal.adj;
      state.salaryAdjustments = state.salaryAdjustments.filter(x=>x.id !== adjToDelete.id);
      // убираем строку себестоимости, если она была синхронизирована с мероприятием
      if(adjToDelete.eventId){
        const ev = state.events.find(e=>e.id===adjToDelete.eventId);
        if(ev && Array.isArray(ev.materialsItems)){
          const before = ev.materialsItems.length;
          ev.materialsItems = ev.materialsItems.filter(m=>m.adjRef !== adjToDelete.id);
          if(ev.materialsItems.length !== before) await saveEvents();
        }
      }
      await saveSalaryAdjustments();
      state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-adj').onclick = async ()=>{
      ['adj-date','adj-master','adj-amount','adj-comment'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dateVal = overlay.querySelector('#adj-date').value;
      const masterVal = overlay.querySelector('#adj-master').value.trim();
      const amountRaw = overlay.querySelector('#adj-amount').value;
      const commentVal = overlay.querySelector('#adj-comment').value.trim();

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!dateVal) markInvalid('adj-date');
      if(!masterVal) markInvalid('adj-master');
      if(amountRaw === '' || parseInt(amountRaw) === 0) markInvalid('adj-amount');
      if(!commentVal) markInvalid('adj-comment');
      if(!dateVal || !masterVal || amountRaw==='' || parseInt(amountRaw)===0 || !commentVal){
        showGapWarningBanner('Заполните все поля — сумма не может быть нулевой (положительная — доплата, отрицательная — удержание).');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const previousAdj = state.modal.adj;
      const updated = {
        id: previousAdj.id,
        date: dateVal,
        masterName: masterVal,
        amount: parseInt(amountRaw),
        eventId: overlay.querySelector('#adj-event').value || '',
        comment: commentVal,
      };

      // синхронизация с себестоимостью мероприятия: только положительные доплаты (студия должна),
      // отрицательные удержания к конкретному мероприятию не относятся
      const prevEventId = previousAdj.eventId || '';
      const affectedEventIds = new Set([prevEventId, updated.eventId].filter(Boolean));
      let anyEventChanged = false;
      affectedEventIds.forEach(eventId=>{
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) return;
        if(!Array.isArray(ev.materialsItems)) ev.materialsItems = [];
        const before = ev.materialsItems.length;
        ev.materialsItems = ev.materialsItems.filter(m=>m.adjRef !== updated.id);
        if(eventId === updated.eventId && updated.amount > 0){
          ev.materialsItems.push({ name: `Возврат мастеру: ${updated.comment}`, cost: updated.amount, source: 'studio', adjRef: updated.id });
        }
        if(ev.materialsItems.length !== before || (eventId === updated.eventId && updated.amount > 0)) anyEventChanged = true;
      });
      if(anyEventChanged) await saveEvents();

      const idx = state.salaryAdjustments.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.salaryAdjustments[idx] = updated; else state.salaryAdjustments.push(updated);
      await saveSalaryAdjustments();
      state.modal = null; overlay.remove(); render();
    };
  }

  function renderBookAnalyticsView(){

    const totalExpense = state.expenses.reduce((s,e)=> s + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0), 0);

    const byCategory = {};
    state.expenses.forEach(e=>{
      const cat = e.category || 'Без категории';
      byCategory[cat] = (byCategory[cat]||0) + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0);
    });
    const catList = Object.entries(byCategory).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxCat = Math.max(1, ...catList.map(x=>x[1]));

    const byDirection = {};
    state.expenses.filter(e=>e.category==='Материалы' && e.direction).forEach(e=>{
      byDirection[e.direction] = (byDirection[e.direction]||0) + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0);
    });
    const dirList = Object.entries(byDirection).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxDir = Math.max(1, ...dirList.map(x=>x[1]));

    // расходы по источникам оплаты

    state.expenses.forEach(e=>{

    const sourceExpList = Object.entries(bySourceExp).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const maxSourceExp = Math.max(1, ...sourceExpList.map(x=>x[1]));

    // доходы по продукту

    state.incomes.forEach(i=>{

    });
    const incomeProductList = Object.entries(incomeByProduct).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);

  function attachIncomeModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-income');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const eventOptions = eventSelectOptions();
    const labelToId = {};
    eventOptions.forEach(o=>{ labelToId[o.label] = o.id; });
    const eventSearchInput = overlay.querySelector('#i-event-search');
    const eventHidden = overlay.querySelector('#i-event');
    if(eventSearchInput && eventHidden){
      eventSearchInput.addEventListener('input', ()=>{
        const val = eventSearchInput.value.trim();
        if(val === ''){ eventHidden.value = ''; eventSearchInput.style.borderColor = ''; return; }
        if(labelToId[val]){ eventHidden.value = labelToId[val]; eventSearchInput.style.borderColor = ''; }
      });
      eventSearchInput.addEventListener('blur', ()=>{
        const val = eventSearchInput.value.trim();
        if(val !== '' && !labelToId[val]){
          // введённый текст не совпал ни с одним мероприятием — считаем "без привязки"
          eventSearchInput.value = '';
          eventHidden.value = '';
        }
      });
    }

    const delBtn = overlay.querySelector('#btn-del-income');
    if(delBtn) delBtn.onclick = ()=>{
      const cascades = state.modal.income.itemSaleId || state.modal.income.orderId;
      showConfirmDeletePopup(`Удалить этот доход?${cascades ? ' Связанная запись в «Изделиях»/«Заказе» также удалится.' : ' Действие необратимо.'}`, async ()=>{
      state.incomes = state.incomes.filter(x=>x.id !== state.modal.income.id);
      if(state.modal.income.itemSaleId){
        state.itemSales = state.itemSales.filter(x=>x.id !== state.modal.income.itemSaleId);
        await saveItemSales();
      }
      if(state.modal.income.orderId){
        state.orders = state.orders.filter(x=>x.id !== state.modal.income.orderId);
        await saveOrders();
      }
      await saveIncomes();
      state.modal = null; overlay.remove(); render();
      });
    };

    const productSelect = overlay.querySelector('#i-product');
    const masterField = overlay.querySelector('#income-master-field');
    const orderField = overlay.querySelector('#income-order-field');
    if(productSelect){
      productSelect.addEventListener('change', ()=>{
        if(masterField) masterField.style.display = (productSelect.value === 'Изделие') ? 'block' : 'none';
        if(orderField) orderField.style.display = (productSelect.value === 'Заказ') ? 'block' : 'none';
      });
    }

    overlay.querySelector('#btn-save-income').onclick = async ()=>{
      ['i-date','i-amount','i-comment','i-master','i-order-master','i-order-share'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dateVal = overlay.querySelector('#i-date').value;
      const amountRaw = overlay.querySelector('#i-amount').value;
      const operationVal = overlay.querySelector('#i-operation').value;
      const productVal = overlay.querySelector('#i-product').value;
      const accountVal = overlay.querySelector('#i-account').value;
      const commentVal = overlay.querySelector('#i-comment').value.trim();
      const masterVal = overlay.querySelector('#i-master').value.trim();
      const orderMasterVal = overlay.querySelector('#i-order-master').value.trim();
      const orderShareRaw = overlay.querySelector('#i-order-share').value;

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!dateVal) markInvalid('i-date');
      if(amountRaw === '') markInvalid('i-amount');
      if(!commentVal) markInvalid('i-comment');
      const masterMissing = (productVal === 'Изделие' && !masterVal);
      if(masterMissing) markInvalid('i-master');
      const orderMasterMissing = (productVal === 'Заказ' && !orderMasterVal);
      if(orderMasterMissing) markInvalid('i-order-master');
      const orderShareMissing = (productVal === 'Заказ' && orderShareRaw === '');
      if(orderShareMissing) markInvalid('i-order-share');
      if(!dateVal || amountRaw==='' || !commentVal || masterMissing || orderMasterMissing || orderShareMissing){
        let msg = 'Заполните все поля перед сохранением дохода.';
        if(masterMissing) msg = 'Продукт «Изделие» — укажите мастера, который его изготовил.';
        else if(orderMasterMissing || orderShareMissing) msg = 'Продукт «Заказ» — укажите мастера и договорённую сумму ЗП мастера.';
        showGapWarningBanner(msg);
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const updated = {
        id: state.modal.income.id,
        date: dateVal,
        operation: operationVal,
        product: productVal,
        account: accountVal,
        eventId: overlay.querySelector('#i-event').value || '',
        amount: parseInt(amountRaw),
        masterName: productVal==='Изделие' ? masterVal : (productVal==='Заказ' ? orderMasterVal : ''),
        masterShare: productVal==='Заказ' ? parseInt(orderShareRaw) : null,
        itemSaleId: state.modal.income.itemSaleId || '',
        orderId: state.modal.income.orderId || '',
        comment: commentVal,
      };

      // синхронизация с "Для менеджеров → Изделия"
      if(productVal === 'Изделие'){
        const saleEntry = { id: updated.itemSaleId || uid(), date: updated.date, masterName: masterVal, revenue: updated.amount, comment: updated.comment };
        updated.itemSaleId = saleEntry.id;
        const saleIdx = state.itemSales.findIndex(x=>x.id===saleEntry.id);
        if(saleIdx >= 0) state.itemSales[saleIdx] = saleEntry; else state.itemSales.push(saleEntry);
        await saveItemSales();
      } else if(updated.itemSaleId){
        state.itemSales = state.itemSales.filter(x=>x.id !== updated.itemSaleId);
        await saveItemSales();
        updated.itemSaleId = '';
      }

      // синхронизация с "Для менеджеров → Заказ"
      if(productVal === 'Заказ'){
        const orderEntry = { id: updated.orderId || uid(), date: updated.date, masterName: orderMasterVal, revenue: updated.amount, masterShare: parseInt(orderShareRaw), comment: updated.comment };
        updated.orderId = orderEntry.id;
        const orderIdx = state.orders.findIndex(x=>x.id===orderEntry.id);
        if(orderIdx >= 0) state.orders[orderIdx] = orderEntry; else state.orders.push(orderEntry);
        await saveOrders();
      } else if(updated.orderId){
        state.orders = state.orders.filter(x=>x.id !== updated.orderId);
        await saveOrders();
        updated.orderId = '';
      }

      const idx = state.incomes.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.incomes[idx] = updated; else state.incomes.push(updated);
      await saveIncomes();
      state.modal = null; overlay.remove(); render();
    };
  }

            <datalist id="ex-event-options">${eventSelectOptions().map(o=>`<option value="${escapeHtml(o.label)}">`).join('')}</datalist>

              <button class="btn btn-primary" id="btn-save-expense">Сохранить</button>
