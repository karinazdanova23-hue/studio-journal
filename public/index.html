/* ================= OVERVIEW ================= */
// Сохранение галочки «Готово» на карточке задачи (Обзор, день в календаре) — вынесено из
// обработчика, чтобы при неудачном сохранении кнопка «Повторить» могла пересохранить именно это
// (не переспрашивая комментарий заново). afterSuccess — необязательный колбэк после удачного render().
async function saveDoneToggle(id, personal, result, cb, task, afterSuccess){
  const fresh = await refreshTasksFromServer(personal);
  const before = fresh || tasksFor(personal);
  // Последняя проверка уже по свежим данным: за время, пока вводился отчёт, кто-то мог добавить
  // подзадачу или вернуть её на доработку.
  if(before.some(c=>c.parentId===id && c.status!=='done' && c.status!=='review')){
    cb.checked = false;
    toast('Внутри есть незавершённая подзадача — сначала выполните её и отправьте на проверку.');
    render();
    return;
  }
  const updated = before.map(t=>t.id===id?withStatusReview(t,result.comment,result.link,result.overdueReason):t);
  setTasksFor(personal, updated);
  const ok = await persistTasksFor(personal);
  if(!ok){ setTasksFor(personal, before); cb.checked=false; saveFailedToast(()=>saveDoneToggle(id, personal, result, cb, task, afterSuccess)); return; }
  notifySelfSaved('✅ Отчёт по задаче сохранён', task ? task.title : '');
  render();
  if(afterSuccess) afterSuccess();
}
async function saveUndoneToggle(id, personal, cb, afterSuccess){
  const fresh = await refreshTasksFromServer(personal);
  const before = fresh || tasksFor(personal);
  const undoTarget = before.find(t=>t.id===id);
  setTasksFor(personal, before.map(t=>{
    if(t.id===id) return withStatus(t,'progress');
    // Подзадачу вернули в работу — главная задача, сданная на проверку, тоже возвращается в работу.
    if(undoTarget && undoTarget.parentId===t.id && t.status==='review') return withStatus(t,'progress');
    return t;
  }));
  const ok = await persistTasksFor(personal);
  if(!ok){ setTasksFor(personal, before); cb.checked=true; saveFailedToast(()=>saveUndoneToggle(id, personal, cb, afterSuccess)); return; }
  render();
  if(afterSuccess) afterSuccess();
}
function renderOverview(root){
  const canChooseWhoToView = hasRole('Руководитель','Ассистент');
  // По умолчанию каждый видит только свои задачи. Руководитель/Ассистент могут выбрать чужой обзор или "Все".
  let viewingId = canChooseWhoToView ? (state.overviewFilterEmployee || state.currentUserId) : state.currentUserId;
  const viewCompanyWide = canChooseWhoToView && viewingId === 'all';
  // Ручная очередность задач «на сегодня» хранится отдельно для каждого сотрудника.
  const orderKey = id => 'settings:todayOrder:'+id;
  const canOrderToday = !viewCompanyWide && !!viewingId && (viewingId===state.currentUserId || canChooseWhoToView) && state.todayOrderLoaded[viewingId]===true;
  if(!viewCompanyWide && viewingId && state.todayOrderLoaded[viewingId]===undefined){
    state.todayOrderLoaded[viewingId] = 'loading';

    const ok = await sSet(orderKey(viewingId), JSON.stringify(ids), true);
    if(!ok){ state.todayOrder[viewingId] = prev; toast('Не удалось сохранить очередность — попробуйте ещё раз'); }
    render();
  }
  root.querySelectorAll('[data-ov-move]').forEach(btn=>btn.onclick=async (e)=>{
    e.stopPropagation();
    const [id, dir] = btn.dataset.ovMove.split('|');
    const ids = Array.from(root.querySelectorAll('[data-ov-rank]')).map(el=>el.dataset.ovRank);
    const i = ids.indexOf(id), j = dir==='up' ? i-1 : i+1;
    if(i<0 || j<0 || j>=ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    await saveTodayOrder(ids);
  });
  const resetOrderBtn = document.getElementById('resetTodayOrder');
  if(resetOrderBtn) resetOrderBtn.onclick = ()=>saveTodayOrder([]);
  root.querySelectorAll('[data-ov-done]').forEach(cb=>{
    cb.onclick = e=>e.stopPropagation();
    cb.onchange = async ()=>{
      const id = cb.dataset.ovDone;
      const personal = cb.dataset.ovDonePersonal==='1';
      const task = tasksFor(personal).find(t=>t.id===id);
      if(cb.checked && !canCompleteTask(task, personal)){
        cb.checked = false;
        toast(whyCantComplete(task, personal));
        return;
      }
      if(cb.checked){
        const isOverdue = !!(task && task.deadline && task.deadline < todayISO());
        const result = await requestCompletionComment(task ? task.title : '', isOverdue);
        if(result===null){ cb.checked=false; return; }
        await saveDoneToggle(id, personal, result, cb, task);
      } else {
        await saveUndoneToggle(id, personal, cb);
      }
    };
  });
  // Открываем задачу/день поверх Обзора как модальное окно, НЕ переключая вкладку —
  // иначе после закрытия/сохранения пользователя «перекидывало» в «Задачи»/«Календарь»
  // вместо того, чтобы оставить его там, где он был (в Обзоре).
  root.querySelectorAll('[data-ov-task]').forEach(row=>row.onclick=()=>{
    const id = row.dataset.ovTask;
    openTaskModal(id, false);
  });
  root.querySelectorAll('[data-ov-day]').forEach(row=>row.onclick=()=>{
    const iso = row.dataset.ovDay;
    openDayModal(iso);
  });
}
// Отдельное окно со списком задач, поставленных сегодня — Руководитель/Ассистент видят все

          ${t.assigneeId?`<span>Исполнитель: ${escapeHtml(empName(t.assigneeId))}</span>`:''}

/* ================= CALENDAR ================= */
function renderCalendar(root){
  const y=state.calYear, m=state.calMonth;
  const monthNames=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const first = new Date(y,m,1);
  let startDow = first.getDay(); startDow = startDow===0?6:startDow-1; // Monday start
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const eventsByDate = {};
  calendarVisibleEvents().filter(e=>state.calFilters[e.category]!==false).forEach(e=>{ (eventsByDate[e.date]=eventsByDate[e.date]||[]).push(e); });
  const ownerIds = selectedEventOwnerIds();
  // Дни рождения всегда подписаны сверху дня — независимо от фильтров вида и выбранных сотрудников.
  const birthdayDates = new Set(calendarVisibleEvents().filter(e=>e.category==='birthday').map(e=>e.date));

  const activeEmpIds = state.employees.filter(e=>state.calEmployeeFilters[e.id]).map(e=>e.id);
  const tasksByDate = {};
  if(activeEmpIds.length){
    state.tasksWork.filter(t=>t.deadline && t.assigneeId && activeEmpIds.includes(t.assigneeId)).forEach(t=>{
      (tasksByDate[t.deadline]=tasksByDate[t.deadline]||[]).push(t);
    });
  }

  root.innerHTML = `
    <div class="row-between">
      <div>
        <h2 class="section-title">Общий календарь</h2>
        <p class="subtitle">${ownerIds.length ? 'Показаны события: '+ownerIds.map(empName).map(escapeHtml).join(', ') : (hasRole('Руководитель') && state.calendarFullView ? 'Полное расписание — видны все события' : 'Показаны только те события, где вы участвуете')}</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${hasRole('Руководитель') ? `<button class="btn ghost" id="toggleFullScheduleBtn">${state.calendarFullView?'👁 Скрыть до моих':'🔭 Показать общее расписание'}</button>` : ''}
        ${hasRole('Руководитель','Ассистент') ? `<button class="btn ghost" id="purposesBtn">⚙️ Назначения</button>` : ''}
        <button class="btn" id="addEventBtn">+ Событие</button>
      </div>
    </div>
    <div class="cat-filters" id="catFilters">
      ${Object.entries(CATEGORIES).map(([k,v])=>`
        <button class="cat-chip ${state.calFilters[k]?'':'off'}" data-cat="${k}">
          <span class="dot" style="background:${CATEGORY_COLORS[k]};"></span>${v}${k==='personal' && !personalAccessAllowed()?' 🔒':''}
        </button>
      `).join('')}
    </div>
    ${!personalAccessAllowed()?`<div class="note" id="calPersonalNote" style="margin-bottom:16px;">🔒 «Личное» видно только Руководителю и Ассистенту. <button class="btn ghost small" id="calUnlockBtn" style="margin-left:6px;">🙋 Войти</button></div>`:''}
    ${canPickEventOwners() ? `
    <div class="row-between" style="margin-bottom:6px;">
      <p class="subtitle" style="margin:0;">Чьи события и мероприятия показывать${ownerIds.length?'':' (ничего не выбрано — ваши как обычно)'}:</p>
      ${ownerIds.length?`<button class="btn ghost small" id="ownerFilterReset">Сбросить</button>`:''}
    </div>
    <div class="cat-filters" id="ownerFilters" style="margin-bottom:18px;">
      ${state.employees.map(e=>`
        <button class="cat-chip ${state.calOwnerFilter[e.id]?'':'off'}" data-owner="${e.id}">
          <span class="dot" style="background:${employeeColor(e.id)};"></span>${escapeHtml(e.name)}
        </button>
      `).join('') || `<span class="subtitle" style="margin:0;">Сначала добавьте сотрудников</span>`}
    </div>` : ''}
    <div class="row-between" style="margin-bottom:6px;">
      <p class="subtitle" style="margin:0;">Показать задачи на календаре:</p>
    </div>
    <div class="cat-filters" id="empFilters" style="margin-bottom:18px;">
      ${state.employees.map(e=>`
        <button class="cat-chip ${state.calEmployeeFilters[e.id]?'':'off'}" data-emp="${e.id}">
          <span class="dot" style="background:${employeeColor(e.id)};"></span>${escapeHtml(e.name)}
        </button>
      `).join('') || `<span class="subtitle" style="margin:0;">Сначала добавьте сотрудников</span>`}
    </div>
    <div class="cal-head">
      <div class="cal-nav"><button class="btn ghost small" id="calPrev">←</button></div>
      <div class="month-label">${monthNames[m]} ${y}</div>
      <div class="cal-nav"><button class="btn ghost small" id="calNext">→</button></div>
    </div>
    <div class="cal-grid">
      ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(d===null) return `<div class="cal-cell empty"></div>`;
        const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = iso===todayISO();
        const evts = (eventsByDate[iso]||[]).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
        const tasks = (tasksByDate[iso]||[]).sort((a,b)=>(a.priority==='high'?-1:1));
        const chipLen = calChipLen();
        const evtChips = evts.map(e=>{
          const label = truncate((e.seriesId?'🔁 ':'')+(e.startTime?e.startTime+' · ':'')+e.title, chipLen);
          return `<div class="cal-evt cat-${e.category}" title="${e.seriesId?'🔁 Повтор — ':''}${escapeHtml(e.title)}">${escapeHtml(label)}</div>`;

        const taskChips = tasks.map(t=>{
          const label = truncate((t.status==='done'?'✓ ':'☐ ')+t.title, chipLen);
          return `<div class="cal-evt cal-task ${t.status==='done'?'is-done':''}" style="border-color:${employeeColor(t.assigneeId)};color:${employeeColor(t.assigneeId)};" title="${escapeHtml(empName(t.assigneeId))}: ${escapeHtml(t.title)}">${escapeHtml(label)}</div>`;
        });
        const allChips = evtChips.concat(taskChips);
        const maxShown = calMaxShown();
        const shown = allChips.slice(0,maxShown);
        const more = allChips.length - shown.length;
        return `<div class="cal-cell ${isToday?'today':''}" data-date="${iso}">
          ${birthdayDates.has(iso)?`<div class="cal-bday">🎂 день рождения</div>`:''}
          <div class="cal-daynum">${d}</div>
          ${shown.join('')}
          ${more>0?`<div class="cal-more">+${more} ещё</div>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
  root.querySelector('#calPrev').onclick=()=>{ state.calMonth--; if(state.calMonth<0){state.calMonth=11;state.calYear--;} render(); };
  root.querySelector('#calNext').onclick=()=>{ state.calMonth++; if(state.calMonth>11){state.calMonth=0;state.calYear++;} render(); };
  root.querySelector('#addEventBtn').onclick=()=>openEventModal();
  const purposesBtn = root.querySelector('#purposesBtn'); if(purposesBtn) purposesBtn.onclick = openPurposesModal;
  const toggleFullBtn = document.getElementById('toggleFullScheduleBtn');
  if(toggleFullBtn) toggleFullBtn.onclick=()=>{
    state.calendarFullView = !state.calendarFullView;
    render();
  };
  const calUnlockBtn = document.getElementById('calUnlockBtn');
  if(calUnlockBtn) calUnlockBtn.onclick=()=>openWhoAmIModal();
  root.querySelectorAll('#catFilters .cat-chip').forEach(chip=>{
    chip.onclick=()=>{
      const cat = chip.dataset.cat;
      state.calFilters[cat] = !state.calFilters[cat];
      render();
    };
  });
  root.querySelectorAll('#ownerFilters .cat-chip').forEach(chip=>{
    chip.onclick=()=>{
      const empId = chip.dataset.owner;
      if(state.calOwnerFilter[empId]) delete state.calOwnerFilter[empId];
      else state.calOwnerFilter[empId] = true;
      render();
    };
  });
  const ownerResetBtn = document.getElementById('ownerFilterReset');
  if(ownerResetBtn) ownerResetBtn.onclick=()=>{ state.calOwnerFilter = {}; render(); };
  root.querySelectorAll('#empFilters .cat-chip').forEach(chip=>{
    chip.onclick=()=>{
      const empId = chip.dataset.emp;
      state.calEmployeeFilters[empId] = !state.calEmployeeFilters[empId];
      render();
    };
  });
  root.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    cell.onclick=()=>openDayModal(cell.dataset.date);
  });
}

// Финальный шаг удаления события (после подтверждения и перемещения в корзину) — отдельной
// функцией, чтобы «Повторить» при неудачном сохранении не переспрашивал подтверждение и не
// перемещал событие в корзину повторно, а просто пересохранял уже готовый результат.
async function saveEventDeletion(personal, before, updated, evObj, isSeries){
  setEventsFor(personal, updated);
  const ok = await withConfirmEmpty(()=>persistEventsFor(personal)); // человек сам подтвердил удаление
  if(!ok){ setEventsFor(personal, before); saveFailedToast(()=>saveEventDeletion(personal, before, updated, evObj, isSeries)); return; }
  if(evObj && !personal) logAudit('event_deleted', `«${evObj.title}»${isSeries?' (вся серия)':''}`);
  closeModal(); render();
}

  const activeTasks = dayTasks.filter(t=>t.status!=='done').sort((a,b)=> (b.seriesId?1:0) - (a.seriesId?1:0));
  const doneTasks = dayTasks.filter(t=>t.status==='done');
  const isPersonalTaskFn = (id)=> state.personalTasks.some(pt=>pt.id===id);
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal" style="max-width:520px;">
        <div class="modal-topbar">
          <h3>${fmtDate(iso)}</h3>
          <div class="modal-topbar-btns">

            <button class="btn ghost" id="closeDayModal">Закрыть</button>
          </div>
        </div>
        <h4 style="font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 8px;">События</h4>
        <div class="item-list" style="margin-bottom:16px;">
          ${evts.length? evts.map(e=>`
            <div class="item">
              <div class="main">
                <div class="title">${isPersonalEvent(e.id)?'🔒 ':''}${e.startTime?e.startTime+(e.endTime?'–'+e.endTime:'')+' · ':''}${escapeHtml(e.title)}</div>
                <div class="meta">
                  <span>${catLabel(e.category)}</span>
                  ${e.seriesId?'<span>🔁 Повтор</span>':''}
                  <span>${e.format==='online'?'💻 Онлайн':'📍 Оффлайн'}</span>

                  ${e.manualNames?`<span>(${escapeHtml(e.manualNames)})</span>`:''}
                </div>
                ${e.format==='offline' && e.location?`<div class="desc">📍 ${escapeHtml(e.location)}</div>`:''}

                ${e.extraLink?`<div class="desc">📎 <a href="${escapeHtml(e.extraLink)}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;">Доп. ссылка</a></div>`:''}

              </div>

                <button class="btn danger small" data-del="${e.id}">✕</button>
              </div>

          `).join('') : `<p class="subtitle" style="margin:0;">Событий нет</p>`}
        </div>
        <h4 style="font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 8px;">Задачи в работе на этот день</h4>
        <div class="item-list" id="dayTaskListActive" style="margin-bottom:${doneTasks.length?10:16}px;">
          ${activeTasks.length ? activeTasks.map(t=>taskItemHtml(t, isPersonalTaskFn(t.id))).join('')
            : (doneTasks.length ? `<p class="subtitle" style="margin:0;">Активных задач нет — все выполнены 🎉</p>` : `<p class="subtitle" style="margin:0;">Задач с таким сроком нет</p>`)}
        </div>
        ${doneTasks.length ? `
        <button class="btn ghost small" id="toggleDoneTasks">${state.dayDoneExpanded?'Скрыть':'Показать'} выполненные задачи (${doneTasks.length})</button>
        <div class="item-list" id="dayTaskListDone" style="margin:10px 0 16px;${state.dayDoneExpanded?'':'display:none;'}">
          ${doneTasks.map(t=>taskItemHtml(t, isPersonalTaskFn(t.id))).join('')}
        </div>` : ''}
      </div>
    </div>`;
  document.getElementById('closeDayModal').onclick=()=>{ state.dayModalIso=null; closeModal(); };
  document.getElementById('ov').onclick=(ev)=>{ if(ev.target.id==='ov'){ state.dayModalIso=null; closeModal(); } };
  document.getElementById('addForDay').onclick=()=>openEventModal(null, iso);
  modal.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEventModal(b.dataset.edit));
  modal.querySelectorAll('[data-del]').forEach(b=>b.onclick=async ()=>{
    const evId = b.dataset.del;
    const personal = isPersonalEvent(evId);
    await refreshEventsFromServer(personal);
    const evObj = eventsFor(personal).find(e=>e.id===evId);
    if(evObj && evObj.seriesId){
      const choice = await showSeriesDeleteChoice();
      if(!choice) return;
      const before = eventsFor(personal);
      let updated;
      if(choice==='one'){
        await moveToTrash(personal, 'event', evObj);
        updated = before.filter(e=>e.id!==evId);
      } else {
        const seriesEvents = before.filter(e=>e.seriesId===evObj.seriesId);
        for(const se of seriesEvents) await moveToTrash(personal, 'event', se);
        updated = before.filter(e=>e.seriesId!==evObj.seriesId);
      }
      await saveEventDeletion(personal, before, updated, evObj, choice==='series');
    } else if(await showConfirm('Удалить событие?')){
      const before = eventsFor(personal);
      if(evObj) await moveToTrash(personal, 'event', evObj);
      const updated = before.filter(e=>e.id!==evId);
      await saveEventDeletion(personal, before, updated, evObj, false);
    }
  });
  const activeListEl = document.getElementById('dayTaskListActive');
  if(activeTasks.length) wireDayTaskActions(activeListEl, iso);
  const doneListEl = document.getElementById('dayTaskListDone');
  if(doneListEl) wireDayTaskActions(doneListEl, iso);
  const toggleBtn = document.getElementById('toggleDoneTasks');
  if(toggleBtn) toggleBtn.onclick=()=>{
    state.dayDoneExpanded = !state.dayDoneExpanded;
    closeModal(); openDayModal(iso);
  };
}

function wireDayTaskActions(el, iso){
  wireEventLinks(el);
  wireOverdueReasonInputs(el);
  wireReviewActions(el);
  wireTaskComments(el);
  const isPersonalTask = (id)=> state.personalTasks.some(pt=>pt.id===id);
  el.querySelectorAll('[data-done]').forEach(cb=>{
    cb.onclick = e=>e.stopPropagation();
    cb.onchange = async ()=>{
      const id = cb.dataset.done;
      const personal = isPersonalTask(id);
      const task = tasksFor(personal).find(t=>t.id===id);
      if(!canCompleteTask(task, personal)){
        cb.checked = !cb.checked;
        toast(whyCantComplete(task, personal));
        return;
      }
      if(cb.checked){
        const isOverdue = !!(task && task.deadline && task.deadline < todayISO());
        const result = await requestCompletionComment(task ? task.title : '', isOverdue);
        if(result===null){ cb.checked=false; return; }
        await saveDoneToggle(id, personal, result, cb, task, ()=>{ closeModal(); openDayModal(iso); });
      } else {
        await saveUndoneToggle(id, personal, cb, ()=>{ closeModal(); openDayModal(iso); });
      }
    };
  });
  el.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.editTask;
    const personal = isPersonalTask(id);
    const t = tasksFor(personal).find(x=>x.id===id);
    if(!canEditTask(t, personal)){ toast(whyCantEdit(t)); return; }
    openTaskModal(id, personal);
  });
  el.querySelectorAll('[data-add-sub]').forEach(b=>b.onclick=()=>openTaskModal(null, isPersonalTask(b.dataset.addSub), b.dataset.addSub));
  el.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.delTask;
    const personal = isPersonalTask(id);
    const targetTask = tasksFor(personal).find(x=>x.id===id);
    const didDelete = await performTaskDeletion(personal, targetTask);
    if(!didDelete) return;
    render();
    closeModal(); openDayModal(iso);
  });
}

function openEventModal(id, presetDate){
  const existingPersonal = id ? isPersonalEvent(id) : false;
  const existing = id ? (existingPersonal ? state.personalEvents : state.events).find(e=>e.id===id) : null;
  const initialFormat = existing ? (existing.format||'offline') : 'offline';
  const initialCategory = existing ? (normCat(existing.category)||'work') : 'work';
  const isAllDayCategory = (cat)=> cat==='vacation' || cat==='birthday';
  const initialEmpIds = existing && existing.employeeIds ? existing.employeeIds : [];
  const initialHasManagerHostess = initialEmpIds.some(eid=>{
    const e = state.employees.find(x=>x.id===eid);
    return e && (e.role==='Менеджер' || e.role==='Хостес');
  });
  // Задачи, привязанные к этому событию (поле t.eventId) — показываем кратким списком,
  // клик по задаче разворачивает подробности. Только для уже существующего события.
  const linkedTasks = existing
    ? state.tasksWork.concat(personalAccessAllowed() ? state.personalTasks : []).filter(t=>t.eventId===existing.id)
    : [];
  if(state.eventModalId !== (existing?existing.id:null)) state.eventModalExpandedTasks = [];

    async function confirmNoDoubleBooking(datesToCheck, excludeIds){

        });
        const uniq = [...new Set(clashes)];
        if(uniq.length){
          const shown = uniq.slice(0,8).join('\n');
          const more = uniq.length>8 ? `\n…и ещё ${uniq.length-8}` : '';
          const okVac = await showConfirm(`🌴 У участников в эти даты отпуск:\n${shown}${more}\n\nТочно сохранить событие с их участием?`, 'Всё равно сохранить');
          if(!okVac) return false;
        }
      }
      const excludeSet = new Set(excludeIds);
      let conflicts = [];
      datesToCheck.forEach(d=>{
        state.events.concat(state.personalEvents)
          .filter(e=>!excludeSet.has(e.id) && e.date===d && !isAllDayCategory(e.category))

            const shared = (e.employeeIds||[]).filter(eid=>emp.includes(eid));

          });
      });
      conflicts = [...new Set(conflicts)];
      if(!conflicts.length) return true;
      const shown = conflicts.slice(0,8).join('\n');
      const more = conflicts.length>8 ? `\n…и ещё ${conflicts.length-8}` : '';
      return await showConfirm(`⚠️ Пересечение по времени с другим событием:\n${shown}${more}\n\nВсё равно сохранить?`, 'Всё равно сохранить');
    }
    const repeatType = rep_();
    if(!existing && repeatType!=='none'){
      const untilVal = until_(data.date);
      const weekdaySet = weekdays_();
      let dates = generateRecurrenceDates(data.date, repeatType, weekdaySet, untilVal, 300);
      if(!dates.length) dates = [data.date];
      if(!(await confirmNoDoubleBooking(dates, []))) return;
      const seriesId = uid();
      const newEvts = dates.map(d=>({...data, id: uid()+d, date: d, seriesId}));
      // Каждая ветка сохранения — своей вложенной именованной функцией, чтобы при неудаче кнопка
      // «Повторить» пересохраняла именно этот расчёт, не переспрашивая конфликты/выбор серии заново.
      async function saveRecurringEvents(){
        const before = eventsFor(newPersonal);
        setEventsFor(newPersonal, before.concat(newEvts));
        const ok = await persistEventsFor(newPersonal);
        if(!ok){ setEventsFor(newPersonal, before); saveFailedToast(saveRecurringEvents); return; }
        toast(`Добавлено событий: ${dates.length}`);
        notifySelfSaved('✅ Событие создано', data.title);
        closeModal(); render();
      }
      await saveRecurringEvents();
      return;
    } else if(existing){
      if(existingPersonal !== newPersonal){
        if(!(await confirmNoDoubleBooking([data.date], [existing.id]))) return;
        // moved between personal/work — remove from old store, add to new
        async function saveMovedEvent(){
          const beforeOld = eventsFor(existingPersonal);
          setEventsFor(existingPersonal, beforeOld.filter(e=>e.id!==existing.id));
          const ok1 = await persistEventsFor(existingPersonal);
          if(!ok1){ setEventsFor(existingPersonal, beforeOld); saveFailedToast(saveMovedEvent); return false; }
          const beforeNew = eventsFor(newPersonal);
          setEventsFor(newPersonal, beforeNew.concat([data]));
          const ok2 = await persistEventsFor(newPersonal);
          if(!ok2){
            setEventsFor(newPersonal, beforeNew);
            setEventsFor(existingPersonal, beforeOld);
            await persistEventsFor(existingPersonal);
            saveFailedToast(saveMovedEvent);
            return false;
          }
          toast('Событие сохранено');
          return true;
        }
        if(!(await saveMovedEvent())) return;
      } else if(existing.seriesId){
        const choice = await showSeriesEditChoice();
        if(!choice) return;
        if(choice==='one'){
          if(!(await confirmNoDoubleBooking([data.date], [existing.id]))) return;
        } else {
          const seriesEvts = eventsFor(newPersonal).filter(e=>e.seriesId===existing.seriesId);
          if(!(await confirmNoDoubleBooking(seriesEvts.map(e=>e.date), seriesEvts.map(e=>e.id)))) return;
        }
        async function saveSeriesEdit(){
          const before = eventsFor(newPersonal);
          if(choice==='one'){
            setEventsFor(newPersonal, before.map(e=>e.id===existing.id?data:e));
          } else {
            setEventsFor(newPersonal, before.map(e=>{
              if(e.seriesId===existing.seriesId){
                return {...data, id:e.id, date:e.date, seriesId:e.seriesId};
              }
              return e;
            }));
          }
          const ok = await persistEventsFor(newPersonal);
          if(!ok){ setEventsFor(newPersonal, before); saveFailedToast(saveSeriesEdit); return false; }
          toast(choice==='series' ? 'Изменения применены ко всей серии' : 'Событие сохранено');
          return true;
        }
        if(!(await saveSeriesEdit())) return;
      } else {
        if(!(await confirmNoDoubleBooking([data.date], [existing.id]))) return;
        async function saveSimpleEventEdit(){
          const before = eventsFor(newPersonal);
          setEventsFor(newPersonal, before.map(e=>e.id===existing.id?data:e));
          const ok = await persistEventsFor(newPersonal);
          if(!ok){ setEventsFor(newPersonal, before); saveFailedToast(saveSimpleEventEdit); return false; }
          toast('Событие сохранено');
          return true;
        }
        if(!(await saveSimpleEventEdit())) return;
      }
    } else {
      if(!(await confirmNoDoubleBooking([data.date], []))) return;
      async function saveNewEvent(){
        const before = eventsFor(newPersonal);
        setEventsFor(newPersonal, before.concat([data]));
        const ok = await persistEventsFor(newPersonal);
        if(!ok){ setEventsFor(newPersonal, before); saveFailedToast(saveNewEvent); return false; }
        toast('Событие сохранено');
        notifySelfSaved('✅ Событие создано', data.title);
        return true;
      }
      if(!(await saveNewEvent())) return;
    }
    closeModal(); render();
  };
}

/* ---------------- порядок подзадач ----------------
   Подзадачи одной задачи везде (в «Задачах» и в «Обзоре») идут в одном порядке: ручной (sortOrder),
   а пока он не задан — по сроку (дате); при равенстве остаётся порядок, в котором их поставили. */
function compareSiblings(a,b){
  return ((a.sortOrder||0)-(b.sortOrder||0)) || (a.deadline||'9999').localeCompare(b.deadline||'9999');
}
function canReorderSubtasks(parentId, personal){
  if(hasRole('Руководитель','Ассистент')) return true;
  const parent = tasksFor(personal).find(x=>x.id===parentId);
  return !!parent && canEditTask(parent, personal);
}
// Стрелки ▲▼ у подзадачи (рисуются слева; доступность крайних кнопок выставляет wireSubtaskMoves)
function subMoveHtml(t, personal){
  if(!t.parentId || !canReorderSubtasks(t.parentId, personal)) return '';
  return `<div class="sub-move" style="display:flex;flex-direction:column;gap:2px;flex:none;">
    <button type="button" class="btn ghost small" data-sub-move="${t.id}|up" title="Поднять подзадачу выше" style="padding:0 7px;line-height:1.3;">▲</button>
    <button type="button" class="btn ghost small" data-sub-move="${t.id}|down" title="Опустить подзадачу ниже" style="padding:0 7px;line-height:1.3;">▼</button>
  </div>`;
}
async function moveSubtask(id, neighborId, personal){
  await refreshTasksFromServer(personal);
  const before = tasksFor(personal);
  const me = before.find(t=>t.id===id);
  if(!me || !me.parentId) return;
  if(!canReorderSubtasks(me.parentId, personal)){ toast('Менять порядок подзадач может тот, кто поставил задачу, либо Руководитель/Ассистент'); return; }
  const sibs = before.filter(t=>t.parentId===me.parentId).sort(compareSiblings);
  const i = sibs.findIndex(t=>t.id===id), j = sibs.findIndex(t=>t.id===neighborId);
  if(i<0 || j<0) return;
  [sibs[i], sibs[j]] = [sibs[j], sibs[i]];
  const orderMap = {}; sibs.forEach((t,k)=>{ orderMap[t.id] = (k+1)*10; });
  async function saveSubOrder(){
    setTasksFor(personal, before.map(t=> orderMap[t.id]!==undefined ? {...t, sortOrder: orderMap[t.id]} : t));
    const ok = await persistTasksFor(personal);
    if(!ok){ setTasksFor(personal, before); saveFailedToast(saveSubOrder); }
    render();
  }
  await saveSubOrder();
}
function wireSubtaskMoves(container){
  const rows = Array.from(container.querySelectorAll('[data-sub-parent]'));
  const byParent = {};
  rows.forEach(r=>{ (byParent[r.dataset.subParent] = byParent[r.dataset.subParent]||[]).push(r); });
  container.querySelectorAll('[data-sub-move]').forEach(btn=>{
    const [id, dir] = btn.dataset.subMove.split('|');
    const row = btn.closest('[data-sub-parent]'); if(!row) return;
    const sibs = byParent[row.dataset.subParent] || [];
    const idx = sibs.indexOf(row);
    const nb = sibs[dir==='up' ? idx-1 : idx+1];
    if(!nb){ btn.disabled = true; return; }
    btn.onclick = (e)=>{
      e.stopPropagation();
      const personal = state.personalTasks.some(pt=>pt.id===id);
      moveSubtask(id, nb.dataset.subRowId, personal);
    };
  });
}

  const before = state.tasksWork;
  setTasksFor(false, all.filter(t=>!idsSet.includes(t.id)));

  toast(`Удалено: ${deletedCount}${skipped?`, пропущено (не вы постановщик): ${skipped}`:''}`);
  state.bulkSelectedIds = new Set();
  render();
}

    <div class="cat-filters" style="margin-bottom:10px;">
      <span class="subtitle" style="margin:0 2px 0 0;">Срок:</span>
      <button class="cat-chip ${state.taskFilterPeriod==='all'?'':'off'}" data-period="all">Все</button>
      <button class="cat-chip ${state.taskFilterPeriod==='week'?'':'off'}" data-period="week">На этой неделе</button>
      <button class="cat-chip ${state.taskFilterPeriod==='month'?'':'off'}" data-period="month">В этом месяце</button>
      <button class="cat-chip ${state.taskHideOverdue?'':'off'}" id="hideOverdueChip" style="${state.taskHideOverdue?'border-color:var(--brick);color:var(--brick);':''}">🙈 Скрыть просроченные</button>
    </div>
    <div id="delegatedSummary"></div>
    <div id="bulkActionBar"></div>
    <div class="item-list" id="taskList"></div>
  `;

  const projRow = el.querySelector('#projRow');
  const blockRow = el.querySelector('#blockRow');

  if(!personal && activeBlocksFor().length){
    blockRow.style.display = '';
    blockRow.className = 'cat-filters block-row';
    blockRow.innerHTML = `
      <span class="subtitle" style="margin:0 2px 0 0;font-weight:700;color:var(--rose);">📦 Блоки:</span>
      <button class="cat-chip ${!activeBlockId?'':'off'}" data-block="__all__" style="border-color:var(--rose);">Все блоки</button>
      ${activeBlocksFor().map(b=>`<button class="cat-chip ${activeBlockId===b.id?'':'off'}" data-block="${b.id}" style="border-color:var(--rose);"><span class="dot" style="background:var(--rose);"></span>${escapeHtml(b.name)}</button>`).join('')}
    `;
  } else {
    blockRow.style.display = 'none';
    blockRow.innerHTML = '';
  }

  // Если активен блок — показываем только его проекты (каскад); иначе все проекты в области видимости.
  const projectsInScope = (!personal && activeBlockId) ? projects.filter(p=>p.blockId===activeBlockId) : projects;
  function projChip(p){
    const isSel = state.taskFilterProjectIds[selKey].has(p.id);
    return `<button class="cat-chip ${isSel?'':'off'}" data-proj="${p.id}"><span class="dot" style="background:var(--indigo);"></span>${escapeHtml(p.name)}</button>`;
  }
  const noSelection = !state.taskFilterNoProject[selKey] && state.taskFilterProjectIds[selKey].size===0;
  // Список проектов можно свернуть (запоминается в этом браузере). В свёрнутом виде видны только
  // выбранные проекты — фильтр продолжает работать, но список не занимает пол-экрана.
  const projCollapsed = !!state.projListCollapsed;
  const selNames = projectsInScope.filter(p=>state.taskFilterProjectIds[selKey].has(p.id));
  projRow.innerHTML = `
    <button class="btn ghost small" id="projListToggle" title="${projCollapsed?'Показать все проекты':'Скрыть список проектов'}">${projCollapsed?'▸ Проекты ('+projectsInScope.length+')':'▾ Скрыть проекты'}</button>
    ${(!projCollapsed || noSelection) ? `<button class="cat-chip ${noSelection?'':'off'}" data-proj="all"><span class="dot" style="background:var(--ink-soft);"></span>Все${!personal && activeBlockId?' (в блоке)':''}</button>` : ''}
    ${(!projCollapsed || state.taskFilterNoProject[selKey]) ? `<button class="cat-chip ${state.taskFilterNoProject[selKey]?'':'off'}" data-proj="none"><span class="dot" style="background:transparent;border:1px solid var(--ink-soft);"></span>Без проекта</button>` : ''}
    ${(projCollapsed ? selNames : projectsInScope).map(projChip).join('')}
    <button class="btn ghost small" id="manageProjBtn">+ Проект</button>
    ${!personal?`<button class="btn ghost small" id="bulkSelectToggle">${state.bulkSelectMode?'✕ Отменить выбор':'☑️ Выбрать несколько'}</button>`:''}
  `;

  const blockChips = blockRow.querySelectorAll('[data-block]');
  blockChips.forEach(chip=>{
    chip.onclick=()=>{
      state.taskFilterBlockId[selKey] = chip.dataset.block==='__all__' ? null : chip.dataset.block;
      // Смена блока сбрасывает выбор конкретных проектов — начинаем каскад заново.
      state.taskFilterProjectIds[selKey] = new Set();
      state.taskFilterNoProject[selKey] = false;
      render();
    };
  });
  projRow.querySelector('#projListToggle').onclick=()=>{
    state.projListCollapsed = !state.projListCollapsed;
    try{ localStorage.setItem('lj:ui:projCollapsed', state.projListCollapsed?'1':'0'); }catch(e){}
    render();
  };
  const projAllBtn = projRow.querySelector('[data-proj="all"]');
  if(projAllBtn) projAllBtn.onclick=()=>{
    state.taskFilterProjectIds[selKey] = new Set();
    state.taskFilterNoProject[selKey] = false;
    render();
  };
  const projNoneBtn = projRow.querySelector('[data-proj="none"]');
  if(projNoneBtn) projNoneBtn.onclick=()=>{
    state.taskFilterNoProject[selKey] = !state.taskFilterNoProject[selKey];
    if(state.taskFilterNoProject[selKey]) state.taskFilterProjectIds[selKey] = new Set();
    render();
  };
  projRow.querySelectorAll('[data-proj]:not([data-proj="all"]):not([data-proj="none"])').forEach(chip=>{
    chip.onclick=()=>{
      const pid = chip.dataset.proj;
      if(state.taskFilterProjectIds[selKey].has(pid)) state.taskFilterProjectIds[selKey].delete(pid);
      else state.taskFilterProjectIds[selKey].add(pid);
      state.taskFilterNoProject[selKey] = false;
      render();
    };
  });
  projRow.querySelector('#manageProjBtn').onclick=()=>openProjectsModal(personal);
  const bulkToggleBtn = projRow.querySelector('#bulkSelectToggle');
  if(bulkToggleBtn) bulkToggleBtn.onclick=()=>{
    state.bulkSelectMode = !state.bulkSelectMode;
    state.bulkSelectedIds = new Set();
    render();
  };

  if(!personal){
    const fe = el.querySelector('#filtEmp');
    fe.onchange=(e)=>{ state.taskFilterEmployee=e.target.value; render(); };
    el.querySelectorAll('[data-view-mode]').forEach(b=>b.onclick=()=>{
      state.taskViewMode=b.dataset.viewMode;
      if(b.dataset.viewMode==='created') state.taskFilterEmployee='all';
      else state.taskFilterEmployee=state.currentUserId||'all';
      render();
    });
  }
  el.querySelector('#filtStatus').onchange=(e)=>{ state.taskFilterStatus=e.target.value; render(); };
  el.querySelector('#filtPriority').onchange=(e)=>{ state.taskFilterPriority=e.target.value; render(); };
  el.querySelectorAll('[data-sort-by]').forEach(b=>b.onclick=()=>{
    state.taskSortBy=b.dataset.sortBy;
    if(state.taskSortBy==='created' && !state.taskFilterCreatedDate) state.taskFilterCreatedDate = todayISO();
    render();
  });
  const createdDateInput = el.querySelector('#filtCreatedDate');
  if(createdDateInput) createdDateInput.onchange=(e)=>{ state.taskFilterCreatedDate = e.target.value || todayISO(); render(); };
  el.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{ state.taskFilterPeriod=b.dataset.period; render(); });
  const hideOverdueChip = el.querySelector('#hideOverdueChip');
  if(hideOverdueChip) hideOverdueChip.onclick=()=>{ state.taskHideOverdue = !state.taskHideOverdue; render(); };

  const viewMode = personal ? 'assigned' : state.taskViewMode;
  let list = tasksFor(personal).slice();
  if(!personal && viewMode==='created'){
    list = list.filter(t=>t.creatorId===state.currentUserId);
    if(state.taskFilterEmployee!=='all') list = list.filter(t=>t.assigneeId===state.taskFilterEmployee);
  } else if(!personal && state.taskFilterEmployee!=='all'){
    list = list.filter(t=>t.assigneeId===state.taskFilterEmployee);
  }
  if(state.taskFilterStatus!=='all') list = list.filter(t=>t.status===state.taskFilterStatus);
  if(state.taskFilterPriority!=='all') list = list.filter(t=>(t.priority||'med')===state.taskFilterPriority);
  if(state.taskHideOverdue){
    // Просроченная — дедлайн уже прошёл, а задача ещё не «Готово» (и не на проверке/отменена —
    // это отдельные статусы, для которых «просрочено» не так важно показывать/скрывать).
    const today = todayISO();
    list = list.filter(t=>!(t.deadline && t.deadline<today && t.status==='progress'));
  }
  if(state.taskSortBy==='created'){
    // Режим «Поставленные» — показываем только задачи, созданные ровно в выбранный день,
    // независимо от дедлайна (фильтр «Срок» в этом режиме не применяется).
    const pickedDate = state.taskFilterCreatedDate || todayISO();
    list = list.filter(t=>t.createdDate===pickedDate);
  } else if(state.taskFilterPeriod!=='all'){
    // «На этой неделе» / «В этом месяце» — по дедлайну, чтобы после планёрки было видно,
    // что именно согласовано и поставлено на ближайший срок.
    const now = new Date();
    let rangeStart, rangeEnd;
    if(state.taskFilterPeriod==='week'){
      const day = (now.getDay()+6)%7;
      const monday = new Date(now); monday.setDate(now.getDate()-day);
      const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
      rangeStart = dateToISO(monday); rangeEnd = dateToISO(sunday);
    } else {
      const first = new Date(now.getFullYear(), now.getMonth(), 1);
      const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
      rangeStart = dateToISO(first); rangeEnd = dateToISO(last);
    }
    list = list.filter(t=>t.deadline && t.deadline>=rangeStart && t.deadline<=rangeEnd);
  }
  if(state.taskFilterNoProject[selKey]){
    list = list.filter(t=>!t.projectId);
  } else if(state.taskFilterProjectIds[selKey].size){
    list = list.filter(t=>state.taskFilterProjectIds[selKey].has(t.projectId));
  } else if(!personal && activeBlockId){
    const projectIdsInBlock = new Set(projectsInBlock(activeBlockId).map(p=>p.id));
    list = list.filter(t=>t.blockId===activeBlockId || (t.projectId && projectIdsInBlock.has(t.projectId)));
  }

  const delegatedSummaryEl = el.querySelector('#delegatedSummary');
  if(delegatedSummaryEl){
    if(!personal && viewMode==='created'){
      const rootsForSummary = list.filter(t=>!t.parentId);
      const today = todayISO();
      const overdueCount = rootsForSummary.filter(t=>t.status==='progress' && t.deadline && t.deadline<today).length;
      const reviewCount = rootsForSummary.filter(t=>t.status==='review').length;
      const activeCount = rootsForSummary.filter(t=>t.status!=='done').length;
      delegatedSummaryEl.innerHTML = `
        <div class="ledger-summary" style="margin-bottom:16px;">
          <div class="sum-card"><div class="label">Поставлено (в работе)</div><div class="val mono" style="color:var(--indigo);">${activeCount}</div></div>
          <div class="sum-card spent"><div class="label">Просрочено</div><div class="val mono">${overdueCount}</div></div>
          <div class="sum-card issued"><div class="label">На проверке</div><div class="val mono">${reviewCount}</div></div>
        </div>
      `;
    } else {
      delegatedSummaryEl.innerHTML = '';
    }
  }

  const byId = {}; list.forEach(t=>byId[t.id]=t);
  const roots = list.filter(t=> !t.parentId || !byId[t.parentId]);
  // Сортировка списка: «Обычный порядок» — вручную (drag&drop), «По приоритету» — высокий → средний → низкий,
  // «По сроку» — по ближайшему дедлайну. Приоритет/срок применяются и к подзадачам, чтобы порядок был согласованным.
  const PRIORITY_RANK = {high:0, med:1, low:2};
  function taskComparator(a,b){
    if(state.taskSortBy==='priority'){
      return (PRIORITY_RANK[a.priority]??1) - (PRIORITY_RANK[b.priority]??1) || (a.deadline||'9999').localeCompare(b.deadline||'9999');
    } else if(state.taskSortBy==='deadline'){
      return (a.deadline||'9999').localeCompare(b.deadline||'9999');
    } else if(state.taskSortBy==='created'){
      return (PRIORITY_RANK[a.priority]??1) - (PRIORITY_RANK[b.priority]??1) || (a.deadline||'9999').localeCompare(b.deadline||'9999');
    }
    return ((a.sortOrder||0) - (b.sortOrder||0)) || (a.deadline||'9999').localeCompare(b.deadline||'9999');
  }
  roots.sort(taskComparator);

  function renderNode(t, depth){
    const children = list.filter(c=>c.parentId===t.id).sort(compareSiblings);
    const allTasks = tasksFor(personal);
    const orphanParent = (t.parentId && !byId[t.parentId]) ? allTasks.find(x=>x.id===t.parentId) : null;
    const collapsed = state.collapsedTaskIds.has(t.id);
    const html = taskItemHtml(t, personal, {depth, orphanParentName: orphanParent?orphanParent.title:null, childCount: children.length, collapsed, bulkSelect: state.bulkSelectMode && !personal, bulkSelected: state.bulkSelectedIds.has(t.id), dragEnabled: state.taskSortBy==='manual'});
    if(collapsed || !children.length) return html;
    return html + children.map(c=>renderNode(c, depth+1)).join('');
  }

  // Когда показаны все статусы разом, выполненные задачи (внутри ещё активного проекта) сворачиваем
  // по умолчанию — чтобы рабочая доска не превращалась в полотно текста из готового вперемешку с активным.
  // Если явно выбран фильтр "Готово" — показываем как обычно, без сворачивания.
  const splitDoneByDefault = state.taskFilterStatus==='all';
  const activeRoots = splitDoneByDefault ? roots.filter(t=>t.status!=='done') : roots;
  const doneRoots = splitDoneByDefault ? roots.filter(t=>t.status==='done') : [];

  const listEl = el.querySelector('#taskList');
  const activeHtml = activeRoots.length ? activeRoots.map(t=>renderNode(t,0)).join('') :
    (doneRoots.length ? '' : (state.taskSortBy==='created'
      ? `<div class="empty-state"><div class="big">Ничего не поставлено</div><p>В этот день (${fmtDate(state.taskFilterCreatedDate||todayISO())}) задач не создавалось — выберите другую дату выше</p></div>`
      : `<div class="empty-state"><div class="big">Пока нет задач</div><p>${projects.length?'Добавьте задачу в этот проект':'Добавьте первую задачу'}</p></div>`));
  const doneToggleHtml = doneRoots.length ? `
    <button type="button" class="btn ghost small" id="toggleDoneRoots" style="margin:10px 0;">
      ${state.taskBoardShowDone ? '▾' : '▸'} Выполнено (${doneRoots.length})
    </button>
    ${state.taskBoardShowDone ? doneRoots.map(t=>renderNode(t,0)).join('') : ''}
  ` : '';
  listEl.innerHTML = activeHtml + doneToggleHtml;
  const toggleBtn = document.getElementById('toggleDoneRoots');
  if(toggleBtn) toggleBtn.onclick = ()=>{ state.taskBoardShowDone = !state.taskBoardShowDone; render(); };
  wireTaskActions(listEl, personal);
  wireTaskDragReorder(listEl, personal, roots.map(t=>t.id));
  wireSubtaskMoves(listEl);

  const bulkBarEl = el.querySelector('#bulkActionBar');
  if(bulkBarEl){
    if(state.bulkSelectMode && !personal){
      const selectedTasks = roots.filter(t=>state.bulkSelectedIds.has(t.id));
      bulkBarEl.innerHTML = selectedTasks.length ? `
        <div class="ledger-summary" style="margin-bottom:14px;align-items:center;">
          <div class="sum-card"><div class="label">Выбрано задач</div><div class="val mono" style="color:var(--indigo);">${selectedTasks.length}</div></div>
          <select id="bulkMoveProject" style="width:auto;">
            <option value="">Переместить в проект…</option>
            <option value="__none__">Без проекта</option>
            ${projectsFor(false).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
          </select>
          <select id="bulkReassign" style="width:auto;">
            <option value="">Сменить исполнителя…</option>
            ${state.employees.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('')}
          </select>
          <button class="btn danger small" id="bulkDelete">Удалить выбранные</button>
        </div>
      ` : `<p class="subtitle" style="margin:0 0 14px;">Отметьте задачи галочкой слева, чтобы применить действие сразу к нескольким</p>`;
      listEl.querySelectorAll('[data-bulk-select]').forEach(cb=>{
        cb.onclick = e=>e.stopPropagation();
        cb.onchange = ()=>{
          const id = cb.dataset.bulkSelect;
          if(cb.checked) state.bulkSelectedIds.add(id); else state.bulkSelectedIds.delete(id);
          render();
        };
      });
      const moveSel = bulkBarEl.querySelector('#bulkMoveProject');
      if(moveSel) moveSel.onchange = async function retry(){
        const val = moveSel.value;
        if(!val) return;
        const newProjectId = val==='__none__' ? null : val;
        const editable = selectedTasks.filter(t=>canEditTask(t, false));
        const skipped = selectedTasks.length - editable.length;
        if(!editable.length){ toast('Ни одну из выбранных задач нельзя изменить — вы не постановщик'); return; }
        await refreshTasksFromServer(false);
        const before = state.tasksWork;
        state.tasksWork = before.map(t=>editable.some(e=>e.id===t.id)?{...t,projectId:newProjectId}:t);
        const ok = await saveTasksWork();
        if(!ok){ state.tasksWork = before; saveFailedToast(retry); return; }
        logAudit('bulk_move_project', `${editable.length} задач(и) → ${newProjectId?projectName(false,newProjectId):'без проекта'}`);
        toast(`Перемещено: ${editable.length}${skipped?`, пропущено (не вы постановщик): ${skipped}`:''}`);
        state.bulkSelectedIds = new Set();
        render();
      };
      const reassignSel = bulkBarEl.querySelector('#bulkReassign');
      if(reassignSel) reassignSel.onchange = async function retry(){
        const val = reassignSel.value;
        if(!val) return;
        const editable = selectedTasks.filter(t=>canEditTask(t, false));
        const skipped = selectedTasks.length - editable.length;
        if(!editable.length){ toast('Ни одну из выбранных задач нельзя изменить — вы не постановщик'); return; }
        await refreshTasksFromServer(false);
        const before = state.tasksWork;
        state.tasksWork = before.map(t=>editable.some(e=>e.id===t.id)?{...t,assigneeId:val}:t);
        const ok = await saveTasksWork();
        if(!ok){ state.tasksWork = before; saveFailedToast(retry); return; }
        logAudit('bulk_reassign', `${editable.length} задач(и) → ${empName(val)}`);
        toast(`Переназначено: ${editable.length}${skipped?`, пропущено (не вы постановщик): ${skipped}`:''}`);
        state.bulkSelectedIds = new Set();
        render();
      };
      const delBtn = bulkBarEl.querySelector('#bulkDelete');
      if(delBtn) delBtn.onclick = async ()=>{
        const deletable = selectedTasks.filter(t=>canDeleteTask(t, false));
        const skipped = selectedTasks.length - deletable.length;
        if(!deletable.length){ toast('Ни одну из выбранных задач нельзя удалить — вы не постановщик'); return; }
        if(!(await showConfirm(`Удалить ${deletable.length} задач(и)? Это затронет и их подзадачи.`, 'Удалить'))) return;
        await refreshTasksFromServer(false);
        const all = tasksFor(false);
        function idsToDelete(rootId){
          let ids=[rootId];
          all.filter(t=>t.parentId===rootId).forEach(c=>{ ids = ids.concat(idsToDelete(c.id)); });
          return ids;
        }
        let idsSet = [];
        deletable.forEach(t=>{ idsSet = idsSet.concat(idsToDelete(t.id)); });
        idsSet = [...new Set(idsSet)];
        for(const tid of idsSet){
          const doomed = all.find(x=>x.id===tid);
          if(doomed) await moveToTrash(false, 'task', doomed);
        }
        await saveBulkDelete(all, idsSet, deletable.length, skipped);
      };
    } else {
      bulkBarEl.innerHTML = '';
    }
  }
}

function wireEventLinks(el){
  el.querySelectorAll('[data-goto-event]').forEach(span=>{
    span.onclick=(e)=>{
      e.stopPropagation();
      const iso = span.dataset.gotoEvent;
      if(state.tab!=='calendar'){ state.tab='calendar'; render(); }
      closeModal();
      setTimeout(()=>openDayModal(iso), 30);
    };
  });
}
function wireTaskActions(el, personal){
  wireEventLinks(el);
  wireOverdueReasonInputs(el);
  wireReviewActions(el);
  wireTaskComments(el);
  el.querySelectorAll('[data-toggle-children]').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const id = btn.dataset.toggleChildren;
      if(state.collapsedTaskIds.has(id)) state.collapsedTaskIds.delete(id);
      else state.collapsedTaskIds.add(id);
      render();
    };
  });
  el.querySelectorAll('[data-done]').forEach(cb=>{
    cb.onclick = e=>e.stopPropagation();
    cb.onchange = async ()=>{
      const id = cb.dataset.done;
      const task = tasksFor(personal).find(t=>t.id===id);
      if(!canCompleteTask(task, personal)){
        cb.checked = !cb.checked;
        toast(whyCantComplete(task, personal));
        return;
      }
      if(cb.checked){
        const isOverdue = !!(task && task.deadline && task.deadline < todayISO());
        const result = await requestCompletionComment(task ? task.title : '', isOverdue);
        if(result===null){ cb.checked=false; return; }
        await saveDoneToggle(id, personal, result, cb, task);
      } else {
        await saveUndoneToggle(id, personal, cb);
      }
    };
  });
  el.querySelectorAll('[data-add-sub]').forEach(b=>b.onclick=()=>openTaskModal(null, personal, b.dataset.addSub));
  el.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.editTask;
    const t = tasksFor(personal).find(x=>x.id===id);
    if(!canEditTask(t, personal)){ toast(whyCantEdit(t)); return; }
    openTaskModal(id, personal);
  });
  el.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.delTask;
    const targetTask = tasksFor(personal).find(x=>x.id===id);
    const didDelete = await performTaskDeletion(personal, targetTask);
    if(!didDelete) return;
    render();
  });
}

// Перетаскивание задач верхнего уровня мышью/пальцем — задаёт ручной порядок (sortOrder).
// Подзадачи не перетаскиваются — они остаются привязаны к своему родителю.
function wireTaskDragReorder(listEl, personal, rootIdsInOrder){
  let dragId = null;
  let dragEl = null;
  let targetId = null;
  let targetPos = null; // 'top' | 'bottom'

  function clearIndicators(){
    listEl.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(x=>{
      x.classList.remove('drag-over-top','drag-over-bottom');
    });
  }

  listEl.querySelectorAll('[data-drag-handle]').forEach(handle=>{
    handle.onpointerdown = (e)=>{
      if(e.button !== undefined && e.button !== 0) return;
      dragId = handle.dataset.dragHandle;
      dragEl = listEl.querySelector(`[data-task-row="${dragId}"][data-depth="0"]`);
      if(!dragEl) return;
      e.preventDefault();
      dragEl.classList.add('dragging');
      targetId = null; targetPos = null;

      const onMove = (ev)=>{
        const rootEls = Array.from(listEl.querySelectorAll('[data-depth="0"]')).filter(x=>x!==dragEl);
        let found = null, foundPos = null;
        for(const rEl of rootEls){
          const box = rEl.getBoundingClientRect();
          if(ev.clientY >= box.top && ev.clientY <= box.bottom){
            found = rEl.dataset.taskRow;
            foundPos = (ev.clientY - box.top) < box.height/2 ? 'top' : 'bottom';
            break;
          }
        }
        clearIndicators();
        targetId = found; targetPos = foundPos;
        if(found){
          const el2 = listEl.querySelector(`[data-task-row="${found}"][data-depth="0"]`);
          if(el2) el2.classList.add(foundPos==='top' ? 'drag-over-top' : 'drag-over-bottom');
        }
      };

      const onUp = async ()=>{
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        dragEl.classList.remove('dragging');
        clearIndicators();
        if(targetId && targetId!==dragId){
          let order = rootIdsInOrder.filter(id=>id!==dragId);
          const idx = order.indexOf(targetId);
          const insertAt = targetPos==='top' ? idx : idx+1;
          order.splice(insertAt, 0, dragId);
          // Перетаскивание для смены порядка тоже перезаписывает весь список задач целиком —
          // подтягиваем свежую версию перед сохранением (см. refreshTasksFromServer), иначе с телефона,
          // который долго был открыт на старой странице, можно незаметно затереть чужие изменения.
          async function saveReorder(){
            await refreshTasksFromServer(personal);
            const before = tasksFor(personal);
            const orderMap = {}; order.forEach((id,i)=>{ orderMap[id]=(i+1)*10; });
            const updated = before.map(t=> orderMap[t.id]!==undefined ? {...t, sortOrder: orderMap[t.id]} : t);
            setTasksFor(personal, updated);
            const ok = await persistTasksFor(personal);
            if(!ok){ setTasksFor(personal, before); saveFailedToast(saveReorder); }
            render();
          }
          await saveReorder();
        }
        dragId = null; dragEl = null; targetId = null; targetPos = null;
      };

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    };
  });
}

function renderPersonalTasks(el){
  if(!hasRole('Руководитель','Ассистент')){
    el.innerHTML = accessDeniedScreen('Личные задачи доступны только Руководителю и Ассистенту.');
    return;

  el.innerHTML = `

  renderTaskBoard(el.querySelector('#persBoard'), true);
}

function openTaskModal(id, personal, presetParentId, presetTitle, onDone, opts){

  // шаги становятся подзадачами (их можно поправить кнопкой «Редактировать подзадачи»).

  const draftSubs = checklist ? (checklist.items||[]).map(t=>({title:t, description:'—', assigneeId:'', deadline:'', deadlineTime:''})) : null;
  const source = tasksFor(personal);
  const existing = id ? source.find(t=>t.id===id) : null;
  const parentId = existing ? (existing.parentId||null) : (presetParentId||null);
  const parentTask = parentId ? source.find(x=>x.id===parentId) : null;
  // Упрощённая форма: только для новых задач из «простого» блока или для уже упрощённых задач.
  let simpleMode = false;
  if(!personal && !parentId && !checklist){
    if(existing) simpleMode = !!existing.simple && !opts.extended && isSimpleBlock(state.blocksWork.find(b=>b.id===existing.blockId));
    else if(opts.simple===true) simpleMode = simpleBlocks().length>0;
    else if(opts.simple===undefined){ const cb = contextSimpleBlockId(); if(cb){ simpleMode = true; opts.blockId = cb; } }
  }
  if(simpleMode && !existing){
    const bid = opts.blockId || (simpleBlocks()[0]||{}).id;
    if(bid){ opts.blockId = bid; opts.projectId = ensureSimpleProject(bid).id; }

  const allProjects = projectsFor(personal);
  const selKey = personal?'personal':'work';
  const purchasesProject = allProjects.find(p=>isPurchasesProjectName(p.name));

  const currentProject = existing && existing.projectId ? allProjects.find(p=>p.id===existing.projectId) : null;
  const projects = (currentProject && !activeProjects.some(p=>p.id===currentProject.id))
    ? activeProjects.concat([currentProject])

  const soleSelectedProjectId = state.taskFilterProjectIds[selKey].size===1 ? Array.from(state.taskFilterProjectIds[selKey])[0] : null;
  const initialProjectId = parentId
    ? (parentTask ? parentTask.projectId : null)

  // выбранного проекта (например, из фильтра доски или как подзадача) — блок этого проекта.
  const initialProjectForBlock = initialProjectId ? allProjects.find(p=>p.id===initialProjectId) : null;

          <div class="field"><label>Магазин (необязательно)</label><input id="t_purchase_store" value="${existing?escapeHtml(existing.purchaseStore||''):''}" placeholder="Например: Леонардо"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Кто поставил задачу *</label>
            <select id="t_creator">
              <option value="">— выберите —</option>
              ${state.employees.map(e=>{

    </div>`;
  document.getElementById('cancelTask').onclick=closeModal;

  // Несколько ссылок к задаче: каждая строка — своё поле, можно добавлять и убирать.
  // Последнюю оставшуюся строку не удаляем целиком (чтобы поле не пропадало из формы), а просто очищаем.
  function wireLinkRows(){
    document.querySelectorAll('.link-remove-btn').forEach(btn=>{
      btn.onclick=()=>{
        const row = btn.closest('.link-row');

  // Текущие значения главной задачи — от них «наследуются» пустые поля подзадач.
  function mainFormValues(){
    const a = document.getElementById('t_assignee');
    return {
      assigneeId: a ? a.value : '',
      deadline: document.getElementById('t_deadline').value || '',

    // например, задача создаётся в контексте уже выбранного на доске проекта).

  // Длинные тексты (описание, отчёт «Что сделано?») показываем целиком: поле растёт по содержимому.
  function autosizeTextareas(){

  const repeatEl = document.getElementById('t_repeat');
