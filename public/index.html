          <div class="field"><label>Начало</label><input type="time" id="f_start" value="${existing?existing.startTime||'':''}"></div>
          <div class="field"><label>Окончание</label><input type="time" id="f_end" value="${existing?existing.endTime||'':''}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Тип</label>
            <select id="f_cat">
              ${Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}" ${existing&&existing.category===k?'selected':''}>${v}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Формат</label>
            <select id="f_format">
              <option value="offline" ${initialFormat==='offline'?'selected':''}>Оффлайн</option>
              <option value="online" ${initialFormat==='online'?'selected':''}>Онлайн</option>
            </select>
          </div>
        </div>
        <div class="field" id="f_location_wrap" style="${initialFormat==='online'?'display:none;':''}">
          <label>Местоположение</label>
          <input id="f_location" value="${existing?escapeHtml(existing.location||''):''}" placeholder="Например: Мастерская">
        </div>
        <div class="field" id="f_link_wrap" style="${initialFormat==='offline'?'display:none;':''}">
          <label>Ссылка на созвон</label>
          <input id="f_link" value="${existing?escapeHtml(existing.link||''):''}" placeholder="https://...">
        </div>
        <div class="field"><label>Дополнительная ссылка (необязательно)</label><input id="f_extra_link" type="text" value="${existing?escapeHtml(existing.extraLink||''):''}" placeholder="Например: резюме кандидата, отчёт, документ"></div>
        <div class="field"><label>Участники (можно выбрать несколько)</label>
          <div class="emp-checklist" id="f_emp_list">
            ${state.employees.map(e=>`
              <label>
                <input type="checkbox" data-emp-cb value="${e.id}" ${initialEmpIds.includes(e.id)?'checked':''}>
                ${escapeHtml(e.name)}${e.role?' — '+escapeHtml(e.role):''}
              </label>
            `).join('') || `<span class="subtitle" style="margin:0;">Сначала добавьте сотрудников</span>`}
          </div>
        </div>
        <div class="field" id="f_manual_wrap" style="${initialHasManagerHostess?'':'display:none;'}">
          <label>Уточните имена (Менеджер / Хостес)</label>
          <input id="f_manual_names" value="${existing?escapeHtml(existing.manualNames||''):''}" placeholder="Например: Оля, Настя">
        </div>
        <div class="field"><label>Заметка</label><textarea id="f_notes" rows="2">${existing?escapeHtml(existing.notes||''):''}</textarea></div>
        ${!existing ? `
        <div class="field"><label>Повтор</label>
          <select id="f_repeat">
            <option value="none">Не повторять</option>
            <option value="daily">Каждый день</option>
            <option value="weekly">Каждую неделю</option>
            <option value="monthly">Каждый месяц</option>
            <option value="yearly">Каждый год</option>
          </select>
        </div>
        <div class="field" id="f_weekdays_wrap" style="display:none;">
          <label>Дни недели</label>
          <div class="cat-filters" id="f_weekdays">
            ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>`<button type="button" class="cat-chip off" data-wd="${i+1}">${d}</button>`).join('')}
          </div>
        </div>
        <div class="field" id="f_repeat_until_wrap" style="display:none;">
          <label>Повторять до</label>
          <input type="date" id="f_repeat_until">
        </div>
        ` : (existing.seriesId ? `<div class="note">🔁 Это событие — часть повторяющейся серии. При сохранении можно применить изменения только к этой дате или сразу ко всей серии.</div>` : '')}
        <div class="modal-actions">
          <button class="btn ghost" id="cancelEvt">Отмена</button>
          <button class="btn" id="saveEvt">Сохранить</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelEvt').onclick=closeModal;
  document.getElementById('ov').onclick=(ev)=>{ if(ev.target.id==='ov') closeModal(); };
  document.getElementById('f_format').onchange=(e)=>{
    const isOnline = e.target.value==='online';
    document.getElementById('f_location_wrap').style.display = isOnline?'none':'';
    document.getElementById('f_link_wrap').style.display = isOnline?'':'none';
  };
  document.getElementById('f_cat').onchange=(e)=>{
    document.getElementById('f_time_wrap').style.display = isAllDayCategory(e.target.value)?'none':'';
  };
  const empListEl = document.getElementById('f_emp_list');
  const getSelectedEmpIds = ()=> Array.from(empListEl.querySelectorAll('[data-emp-cb]:checked')).map(cb=>cb.value);
  const refreshManualWrap = ()=>{
    const selected = getSelectedEmpIds();
    const hasMgrHost = selected.some(eid=>{
      const e = state.employees.find(x=>x.id===eid);
      return e && (e.role==='Менеджер' || e.role==='Хостес');
    });
    document.getElementById('f_manual_wrap').style.display = hasMgrHost?'':'none';
  };
  empListEl.querySelectorAll('[data-emp-cb]').forEach(cb=>cb.onchange=refreshManualWrap);

  const repeatEl = document.getElementById('f_repeat');
  if(repeatEl){
    const weekdaysWrap = document.getElementById('f_weekdays_wrap');
    const untilWrap = document.getElementById('f_repeat_until_wrap');
    document.querySelectorAll('#f_weekdays .cat-chip').forEach(chip=>{
      chip.onclick=()=>chip.classList.toggle('off');
    });
    repeatEl.onchange=(e)=>{
      const val = e.target.value;
      if(val==='none'){ weekdaysWrap.style.display='none'; untilWrap.style.display='none'; return; }
      untilWrap.style.display='';
      if(val==='daily' || val==='weekly'){
        weekdaysWrap.style.display='';
        const startDate = document.getElementById('f_date').value || todayISO();
        const startWdRaw = new Date(startDate+'T00:00:00').getDay();
        const startWd = startWdRaw===0?7:startWdRaw;
        document.querySelectorAll('#f_weekdays .cat-chip').forEach(chip=>{
          const wd = parseInt(chip.dataset.wd, 10);
          if(val==='daily') chip.classList.remove('off');
          else chip.classList.toggle('off', wd!==startWd);
        });
      } else {
        weekdaysWrap.style.display='none';
      }
      const untilInput = document.getElementById('f_repeat_until');
      if(!untilInput.value){
        const startDate = document.getElementById('f_date').value || todayISO();
        const d = new Date(startDate+'T00:00:00'); d.setMonth(d.getMonth()+3);
        untilInput.value = dateToISO(d);
      }
    };
  }

  document.getElementById('saveEvt').onclick=async ()=>{
    const title = document.getElementById('f_title').value.trim();
    if(!title){ toast('Укажите название'); return; }
    const category = document.getElementById('f_cat').value;
    const newPersonal = category==='personal';
    if(newPersonal && !personalAccessAllowed()){
      toast('Категория «Личные дела Карины» доступна только Руководителю и Ассистенту — войдите через «🙋 Кто я?»');
      return;
    }
    const emp = getSelectedEmpIds();
    const format = document.getElementById('f_format').value;
    const hasMgrHost = emp.some(eid=>{
      const e = state.employees.find(x=>x.id===eid);
      return e && (e.role==='Менеджер' || e.role==='Хостес');
    });
    const data = {
      id: existing?existing.id:uid(),
      title,
      date: document.getElementById('f_date').value || todayISO(),
      startTime: isAllDayCategory(category) ? '' : document.getElementById('f_start').value,
      endTime: isAllDayCategory(category) ? '' : document.getElementById('f_end').value,
      category,
      format,
      location: format==='offline' ? document.getElementById('f_location').value.trim() : '',
      link: format==='online' ? document.getElementById('f_link').value.trim() : '',
      extraLink: (()=>{
        const raw = document.getElementById('f_extra_link').value.trim();
        if(!raw) return '';
        return /^https?:\/\//i.test(raw) ? raw : 'https://'+raw;
      })(),
      employeeIds: emp,
      manualNames: hasMgrHost ? document.getElementById('f_manual_names').value.trim() : '',
      notes: document.getElementById('f_notes').value.trim(),
      seriesId: existing ? (existing.seriesId||null) : null,
    };
    const repeatType = repeatEl ? repeatEl.value : 'none';
    if(!existing && repeatType!=='none'){
      const untilVal = document.getElementById('f_repeat_until').value || data.date;
      const weekdaySet = new Set(Array.from(document.querySelectorAll('#f_weekdays .cat-chip:not(.off)')).map(c=>parseInt(c.dataset.wd,10)));
      let dates = generateRecurrenceDates(data.date, repeatType, weekdaySet, untilVal, 300);
      if(!dates.length) dates = [data.date];
      const seriesId = uid();
      const newEvts = dates.map(d=>({...data, id: uid()+d, date: d, seriesId}));
      const before = eventsFor(newPersonal);
      setEventsFor(newPersonal, before.concat(newEvts));
      const ok = await persistEventsFor(newPersonal);
      if(!ok){ setEventsFor(newPersonal, before); saveFailedToast(); return; }
      toast(`Добавлено событий: ${dates.length}`);
      closeModal(); render();
      return;
    } else if(existing){
      if(existingPersonal !== newPersonal){
        // moved between personal/work — remove from old store, add to new
        const beforeOld = eventsFor(existingPersonal);
        setEventsFor(existingPersonal, beforeOld.filter(e=>e.id!==existing.id));
        const ok1 = await persistEventsFor(existingPersonal);
        if(!ok1){ setEventsFor(existingPersonal, beforeOld); saveFailedToast(); return; }
        const beforeNew = eventsFor(newPersonal);
        setEventsFor(newPersonal, beforeNew.concat([data]));
        const ok2 = await persistEventsFor(newPersonal);
        if(!ok2){
          setEventsFor(newPersonal, beforeNew);
          setEventsFor(existingPersonal, beforeOld);
          await persistEventsFor(existingPersonal);
          saveFailedToast();
          return;
        }
        toast('Событие сохранено');
      } else if(existing.seriesId){
        const choice = await showSeriesEditChoice();
        if(!choice) return;
        const before = eventsFor(newPersonal);
        if(choice==='one'){
          setEventsFor(newPersonal, before.map(e=>e.id===existing.id?data:e));
        } else {
          setEventsFor(newPersonal, before.map(e=>{
            if(e.seriesId===existing.seriesId){
              return {...data, id:e.id, date:e.date, seriesId:e.seriesId};
            }
            return e;
          }));
        }
        const ok = await persistEventsFor(newPersonal);
        if(!ok){ setEventsFor(newPersonal, before); saveFailedToast(); return; }
        toast(choice==='series' ? 'Изменения применены ко всей серии' : 'Событие сохранено');
      } else {
        const before = eventsFor(newPersonal);
        setEventsFor(newPersonal, before.map(e=>e.id===existing.id?data:e));
        const ok = await persistEventsFor(newPersonal);
        if(!ok){ setEventsFor(newPersonal, before); saveFailedToast(); return; }
        toast('Событие сохранено');
      }
    } else {
      const before = eventsFor(newPersonal);
      setEventsFor(newPersonal, before.concat([data]));
      const ok = await persistEventsFor(newPersonal);
      if(!ok){ setEventsFor(newPersonal, before); saveFailedToast(); return; }
      toast('Событие сохранено');
    }
    closeModal(); render();
  };
}

  };
  const checklistsBtn = document.getElementById('checklistsBtn');
  if(checklistsBtn) checklistsBtn.onclick=()=>openChecklistsModal();
  const ideasBtn = document.getElementById('ideasBtn');
  if(ideasBtn) ideasBtn.onclick=()=>openQuickIdeasModal();
  if(state.taskSubtab==='work') renderTaskBoard(root.querySelector('#taskBody'), false);
  else if(state.taskSubtab==='analytics') renderTaskAnalytics(root.querySelector('#taskBody'));
  else if(state.taskSubtab==='report') renderTaskReport(root.querySelector('#taskBody'));
  else renderPersonalTasks(root.querySelector('#taskBody'));
}

function linkedEventBadge(t){
  if(!t.eventId) return '';
  const ev = allVisibleEvents().find(e=>e.id===t.eventId);
  if(!ev){
    if(!personalAccessAllowed()) return `<span>🔗 🔒 (доступно только Руководителю/Ассистенту)</span>`;
    return `<span style="color:var(--brick);">🔗 мероприятие удалено</span>`;
  }
  return `<span data-goto-event="${ev.date}" style="cursor:pointer;text-decoration:underline;color:var(--indigo);">🔗 ${escapeHtml(ev.title)} · ${fmtDate(ev.date)}</span>`;
}

function taskItemHtml(t, personal, opts){
  opts = opts || {};
  const depth = opts.depth||0;
  const childCount = opts.childCount||0;
  const collapsed = !!opts.collapsed;
  const overdue = t.deadline && t.deadline < todayISO() && t.status==='progress';
  const canComplete = canCompleteTask(t, personal);
  const isChecked = t.status==='review' || t.status==='done';
  const checkInteractive = t.status==='done' ? false : canComplete;
  const checkTitle = t.status==='done' ? 'Задача принята постановщиком' : (canComplete ? (t.status==='review' ? 'Отменить и вернуть в работу' : 'Отметить выполненной') : whyCantComplete(t));
  return `
    <div class="item ${t.status==='done'?'is-done':''}" data-task-row="${t.id}" data-depth="${depth}" style="${depth>0?`margin-left:${depth*24}px;border-left:2px solid var(--paper-line);`:''}">
      ${depth===0?`<span class="drag-handle" data-drag-handle="${t.id}" title="Перетащить, чтобы изменить порядок">⠿</span>`:''}
      <input type="checkbox" class="task-check${checkInteractive?'':' task-check-locked'}" data-done="${t.id}" ${isChecked?'checked':''} ${checkInteractive?'':'disabled'} title="${checkTitle}">
      <div class="main">
        <div class="title">
          ${childCount>0?`<button type="button" class="task-toggle" data-toggle-children="${t.id}" title="${collapsed?'Показать':'Скрыть'} подзадачи">${collapsed?'▸':'▾'}</button>`:''}
          ${depth>0?'↳ ':''}${escapeHtml(t.title)}
          ${childCount>0?`<span class="subtitle" style="font-size:11px;">(${childCount})</span>`:''}
        </div>
        <div class="meta">
          <span class="badge ${t.status||'progress'}">${STATUSES[t.status] || STATUSES.progress}</span>
          <span class="badge prio-${t.priority==='high'?'high':t.priority==='med'?'med':'low'}">${PRIORITIES[t.priority]}</span>
          ${t.projectId?`<span>📁 ${escapeHtml(projectName(personal,t.projectId))}</span>`:''}
          ${opts.orphanParentName?`<span>⤷ подзадача: ${escapeHtml(opts.orphanParentName)}</span>`:''}
          ${t.assigneeId?`<span>Исполнитель: ${escapeHtml(empName(t.assigneeId))}</span>`:''}
          ${t.creatorId?`<span>Поставил: ${escapeHtml(empName(t.creatorId))}</span>`:''}
          ${t.createdDate?`<span>от ${fmtDate(t.createdDate)}</span>`:''}
          ${t.deadline?`<span style="${overdue?'color:var(--brick);font-weight:600;':''}">до ${fmtDate(t.deadline)}${overdue?' · просрочено':''}</span>`:''}
          ${t.seriesId?`<span>🔁 повтор</span>`:''}
          ${t.purchaseStore?`<span>🏬 ${escapeHtml(t.purchaseStore)}</span>`:''}
          ${t.purchaseAmount?`<span>💰 ${fmtMoney(t.purchaseAmount)}</span>`:''}
          ${t.purchaseExpenseId?`<span style="color:var(--teal);">💳 расход добавлен</span>`:''}
          ${t.link?`<span>🔗 <a href="${escapeHtml(t.link)}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;" onclick="event.stopPropagation()">Ссылка</a></span>`:''}
          ${linkedEventBadge(t)}

        ${t.description?`<div class="desc">${linkifyEscaped(t.description)}</div>`:''}
        ${(t.status==='review'||t.status==='done') && t.completionComment?`<div class="desc" style="color:var(--teal);">✅ ${linkifyEscaped(t.completionComment)}</div>`:''}
        ${t.completionLink?`<div class="desc">🔗 <a href="${escapeHtml(t.completionLink)}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;" onclick="event.stopPropagation()">Ссылка на результат</a></div>`:''}

        ${t.status==='review' ? (canReviewTask(t,personal)
          ? `<div class="review-box">
              <div class="review-label">🔍 Проверьте и решите, что делать с задачей</div>
              <div style="display:flex;gap:8px;">
                <button type="button" class="btn small" data-approve-task="${t.id}">✅ Принять</button>
                <button type="button" class="btn ghost small" data-rework-task="${t.id}">↩️ На доработку</button>

          : `<div class="review-box"><div class="review-label">🔍 Ожидает проверки — ${t.creatorId?escapeHtml(empName(t.creatorId)):'постановщик'}</div></div>`

function renderTaskBoard(el, personal){
  const selKey = personal?'personal':'work';
  const projects = activeProjectsFor(personal);
  let selected = state.selectedProject[selKey];
  // Если выбранный проект (или блок) только что стал завершённым и уехал в архив — сбрасываем на "Все"
  if(selected && typeof selected==='string' && selected.startsWith('block:')){
    const bid = selected.slice(6);
    if(!activeBlocksFor().some(b=>b.id===bid)){ selected='all'; state.selectedProject[selKey]='all'; }
  } else if(selected!=='all' && selected!=='none' && !projects.some(p=>p.id===selected)){
    selected = 'all';
    state.selectedProject[selKey] = 'all';
  }

  el.innerHTML = `
    <div class="cat-filters" id="blockRow" style="display:none;"></div>
    <div class="cat-filters" id="projRow"></div>
    <div class="filters">
      ${!personal?`<select id="filtEmp">
        <option value="all" ${state.taskFilterEmployee==='all'?'selected':''}>Все сотрудники</option>
        ${state.employees.map(e=>`<option value="${e.id}" ${state.taskFilterEmployee===e.id?'selected':''}>${e.id===state.currentUserId?'🙋 ':''}${escapeHtml(e.name)}</option>`).join('')}
      </select>`:''}
      <select id="filtStatus">
        <option value="all" ${state.taskFilterStatus==='all'?'selected':''}>Любой статус</option>
        ${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}" ${state.taskFilterStatus===k?'selected':''}>${v}</option>`).join('')}
      </select>
    </div>
    <div class="item-list" id="taskList"></div>
  `;

  const projRow = el.querySelector('#projRow');
  const blockRow = el.querySelector('#blockRow');
  function projChip(p){
    return `<button class="cat-chip ${selected===p.id?'':'off'}" data-proj="${p.id}"><span class="dot" style="background:var(--indigo);"></span>${escapeHtml(p.name)}</button>`;
  }
  if(!personal && activeBlocksFor().length){
    blockRow.style.display = '';
    blockRow.className = 'cat-filters block-row';
    blockRow.innerHTML = `
      <span class="subtitle" style="margin:0 2px 0 0;font-weight:700;color:var(--rose);">📦 Блоки:</span>
      ${activeBlocksFor().map(b=>`<button class="cat-chip ${selected==='block:'+b.id?'':'off'}" data-proj="block:${b.id}" style="border-color:var(--rose);"><span class="dot" style="background:var(--rose);"></span>${escapeHtml(b.name)}</button>`).join('')}
    `;
  } else {
    blockRow.style.display = 'none';
    blockRow.innerHTML = '';
  }
  const projChipsHtml = projects.map(projChip).join('');
  projRow.innerHTML = `
    <button class="cat-chip ${selected==='all'?'':'off'}" data-proj="all"><span class="dot" style="background:var(--ink-soft);"></span>Все</button>
    <button class="cat-chip ${selected==='none'?'':'off'}" data-proj="none"><span class="dot" style="background:transparent;border:1px solid var(--ink-soft);"></span>Без проекта</button>
    ${projChipsHtml}
    <button class="btn ghost small" id="manageProjBtn">+ Проект</button>
  `;
  blockRow.querySelectorAll('[data-proj]').forEach(chip=>{
    chip.onclick=()=>{ state.selectedProject[selKey]=chip.dataset.proj; render(); };
  });
  projRow.querySelectorAll('[data-proj]').forEach(chip=>{
    chip.onclick=()=>{ state.selectedProject[selKey]=chip.dataset.proj; render(); };
  });
  projRow.querySelector('#manageProjBtn').onclick=()=>openProjectsModal(personal);

  if(!personal){
    const fe = el.querySelector('#filtEmp');
    fe.onchange=(e)=>{ state.taskFilterEmployee=e.target.value; render(); };
  }
  el.querySelector('#filtStatus').onchange=(e)=>{ state.taskFilterStatus=e.target.value; render(); };

  let list = tasksFor(personal).slice();
  if(!personal && state.taskFilterEmployee!=='all') list = list.filter(t=>t.assigneeId===state.taskFilterEmployee);
  if(state.taskFilterStatus!=='all') list = list.filter(t=>t.status===state.taskFilterStatus);
  if(selected==='none') list = list.filter(t=>!t.projectId);
  else if(typeof selected==='string' && selected.startsWith('block:')){
    const projectIdsInBlock = projectsInBlock(selected.slice(6)).map(p=>p.id);
    list = list.filter(t=>projectIdsInBlock.includes(t.projectId));
  }
  else if(selected!=='all') list = list.filter(t=>t.projectId===selected);

  const byId = {}; list.forEach(t=>byId[t.id]=t);
  const roots = list.filter(t=> !t.parentId || !byId[t.parentId]);
  roots.sort((a,b)=> ((a.sortOrder||0) - (b.sortOrder||0)) || (a.deadline||'9999').localeCompare(b.deadline||'9999'));

  function renderNode(t, depth){
    const children = list.filter(c=>c.parentId===t.id).sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));
    const allTasks = tasksFor(personal);
    const orphanParent = (t.parentId && !byId[t.parentId]) ? allTasks.find(x=>x.id===t.parentId) : null;
    const collapsed = state.collapsedTaskIds.has(t.id);
    const html = taskItemHtml(t, personal, {depth, orphanParentName: orphanParent?orphanParent.title:null, childCount: children.length, collapsed});
    if(collapsed || !children.length) return html;
    return html + children.map(c=>renderNode(c, depth+1)).join('');
  }

  // Когда показаны все статусы разом, выполненные задачи (внутри ещё активного проекта) сворачиваем
  // по умолчанию — чтобы рабочая доска не превращалась в полотно текста из готового вперемешку с активным.
  // Если явно выбран фильтр "Готово" — показываем как обычно, без сворачивания.
  const splitDoneByDefault = state.taskFilterStatus==='all';
  const activeRoots = splitDoneByDefault ? roots.filter(t=>t.status!=='done') : roots;
  const doneRoots = splitDoneByDefault ? roots.filter(t=>t.status==='done') : [];

  const listEl = el.querySelector('#taskList');
  const activeHtml = activeRoots.length ? activeRoots.map(t=>renderNode(t,0)).join('') :
    (doneRoots.length ? '' : `<div class="empty-state"><div class="big">Пока нет задач</div><p>${projects.length?'Добавьте задачу в этот проект':'Добавьте первую задачу'}</p></div>`);
  const doneToggleHtml = doneRoots.length ? `
    <button type="button" class="btn ghost small" id="toggleDoneRoots" style="margin:10px 0;">
      ${state.taskBoardShowDone ? '▾' : '▸'} Выполнено (${doneRoots.length})
    </button>
    ${state.taskBoardShowDone ? doneRoots.map(t=>renderNode(t,0)).join('') : ''}
  ` : '';
  listEl.innerHTML = activeHtml + doneToggleHtml;
  const toggleBtn = document.getElementById('toggleDoneRoots');
  if(toggleBtn) toggleBtn.onclick = ()=>{ state.taskBoardShowDone = !state.taskBoardShowDone; render(); };
  wireTaskActions(listEl, personal);
  wireTaskDragReorder(listEl, personal, roots.map(t=>t.id));
}

function wireTaskActions(el, personal){
  wireEventLinks(el);
  wireOverdueReasonInputs(el);
  wireReviewActions(el);
  el.querySelectorAll('[data-toggle-children]').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const id = btn.dataset.toggleChildren;
      if(state.collapsedTaskIds.has(id)) state.collapsedTaskIds.delete(id);
      else state.collapsedTaskIds.add(id);
      render();
    };
  });
  el.querySelectorAll('[data-done]').forEach(cb=>{
    cb.onclick = e=>e.stopPropagation();
    cb.onchange = async ()=>{
      const id = cb.dataset.done;
      const task = tasksFor(personal).find(t=>t.id===id);
      if(!canCompleteTask(task, personal)){
        cb.checked = !cb.checked;
        toast(state.currentUserId ? `Отметить может только исполнитель${task&&task.assigneeId?': '+empName(task.assigneeId):''}` : 'Сначала выберите «Кто я?» в шапке');
        return;
      }
      if(cb.checked){
        const result = await requestCompletionComment(task ? task.title : '');
        if(result===null){ cb.checked=false; return; }
        const fresh = await refreshTasksFromServer(personal);
        const before = fresh || tasksFor(personal);
        const updated = before.map(t=>t.id===id?withStatusReview(t,result.comment,result.link):t);
        setTasksFor(personal, updated);
        const ok = await persistTasksFor(personal);
        if(!ok){ setTasksFor(personal, before); cb.checked=false; saveFailedToast(); return; }
        render();
      } else {
        const fresh = await refreshTasksFromServer(personal);
        const before = fresh || tasksFor(personal);
        setTasksFor(personal, before.map(t=>t.id===id?withStatus(t,'progress'):t));
        const ok = await persistTasksFor(personal);
        if(!ok){ setTasksFor(personal, before); cb.checked=true; saveFailedToast(); return; }
        render();
      }
    };
  });
  el.querySelectorAll('[data-add-sub]').forEach(b=>b.onclick=()=>openTaskModal(null, personal, b.dataset.addSub));
  el.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.editTask;
    const t = tasksFor(personal).find(x=>x.id===id);
    if(!canEditTask(t, personal)){ toast(whyCantEdit(t)); return; }
    openTaskModal(id, personal);
  });
  el.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.delTask;
    const targetTask = tasksFor(personal).find(x=>x.id===id);
    const didDelete = await performTaskDeletion(personal, targetTask);
    if(!didDelete) return;
    render();
  });
}

// Перетаскивание задач верхнего уровня мышью/пальцем — задаёт ручной порядок (sortOrder).
// Подзадачи не перетаскиваются — они остаются привязаны к своему родителю.
function wireTaskDragReorder(listEl, personal, rootIdsInOrder){
  let dragId = null;
  let dragEl = null;
  let targetId = null;
  let targetPos = null; // 'top' | 'bottom'

  function clearIndicators(){
    listEl.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(x=>{
      x.classList.remove('drag-over-top','drag-over-bottom');
    });
  }

  listEl.querySelectorAll('[data-drag-handle]').forEach(handle=>{
    handle.onpointerdown = (e)=>{
      if(e.button !== undefined && e.button !== 0) return;
      dragId = handle.dataset.dragHandle;
      dragEl = listEl.querySelector(`[data-task-row="${dragId}"][data-depth="0"]`);
      if(!dragEl) return;
      e.preventDefault();
      dragEl.classList.add('dragging');
      targetId = null; targetPos = null;

      const onMove = (ev)=>{
        const rootEls = Array.from(listEl.querySelectorAll('[data-depth="0"]')).filter(x=>x!==dragEl);
        let found = null, foundPos = null;
        for(const rEl of rootEls){
          const box = rEl.getBoundingClientRect();
          if(ev.clientY >= box.top && ev.clientY <= box.bottom){
            found = rEl.dataset.taskRow;
            foundPos = (ev.clientY - box.top) < box.height/2 ? 'top' : 'bottom';
            break;
          }
        }
        clearIndicators();
        targetId = found; targetPos = foundPos;
        if(found){
          const el2 = listEl.querySelector(`[data-task-row="${found}"][data-depth="0"]`);
          if(el2) el2.classList.add(foundPos==='top' ? 'drag-over-top' : 'drag-over-bottom');
        }
      };

      const onUp = async ()=>{
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        dragEl.classList.remove('dragging');
        clearIndicators();
        if(targetId && targetId!==dragId){
          let order = rootIdsInOrder.filter(id=>id!==dragId);
          const idx = order.indexOf(targetId);
          const insertAt = targetPos==='top' ? idx : idx+1;
          order.splice(insertAt, 0, dragId);
          const before = tasksFor(personal);
          const orderMap = {}; order.forEach((id,i)=>{ orderMap[id]=(i+1)*10; });
          const updated = before.map(t=> orderMap[t.id]!==undefined ? {...t, sortOrder: orderMap[t.id]} : t);
          setTasksFor(personal, updated);
          const ok = await persistTasksFor(personal);
          if(!ok){ setTasksFor(personal, before); saveFailedToast(); }
          render();
        }
        dragId = null; dragEl = null; targetId = null; targetPos = null;
      };

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    };
  });
}

function openTaskModal(id, personal, presetParentId, presetTitle, onDone){
  const source = tasksFor(personal);
  const existing = id ? source.find(t=>t.id===id) : null;
  const parentId = existing ? (existing.parentId||null) : (presetParentId||null);
  const parentTask = parentId ? source.find(x=>x.id===parentId) : null;
  const allProjects = projectsFor(personal);
  const selKey = personal?'personal':'work';
  const purchasesProject = allProjects.find(p=>isPurchasesProjectName(p.name));
  // В выпадающем списке — только активные (не завершённые) проекты. Но если редактируем задачу
  // из уже завершённого (архивного) проекта — его название всё равно показываем, чтобы не потерять значение.
  const activeProjects = activeProjectsFor(personal);
  const currentProject = existing && existing.projectId ? allProjects.find(p=>p.id===existing.projectId) : null;
  const projects = (currentProject && !activeProjects.some(p=>p.id===currentProject.id))
    ? activeProjects.concat([currentProject])
    : activeProjects;
  const initialProjectId = parentId
    ? (parentTask ? parentTask.projectId : null)
    : (existing ? (existing.projectId||null) : (allProjects.some(p=>p.id===state.selectedProject[selKey]) ? state.selectedProject[selKey] : null));
  const initialIsPurchases = !!(purchasesProject && initialProjectId===purchasesProject.id);
  const assistantEmp = state.employees.find(e=>e.role==='Ассистент');
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal">
        <h3>${existing?'Изменить задачу':(parentId?'Новая подзадача':'Новая задача')}${personal?' · личная':''}</h3>
        ${parentId?`<div class="note">Подзадача для: <strong>${escapeHtml(parentTask?parentTask.title:'')}</strong></div>`:''}
        <div class="field"><label>Название *</label><input id="t_title" value="${existing?escapeHtml(existing.title):escapeHtml(presetTitle||'')}"></div>
        <div class="field"><label>Описание *</label><textarea id="t_desc" rows="2">${existing?escapeHtml(existing.description||''):''}</textarea></div>
        <div class="field"><label>Ссылка (необязательно)</label><input id="t_link" type="text" placeholder="https://..." value="${existing?escapeHtml(existing.link||''):''}"></div>
        ${!parentId?`
        <div class="field"><label>Проект</label>
          <select id="t_project">
            <option value="">Без проекта</option>
            ${projects.map(p=>`<option value="${p.id}" ${existing? (existing.projectId===p.id?'selected':'') : (state.selectedProject[selKey]===p.id?'selected':'')}>${escapeHtml(p.name)}</option>`).join('')}
          </select>
        </div>`:''}
        <div class="field-row" id="t_purchase_wrap" style="${initialIsPurchases?'':'display:none;'}">
          <div class="field"><label>Сумма покупки (необязательно)</label><input type="number" min="0" step="0.01" class="mono" id="t_purchase_amount" value="${existing&&existing.purchaseAmount?existing.purchaseAmount:''}"></div>
          <div class="field"><label>Магазин (необязательно)</label><input id="t_purchase_store" value="${existing?escapeHtml(existing.purchaseStore||''):''}" placeholder="Например: Леонардо"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Кто поставил задачу *</label>
            <select id="t_creator">
              <option value="">— выберите —</option>
              ${state.employees.map(e=>{
                const isSelected = existing ? existing.creatorId===e.id : (state.currentUserId && e.id===state.currentUserId);
                return `<option value="${e.id}" ${isSelected?'selected':''}>${escapeHtml(e.name)}</option>`;
              }).join('')}
            </select>
          </div>
          <div class="field"><label>Исполнитель${!personal?' *':''}</label>
            <select id="t_assignee">
              <option value="">— выберите —</option>
              ${state.employees.filter(e=>!personal || e.role==='Руководитель' || e.role==='Ассистент').map(e=>{
                const isSelected = existing ? existing.assigneeId===e.id : (initialIsPurchases && assistantEmp && e.id===assistantEmp.id);
                return `<option value="${e.id}" ${isSelected?'selected':''}>${escapeHtml(e.name)}</option>`;
              }).join('')}
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Дата постановки *</label><input type="date" id="t_createdDate" value="${existing?existing.createdDate||todayISO():todayISO()}"></div>
          <div class="field"><label>Дедлайн *</label><input type="date" id="t_deadline" value="${existing?existing.deadline||'':''}"></div>
          <div class="field"><label>Приоритет *</label>
            <select id="t_priority">
              ${Object.entries(PRIORITIES).map(([k,v])=>`<option value="${k}" ${existing?existing.priority===k?'selected':'':k==='med'?'selected':''}>${v}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Статус *</label>
            <select id="t_status">
              ${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}" ${existing&&existing.status===k?'selected':''}>${v}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field" id="t_completion_wrap" style="${existing&&existing.status==='done'?'':'display:none;'}">
          <label>Что сделано? *</label>
          <textarea id="t_completion_comment" rows="2" placeholder="Опишите, что было сделано">${existing?escapeHtml(existing.completionComment||''):''}</textarea>
        </div>
        ${!existing && !parentId ? `
        <div class="field"><label>Повтор</label>
          <select id="t_repeat">
            <option value="none">Не повторять</option>
            <option value="daily">Каждый день</option>
            <option value="weekly">Каждую неделю</option>
            <option value="monthly">Каждый месяц</option>
            <option value="yearly">Каждый год</option>
          </select>
        </div>
        <div class="field" id="t_weekdays_wrap" style="display:none;">
          <label>Дни недели</label>
          <div class="cat-filters" id="t_weekdays">
            ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>`<button type="button" class="cat-chip off" data-wd="${i+1}">${d}</button>`).join('')}
          </div>
        </div>
        <div class="field" id="t_repeat_until_wrap" style="display:none;">
          <label>Повторять до</label>
          <input type="date" id="t_repeat_until">
        </div>
        ` : (existing && existing.seriesId ? `<div class="note">🔁 Эта задача — часть повторяющейся серии. При сохранении можно применить изменения только к ней или сразу ко всей серии.</div>` : '')}
        <div class="field"><label>Привязать к мероприятию</label>
          <div class="cat-filters" id="t_event_cats">
            <button type="button" class="cat-chip" data-evcat="">Без привязки</button>
            ${Object.entries(CATEGORIES).map(([k,v])=>`<button type="button" class="cat-chip off" data-evcat="${k}"><span class="dot" style="background:${CATEGORY_COLORS[k]};"></span>${v}</button>`).join('')}
          </div>
          <div class="cat-filters" id="t_event_items" style="margin-top:8px;"></div>
          <input type="hidden" id="t_event" value="">
        </div>
        <div class="modal-actions">
          <button class="btn ghost" id="cancelTask">Отмена</button>
          <button class="btn" id="saveTask">Сохранить</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelTask').onclick=closeModal;
  document.getElementById('ov').onclick=(ev)=>{ if(ev.target.id==='ov') closeModal(); };

  if(!parentId){
    const projectSelect = document.getElementById('t_project');
    projectSelect.onchange=(e)=>{
      const pid = e.target.value;
      const isPurchases = !!(purchasesProject && pid===purchasesProject.id);
      document.getElementById('t_purchase_wrap').style.display = isPurchases ? '' : 'none';
      if(isPurchases && !personal && assistantEmp){
        const assigneeSel = document.getElementById('t_assignee');
        if(assigneeSel) assigneeSel.value = assistantEmp.id;
      }
    };
  }

  document.getElementById('t_status').onchange=(e)=>{
    document.getElementById('t_completion_wrap').style.display = e.target.value==='done' ? '' : 'none';
  };

  const repeatEl = document.getElementById('t_repeat');
  if(repeatEl){
    const weekdaysWrap = document.getElementById('t_weekdays_wrap');
    const untilWrap = document.getElementById('t_repeat_until_wrap');
    document.querySelectorAll('#t_weekdays .cat-chip').forEach(chip=>{
      chip.onclick=()=>chip.classList.toggle('off');
    });
    repeatEl.onchange=(e)=>{
      const val = e.target.value;
      if(val==='none'){ weekdaysWrap.style.display='none'; untilWrap.style.display='none'; return; }
      untilWrap.style.display='';
      if(val==='daily' || val==='weekly'){
        weekdaysWrap.style.display='';
        const startDate = document.getElementById('t_deadline').value || todayISO();
        const startWdRaw = new Date(startDate+'T00:00:00').getDay();
        const startWd = startWdRaw===0?7:startWdRaw;
        document.querySelectorAll('#t_weekdays .cat-chip').forEach(chip=>{
          const wd = parseInt(chip.dataset.wd, 10);
          if(val==='daily') chip.classList.remove('off');
          else chip.classList.toggle('off', wd!==startWd);
        });
      } else {
        weekdaysWrap.style.display='none';
      }
      const untilInput = document.getElementById('t_repeat_until');
      if(!untilInput.value){
        const startDate = document.getElementById('t_deadline').value || todayISO();
        const d = new Date(startDate+'T00:00:00'); d.setMonth(d.getMonth()+3);
        untilInput.value = dateToISO(d);
      }
    };
  }

  const existingEvent = existing && existing.eventId ? state.events.find(x=>x.id===existing.eventId) : null;
  const initialEvCat = existingEvent ? existingEvent.category : '';
  document.getElementById('t_event').value = existing && existing.eventId ? existing.eventId : '';

  function renderEventItems(cat){
    const wrap = document.getElementById('t_event_items');
    if(!cat){ wrap.innerHTML=''; return; }
    if(cat==='personal' && !personalAccessAllowed()){
      wrap.innerHTML = `<span class="subtitle" style="margin:0;">🔒 Доступно только Руководителю и Ассистенту</span>`;
      return;
    }
    const source = cat==='personal' ? state.personalEvents : state.events.filter(canSeeEvent);
    const evs = source.filter(ev=>ev.category===cat).sort((a,b)=>a.date.localeCompare(b.date));
    const currentVal = document.getElementById('t_event').value;
    wrap.innerHTML = evs.length
      ? evs.map(ev=>`<button type="button" class="cat-chip ${currentVal===ev.id?'':'off'}" data-evid="${ev.id}">${fmtDate(ev.date)} · ${escapeHtml(ev.title)}</button>`).join('')
      : `<span class="subtitle" style="margin:0;">Нет мероприятий в этой категории</span>`;
    wrap.querySelectorAll('[data-evid]').forEach(btn=>{
      btn.onclick=()=>{
        document.getElementById('t_event').value = btn.dataset.evid;
        wrap.querySelectorAll('[data-evid]').forEach(b=>b.classList.toggle('off', b!==btn));
        const ev = source.find(x=>x.id===btn.dataset.evid);
        const deadlineInput = document.getElementById('t_deadline');
        if(ev && !deadlineInput.value){
          deadlineInput.value = ev.date;
          deadlineInput.classList.remove('invalid');
        }
      };
    });
  }

  document.querySelectorAll('#t_event_cats .cat-chip').forEach(chip=>{
    chip.classList.toggle('off', chip.dataset.evcat !== initialEvCat);
    chip.onclick=()=>{
      const cat = chip.dataset.evcat;
      document.querySelectorAll('#t_event_cats .cat-chip').forEach(c=>c.classList.toggle('off', c!==chip));
      if(!cat){
        document.getElementById('t_event').value = '';
        document.getElementById('t_event_items').innerHTML = '';
      } else {
        renderEventItems(cat);
      }
    };
  });
  if(initialEvCat) renderEventItems(initialEvCat);

  function flagInvalid(elId){
    const elm = document.getElementById(elId);
    elm.classList.add('invalid');
    const clear = ()=>elm.classList.remove('invalid');
    elm.addEventListener('input', clear, {once:true});
    elm.addEventListener('change', clear, {once:true});
    return elm;
  }

  document.getElementById('saveTask').onclick=async ()=>{
    const title = document.getElementById('t_title').value.trim();
    const description = document.getElementById('t_desc').value.trim();
    const linkRaw = document.getElementById('t_link').value.trim();
    const link = linkRaw ? (/^https?:\/\//i.test(linkRaw) ? linkRaw : 'https://'+linkRaw) : '';
    const creatorId = document.getElementById('t_creator').value;
    const assigneeEl = document.getElementById('t_assignee');
    const assigneeId = assigneeEl ? assigneeEl.value : null;
    const createdDate = document.getElementById('t_createdDate').value;
    const deadline = document.getElementById('t_deadline').value;

    let firstInvalid = null;
    if(!title) firstInvalid = flagInvalid('t_title');
    if(!description) firstInvalid = firstInvalid || flagInvalid('t_desc');
    if(!creatorId) firstInvalid = firstInvalid || flagInvalid('t_creator');
    if(!personal && !assigneeId) firstInvalid = firstInvalid || flagInvalid('t_assignee');
    if(!createdDate) firstInvalid = firstInvalid || flagInvalid('t_createdDate');
    if(!deadline) firstInvalid = firstInvalid || flagInvalid('t_deadline');
    const statusVal = document.getElementById('t_status').value;
    const completionCommentVal = document.getElementById('t_completion_comment').value.trim();
    if(statusVal==='done' && !completionCommentVal) firstInvalid = firstInvalid || flagInvalid('t_completion_comment');
    if(firstInvalid){
      toast('Заполните все обязательные поля (отмечены *)');
      firstInvalid.focus();
      return;
    }
    if(deadline < createdDate){
      toast('Дедлайн не может быть раньше даты постановки');
      flagInvalid('t_deadline');
      return;
    }
    if(parentId && parentTask && parentTask.deadline && deadline > parentTask.deadline){
      toast(`Дедлайн подзадачи не может быть позже дедлайна задачи (до ${fmtDate(parentTask.deadline)})`);
      flagInvalid('t_deadline');
      return;
    }
    if(!parentId && existing){
      const childTasks = tasksFor(personal).filter(c=>c.parentId===existing.id);
      const violatingChild = childTasks.find(c=>c.deadline && c.deadline > deadline);
      if(violatingChild){
        toast(`Дедлайн задачи не может быть раньше дедлайна подзадачи «${violatingChild.title}» (до ${fmtDate(violatingChild.deadline)})`);
        flagInvalid('t_deadline');
        return;
      }
    }
    if(statusVal==='done' && (!existing || existing.status!=='done')){
      const effectiveAssignee = personal ? null : assigneeId;
      const wouldBeTask = {assigneeId: effectiveAssignee};
      if(!canCompleteTask(wouldBeTask, personal)){
        toast(whyCantComplete({assigneeId: effectiveAssignee}));
        return;
      }
    }

    const projectId = parentId
      ? (parentTask ? parentTask.projectId : (existing?existing.projectId||null:null))
      : (document.getElementById('t_project').value || null);
    const chosenStatus = statusVal;
    const completedAt = chosenStatus==='done'
      ? (existing && existing.status==='done' ? existing.completedAt : todayISO())
      : null;
    const data = {
      id: existing?existing.id:uid(),
      title,
      description,
      link,
      projectId,
      parentId: parentId||null,
      assigneeId: assigneeId || null,
      creatorId,
      createdDate,
      deadline,
      priority: document.getElementById('t_priority').value,
      status: chosenStatus,
      completedAt,
      completionComment: chosenStatus==='done' ? completionCommentVal : '',
      eventId: document.getElementById('t_event').value || null,
      purchaseAmount: document.getElementById('t_purchase_amount').value ? parseFloat(document.getElementById('t_purchase_amount').value) : null,
      purchaseStore: document.getElementById('t_purchase_store').value.trim(),
      purchaseExpenseId: existing ? (existing.purchaseExpenseId||null) : null,
      seriesId: existing ? (existing.seriesId||null) : null,
      // Если дедлайн перенесён — старая причина задержки больше не актуальна, потребуется новая при следующей просрочке.
      overdueReason: (existing && existing.deadline===deadline) ? (existing.overdueReason||'') : '',
    };

    if(!existing && repeatEl && repeatEl.value!=='none'){
      const repeatType = repeatEl.value;
      const untilVal = document.getElementById('t_repeat_until').value || deadline;
      const weekdaySet = new Set(Array.from(document.querySelectorAll('#t_weekdays .cat-chip:not(.off)')).map(c=>parseInt(c.dataset.wd,10)));
      let dates = generateRecurrenceDates(deadline, repeatType, weekdaySet, untilVal, 300);
      if(!dates.length) dates = [deadline];
      const seriesId = uid();
      const arr = tasksFor(personal);
      const newTasks = dates.map(d=>({...data, id: uid()+d, deadline: d, seriesId}));
      setTasksFor(personal, arr.concat(newTasks));
      await persistTasksFor(personal);
      closeModal(); render();
      toast(`Добавлено задач: ${newTasks.length}`);
      if(onDone) onDone();
      return;
    }

    if(existing && existing.seriesId){
      const choice = await showSeriesEditChoice();
      if(!choice) return;
      if(choice==='one'){
        setTasksFor(personal, tasksFor(personal).map(t=>t.id===existing.id?data:t));
      } else {
        setTasksFor(personal, tasksFor(personal).map(t=>{
          if(t.seriesId===existing.seriesId){
            return {...data, id:t.id, deadline:t.deadline, status:t.status, completedAt:t.completedAt, completionComment:t.completionComment, completionLink:t.completionLink, createdDate:t.createdDate, parentId:t.parentId, seriesId:t.seriesId, purchaseExpenseId:t.purchaseExpenseId};
          }
          return t;
        }));
      }
      await persistTasksFor(personal);
      if(chosenStatus==='done' && existing.status!=='done'){
        await maybeOfferPurchaseExpense(data, personal);
      }
      closeModal(); render();
      toast(choice==='series' ? 'Изменения применены ко всей серии' : 'Задача сохранена');
      return;
    }

    const arr = tasksFor(personal);
    if(existing) setTasksFor(personal, arr.map(t=>t.id===existing.id?data:t));
    else setTasksFor(personal, arr.concat([data]));
    await persistTasksFor(personal);
    if(chosenStatus==='done' && (!existing || existing.status!=='done')){
      await maybeOfferPurchaseExpense(data, personal);
    }
    closeModal(); render();
    toast('Задача сохранена');
    if(!existing && onDone) onDone();
  };
}

function openProjectsModal(personal){
  const modal = document.getElementById('modalRoot');
  const selKey = personal?'personal':'work';
  const canDeleteProject = hasRole('Руководитель','Ассистент');
  function body(){
    const projects = projectsFor(personal);
    const blockSection = personal ? '' : `
      <div style="background:var(--rose-bg);border:1px solid var(--rose);border-radius:10px;padding:14px 16px;margin-bottom:20px;">
        <h4 style="font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--rose);margin:0 0 8px;">📦 Блоки — уровень выше проектов</h4>
        <p class="subtitle" style="margin:0 0 10px;">Удобно для крупных направлений (например, «Финансы», «Персонал»), в которые входит сразу несколько проектов.</p>
        <div class="item-list" style="margin-bottom:12px;">
          ${state.blocksWork.map(b=>`
            <div class="item" style="background:var(--card);">
              <div class="main"><div class="title">${escapeHtml(b.name)}</div><div class="meta"><span>${projectsInBlock(b.id).length} проект(ов)</span></div></div>
              <div class="actions">
                <button class="btn ghost small" data-rename-block="${b.id}">✎</button>
                <button class="btn danger small" data-del-block="${b.id}" style="${canDeleteProject?'':'opacity:.4;'}" title="${canDeleteProject?'Удалить':'Удалять блоки может только Руководитель или Ассистент'}">✕</button>
              </div>
            </div>
          `).join('') || `<p class="subtitle" style="margin:0;">Блоков пока нет</p>`}
        </div>
        <div class="field-row" style="margin:0;">
          <input id="block_name" placeholder="Например: Финансы" style="flex:1;">
          <button class="btn ghost small" id="addBlockBtn">+ Добавить блок</button>
        </div>
      </div>
    `;
    function projectRow(p){
      return `
        <div class="item">
          <div class="main"><div class="title">${escapeHtml(p.name)}</div></div>
          ${!personal ? `
            <select data-proj-block="${p.id}" style="width:auto;max-width:160px;">
              <option value="">Без блока</option>
              ${state.blocksWork.map(b=>`<option value="${b.id}" ${p.blockId===b.id?'selected':''}>${escapeHtml(b.name)}</option>`).join('')}
            </select>
          ` : ''}
          <div class="actions">
            <button class="btn ghost small" data-rename-proj="${p.id}">✎</button>
            <button class="btn danger small" data-del-proj="${p.id}" style="${canDeleteProject?'':'opacity:.4;'}" title="${canDeleteProject?'Удалить':'Удалять проекты может только Руководитель или Ассистент'}">✕</button>
          </div>
        </div>
      `;
    }
    const projectsListHtml = personal ? projects.map(projectRow).join('') || `<p class="subtitle" style="margin:0;">Проектов пока нет</p>` : (() => {
      let html = '';
      state.blocksWork.forEach(b=>{
        const inBlock = projectsInBlock(b.id);
        if(!inBlock.length) return;
        html += `<div class="subtitle" style="font-weight:700;margin:10px 0 4px;color:var(--rose);">📦 ${escapeHtml(b.name)}</div>`;
        html += inBlock.map(projectRow).join('');
      });
      const noBlock = projectsWithoutBlock();
      if(noBlock.length){
        if(state.blocksWork.length) html += `<div class="subtitle" style="font-weight:700;margin:10px 0 4px;">Без блока</div>`;
        html += noBlock.map(projectRow).join('');
      }
      return html || `<p class="subtitle" style="margin:0;">Проектов пока нет</p>`;
    })();
    return `
      <div class="overlay" id="ov">
        <div class="modal">
          <h3>Проекты${personal?' (личные)':''}</h3>
          ${blockSection}
          <div class="item-list" style="margin-bottom:16px;">
            ${projectsListHtml}
          </div>
          <div class="field"><label>Название нового проекта</label><input id="proj_name" placeholder="Например: Запуск нового курса"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="closeProj">Закрыть</button>
            <button class="btn" id="addProj">Добавить</button>
          </div>
          ${!personal?`
          <h4 style="font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:20px 0 8px;">Банк идей-проектов</h4>
          <p class="subtitle" style="margin:0 0 10px;">Копилка идей на будущее — своих типовых проектов с набором задач. Выберите идею, чтобы превратить её в проект.</p>
          <div class="item-list" style="margin-bottom:12px;">
            ${state.ideaBankWork.map(idea=>`
              <div class="item">
                <div class="main">
                  <div class="title">${escapeHtml(idea.name)}</div>
                  <div class="meta"><span>${(idea.tasks||[]).length} задач(и) в плане</span></div>
                </div>
                <div class="actions">
                  <button class="btn ghost small" data-apply-idea="${idea.id}">Создать проект</button>
                  <button class="btn ghost small" data-edit-idea="${idea.id}">✎</button>
                  <button class="btn danger small" data-del-idea="${idea.id}">✕</button>
                </div>
              </div>
            `).join('') || `<p class="subtitle" style="margin:0;">Идей пока нет — добавьте первую</p>`}
          </div>
          <button class="btn ghost small" id="addIdeaBtn">+ Добавить идею</button>
          `:''}
        </div>
      </div>`;
  }
  modal.innerHTML = body();
  function wire(){
    document.getElementById('closeProj').onclick=closeModal;
    document.getElementById('ov').onclick=(ev)=>{ if(ev.target.id==='ov') closeModal(); };
    document.getElementById('addProj').onclick=async ()=>{
      const name = document.getElementById('proj_name').value.trim();
      if(!name){ toast('Введите название'); return; }
      setProjectsFor(personal, projectsFor(personal).concat([{id:uid(), name}]));
      await persistProjectsFor(personal);
      modal.innerHTML = body(); wire(); render();
    };
    const addBlockBtn = document.getElementById('addBlockBtn');
    if(addBlockBtn) addBlockBtn.onclick=async ()=>{
      const name = document.getElementById('block_name').value.trim();
      if(!name){ toast('Введите название блока'); return; }
      const before = state.blocksWork;
      state.blocksWork = before.concat([{id:uid(), name}]);
      const ok = await saveBlocksWork();
      if(!ok){ state.blocksWork = before; saveFailedToast(); return; }
      modal.innerHTML = body(); wire(); render();
    };
    modal.querySelectorAll('[data-rename-block]').forEach(b=>b.onclick=async ()=>{
      const bid = b.dataset.renameBlock;
      const current = state.blocksWork.find(x=>x.id===bid);
      const newName = await showPrompt('Название блока', current?current.name:'');
      if(newName===null || !newName) return;
      const before = state.blocksWork;
      state.blocksWork = before.map(x=>x.id===bid?{...x,name:newName}:x);
      const ok = await saveBlocksWork();
      if(!ok){ state.blocksWork = before; saveFailedToast(); return; }
      modal.innerHTML = body(); wire(); render();
    });
    modal.querySelectorAll('[data-del-block]').forEach(b=>b.onclick=async ()=>{
      if(!canDeleteProject){ toast('Удалять блоки может только Руководитель или Ассистент'); return; }
      if(!(await showConfirm('Удалить блок? Проекты внутри останутся, но станут «без блока».'))) return;
      const bid = b.dataset.delBlock;
      const beforeBlocks = state.blocksWork;
      const beforeProjects = state.projectsWork;
      state.blocksWork = beforeBlocks.filter(x=>x.id!==bid);
      state.projectsWork = beforeProjects.map(p=>p.blockId===bid?{...p,blockId:null}:p);
      const ok1 = await saveBlocksWork();
      const ok2 = await saveProjectsWork();
      if(!ok1 || !ok2){ state.blocksWork = beforeBlocks; state.projectsWork = beforeProjects; saveFailedToast(); return; }
      modal.innerHTML = body(); wire(); render();
    });
    modal.querySelectorAll('[data-proj-block]').forEach(sel=>sel.onchange=async ()=>{
      const pid = sel.dataset.projBlock;
      const newBlockId = sel.value || null;
      const before = state.projectsWork;
      state.projectsWork = before.map(p=>p.id===pid?{...p,blockId:newBlockId}:p);
      const ok = await saveProjectsWork();
      if(!ok){ state.projectsWork = before; saveFailedToast(); sel.value = before.find(p=>p.id===pid).blockId || ''; return; }
      render();
    });
    modal.querySelectorAll('[data-rename-proj]').forEach(b=>b.onclick=async ()=>{
      const pid = b.dataset.renameProj;
      const current = projectsFor(personal).find(p=>p.id===pid);
      const newName = await showPrompt('Название проекта', current?current.name:'');
      if(newName===null || !newName) return;
      const finalName = isPurchasesProjectName(newName) ? PURCHASES_PROJECT_NAME : newName;
      setProjectsFor(personal, projectsFor(personal).map(p=>p.id===pid?{...p,name:finalName}:p));
      await persistProjectsFor(personal);
      modal.innerHTML = body(); wire(); render();
    });
    modal.querySelectorAll('[data-del-proj]').forEach(b=>b.onclick=async ()=>{
      if(!canDeleteProject){ toast('Удалять проекты может только Руководитель или Ассистент'); return; }
      if(!(await showConfirm('Удалить проект? Задачи останутся, но будут перемещены в «Без проекта».'))) return;
      const pid = b.dataset.delProj;
      const doomedProj = projectsFor(personal).find(p=>p.id===pid);
      if(doomedProj) await moveToTrash(personal, 'project', doomedProj);
      setProjectsFor(personal, projectsFor(personal).filter(p=>p.id!==pid));
      setTasksFor(personal, tasksFor(personal).map(t=>t.projectId===pid?{...t,projectId:null}:t));
      await persistProjectsFor(personal);
      if(!personal) await saveTasksWork();
      if(state.selectedProject[selKey]===pid) state.selectedProject[selKey]='all';
      modal.innerHTML = body(); wire(); render();
    });
    if(!personal){
      const ideaBtn = document.getElementById('addIdeaBtn');
      if(ideaBtn) ideaBtn.onclick=()=>openIdeaModal(null, ()=>{ modal.innerHTML = body(); wire(); });
      modal.querySelectorAll('[data-edit-idea]').forEach(b=>b.onclick=()=>openIdeaModal(b.dataset.editIdea, ()=>{ modal.innerHTML = body(); wire(); }));
      modal.querySelectorAll('[data-del-idea]').forEach(b=>b.onclick=async ()=>{
        if(!(await showConfirm('Удалить идею из банка?'))) return;
        const doomedIdea = state.ideaBankWork.find(i=>i.id===b.dataset.delIdea);
        if(doomedIdea) await moveToTrash(false, 'idea', doomedIdea);
        state.ideaBankWork = state.ideaBankWork.filter(i=>i.id!==b.dataset.delIdea);
        await saveIdeaBank();
        modal.innerHTML = body(); wire();
      });
      modal.querySelectorAll('[data-apply-idea]').forEach(b=>b.onclick=async ()=>{
        const idea = state.ideaBankWork.find(i=>i.id===b.dataset.applyIdea);
        if(!idea) return;
        const taskCount = (idea.tasks||[]).length;
        if(!(await showConfirm(`Создать проект «${idea.name}»${taskCount?` с ${taskCount} задачами`:''}?`, 'Создать'))) return;
        await applyIdeaToProject(idea);
        closeModal(); render();
      });
    }
  }
  wire();
}

/* ================= TASK ANALYTICS ================= */
function renderTaskAnalytics(el){
  const today = todayISO();
  const rows = state.employees.map(e=>{
    const tasks = state.tasksWork.filter(t=>t.assigneeId===e.id);
    const inProgress = tasks.filter(t=>t.status!=='done').length;
    const doneTasks = tasks.filter(t=>t.status==='done');
    const overdue = tasks.filter(t=>t.deadline && t.deadline<today && t.status!=='done').length;
    const durations = doneTasks
      .filter(t=>t.createdDate && t.completedAt)
      .map(t=>Math.max(0,(new Date(t.completedAt)-new Date(t.createdDate))/86400000));
    const avgDays = durations.length ? durations.reduce((a,b)=>a+b,0)/durations.length : null;
    return {employee:e, total:tasks.length, inProgress, doneCount:doneTasks.length, overdue, avgDays};
  }).filter(r=>r.total>0);

  const unassigned = state.tasksWork.filter(t=>!t.assigneeId);
  const totalInProgress = state.tasksWork.filter(t=>t.status!=='done').length;
  const totalDone = state.tasksWork.filter(t=>t.status==='done').length;
  const totalOverdue = state.tasksWork.filter(t=>t.deadline && t.deadline<today && t.status!=='done').length;
  const maxTotal = Math.max(1, ...rows.map(r=>r.total));

  const projectRows = state.projectsWork.map(p=>{
    const tasks = state.tasksWork.filter(t=>t.projectId===p.id);
    const done = tasks.filter(t=>t.status==='done').length;
    return {name:p.name, total:tasks.length, done, pct: tasks.length ? Math.round(done/tasks.length*100) : 0};
  }).filter(r=>r.total>0);
  const noProjTasks = state.tasksWork.filter(t=>!t.projectId);
  if(noProjTasks.length){
    const doneNP = noProjTasks.filter(t=>t.status==='done').length;
    projectRows.push({name:'Без проекта', total:noProjTasks.length, done:doneNP, pct:Math.round(doneNP/noProjTasks.length*100)});
  }
  projectRows.sort((a,b)=>b.pct-a.pct);
  function barColor(pct){ return pct>=70?'var(--teal)':pct>=30?'var(--ochre)':'var(--brick)'; }

  const blockRows = state.blocksWork.map(b=>{
    const projIds = projectsInBlock(b.id).map(p=>p.id);
    const tasks = state.tasksWork.filter(t=>projIds.includes(t.projectId));
    const done = tasks.filter(t=>t.status==='done').length;
    return {name:b.name, total:tasks.length, done, pct: tasks.length ? Math.round(done/tasks.length*100) : 0};
  }).filter(r=>r.total>0);
  blockRows.sort((a,b)=>b.pct-a.pct);

  el.innerHTML = `
    <div class="ledger-summary">
      <div class="sum-card issued"><div class="label">В работе</div><div class="val mono">${totalInProgress}</div></div>
      <div class="sum-card"><div class="label">Выполнено</div><div class="val mono" style="color:var(--indigo);">${totalDone}</div></div>
      <div class="sum-card spent"><div class="label">Просрочено</div><div class="val mono">${totalOverdue}</div></div>
    </div>
    <div class="an-table">
      <table class="an-table-inner">
        <thead><tr><th>Сотрудник</th><th>В работе</th><th>Готово</th><th>Просрочено</th><th>Средний срок</th><th>Нагрузка</th></tr></thead>
        <tbody>
          ${rows.length ? rows.map(r=>`
            <tr>
              <td class="an-name">${escapeHtml(r.employee.name)}<div class="subtitle" style="margin:0;font-size:11px;">${escapeHtml(r.employee.role||'')}</div></td>
              <td class="an-num">${r.inProgress}</td>
              <td class="an-num" style="color:var(--teal);">${r.doneCount}</td>
              <td class="an-num" style="color:${r.overdue>0?'var(--brick)':'var(--ink-soft)'};font-weight:${r.overdue>0?'600':'400'};">${r.overdue}</td>
              <td class="an-num">${r.avgDays!==null ? r.avgDays.toFixed(1)+' дн.' : '—'}</td>
              <td><div class="an-bar-wrap"><div class="an-bar-track"><div class="an-bar-fill" style="width:${(r.total/maxTotal*100).toFixed(0)}%;background:var(--indigo);"></div></div><span class="an-num" style="font-size:11px;color:var(--ink-soft);">${r.total}</span></div></td>
            </tr>
          `).join('') : `<tr><td colspan="6"><div class="empty-state"><div class="big">Пока нет данных</div><p>Назначьте задачи сотрудникам, чтобы увидеть статистику</p></div></td></tr>`}
          ${unassigned.length ? `
            <tr>
              <td class="an-name">Без исполнителя</td>
              <td class="an-num">${unassigned.filter(t=>t.status!=='done').length}</td>
              <td class="an-num" style="color:var(--teal);">${unassigned.filter(t=>t.status==='done').length}</td>
              <td class="an-num" style="color:${unassigned.filter(t=>t.deadline&&t.deadline<today&&t.status!=='done').length>0?'var(--brick)':'var(--ink-soft)'};">${unassigned.filter(t=>t.deadline&&t.deadline<today&&t.status!=='done').length}</td>
              <td class="an-num">—</td>
              <td></td>
            </tr>` : ''}
        </tbody>
      </table>
    </div>
    ${blockRows.length ? `
    <h4 style="font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--rose);margin:22px 0 8px;">📦 Прогресс по блокам</h4>
    <div class="an-table">
      <table class="an-table-inner">
        <thead><tr><th>Блок</th><th>Готово</th><th>Всего</th><th>% выполнения</th></tr></thead>
        <tbody>
          ${blockRows.map(r=>`
            <tr>
              <td class="an-name">${escapeHtml(r.name)}</td>
              <td class="an-num" style="color:var(--teal);">${r.done}</td>
              <td class="an-num">${r.total}</td>
              <td><div class="an-bar-wrap"><div class="an-bar-track"><div class="an-bar-fill" style="width:${r.pct}%;background:${barColor(r.pct)};"></div></div><span class="an-num" style="font-size:11px;color:var(--ink-soft);min-width:32px;text-align:right;">${r.pct}%</span></div></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    ` : ''}
    <h4 style="font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:22px 0 8px;">Прогресс по проектам</h4>
    <div class="an-table">
      <table class="an-table-inner">
        <thead><tr><th>Проект</th><th>Готово</th><th>Всего</th><th>% выполнения</th></tr></thead>
        <tbody>
          ${projectRows.length ? projectRows.map(r=>`
            <tr>
              <td class="an-name">${escapeHtml(r.name)}</td>
              <td class="an-num" style="color:var(--teal);">${r.done}</td>
              <td class="an-num">${r.total}</td>
              <td><div class="an-bar-wrap"><div class="an-bar-track"><div class="an-bar-fill" style="width:${r.pct}%;background:${barColor(r.pct)};"></div></div><span class="an-num" style="font-size:11px;color:var(--ink-soft);min-width:32px;text-align:right;">${r.pct}%</span></div></td>
            </tr>
          `).join('') : `<tr><td colspan="4"><div class="empty-state"><div class="big">Нет данных по проектам</div><p>Добавьте задачи в проект, чтобы увидеть прогресс</p></div></td></tr>`}

      </table>

    <p class="subtitle" style="margin-top:14px;">Средний срок выполнения считается от даты постановки задачи до отметки «Готово». Личные задачи в статистику не входят.</p>
  `;
}

/* ================= REPORT (отчёт о выполненных задачах) ================= */
function computeReportTasks(){
  return state.tasksWork.filter(t=>
    t.status==='done' && t.completedAt &&
    t.completedAt.slice(0,10) >= state.reportStart && t.completedAt.slice(0,10) <= state.reportEnd &&
    (state.reportEmployee==='all' || t.assigneeId===state.reportEmployee)
  );
}
// Задачи, которые должны были закрыться к концу периода (дедлайн уже наступил), но всё ещё не "Готово".
// Удобно для еженедельной планёрки — сразу видно, что не сделано.
function computeNotDoneTasks(){
  return state.tasksWork.filter(t=>
    t.status!=='done' && !t.parentId && t.deadline && t.deadline<=state.reportEnd &&
    (state.reportEmployee==='all' || t.assigneeId===state.reportEmployee)
  );
}
function reportTaskWasLate(t){
  return !!(t.deadline && t.completedAt && t.completedAt.slice(0,10) > t.deadline);
}
function renderTaskReport(el){
  const today = todayISO();
  if(!state.reportStart){
    const d = new Date();
    state.reportStart = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  }
  if(!state.reportEnd) state.reportEnd = today;

  const doneTasks = computeReportTasks();
  const notDoneTasks = computeNotDoneTasks();
  const lateTasks = doneTasks.filter(reportTaskWasLate);
  const durations = doneTasks.filter(t=>t.createdDate).map(t=>Math.max(0,(new Date(t.completedAt)-new Date(t.createdDate))/86400000));
  const avgDays = durations.length ? (durations.reduce((a,b)=>a+b,0)/durations.length) : null;

  function rowHtml(t){
    const late = reportTaskWasLate(t);
    return `<div class="item">
      <div class="main">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="meta">
          ${t.projectId?`<span>📁 ${escapeHtml(projectName(false,t.projectId))}</span>`:''}
          ${t.assigneeId?`<span>${escapeHtml(empName(t.assigneeId))}</span>`:''}
          <span>Срок: ${t.deadline?fmtDate(t.deadline):'—'}</span>
          <span>Закрыто: ${fmtDate(t.completedAt)}</span>
          ${late?`<span style="color:var(--brick);font-weight:600;">просрочено</span>`:''}
        </div>
        ${t.completionComment?`<div class="desc" style="color:var(--teal);">✅ ${linkifyEscaped(t.completionComment)}</div>`:''}
        ${t.completionLink?`<div class="desc">🔗 <a href="${escapeHtml(t.completionLink)}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;" onclick="event.stopPropagation()">Ссылка на результат</a></div>`:''}
        ${late && t.overdueReason?`<div class="desc" style="color:var(--brick);">⚠️ Причина задержки: ${linkifyEscaped(t.overdueReason)}</div>`:''}
        ${t.link?`<div class="desc">🔗 <a href="${escapeHtml(t.link)}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;">Ссылка</a></div>`:''}
      </div>
    </div>`;
  }
  function notDoneRowHtml(t){
    return `<div class="item">
      <div class="main">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="meta">
          ${t.projectId?`<span>📁 ${escapeHtml(projectName(false,t.projectId))}</span>`:''}
          ${t.assigneeId?`<span>${escapeHtml(empName(t.assigneeId))}</span>`:''}
          <span>Срок: ${t.deadline?fmtDate(t.deadline):'—'}</span>
          <span class="badge" style="background:${t.status==='review'?'var(--ochre-bg,#F3E9D6)':'var(--brick-bg,#F6E2E2)'};color:${t.status==='review'?'var(--ochre)':'var(--brick)'};">${STATUSES[t.status]||t.status}</span>
        </div>
        ${t.description?`<div class="desc">${linkifyEscaped(t.description)}</div>`:''}
        ${t.overdueReason?`<div class="desc" style="color:var(--brick);">⚠️ Причина задержки: ${linkifyEscaped(t.overdueReason)}</div>`:''}
        ${t.reworkNote?`<div class="desc" style="color:var(--brick);">↩️ На доработке: ${linkifyEscaped(t.reworkNote)}</div>`:''}
      </div>
    </div>`;
  }
  function groupBlock(label, tasks, rowFn){
    rowFn = rowFn || rowHtml;
    return `
      ${label!==null?`<h3 class="section-title" style="font-size:14.5px;margin:18px 0 8px;">${escapeHtml(label)} <span class="subtitle" style="font-size:12px;">(${tasks.length})</span></h3>`:''}
      <div class="item-list" style="margin-bottom:10px;">${tasks.map(rowFn).join('')}</div>
    `;
  }
  function buildGroupedHtml(tasks, sortKey, rowFn){
    if(!tasks.length) return null;
    if(state.reportGroupBy==='employee'){
      const byEmp = {};
      tasks.forEach(t=>{ const key=t.assigneeId||'none'; (byEmp[key]=byEmp[key]||[]).push(t); });
      const groups = Object.entries(byEmp).map(([empId,ts])=>({
        label: empId==='none' ? 'Без исполнителя' : empName(empId),
        tasks: ts.slice().sort((a,b)=>(a[sortKey]||'').localeCompare(b[sortKey]||'')),
      })).sort((a,b)=>b.tasks.length-a.tasks.length);
      return groups.map(g=>groupBlock(g.label, g.tasks, rowFn)).join('');
    } else if(state.reportGroupBy==='project'){
      const byProj = {};
      tasks.forEach(t=>{ const key=t.projectId||'none'; (byProj[key]=byProj[key]||[]).push(t); });
      const groups = Object.entries(byProj).map(([pid,ts])=>({
        label: pid==='none' ? 'Без проекта' : projectName(false,pid),
        tasks: ts.slice().sort((a,b)=>(a[sortKey]||'').localeCompare(b[sortKey]||'')),
      })).sort((a,b)=>b.tasks.length-a.tasks.length);
      return groups.map(g=>groupBlock(g.label, g.tasks, rowFn)).join('');
    } else {
      const sorted = tasks.slice().sort((a,b)=>(a[sortKey]||'').localeCompare(b[sortKey]||''));
      return groupBlock(null, sorted, rowFn);
    }
  }

  const doneHtml = buildGroupedHtml(doneTasks, 'completedAt', rowHtml) ||
    `<div class="empty-state"><div class="big">За этот период ничего не завершено</div><p>Попробуйте выбрать другой период</p></div>`;
  const notDoneHtml = buildGroupedHtml(notDoneTasks, 'deadline', notDoneRowHtml) ||
    `<p class="subtitle" style="margin:0;">Не осталось незакрытых задач с истёкшим сроком за этот период 🎉</p>`;

  el.innerHTML = `
    <div class="field-row" style="align-items:flex-end;">
      <div class="field"><label>С какой даты</label><input type="date" id="rep_start" value="${state.reportStart}"></div>
      <div class="field"><label>По какую дату</label><input type="date" id="rep_end" value="${state.reportEnd}"></div>
      <button class="btn ghost" id="rep_download">⬇️ Скачать отчёт (CSV)</button>
    </div>
    <div class="cat-filters" style="margin-bottom:16px;">
      <button class="cat-chip off" data-rep-period="week">Эта неделя</button>
      <button class="cat-chip off" data-rep-period="month">Этот месяц</button>
      <button class="cat-chip off" data-rep-period="lastmonth">Прошлый месяц</button>
    </div>
    <div class="field-row" style="margin-bottom:16px;max-width:320px;">
      <select id="rep_emp">
        <option value="all" ${state.reportEmployee==='all'?'selected':''}>Все сотрудники</option>
        ${state.employees.map(e=>`<option value="${e.id}" ${state.reportEmployee===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}
      </select>
    </div>
    <div class="cat-filters" style="margin-bottom:16px;">
      <button class="cat-chip ${state.reportGroupBy==='employee'?'':'off'}" data-rep-group="employee">По сотруднику</button>
      <button class="cat-chip ${state.reportGroupBy==='project'?'':'off'}" data-rep-group="project">По проекту</button>
      <button class="cat-chip ${state.reportGroupBy==='date'?'':'off'}" data-rep-group="date">По датам</button>
    </div>
    <div class="ledger-summary" style="margin-bottom:20px;">
      <div class="sum-card"><div class="label">Завершено</div><div class="val mono" style="color:var(--indigo);">${doneTasks.length}</div></div>
      <div class="sum-card spent"><div class="label">С опозданием</div><div class="val mono">${lateTasks.length}</div></div>
      <div class="sum-card issued"><div class="label">Средний срок</div><div class="val mono">${avgDays!==null?avgDays.toFixed(1)+' дн.':'—'}</div></div>
      <div class="sum-card" style="background:var(--brick-bg,#F6E2E2);"><div class="label">Не выполнено</div><div class="val mono" style="color:var(--brick);">${notDoneTasks.length}</div></div>
    </div>
    <h2 class="section-title" style="font-size:16px;">✅ Выполнено</h2>
    ${doneHtml}
    <h2 class="section-title" style="font-size:16px;margin-top:24px;">❌ Не выполнено (срок уже наступил)</h2>
    ${notDoneHtml}
    <p class="subtitle" style="margin-top:14px;">Личные задачи в отчёт не входят. «Просрочено» — задача закрыта позже указанного в ней срока. В «Не выполнено» попадают задачи с дедлайном на конец выбранного периода или раньше, которые ещё не в статусе «Готово».</p>
  `;

  document.getElementById('rep_start').onchange = (e)=>{ state.reportStart = e.target.value; render(); };
  document.getElementById('rep_end').onchange = (e)=>{ state.reportEnd = e.target.value; render(); };
  document.getElementById('rep_emp').onchange = (e)=>{ state.reportEmployee = e.target.value; render(); };
  document.getElementById('rep_download').onclick = ()=>exportTaskReportCSV();
  el.querySelectorAll('[data-rep-period]').forEach(b=>b.onclick=()=>{
    const now = new Date();
    if(b.dataset.repPeriod==='week'){
      const day = (now.getDay()+6)%7;
      const monday = new Date(now); monday.setDate(now.getDate()-day);
      state.reportStart = monday.toISOString().slice(0,10);
      state.reportEnd = todayISO();
    } else if(b.dataset.repPeriod==='month'){
      state.reportStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
      state.reportEnd = todayISO();
    } else if(b.dataset.repPeriod==='lastmonth'){
      const firstOfThis = new Date(now.getFullYear(), now.getMonth(), 1);
      const lastOfPrev = new Date(firstOfThis - 86400000);
      const firstOfPrev = new Date(lastOfPrev.getFullYear(), lastOfPrev.getMonth(), 1);
      state.reportStart = firstOfPrev.toISOString().slice(0,10);
      state.reportEnd = lastOfPrev.toISOString().slice(0,10);
    }
    render();
  });
  el.querySelectorAll('[data-rep-group]').forEach(b=>b.onclick=()=>{
    state.reportGroupBy = b.dataset.repGroup;
    render();
  });
}
function exportTaskReportCSV(){
  const doneTasks = computeReportTasks().slice().sort((a,b)=>(a.completedAt||'').localeCompare(b.completedAt||''));
  const notDoneTasks = computeNotDoneTasks().slice().sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
  const header = ['Статус','Задача','Проект','Исполнитель','Постановщик','Срок','Дата закрытия','Просрочено','Причина задержки','Комментарий о выполнении','Ссылка на результат','Ссылка'];
  const lines = [header.map(csvEscape).join(';')];
  doneTasks.forEach(t=>{
    lines.push([
      'Готово',
      t.title,
      t.projectId?projectName(false,t.projectId):'',
      t.assigneeId?empName(t.assigneeId):'',
      t.creatorId?empName(t.creatorId):'',
      t.deadline?fmtDate(t.deadline):'',
      t.completedAt?fmtDate(t.completedAt):'',
      reportTaskWasLate(t)?'Да':'Нет',
      t.overdueReason||'',
      t.completionComment||'',
      t.completionLink||'',
      t.link||'',
    ].map(csvEscape).join(';'));
  });
  notDoneTasks.forEach(t=>{
    lines.push([
      'Не выполнено (' + (STATUSES[t.status]||t.status) + ')',
      t.title,
      t.projectId?projectName(false,t.projectId):'',
      t.assigneeId?empName(t.assigneeId):'',
      t.creatorId?empName(t.creatorId):'',
      t.deadline?fmtDate(t.deadline):'',
      '',
      'Да',
      t.overdueReason||t.reworkNote||'',
      '',
      '',
      t.link||'',
    ].map(csvEscape).join(';'));
  });
  const csv = '\uFEFF' + lines.join('\r\n');
  downloadTextFile(`otchet-zadachi-${state.reportStart}--${state.reportEnd}.csv`, 'text/csv;charset=utf-8', csv);
}

/* ================= ARCHIVE ================= */
function renderArchiveTab(root){

    t.status==='done' && !t.parentId &&

        ${completedBlocksFor().map(b=>{

    <div style="margin-bottom:24px;">
      ${completedProjects.length ? completedProjects.map(p=>{

/* ================= FUNDS ================= */
function renderFunds(root){
  const scope = state.fundsScope;
  let scoped;
  if(scope==='all'){
    scoped = state.fundsEntries.slice().concat(state.personalFundsEntries.slice());
  } else {
    scoped = fundsFor(scope).slice();
  }
  const sorted = scoped.sort((a,b)=> a.date===b.date ? a.createdAt-b.createdAt : a.date.localeCompare(b.date));
  let running = 0;
  const rows = sorted.map(f=>{
    running += (f.type==='issue' ? Number(f.amount) : -Number(f.amount));
    return {...f, runningBalance: running};
  });
  const totalIncome = sorted.filter(f=>f.type==='issue').reduce((s,f)=>s+Number(f.amount),0);
  const totalExpense = sorted.filter(f=>f.type==='expense').reduce((s,f)=>s+Number(f.amount),0);
  const balance = totalIncome - totalExpense;
  const showScopeCol = scope==='all';

  root.innerHTML = `
    <div class="row-between">

              <td class="${f.type==='issue'?'amt-issue':'amt-expense'}">${f.type==='issue'?'+':'−'}${fmtMoney(f.amount)}</td>
              <td>${escapeHtml(f.purpose||'')}${f.comment?`<div class="desc" style="margin-top:2px;">${escapeHtml(f.comment)}</div>`:''}</td>
              <td>${f.receiptUrl?`<a href="${escapeHtml(f.receiptUrl)}" target="_blank" rel="noopener" style="color:var(--indigo);">🧾 Чек</a>`:'—'}</td>
              <td class="amt-balance">${fmtMoney(f.runningBalance)}</td>
              <td>
                <div class="ledger-actions">
                  <button class="btn ghost small" data-edit-fund="${f.id}" data-fund-scope="${f.scope||'work'}">Изм.</button>
                  <button class="btn danger small" data-del-fund="${f.id}" data-fund-scope="${f.scope||'work'}">✕</button>
