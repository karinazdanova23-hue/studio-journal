      ${r.submitted.length ? `<div class="subtitle" style="margin:8px 0 4px;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;">✅ Сдано в этот день</div><div class="item-list">${r.submitted.map(t=>taskRowHtml(t,'sub')).join('')}</div>` : `<p class="subtitle" style="margin:4px 0;">В этот день ничего не сдано.</p>`}
      ${r.left.length ? `<div class="subtitle" style="margin:12px 0 4px;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;">⏳ Не сдано (срок наступил)</div><div class="item-list">${r.overdue.concat(r.dueDay).map(t=>taskRowHtml(t, t.deadline<st.date?'overdue':'due')).join('')}</div>` : ''}
    `).join('') : `<div class="empty-state"><div class="big">Нет данных за этот день</div><p>Ни сданных задач, ни задач со сроком на этот день.</p></div>`}
    <p class="subtitle" style="margin-top:16px;">Дата нажатия «выполнено» записывается с момента обновления приложения — у задач, закрытых раньше, берётся дата принятия.</p>
  `;
  document.getElementById('day_date').onchange = (e)=>{ st.date = e.target.value || today; render(); };
  document.getElementById('day_emp').onchange = (e)=>{ st.emp = e.target.value; render(); };
  document.getElementById('day_today').onclick = ()=>{ st.date = today; render(); };
  el.querySelectorAll('[data-day-task]').forEach(row=>row.onclick=()=>{
    const t = state.tasksWork.find(x=>x.id===row.dataset.dayTask);
    if(!t) return;
    if(canEditTask(t, false)) openTaskModal(t.id, false); else openTaskViewModal(t);
  });
}

/* ================= REPORT (отчёт о выполненных задачах) ================= */
function reportMarkOk(t){
  return state.reportMark==='marked' ? !!t.inReport : state.reportMark==='unmarked' ? !t.inReport : true;
}
function computeReportTasks(){
  return state.tasksWork.filter(t=>
    reportMarkOk(t) &&
    t.status==='done' && t.completedAt &&
    t.completedAt.slice(0,10) >= state.reportStart && t.completedAt.slice(0,10) <= state.reportEnd &&
    (state.reportEmployee==='all' || t.assigneeId===state.reportEmployee)
  );
}
// Задачи, которые должны были закрыться к концу периода (дедлайн уже наступил), но всё ещё не "Готово".
// Удобно для еженедельной планёрки — сразу видно, что не сделано.
// Раньше здесь дополнительно отсеивались подзадачи (!t.parentId) — из-за этого просроченная
// невыполненная подзадача просто пропадала из отчёта, хотя тот же список «Готово» подзадачи не
// исключает. Убрали лишний фильтр, чтобы отчёт не терял часть задач.
function computeNotDoneTasks(){
  return state.tasksWork.filter(t=>
    reportMarkOk(t) &&
    t.status!=='done' && t.deadline && t.deadline<=state.reportEnd &&
    (state.reportEmployee==='all' || t.assigneeId===state.reportEmployee)
  );
}
function reportTaskWasLate(t){
  return !!(t.deadline && t.completedAt && t.completedAt.slice(0,10) > t.deadline);
}
function reportPctColor(pct){ return pct===null?'var(--ink-soft)':pct>=80?'var(--teal)':pct>=50?'var(--ochre)':'var(--brick)'; }
// Процент выполнения по группам (сотрудник/проект) для отчёта за период. Отдельная функция, а не
// вложенная в renderTaskReport, чтобы тот же расчёт мог использовать и экспорт в CSV.
function computeReportCompletionByGroup(doneTasks, notDoneTasks, groupBy){
  if(groupBy!=='employee' && groupBy!=='project') return null;
  const keyFn = groupBy==='employee' ? (t=>t.assigneeId||'none') : (t=>t.projectId||'none');
  const labelFn = groupBy==='employee'
    ? (key=> key==='none' ? 'Без исполнителя' : empName(key))
    : (key=> key==='none' ? 'Без проекта' : projectName(false,key));
  const map = {};
  doneTasks.forEach(t=>{ const k=keyFn(t); (map[k]=map[k]||{done:0,notDone:0}).done++; });
  notDoneTasks.forEach(t=>{ const k=keyFn(t); (map[k]=map[k]||{done:0,notDone:0}).notDone++; });
  return Object.entries(map).map(([k,v])=>({
    key:k, label:labelFn(k), done:v.done, notDone:v.notDone, total:v.done+v.notDone,
    pct: (v.done+v.notDone)>0 ? Math.round(v.done/(v.done+v.notDone)*100) : null,
  })).sort((a,b)=>b.total-a.total);
}
function renderTaskReport(el){
  const today = todayISO();
  if(!state.reportStart){
    const d = new Date();
    state.reportStart = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  }
  if(!state.reportEnd) state.reportEnd = today;

  const doneTasks = computeReportTasks();
  const notDoneTasks = computeNotDoneTasks();
  const lateTasks = doneTasks.filter(reportTaskWasLate);
  const durations = doneTasks.filter(t=>t.createdDate).map(t=>Math.max(0,(new Date(t.completedAt)-new Date(t.createdDate))/86400000));
  const avgDays = durations.length ? (durations.reduce((a,b)=>a+b,0)/durations.length) : null;

  function rowHtml(t){
    const late = reportTaskWasLate(t);
    return `<div class="item">
      <div class="main">
        <div class="title">${t.inReport?'📌 ':''}${escapeHtml(t.title)}</div>
        <div class="meta">
          ${t.inReport?`<span class="badge" style="background:rgba(176,122,46,0.15);color:var(--ochre);">📌 в отчёт</span>`:''}
          ${t.projectId?`<span>📁 ${escapeHtml(projectName(false,t.projectId))}</span>`:''}
          ${t.blockId?`<span>📦 ${escapeHtml(blockName(t.blockId))}</span>`:''}
          ${t.assigneeId?`<span>${escapeHtml(empName(t.assigneeId))}</span>`:''}
          <span>Срок: ${t.deadline?fmtDeadline(t):'—'}</span>
          <span>Закрыто: ${fmtDate(t.completedAt)}</span>
          ${late?`<span style="color:var(--brick);font-weight:600;">просрочено</span>`:''}
        </div>
        ${t.completionComment?`<div class="desc" style="color:var(--teal);">✅ ${linkifyEscaped(t.completionComment)}</div>`:''}
        ${t.completionLink?`<div class="desc">🔗 <a href="${escapeHtml(t.completionLink)}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;" onclick="event.stopPropagation()">Ссылка на результат</a></div>`:''}
        ${late && t.overdueReason?`<div class="desc" style="color:var(--brick);">⚠️ Причина задержки: ${linkifyEscaped(t.overdueReason)}</div>`:''}
        ${taskLinksHtml(t)}
      </div>
      ${canEditTask(t,false)?`<div class="actions"><button type="button" class="btn ghost small" data-edit-task="${t.id}" title="Изменить задачу">Изм.</button></div>`:''}
    </div>`;
  }
  function notDoneRowHtml(t){
    // Исполнитель может отметить свою задачу выполненной прямо из отчёта (так же, как в Обзоре).
    const mine = !!t.assigneeId && t.assigneeId===state.currentUserId && (t.status==='progress' || t.status==='approval');
    const canDo = mine && canCompleteTask(t, false);
    return `<div class="item">
      ${mine ? `<input type="checkbox" class="task-check${canDo?'':' task-check-locked'}" data-rep-done="${t.id}" ${canDo?'':'disabled'} title="${canDo?'Отметить выполненной':whyCantComplete(t, false)}">` : ''}
      <div class="main">
        <div class="title">${t.inReport?'📌 ':''}${escapeHtml(t.title)}</div>
        <div class="meta">
          ${t.inReport?`<span class="badge" style="background:rgba(176,122,46,0.15);color:var(--ochre);">📌 в отчёт</span>`:''}
          ${t.projectId?`<span>📁 ${escapeHtml(projectName(false,t.projectId))}</span>`:''}
          ${t.blockId?`<span>📦 ${escapeHtml(blockName(t.blockId))}</span>`:''}
          ${t.assigneeId?`<span>${escapeHtml(empName(t.assigneeId))}</span>`:''}
          <span>Срок: ${t.deadline?fmtDeadline(t):'—'}</span>
          <span class="badge" style="background:${t.status==='review'?'var(--ochre-bg,#F3E9D6)':'var(--brick-bg,#F6E2E2)'};color:${t.status==='review'?'var(--ochre)':'var(--brick)'};">${STATUSES[t.status]||t.status}</span>
        </div>
        ${t.description?`<div class="desc">${linkifyEscaped(t.description)}</div>`:''}
        ${t.overdueReason?`<div class="desc" style="color:var(--brick);">⚠️ Причина задержки: ${linkifyEscaped(t.overdueReason)}</div>`:''}
        ${t.reworkNote?`<div class="desc" style="color:var(--brick);">↩️ На доработке: ${linkifyEscaped(t.reworkNote)}</div>`:''}
      </div>
      ${canEditTask(t,false)?`<div class="actions"><button type="button" class="btn ghost small" data-edit-task="${t.id}" title="Изменить задачу">Изм.</button></div>`:''}
    </div>`;
  }
  function groupBlock(label, tasks, rowFn){
    rowFn = rowFn || rowHtml;
    return `
      ${label!==null?`<h3 class="section-title" style="font-size:14.5px;margin:18px 0 8px;">${escapeHtml(label)} <span class="subtitle" style="font-size:12px;">(${tasks.length})</span></h3>`:''}
      <div class="item-list" style="margin-bottom:10px;">${tasks.map(rowFn).join('')}</div>
    `;
  }
  function buildGroupedHtml(tasks, sortKey, rowFn){
    if(!tasks.length) return null;
    if(state.reportGroupBy==='employee'){
      const byEmp = {};
      tasks.forEach(t=>{ const key=t.assigneeId||'none'; (byEmp[key]=byEmp[key]||[]).push(t); });
      const groups = Object.entries(byEmp).map(([empId,ts])=>({
        label: empId==='none' ? 'Без исполнителя' : empName(empId),
        tasks: ts.slice().sort((a,b)=>((state.reportMark==='all' ? (b.inReport?1:0)-(a.inReport?1:0) : 0) || (a[sortKey]||'').localeCompare(b[sortKey]||''))),
      })).sort((a,b)=>b.tasks.length-a.tasks.length);
      return groups.map(g=>groupBlock(g.label, g.tasks, rowFn)).join('');
    } else if(state.reportGroupBy==='project'){
      const byProj = {};
      tasks.forEach(t=>{ const key=t.projectId||'none'; (byProj[key]=byProj[key]||[]).push(t); });
      const groups = Object.entries(byProj).map(([pid,ts])=>({
        label: pid==='none' ? 'Без проекта' : projectName(false,pid),
        tasks: ts.slice().sort((a,b)=>((state.reportMark==='all' ? (b.inReport?1:0)-(a.inReport?1:0) : 0) || (a[sortKey]||'').localeCompare(b[sortKey]||''))),
      })).sort((a,b)=>b.tasks.length-a.tasks.length);
      return groups.map(g=>groupBlock(g.label, g.tasks, rowFn)).join('');
    } else {
      const sorted = tasks.slice().sort((a,b)=>((state.reportMark==='all' ? (b.inReport?1:0)-(a.inReport?1:0) : 0) || (a[sortKey]||'').localeCompare(b[sortKey]||'')));
      return groupBlock(null, sorted, rowFn);
    }
  }

  const doneHtml = buildGroupedHtml(doneTasks, 'completedAt', rowHtml) ||
    `<div class="empty-state"><div class="big">За этот период ничего не завершено</div><p>Попробуйте выбрать другой период</p></div>`;
  const notDoneHtml = buildGroupedHtml(notDoneTasks, 'deadline', notDoneRowHtml) ||
    `<p class="subtitle" style="margin:0;">Не осталось незакрытых задач с истёкшим сроком за этот период 🎉</p>`;

  // Процент выполнения = «Выполнено» / («Выполнено» + «Не выполнено, срок уже наступил»).
  // Общий процент — в карточке сводки; по сотруднику/проекту — отдельным блоком, когда отчёт сгруппирован именно так.
  // Обе функции вынесены на верхний уровень (reportPctColor / computeReportCompletionByGroup),
  // чтобы этот же расчёт мог использовать и экспорт в CSV — не только экран.
  const overallTotal = doneTasks.length + notDoneTasks.length;
  const overallPct = overallTotal ? Math.round(doneTasks.length/overallTotal*100) : null;
  const completionGroups = computeReportCompletionByGroup(doneTasks, notDoneTasks, state.reportGroupBy);
  const completionHtml = (completionGroups && completionGroups.length) ? `
    <h2 class="section-title" style="font-size:16px;">📊 Процент выполнения ${state.reportGroupBy==='employee'?'по сотрудникам':'по проектам'}</h2>
    <div class="item-list" style="margin-bottom:20px;">
      ${completionGroups.map(g=>`
        <div class="item" style="flex-direction:column;align-items:stretch;gap:6px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <span>${escapeHtml(g.label)}</span>
            <span class="mono" style="font-weight:600;color:${reportPctColor(g.pct)};">${g.pct===null?'—':g.pct+'%'}</span>
          </div>
          <div style="height:8px;border-radius:4px;background:var(--paper-line);overflow:hidden;">
            <div style="height:100%;width:${g.pct===null?0:g.pct}%;background:${reportPctColor(g.pct)};border-radius:4px;"></div>
          </div>
          <span class="subtitle" style="margin:0;font-size:11.5px;">Выполнено ${g.done} из ${g.total}${g.notDone?`, не выполнено: ${g.notDone}`:''}</span>
        </div>
      `).join('')}
    </div>
  ` : '';

  el.innerHTML = `
    <div class="field-row" style="align-items:flex-end;">
      <div class="field"><label>С какой даты</label><input type="date" id="rep_start" value="${state.reportStart}"></div>
      <div class="field"><label>По какую дату</label><input type="date" id="rep_end" value="${state.reportEnd}"></div>
      <button class="btn ghost" id="rep_download">⬇️ Скачать отчёт (CSV)</button>
    </div>
    <div class="cat-filters" style="margin-bottom:16px;">
      <button class="cat-chip off" data-rep-period="week">Эта неделя</button>
      <button class="cat-chip off" data-rep-period="month">Этот месяц</button>
      <button class="cat-chip off" data-rep-period="lastmonth">Прошлый месяц</button>
    </div>
    <div class="field-row" style="margin-bottom:16px;max-width:320px;">
      <select id="rep_emp">
        <option value="all" ${state.reportEmployee==='all'?'selected':''}>Все сотрудники</option>
        ${state.employees.map(e=>`<option value="${e.id}" ${state.reportEmployee===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}
      </select>
    </div>
    <div class="cat-filters" style="margin-bottom:16px;">
      <button class="cat-chip ${state.reportGroupBy==='employee'?'':'off'}" data-rep-group="employee">По сотруднику</button>
      <button class="cat-chip ${state.reportGroupBy==='project'?'':'off'}" data-rep-group="project">По проекту</button>
      <button class="cat-chip ${state.reportGroupBy==='date'?'':'off'}" data-rep-group="date">По датам</button>
    </div>
    <div class="cat-filters" style="margin-bottom:16px;">
      <button class="cat-chip ${state.reportMark==='all'?'':'off'}" data-rep-mark="all">Все задачи (📌 сверху)</button>
      <button class="cat-chip ${state.reportMark==='marked'?'':'off'}" data-rep-mark="marked">📌 Только отмеченные для отчёта</button>
      <button class="cat-chip ${state.reportMark==='unmarked'?'':'off'}" data-rep-mark="unmarked">Без отметки</button>
    </div>
    <div class="ledger-summary" style="margin-bottom:20px;">
      <div class="sum-card"><div class="label">Завершено</div><div class="val mono" style="color:var(--indigo);">${doneTasks.length}</div></div>
      <div class="sum-card spent"><div class="label">С опозданием</div><div class="val mono">${lateTasks.length}</div></div>
      <div class="sum-card issued"><div class="label">Средний срок</div><div class="val mono">${avgDays!==null?avgDays.toFixed(1)+' дн.':'—'}</div></div>
      <div class="sum-card" style="background:var(--brick-bg,#F6E2E2);"><div class="label">Не выполнено</div><div class="val mono" style="color:var(--brick);">${notDoneTasks.length}</div></div>
      <div class="sum-card"><div class="label">% выполнено</div><div class="val mono" style="color:${reportPctColor(overallPct)};">${overallPct===null?'—':overallPct+'%'}</div></div>
    </div>
    ${completionHtml}
    <h2 class="section-title" style="font-size:16px;">✅ Выполнено</h2>
    ${doneHtml}
    <h2 class="section-title" style="font-size:16px;margin-top:24px;">❌ Не выполнено (срок уже наступил)</h2>
    ${notDoneHtml}
    <p class="subtitle" style="margin-top:14px;">Личные задачи в отчёт не входят. «Просрочено» — задача закрыта позже указанного в ней срока. В «Не выполнено» попадают задачи с дедлайном на конец выбранного периода или раньше, которые ещё не в статусе «Готово».</p>
  `;

  document.getElementById('rep_start').onchange = (e)=>{ state.reportStart = e.target.value; render(); };
  document.getElementById('rep_end').onchange = (e)=>{ state.reportEnd = e.target.value; render(); };
  document.getElementById('rep_emp').onchange = (e)=>{ state.reportEmployee = e.target.value; render(); };
  document.getElementById('rep_download').onclick = ()=>exportTaskReportCSV();
  // «Выполнено» из отчёта: тот же порядок, что в Обзоре — отчёт исполнителя (комментарий/ссылка) и отправка на проверку.
  el.querySelectorAll('[data-rep-done]').forEach(cb=>{
    cb.onchange = async ()=>{
      const id = cb.dataset.repDone;
      const task = state.tasksWork.find(t=>t.id===id);
      if(!cb.checked) return;
      if(!task || !canCompleteTask(task, false)){ cb.checked=false; toast(task?whyCantComplete(task,false):'Задача не найдена'); return; }
      const isOverdue = !!(task.deadline && task.deadline < todayISO());
      const result = await requestCompletionComment(task.title, isOverdue);
      if(result===null){ cb.checked=false; return; }
      await saveDoneToggle(id, false, result, cb, task);
    };
  });
  // Редактирование задачи прямо из отчёта — то же окно, что и в списке задач.
  el.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.editTask;
    const t = state.tasksWork.find(x=>x.id===id);
    if(!t){ toast('Задача не найдена — обновите страницу'); return; }
    if(!canEditTask(t, false)){ toast(whyCantEdit(t)); return; }
    openTaskModal(id, false);
  });
  el.querySelectorAll('[data-rep-period]').forEach(b=>b.onclick=()=>{
    const now = new Date();
    if(b.dataset.repPeriod==='week'){
      const day = (now.getDay()+6)%7;
      const monday = new Date(now); monday.setDate(now.getDate()-day);
      state.reportStart = monday.toISOString().slice(0,10);
      state.reportEnd = todayISO();
    } else if(b.dataset.repPeriod==='month'){
      state.reportStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
      state.reportEnd = todayISO();
    } else if(b.dataset.repPeriod==='lastmonth'){
      const firstOfThis = new Date(now.getFullYear(), now.getMonth(), 1);
      const lastOfPrev = new Date(firstOfThis - 86400000);
      const firstOfPrev = new Date(lastOfPrev.getFullYear(), lastOfPrev.getMonth(), 1);
      state.reportStart = firstOfPrev.toISOString().slice(0,10);
      state.reportEnd = lastOfPrev.toISOString().slice(0,10);
    }
    render();
  });
  el.querySelectorAll('[data-rep-mark]').forEach(b=>b.onclick=()=>{
    state.reportMark = b.dataset.repMark;
    render();
  });
  el.querySelectorAll('[data-rep-group]').forEach(b=>b.onclick=()=>{
    state.reportGroupBy = b.dataset.repGroup;
    render();
  });
}
function exportTaskReportCSV(){
  const doneTasks = computeReportTasks().slice().sort((a,b)=>(state.reportMark==='all'?(b.inReport?1:0)-(a.inReport?1:0):0) || (a.completedAt||'').localeCompare(b.completedAt||''));
  const notDoneTasks = computeNotDoneTasks().slice().sort((a,b)=>(state.reportMark==='all'?(b.inReport?1:0)-(a.inReport?1:0):0) || (a.deadline||'').localeCompare(b.deadline||''));
  const header = ['В отчёт','Статус','Задача','Проект','Исполнитель','Постановщик','Срок','Дата закрытия','Просрочено','Причина задержки','Комментарий о выполнении','Ссылка на результат','Ссылки'];
  const lines = [header.map(csvEscape).join(';')];
  doneTasks.forEach(t=>{
    lines.push([
      t.inReport?'Да':'',
      'Готово',
      t.title,
      t.projectId?projectName(false,t.projectId):'',
      t.assigneeId?empName(t.assigneeId):'',
      t.creatorId?empName(t.creatorId):'',
      t.deadline?fmtDeadline(t):'',
      t.completedAt?fmtDate(t.completedAt):'',
      reportTaskWasLate(t)?'Да':'Нет',
      t.overdueReason||'',
      t.completionComment||'',
      t.completionLink||'',
      taskLinks(t).join(', '),
    ].map(csvEscape).join(';'));
  });
  notDoneTasks.forEach(t=>{
    lines.push([
      t.inReport?'Да':'',
      'Не выполнено (' + (STATUSES[t.status]||t.status) + ')',
      t.title,
      t.projectId?projectName(false,t.projectId):'',
      t.assigneeId?empName(t.assigneeId):'',
      t.creatorId?empName(t.creatorId):'',
      t.deadline?fmtDeadline(t):'',
      '',
      'Да',
      t.overdueReason||t.reworkNote||'',
      '',
      '',
      taskLinks(t).join(', '),
    ].map(csvEscape).join(';'));
  });

  // \u0418\u0442\u043E\u0433\u043E\u0432\u044B\u0439 \u0431\u043B\u043E\u043A \u0441 % \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u044F \u2014 \u0442\u043E\u0442 \u0436\u0435 \u0440\u0430\u0441\u0447\u0451\u0442, \u0447\u0442\u043E \u0438 \u043D\u0430 \u044D\u043A\u0440\u0430\u043D\u0435 \u043E\u0442\u0447\u0451\u0442\u0430.
  const overallTotal = doneTasks.length + notDoneTasks.length;
  const overallPct = overallTotal ? Math.round(doneTasks.length/overallTotal*100) : null;
  lines.push('');
  lines.push(['\u041F\u0440\u043E\u0446\u0435\u043D\u0442 \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u044F'].map(csvEscape).join(';'));
  lines.push(['\u0412\u0441\u0435\u0433\u043E \u0437\u0430\u0434\u0430\u0447', String(overallTotal)].map(csvEscape).join(';'));
  lines.push(['\u0412\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u043E', String(doneTasks.length)].map(csvEscape).join(';'));
  lines.push(['\u041D\u0435 \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u043E', String(notDoneTasks.length)].map(csvEscape).join(';'));
  lines.push(['% \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u043E', overallPct===null?'\u2014':overallPct+'%'].map(csvEscape).join(';'));
  const completionGroups = computeReportCompletionByGroup(doneTasks, notDoneTasks, state.reportGroupBy);
  if(completionGroups && completionGroups.length){
    lines.push('');
    lines.push([state.reportGroupBy==='employee' ? '\u041F\u043E \u0441\u043E\u0442\u0440\u0443\u0434\u043D\u0438\u043A\u0443' : '\u041F\u043E \u043F\u0440\u043E\u0435\u043A\u0442\u0443', '\u0412\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u043E', '\u041D\u0435 \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u043E', '\u0412\u0441\u0435\u0433\u043E', '%'].map(csvEscape).join(';'));
    completionGroups.forEach(g=>{
      lines.push([g.label, String(g.done), String(g.notDone), String(g.total), g.pct===null?'\u2014':g.pct+'%'].map(csvEscape).join(';'));
    });
  }

  const csv = '\uFEFF' + lines.join('\r\n');
  downloadTextFile(`otchet-zadachi-${state.reportStart}--${state.reportEnd}.csv`, 'text/csv;charset=utf-8', csv);
}

/* ================= ANALYTICS: время на встречах ================= */
// Считаем все рабочие события, в разрезе «назначения» (info/feedback/control/solutions/other; у старых
// событий без назначения — none). Длительность — по времени начала/конца.
function purposeKey(e){ return PURPOSE_LABELS[e.purpose] && e.purpose!=='none' ? e.purpose : 'none'; }
function timeToMin(t){
  const m = /^(\d{1,2}):(\d{2})$/.exec(t||'');
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function eventDurationMin(e){
  const a = timeToMin(e.startTime), b = timeToMin(e.endTime);
  if(a===null || b===null || b<=a) return null; // длительность неизвестна
  return b - a;
}
function fmtDur(min){
  min = Math.round(min||0);
  if(!min) return '0 ч';
  const h = Math.floor(min/60), m = min%60;
  return (h ? h+' ч' : '') + (h && m ? ' ' : '') + (m ? m+' мин' : '');
}
function analyticsRange(mode, anchorISO){
  const d = new Date(anchorISO+'T00:00:00');
  let from, to, label;
  const MON = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  if(mode==='week'){
    const wd = (d.getDay()+6)%7;
    from = new Date(d); from.setDate(d.getDate()-wd);
    to = new Date(from); to.setDate(from.getDate()+6);
    label = `${fmtDate(dateToISO(from))} — ${fmtDate(dateToISO(to))}`;
  } else if(mode==='quarter'){
    const q = Math.floor(d.getMonth()/3);
    from = new Date(d.getFullYear(), q*3, 1);
    to = new Date(d.getFullYear(), q*3+3, 0);
    label = `${q+1} квартал ${d.getFullYear()}`;
  } else if(mode==='year'){
    from = new Date(d.getFullYear(), 0, 1);
    to = new Date(d.getFullYear(), 11, 31);
    label = `${d.getFullYear()} год`;
  } else {
    from = new Date(d.getFullYear(), d.getMonth(), 1);
    to = new Date(d.getFullYear(), d.getMonth()+1, 0);
    label = `${MON[d.getMonth()]} ${d.getFullYear()}`;
  }
  return {from:dateToISO(from), to:dateToISO(to), label};
}
function shiftAnalyticsAnchor(mode, anchorISO, dir){
  const d = new Date(anchorISO+'T00:00:00');
  if(mode==='week') d.setDate(d.getDate()+7*dir);
  else if(mode==='quarter') d.setMonth(d.getMonth()+3*dir);
  else if(mode==='year') d.setFullYear(d.getFullYear()+dir);
  else d.setMonth(d.getMonth()+dir, 1);
  return dateToISO(d);
}
// Считает время на встречах по сотрудникам за период. Возвращает строки, отсортированные по убыванию времени.
function computeMeetingStats(fromISO, toISO, pastOnly, employees, events, nowDate, cats){
  const today = dateToISO(nowDate || new Date());
  const on = c => !cats || cats[c]!==false;
  const meetings = events.filter(e=> normCat(e.category)==='work' && on(purposeKey(e)) && e.date>=fromISO && e.date<=toISO && (!pastOnly || e.date<=today));
  const rows = employees.map(emp=>{
    const mine = meetings.filter(e=>(e.employeeIds||[]).includes(emp.id)).sort((a,b)=> a.date===b.date ? (a.startTime||'').localeCompare(b.startTime||'') : a.date.localeCompare(b.date));
    const by = {}; MEETING_CATS.forEach(k=>by[k]=0);
    let unknown = 0;
    mine.forEach(e=>{
      const dur = eventDurationMin(e);
      if(dur===null){ unknown++; return; }
      by[purposeKey(e)] += dur;
    });
    const totalMin = MEETING_CATS.reduce((sum,k)=>sum+by[k],0);
    return {emp, count:mine.length, by, totalMin, unknown, list:mine};
  });
  rows.sort((a,b)=> b.totalMin-a.totalMin || b.count-a.count || a.emp.name.localeCompare(b.emp.name));
  return {rows, meetingsTotal:meetings.length};
}
/* ================= РЕГЛАМЕНТЫ: у кого сейчас в работе ================= */
// Общий список state.regs хранится под ключом 'regs:list'. Регламент:
//   {id, title, priority:1|2|3, stage:'todo'|'work'|'review'|'done', link, note,
//    holderId (null — не назначен), since (дата, с которой он у текущего держателя),
//    createdAt, doneAt, moves:[{id,date,from,to,note,by,stage}]}
const REG_STAGES = {todo:'Не начат', work:'В работе', review:'На проверке', done:'Утверждён'};
const REG_PRIORITIES = {1:'Приоритет 1', 2:'Приоритет 2', 3:'Приоритет 3'};
const REG_SEED = [
  {title:'Генеральная уборка', priority:1}, {title:'Касса', priority:1}, {title:'Конфликты', priority:1},
  {title:'Смены администраторов', priority:1}, {title:'Снабжение', priority:1},
  {title:'Передача смены', priority:2}, {title:'Поломка техники', priority:2}, {title:'ЧП (чрезвычайные ситуации)', priority:2},
];
function regDayDiff(fromISO, toISO){
  if(!fromISO || !toISO) return 0;
  const a = Date.parse(fromISO+'T00:00:00Z'), b = Date.parse(toISO+'T00:00:00Z');
  return Math.max(0, Math.round((b-a)/86400000));
}
function regDaysWord(n){
  const m10 = n%10, m100 = n%100;
  if(m10===1 && m100!==11) return 'день';
  if(m10>=2 && m10<=4 && (m100<10 || m100>=20)) return 'дня';
  return 'дней';
}
// Путь регламента: сколько дней он был у каждого держателя (по порядку), последний отрезок — текущий.
function computeRegPath(reg, today){
  const moves = (reg.moves||[]).slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'') );
  const segs = [];
  let holder = moves.length ? moves[0].from : reg.holderId;
  let start = reg.createdAt || (moves[0] && moves[0].date) || today;
  moves.forEach(m=>{
    segs.push({holderId: holder, from: start, to: m.date, days: regDayDiff(start, m.date), current:false});
    holder = m.to; start = m.date;
  });
  const end = reg.stage==='done' && reg.doneAt ? reg.doneAt : today;
  segs.push({holderId: holder, from: start, to: end, days: regDayDiff(start, end), current: reg.stage!=='done'});
  return segs;
}
// Колонки доски: три ключевые роли всегда, плюс все остальные, у кого что-то лежит, плюс «Не назначен».
function computeRegColumns(regs, employees){
  const open = regs.filter(r=>r.stage!=='done');
  const key = ['Руководитель','Ассистент','Старший администратор'];
  const cols = [];
  const seen = new Set();
  key.forEach(role=>{
    employees.filter(e=>e.role===role).forEach(e=>{ cols.push({id:e.id, name:e.name, role:e.role}); seen.add(e.id); });
  });
  open.forEach(r=>{
    if(r.holderId && !seen.has(r.holderId)){
      const e = employees.find(x=>x.id===r.holderId);
      cols.push({id:r.holderId, name:e?e.name:'(сотрудник удалён)', role:e?e.role:''}); seen.add(r.holderId);
    }
  });
  if(open.some(r=>!r.holderId || (r.holderId && !seen.has(r.holderId)))) cols.push({id:null, name:'Не назначен', role:''});
  return cols.map(c=>({...c, items: open.filter(r=>(r.holderId||null)===c.id)}));
}

async function loadRegs(force){
  const st = state.regsState;
  if(st.loading) return;
  if(!force && st.loadedAt && Date.now()-st.loadedAt < 60000) return;
  st.loading = true;
  const r = await sGetState('regs:list', true);
  st.loading = false;
  if(r.status==='ok'){
    let arr = []; try{ arr = JSON.parse(r.value); }catch(e){ arr = null; }
    if(Array.isArray(arr)){ state.regs = arr; st.error = false; st.loadedAt = Date.now(); }
    else { st.error = true; }
  } else if(r.status==='missing'){ state.regs = []; st.error = false; st.loadedAt = Date.now(); }
  else if(r.status==='failed'){ st.error = true; }
  if(state.tab==='regs' || state.tab==='overview') render();
}
// Любое изменение: берём свежий список с сервера, применяем правку к нему и сохраняем (чтобы не
// затереть то, что за это время поменял кто-то другой). Читать не удалось — НЕ пишем.
async function mutateRegs(mutator){
  const r = await sGetState('regs:list', true);
  let base;
  if(r.status==='ok'){ try{ base = JSON.parse(r.value); }catch(e){ base = null; } if(!Array.isArray(base)){ toast('⚠️ Не удалось прочитать список регламентов — изменение не сохранено'); return false; } }
  else if(r.status==='missing'){ base = []; }
  else { if(r.status==='failed') toast('⚠️ Нет связи с сервером — изменение не сохранено, повторите'); return false; }
  const next = mutator(base.map(x=>({...x})));
  if(!next) return false;
  const ok = await sSet('regs:list', JSON.stringify(next), true);
  if(!ok){ saveFailedToast(); return false; }
  state.regs = next; state.regsState.loadedAt = Date.now(); state.regsState.error = false;
  return true;
}

      lt.length, lt.filter(t=>t.status==='done').length, total, (r.moves||[]).filter(m=>m.from!==m.to).length,
      segs.map(s=>`${regHolderName(s.holderId)} ${s.days} дн.`).join(' → ')].map(csvEscape).join(';'));
  });

// Аналитика движения регламентов: по людям (сколько регламентов прошло, сколько дней держит) и по регламентам.
function computeRegStats(regs, today){
  const people = {};
  const per = regs.map(r=>{
    const segs = computeRegPath(r, today);
    segs.forEach(sg=>{
      const k = sg.holderId||'—';
      const p = people[k] || (people[k] = {id:sg.holderId||null, regIds:new Set(), days:0, holds:0, doneHolds:0, doneDays:0, current:0, overdue:0, maxHold:0});
      p.regIds.add(r.id); p.days += sg.days; p.holds++; p.maxHold = Math.max(p.maxHold, sg.days);
      if(!sg.current){ p.doneHolds++; p.doneDays += sg.days; }
      if(sg.current && r.stage!=='done'){ p.current++; if(r.deadline && r.deadline<today) p.overdue++; }
    });
    const total = regDayDiff(r.createdAt||today, r.stage==='done'&&r.doneAt?r.doneAt:today);
    return {reg:r, segs, total, handoffs:(r.moves||[]).filter(m=>m.from!==m.to).length,
      stuck: r.stage!=='done' ? segs[segs.length-1].days : 0,
      overdue: !!(r.deadline && r.stage!=='done' && r.deadline<today)};
  });
  const doneRows = per.filter(x=>x.reg.stage==='done');
  return {
    people: Object.values(people).map(p=>({...p, regCount:p.regIds.size, avgHold: p.holds? p.days/p.holds : 0})).sort((a,b)=>b.days-a.days),
    per, doneCount: doneRows.length,
    avgToDone: doneRows.length ? doneRows.reduce((s,x)=>s+x.total,0)/doneRows.length : null,
    overdueCount: per.filter(x=>x.overdue).length,
    stuckCount: per.filter(x=>x.stuck>=7).length,
  };
}

// Разбор строк вида «Название (приоритет)»; без числа в скобках — приоритет 1.
function parseRegBulk(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m = l.match(/^(.*?)\s*\((\d)\)\s*$/);
    const pr = m ? parseInt(m[2],10) : 1;
    return {title:(m?m[1]:l).trim(), priority:[1,2,3].includes(pr)?pr:1};
  }).filter(x=>x.title);
}

  root.querySelectorAll('[data-rg-toggle]').forEach(b=> b.onclick = ()=>{ st.openId = st.openId===b.dataset.rgToggle ? null : b.dataset.rgToggle; render(); });
  root.querySelectorAll('[data-rg-task]').forEach(b=> b.onclick = ()=>{
    const t = state.tasksWork.find(x=>x.id===b.dataset.rgTask); if(!t) return;
    if(canEditTask(t,false)) openTaskModal(t.id,false); else openTaskViewModal(t);
  });
  root.querySelectorAll('[data-rg-stage]').forEach(b=> b.onclick = async ()=>{
    const [rid, stg] = b.dataset.rgStage.split(':');
    const reg = state.regs.find(x=>x.id===rid); if(!reg) return;
    if(stg==='done' && !await showConfirm(`Отметить регламент «${reg.title}» готовым?`, 'Готово')) return;
    const today = todayISO();
    const ok = await mutateRegs(a=> a.map(x=> x.id!==rid ? x : {...x, stage:stg, doneAt: stg==='done'?today:null,
      moves:(x.moves||[]).concat([{id:uid(), date:today, from:x.holderId||null, to:x.holderId||null, note: stg==='done'?'Утверждён':'Возвращён в работу', by:state.currentUserId, stage:stg}])}));
    if(ok){ logAudit('reg_moved', `«${reg.title}»: этап → ${REG_STAGES[stg]}`); toast(stg==='done'?'Регламент готов':'Возвращён в работу'); render(); }
  });
  root.querySelectorAll('[data-rg-move]').forEach(b=> b.onclick = ()=>openRegMoveModal(b.dataset.rgMove));
  root.querySelectorAll('[data-rg-edit]').forEach(b=> b.onclick = ()=>openRegEditModal(b.dataset.rgEdit));

// ================= B2B: заявки от бизнеса, воронка, клиентская база =================
// Всё хранится под одним общим ключом 'b2b:data': { clients:[], leads:[], schedule:{ empId: 'YYYY-MM-DD' } }
// clients: {id,name,person,position,phone,instagram,niche,activity,staff,address,note,createdAt}
// leads:   {id,clientId,direction:'in'|'out',source,createdAt,managerId,stage,deadline,
//           meetingKind,meetingDate,meetingTime,meetingDoneDate,kpDate,forecast,dealSum,comment,
//           lostReason,prevStage,doneAt,log:[{date,stage,note,by}]}
// schedule: первый день любой рабочей пары менеджера (график 2/2: 2 рабочих дня, 2 выходных)
const B2B_STAGES = {new:'Новая заявка', meet:'Встреча / звонок', kp:'Готовим КП', sent:'КП отправлено', won:'Сделка ✅', lost:'Отказ'};
const B2B_OPEN = ['new','meet','kp','sent'];
const B2B_SOURCES = ['Входящая заявка (сайт)','Соцсети','Мероприятие','Рекомендация','Звонок / обзвон','Лично','Другое'];
function b2bAccess(){ return hasRole('Руководитель','Ассистент','Менеджер'); }
function b2bLeader(){ return hasRole('Руководитель','Ассистент'); }
function b2bIsOpen(l){ return B2B_OPEN.includes(l.stage); }

function isoParse(s){ const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function isoOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isoAdd(s,n){ const d=isoParse(s); d.setDate(d.getDate()+n); return isoOf(d); }
function isoDiff(a,b){ const x=isoParse(a), y=isoParse(b); return Math.round((Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())-Date.UTC(y.getFullYear(),y.getMonth(),y.getDate()))/864e5); }
function b2bMoney(n){ return (Number(n)||0).toLocaleString('ru-RU')+' ₽'; }

function b2bManagers(){ return state.employees.filter(e=>e.role==='Менеджер'); }
// true — работает, false — выходной, null — график не задан
function b2bWorks(empId, iso){
  const a = state.b2b && state.b2b.schedule && state.b2b.schedule[empId];
  if(!empId || !a) return null;
  const k = ((isoDiff(iso, a) % 4) + 4) % 4;
  return k < 2;
}
// ближайший рабочий день менеджера: строго после fromIso (или включая его, если inclusive)
function b2bNextWork(empId, fromIso, inclusive){
  const start = inclusive ? fromIso : isoAdd(fromIso, 1);
  for(let i=0;i<8;i++){ const d = isoAdd(start,i); if(b2bWorks(empId,d)!==false) return d; }
  return start;
}
// кто из менеджеров сегодня на смене; если их двое — у кого меньше открытых заявок
function b2bPickManager(iso){
  const on = b2bManagers().filter(e=>b2bWorks(e.id,iso)===true);
  if(!on.length) return '';
  const load = id => (state.b2b?state.b2b.leads:[]).filter(l=>b2bIsOpen(l) && l.managerId===id).length;
  return on.slice().sort((a,b)=>load(a.id)-load(b.id))[0].id;
}
function b2bNormalize(o){
  const base = (o && typeof o==='object' && !Array.isArray(o)) ? o : {};
  return {clients:Array.isArray(base.clients)?base.clients:[], leads:Array.isArray(base.leads)?base.leads:[], schedule:(base.schedule&&typeof base.schedule==='object')?base.schedule:{},
    pipelines:(Array.isArray(base.pipelines)&&base.pipelines.length)?base.pipelines:[{id:'main', name:'Основная'}],
    lostReasons:Array.isArray(base.lostReasons)?base.lostReasons:[],
    fields:Array.isArray(base.fields)?base.fields:null, robots:Array.isArray(base.robots)?base.robots:null};
}
async function loadB2B(force){
  const st = state.b2bState;
  if(st.loading) return;
  if(!force && st.loadedAt && Date.now()-st.loadedAt < 60000) return;
  st.loading = true;
  const r = await sGetState('b2b:data', true);
  st.loading = false;
  if(r.status==='ok'){
    let o = null; try{ o = JSON.parse(r.value); }catch(e){}
    if(o && typeof o==='object'){ state.b2b = b2bNormalize(o); st.error=false; st.loadedAt=Date.now(); } else st.error = true;
  } else if(r.status==='missing'){ state.b2b = b2bNormalize(null); st.error=false; st.loadedAt=Date.now(); }
  else if(r.status==='failed'){ st.error = true; }
  if(state.tab==='b2b' || state.tab==='overview') render();
}
// как и у регламентов: берём свежие данные, применяем правку, сохраняем. Не прочитали — не пишем.
async function mutateB2B(mutator, opts){
  const r = await sGetState('b2b:data', true);
  let base;
  if(r.status==='ok'){ let o=null; try{ o=JSON.parse(r.value); }catch(e){} if(!o || typeof o!=='object'){ toast('⚠️ Не удалось прочитать B2B-данные — изменение не сохранено'); return false; } base = b2bNormalize(o); }
  else if(r.status==='missing'){ base = b2bNormalize(null); }
  else { if(r.status==='failed') toast('⚠️ Нет связи с сервером — изменение не сохранено, повторите'); return false; }
  const copy = {clients:base.clients.map(x=>({...x})), leads:base.leads.map(x=>({...x, log:(x.log||[]).slice(), tasks:(x.tasks||[]).slice(), tags:(x.tags||[]).slice(), links:(x.links||[]).slice(), custom:{...(x.custom||{})}, fired:(x.fired||[]).slice()})), schedule:{...base.schedule}, pipelines:base.pipelines.map(x=>({...x})), lostReasons:base.lostReasons.map(x=>({...x})), fields:base.fields?base.fields.map(x=>({...x})):null, robots:base.robots?base.robots.map(x=>({...x})):null};
  const next = mutator(copy);
  if(!next) return false;
  if(!(opts && opts.skipRobots)) b2bApplyRobots(next, false);
  const ok = await sSet('b2b:data', JSON.stringify(next), true);
  if(!ok){ saveFailedToast(); return false; }
  state.b2b = next; state.b2bState.loadedAt = Date.now(); state.b2bState.error = false;
  await b2bReconcileTasks();
  return true;
}
function b2bPipeOf(l){ return l.pipelineId || 'main'; }
function b2bPipeName(id){ const p=(state.b2b?state.b2b.pipelines:[]).find(x=>x.id===id); return p?p.name:'Основная'; }
function b2bAllTags(){ const set=new Set(); (state.b2b?state.b2b.leads:[]).forEach(l=>(l.tags||[]).forEach(t=>set.add(t))); return [...set].sort((a,b)=>a.localeCompare(b,'ru')); }
function b2bParseTags(str){ return [...new Set(String(str||'').split(',').map(x=>x.trim()).filter(Boolean))]; }
function b2bTagChips(l){ return (l.tags||[]).map(t=>`<span class="badge prio-low" style="margin-right:3px;">#${escapeHtml(t)}</span>`).join(''); }
function b2bClient(id){ return state.b2b ? state.b2b.clients.find(c=>c.id===id) : null; }
function b2bClientName(l){ const c = b2bClient(l.clientId); return c ? c.name : '(клиент удалён)'; }
function b2bLogEntry(stage, note){ return {date:todayISO(), ts:Date.now(), stage, note:note||'', by:state.currentUserId}; }

// ---------- карточка заявки ----------
function b2bNextAction(l){
  if(l.stage==='new') return 'Решить: сразу КП или встреча / звонок';
  if(l.stage==='meet') return `${l.meetingKind==='call'?'Звонок':'Встреча'}${l.meetingDate?' '+fmtDate(l.meetingDate):''}${l.meetingTime?' в '+l.meetingTime:''}`;
  if(l.stage==='kp') return 'Подготовить и отправить КП';
  if(l.stage==='sent') return 'Связаться по КП, узнать решение';
  return '';
}
function b2bLeadCard(l, today, open){
  const c = b2bClient(l.clientId) || {};
  const due = b2bDue(l);
  const over = !!due && due<today;

    meet: `<button class="btn small" data-b2-act="${l.id}:done">Проведена → КП</button><button class="btn ghost small" data-b2-act="${l.id}:meet">Перенести</button>`,
    kp: `<button class="btn small" data-b2-act="${l.id}:sent">КП отправлено</button>`,
    sent: `<button class="btn small" data-b2-act="${l.id}:won">Сделка ✓</button>`,
  }[l.stage] || `<button class="btn small" data-b2-act="${l.id}:reopen">↩ Вернуть в работу</button>`;
  return `<div class="item" style="display:block;" data-b2-id="${l.id}" draggable="true">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
      <strong style="cursor:pointer;" data-b2-toggle="${l.id}">${escapeHtml(b2bClientName(l))}</strong>
      <span class="badge ${l.direction==='out'?'prio-med':'prio-low'}">${l.direction==='out'?'⬆ исходящая':'⬇ входящая'}</span>
    </div>
    <div class="subtitle" style="margin:2px 0;font-size:12.5px;">${[c.person, c.phone?`<a href="tel:${escapeHtml(String(c.phone).replace(/[^\d+]/g,''))}">${escapeHtml(c.phone)}</a>`:'', escapeHtml(l.source||'')].filter(Boolean).join(' · ')}</div>
    <div class="subtitle" style="font-size:12.5px;">👤 ${escapeHtml(l.managerId?empName(l.managerId):'Не назначен')} · заведена ${fmtDate(l.createdAt)}</div>
    ${(l.tags||[]).length?`<div style="margin-top:2px;">${b2bTagChips(l)}</div>`:''}
    ${(()=>{ const rs=b2bClientStats(l.clientId,l.id); return rs.others.length?`<div class="subtitle" style="font-size:12.5px;">🔁 ${rs.won?`уже ${rs.won} сделк. на ${b2bMoney(rs.sum)}`:'есть другие заявки: '+rs.others.length}</div>`:''; })()}
    ${(l.links||[]).length?`<div class="subtitle" style="font-size:12.5px;">📎 документов: ${l.links.length}</div>`:''}
    ${b2bIsOpen(l)?`<div style="font-size:13px;margin-top:4px;">${escapeHtml(b2bNextAction(l))}</div>`:''}
    ${b2bIsOpen(l)&&!due?`<div class="subtitle" style="font-size:12.5px;color:var(--brick);font-weight:600;">⚠ нет следующего шага</div>`:''}
    ${due?`<div class="subtitle" style="font-size:12.5px;${over?'color:var(--brick);font-weight:600;':isToday?'color:var(--ochre);font-weight:600;':''}">⏰ ${isToday?'сегодня':fmtDate(due)}${over?' — просрочено':''}${off?' ⚠️ у менеджера выходной':''}</div>`:''}
    ${l.stage==='won'?`<div class="subtitle" style="font-size:12.5px;">💰 ${b2bMoney(l.dealSum||l.forecast)} · ${l.doneAt?fmtDate(l.doneAt):''}</div>`:(l.forecast?`<div class="subtitle" style="font-size:12.5px;">💰 прогноз ${b2bMoney(l.forecast)}</div>`:'')}
    ${l.stage==='lost'&&l.lostReason?`<div class="subtitle" style="font-size:12.5px;">Причина: ${escapeHtml(l.lostReason)}</div>`:''}
    ${ot.length?`<div class="subtitle" style="font-size:12.5px;">☑ задач: ${ot.length}</div>`:''}
    ${l.comment?`<div class="subtitle" style="font-size:12.5px;">💬 ${escapeHtml(l.comment)}</div>`:''}
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
      ${stBtns}
      ${b2bIsOpen(l)?`<button class="btn ghost small" data-b2-act="${l.id}:lost">Отказ</button>`:''}
      <button class="btn ghost small" data-b2-act="${l.id}:transfer">↔ Передать</button>
      <button class="btn ghost small" data-b2-edit="${l.id}">Изм.</button>
    </div>

      ${[c.position?'Должность: '+escapeHtml(c.position):'', c.niche?'Ниша: '+escapeHtml(c.niche):'', c.activity?'Деятельность: '+escapeHtml(c.activity):'', c.staff?'Штат: '+escapeHtml(c.staff):'', c.address?'Адрес: '+escapeHtml(c.address):'', c.instagram?'Instagram: '+escapeHtml(c.instagram):''].filter(Boolean).map(x=>`<div>${x}</div>`).join('')}

// ---------- главный экран ----------
function renderB2B(root){
  if(!b2bAccess()){ root.innerHTML = accessDeniedScreen('B2B доступен Руководителю, Ассистенту и менеджерам по продажам.'); return; }
  const st = state.b2bState;
  { const wr = document.querySelector('.wrap'); if(wr && st.view==='funnel') wr.style.maxWidth = 'min(1900px,98vw)'; }
  if(st.mgr===null || st.mgr===undefined) st.mgr = (hasRole('Менеджер') && !b2bLeader()) ? 'me' : 'all';
  if(state.b2b===null){
    if(!st.loading && !st.error) loadB2B(true);
    root.innerHTML = st.error
      ? `<div class="empty">Не удалось загрузить B2B. <button class="btn small" id="b2Retry">Повторить</button></div>`
      : `<div class="empty">Загрузка…</div>`;
    const b = root.querySelector('#b2Retry'); if(b) b.onclick = ()=>{ st.error=false; loadB2B(true); render(); };
    return;
  }
  loadB2B(false);
  const today = todayISO();
  const q = (st.q||'').trim().toLowerCase();
  const mgrId = st.mgr==='me' ? state.currentUserId : st.mgr;
  if(!state.b2b.pipelines.some(x=>x.id===st.pipe)) st.pipe = state.b2b.pipelines[0].id;
  const match = l=>{
    if(b2bPipeOf(l)!==st.pipe) return false;
    if(st.tag!=='all' && !(l.tags||[]).includes(st.tag)) return false;
    if(st.noStep && !(b2bIsOpen(l) && !b2bDue(l))) return false;
    if(st.dir!=='all' && l.direction!==st.dir) return false;
    if(mgrId!=='all' && (l.managerId||'')!==(mgrId==='none'?'':mgrId)) return false;
    if(q){ const c=b2bClient(l.clientId)||{}; const hay=[c.name,c.person,c.phone,c.niche,l.source,l.comment].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  };
  const leads = state.b2b.leads.filter(match);
  const open = leads.filter(b2bIsOpen);
  const closed = leads.filter(l=>!b2bIsOpen(l));
  const onShift = b2bManagers().filter(e=>b2bWorks(e.id,today)===true).map(e=>e.name);
  const overdueN = open.filter(l=>b2bDue(l) && b2bDue(l)<today).length;
  const noStepN = state.b2b.leads.filter(l=>b2bPipeOf(l)===st.pipe && b2bIsOpen(l) && !b2bDue(l)).length;
  const mgrOpts = `<option value="all" ${st.mgr==='all'?'selected':''}>Все менеджеры</option><option value="me" ${st.mgr==='me'?'selected':''}>Мои</option>` +
    b2bManagers().filter(e=>e.id!==state.currentUserId).map(e=>`<option value="${e.id}" ${st.mgr===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('') +
    `<option value="none" ${st.mgr==='none'?'selected':''}>Не назначен</option>`;
  const views = {funnel:'📋 Воронка', today:'✅ К выполнению', clients:'👥 Клиенты', stats:'📈 Статистика'};
  let body = '';
  if(st.view==='today'){
    const rows = open.slice().sort((a,b)=>(b2bDue(a)||'9999').localeCompare(b2bDue(b)||'9999'));
    const groups = [
      ['🔴 Просрочено', rows.filter(l=>b2bDue(l) && b2bDue(l)<today)],
      ['🟠 Сегодня', rows.filter(l=>b2bDue(l)===today)],
      ['🟡 Ближайшие 7 дней', rows.filter(l=>b2bDue(l)>today && b2bDue(l)<=isoAdd(today,7))],
      ['⚪ Позже / без срока', rows.filter(l=>!b2bDue(l) || b2bDue(l)>isoAdd(today,7))],

        const ls = state.b2b.leads.filter(l=>l.clientId===c.id); const op = ls.filter(b2bIsOpen).length;
        return `<div class="item" style="display:block;">
          <strong>${escapeHtml(c.name)}</strong>

          ${c.niche||c.activity?`<div class="subtitle" style="font-size:12.5px;">${escapeHtml([c.niche,c.activity].filter(Boolean).join(' · '))}</div>`:''}
          ${c.note?`<div class="subtitle" style="font-size:12.5px;">💬 ${escapeHtml(c.note)}</div>`:''}
          <div class="subtitle" style="font-size:12.5px;margin-top:3px;">Заявок: ${ls.length}${op?` (в работе ${op})`:''}${(()=>{ const w=ls.filter(l=>l.stage==='won'); return w.length?` · сделок: ${w.length} на ${b2bMoney(w.reduce((a,l)=>a+(Number(l.dealSum||l.forecast)||0),0))}`:''; })()}</div>
          <div style="display:flex;gap:6px;margin-top:8px;"><button class="btn small" data-b2-newlead="${c.id}">+ Заявка</button><button class="btn ghost small" data-b2-client="${c.id}">Изм.</button></div>
        </div>`; }).join('')}</div>` : `<div class="empty" style="padding:20px;text-align:center;">Клиентов пока нет — они появятся при добавлении заявок.</div>`);
  } else if(st.view==='stats'){

  }
  root.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;">
      <div><h2 style="margin:0;font-size:20px;">🤝 B2B — заявки от бизнеса</h2>

  const pe = $('#b2PipeEdit'); if(pe) pe.onclick = async ()=>{

  b2bWireFunnel(root);
  root.querySelectorAll('[data-b2-edit]').forEach(b=>b.onclick=()=>openB2bLeadModal(b.dataset.b2Edit));
  root.querySelectorAll('[data-b2-act]').forEach(b=>b.onclick=()=>{ const [id,k]=b.dataset.b2Act.split(':'); if(k==='transfer') openB2bTransferModal(id); else openB2bStepModal(id,k); });

  root.querySelectorAll('[data-b2-newlead]').forEach(b=>b.onclick=()=>openB2bLeadModal(null, b.dataset.b2Newlead));

function b2bStatsHTML(leads){
  const all = leads;
  const reached = l=>!!l.kpDate || l.stage==='sent' || l.stage==='won';
  const sum = a=>a.reduce((s,l)=>s+(Number(l.forecast)||0),0);
  const won = all.filter(l=>l.stage==='won');
  const wonSum = won.reduce((s,l)=>s+(Number(l.dealSum||l.forecast)||0),0);
  const openForecast = sum(all.filter(b2bIsOpen));
  const pct = (a,b)=> b? Math.round(a/b*100)+'%' : '—';
  const row = (name, ls)=>`<tr><td>${escapeHtml(name)}</td><td>${ls.length}</td><td>${ls.filter(reached).length}</td><td>${ls.filter(l=>l.stage==='won').length}</td><td>${ls.filter(l=>l.stage==='lost').length}</td><td>${pct(ls.filter(l=>l.stage==='won').length, ls.length)}</td></tr>`;
  const th = first=>`<tr><th style="text-align:left;">${first}</th><th>Заявок</th><th>Дошли до КП</th><th>Сделок</th><th>Отказов</th><th>Конверсия</th></tr>`;
  const sources = [...new Set(all.map(l=>l.source||'Не указан'))];
  const mgrs = [...new Set(all.map(l=>l.managerId||''))];
  const stageRows = Object.keys(B2B_STAGES).map(s=>`<div style="display:flex;justify-content:space-between;padding:2px 0;"><span>${B2B_STAGES[s]}</span><strong>${all.filter(l=>l.stage===s).length}</strong></div>`).join('');
  const tbl = `style="width:100%;border-collapse:collapse;font-size:13.5px;"`;
  return `<div class="ledger-summary" style="margin-bottom:16px;">
      <div class="sum-card"><div class="label">Всего заявок</div><div class="val mono">${all.length}</div></div>
      <div class="sum-card"><div class="label">Входящих / исходящих</div><div class="val mono">${all.filter(l=>l.direction!=='out').length} / ${all.filter(l=>l.direction==='out').length}</div></div>
      <div class="sum-card"><div class="label">Прогноз по открытым</div><div class="val mono">${b2bMoney(openForecast)}</div></div>
      <div class="sum-card"><div class="label">Сделки (сумма)</div><div class="val mono" style="color:var(--teal);">${b2bMoney(wonSum)}</div></div>
    </div>
    <div style="max-width:420px;margin-bottom:16px;"><strong>Сейчас по этапам</strong>${stageRows}</div>
    <div style="overflow-x:auto;margin-bottom:16px;"><strong>По источникам</strong><table ${tbl}>${th('Источник')}${sources.map(s=>row(s, all.filter(l=>(l.source||'Не указан')===s))).join('')}</table></div>
    <div style="overflow-x:auto;"><strong>По менеджерам</strong><table ${tbl}>${th('Менеджер')}${mgrs.map(m=>row(m?empName(m):'Не назначен', all.filter(l=>(l.managerId||'')===m))).join('')}</table></div>
    ${b2bLostStatsHTML(all)}
    <div class="subtitle" style="margin-top:8px;">Считается по заявкам выбранной воронки, подходящим под фильтры (направление, менеджер, тег, поиск).</div>`;
}

function exportB2bCSV(leads){
  const head = ['Воронка','Теги','Источник','Направление','Менеджер','Название','Имя','Должность','Instagram','Ниша','Описание деятельности','Штат','Адрес','Контакт','Дата заведения','Этап','Дедлайн','Формат встречи','Дата встречи/звонка','Дата проведения','Дата отправки КП','Прогнозная выручка','Сумма сделки','Причина отказа','Комментарий'].concat(b2bFields().filter(f=>!f.hidden).map(f=>f.label));
  const rows = leads.map(l=>{ const c=b2bClient(l.clientId)||{};
    return [b2bPipeName(b2bPipeOf(l)),(l.tags||[]).join(', '),l.source,l.direction==='out'?'исходящая':'входящая',l.managerId?empName(l.managerId):'',c.name,c.person,c.position,c.instagram,c.niche,c.activity,c.staff,c.address,c.phone,l.createdAt,B2B_STAGES[l.stage],l.deadline,l.meetingKind==='call'?'звонок':(l.meetingKind?'встреча':''),l.meetingDate,l.meetingDoneDate,l.kpDate,l.forecast,l.dealSum,l.stage==='lost'?b2bReasonLabel(l):'',l.comment].concat(b2bFields().filter(f=>!f.hidden).map(f=>(l.custom||{})[f.id]===undefined?'':(l.custom||{})[f.id])).map(csvEscape).join(';'); });
  downloadTextFile(`b2b-${todayISO()}.csv`, 'text/csv;charset=utf-8', '\uFEFF'+[head.map(csvEscape).join(';')].concat(rows).join('\r\n'));
}

// ---------- клиент ----------
const B2B_CLIENT_FIELDS = [['name','Название компании *'],['person','Имя контактного лица'],['position','Должность'],['phone','Телефон / контакт'],['instagram','Instagram'],['niche','Ниша'],['activity','Описание вида деятельности'],['staff','Штат (кол-во сотрудников)'],['address','Адрес']];
function b2bClientFieldsHTML(c, prefix){
  return B2B_CLIENT_FIELDS.map(([k,label])=>`<div class="field"><label>${label}</label><input id="${prefix}${k}" value="${escapeHtml((c&&c[k])||'')}"></div>`).join('') +
    `<div class="field"><label>Заметка о клиенте</label><textarea id="${prefix}note" rows="2">${escapeHtml((c&&c.note)||'')}</textarea></div>`;
}
function b2bReadClient(prefix){
  const o = {}; B2B_CLIENT_FIELDS.forEach(([k])=>{ o[k] = (document.getElementById(prefix+k).value||'').trim(); });
  o.note = (document.getElementById(prefix+'note').value||'').trim();
  return o;
}
function openB2bClientModal(clientId){
  const c = b2bClient(clientId); if(!c) return;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay"><div class="modal"><h3>Клиент</h3>${b2bClientFieldsHTML(c,'b2c_')}
    <div class="modal-actions"><button class="btn ghost" id="b2cCancel">Отмена</button><button class="btn" id="b2cSave">Сохранить</button></div></div></div>`;
  document.getElementById('b2cCancel').onclick = closeModal;
  document.getElementById('b2cSave').onclick = async ()=>{
    const v = b2bReadClient('b2c_');
    if(!v.name){ toast('Укажите название компании'); return; }
    const ok = await mutateB2B(d=>{ d.clients = d.clients.map(x=>x.id!==clientId?x:{...x,...v}); return d; });
    if(ok){ closeModal(); toast('Клиент сохранён'); render(); }
  };
}

// ---------- заявка: создание и редактирование ----------
function openB2bLeadModal(leadId, presetClientId){
  const lead = leadId ? state.b2b.leads.find(l=>l.id===leadId) : null;
  const today = todayISO();
  const clients = state.b2b.clients.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','ru'));
  const curClient = lead ? lead.clientId : (presetClientId||'');
  const created = lead ? lead.createdAt : today;
  const autoMgr = lead ? lead.managerId : b2bPickManager(created);
  const root = document.getElementById('modalRoot');
  const mgrList = state.employees.filter(e=>e.role==='Менеджер' || e.id===(lead&&lead.managerId) || ['Руководитель','Ассистент'].includes(e.role));
  root.innerHTML = `<div class="overlay"><div class="modal">
    <h3>${lead?'Заявка':'Новая заявка'}</h3>
    <div class="field"><label>Клиент</label><select id="b2Client" ${lead?'disabled':''}>
      ${lead?'':`<option value="">＋ Новый клиент</option>`}
      ${clients.map(c=>`<option value="${c.id}" ${c.id===curClient?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
    <div id="b2RepeatHint">${curClient?b2bRepeatHTML(curClient, leadId):''}</div>
    <div id="b2NewClient" style="${curClient?'display:none;':''}">${b2bClientFieldsHTML(null,'b2n_')}<div id="b2DupHint" style="font-size:12.5px;color:var(--brick);"></div></div>
    <div class="field-row">
      <div class="field"><label>Направление</label><select id="b2Dir">
        <option value="in" ${!lead||lead.direction!=='out'?'selected':''}>⬇ Входящая (клиент сам написал)</option>
        <option value="out" ${lead&&lead.direction==='out'?'selected':''}>⬆ Исходящая (мы вышли на клиента)</option></select></div>
      <div class="field"><label>Источник</label><input id="b2Source" list="b2SrcList" value="${escapeHtml(lead?lead.source||'':'')}" placeholder="Откуда пришёл клиент">
        <datalist id="b2SrcList">${B2B_SOURCES.map(s=>`<option value="${escapeHtml(s)}">`).join('')}</datalist></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Воронка</label><select id="b2Pipe">${state.b2b.pipelines.map(pp=>`<option value="${pp.id}" ${pp.id===(lead?b2bPipeOf(lead):state.b2bState.pipe)?'selected':''}>${escapeHtml(pp.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Теги (через запятую)</label><input id="b2Tags" list="b2TagList" value="${escapeHtml(lead?(lead.tags||[]).join(', '):'')}" placeholder="например: VIP, корпоратив">
        <datalist id="b2TagList">${b2bAllTags().map(t=>`<option value="${escapeHtml(t)}">`).join('')}</datalist></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Дата заведения</label><input type="date" id="b2Created" value="${created}"></div>
      <div class="field"><label>Ответственный</label><select id="b2Mgr2"><option value="">Не назначен</option>
        ${mgrList.map(e=>`<option value="${e.id}" ${e.id===autoMgr?'selected':''}>${escapeHtml(e.name)}${e.role!=='Менеджер'?' — '+escapeHtml(e.role):''}</option>`).join('')}</select>
        <div class="subtitle" id="b2MgrHint" style="font-size:12px;"></div></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Дедлайн следующего шага</label><input type="date" id="b2Deadline" value="${lead?lead.deadline||'':''}"><div class="subtitle" id="b2DlHint" style="font-size:12px;"></div></div>
      ${lead?`<div class="field"><label>Этап</label><select id="b2Stage">${Object.keys(B2B_STAGES).map(s=>`<option value="${s}" ${lead.stage===s?'selected':''}>${B2B_STAGES[s]}</option>`).join('')}</select></div>`:''}
      <div class="field"><label>Прогнозная выручка, ₽</label><input type="number" min="0" id="b2Forecast" value="${lead&&lead.forecast?lead.forecast:''}"></div>
    </div>
    ${b2bCustomInputsHTML(lead)}
    <div class="field"><label>Комментарий</label><textarea id="b2Comment" rows="2">${escapeHtml(lead?lead.comment||'':'')}</textarea></div>
    <div class="modal-actions">
      ${lead&&b2bLeader()?'<button class="btn danger" id="b2Del" style="margin-right:auto;">Удалить</button>':''}
      <button class="btn ghost" id="b2Cancel">Отмена</button><button class="btn" id="b2Save">Сохранить</button>
    </div></div></div>`;
  const $ = id=>document.getElementById(id);
  let mgrTouched = !!lead, dlTouched = !!lead;
  const recompute = ()=>{
    const d = $('b2Created').value || today;
    if(!mgrTouched){ $('b2Mgr2').value = b2bPickManager(d); }
    const m = $('b2Mgr2').value;
    $('b2MgrHint').textContent = !lead && !mgrTouched ? (m ? 'по графику: в этот день на смене' : 'в этот день по графику никого — выберите вручную') : '';
    if(!dlTouched){ $('b2Deadline').value = b2bNextWork(m, d, false); }
    const dl = $('b2Deadline').value;
    $('b2DlHint').textContent = (m && dl && b2bWorks(m,dl)===false) ? `⚠️ у менеджера выходной; ближайший рабочий: ${fmtDate(b2bNextWork(m,dl,true))}` : '';
  };
  $('b2Client').onchange = ()=>{ $('b2NewClient').style.display = $('b2Client').value ? 'none' : ''; $('b2RepeatHint').innerHTML = $('b2Client').value ? b2bRepeatHTML($('b2Client').value, leadId) : ''; };
  const dupHint = ()=>{ const el=$('b2DupHint'); if(!el||!$('b2n_name')) return; const d0=b2bFindDupClient($('b2n_name').value,$('b2n_phone').value);
    el.innerHTML = d0 ? `⚠️ Такой клиент уже есть: <strong>${escapeHtml(d0.name)}</strong>${d0.phone?' ('+escapeHtml(d0.phone)+')':''} <button class="btn small" id="b2DupUse" type="button">Выбрать его</button>` : '';
    const u=$('b2DupUse'); if(u) u.onclick=()=>{ $('b2Client').value=d0.id; $('b2Client').onchange(); }; };
  if($('b2n_name')){ $('b2n_name').oninput = dupHint; $('b2n_phone').oninput = dupHint; }
  $('b2Created').onchange = recompute;
  $('b2Mgr2').onchange = ()=>{ mgrTouched = true; recompute(); };
  $('b2Deadline').onchange = ()=>{ dlTouched = true; recompute();
    const dl = $('b2Deadline').value, cur = $('b2Mgr2').value;
    const to = b2bOwnerForDate({managerId:cur}, dl);
    if(to){ $('b2Mgr2').value = to; mgrTouched = true; $('b2DlHint').textContent = `${fmtDate(dl)} — рабочий день ${empName(to)}: ответственный изменён автоматически`; } };
  recompute();
  $('b2Cancel').onclick = closeModal;
  const del = $('b2Del');
  if(del) del.onclick = async ()=>{
    if(!await showConfirm('Удалить эту заявку? Клиент в базе останется.', 'Удалить')) return;
    const ok = await mutateB2B(d=>{ d.leads = d.leads.filter(l=>l.id!==leadId); return d; });
    if(ok){ logAudit('b2b_deleted', `Заявка «${b2bClientName(lead)}»`); await b2bSyncEvent(leadId); closeModal(); toast('Заявка удалена'); render(); }
  };
  $('b2Save').onclick = async ()=>{
    let clientId = $('b2Client').value;
    let newClient = null;
    if(!clientId){
      const v = b2bReadClient('b2n_');
      if(!v.name){ toast('Укажите название компании'); return; }
      let dup = state.b2b.clients.find(c=>(c.name||'').trim().toLowerCase()===v.name.toLowerCase());
      if(!dup){ const byPhone = b2bFindDupClient(v.name, v.phone);
        if(byPhone && await showConfirm(`Телефон совпадает с клиентом «${byPhone.name}». Добавить заявку ему, а не создавать нового клиента?`, 'Да, ему')) dup = byPhone; }
      if(dup){ clientId = dup.id; }
      else { newClient = {id:uid(), ...v, createdAt:today}; clientId = newClient.id; }
    }
    const v = {
      direction: $('b2Dir').value, source: $('b2Source').value.trim(), createdAt: $('b2Created').value || today,
      managerId: $('b2Mgr2').value || '', deadline: $('b2Deadline').value || '',
      forecast: Number($('b2Forecast').value)||0, comment: $('b2Comment').value.trim(),
      pipelineId: $('b2Pipe').value, tags: b2bParseTags($('b2Tags').value), custom: b2bReadCustom(lead?lead.custom:null),
    };
    const stageSel = $('b2Stage') ? $('b2Stage').value : null;
    const ok = await mutateB2B(d=>{
      if(newClient) d.clients.push(newClient);
      if(lead){
        d.leads = d.leads.map(l=>{
          if(l.id!==leadId) return l;
          const n = {...l, ...v};
          if((l.managerId||'')!==(v.managerId||'')) n.log = (l.log||[]).concat([b2bTransferLog(l.managerId, v.managerId, 'в карточке заявки')]);
          if(stageSel && stageSel!==l.stage){
            n.stage = stageSel;
            if(!b2bIsOpen(n)){ n.doneAt = n.doneAt||today; n.deadline=''; } else { n.doneAt=null; if(!n.deadline) n.deadline = b2bNextWork(n.managerId, today, true); }
            n.log = (n.log||l.log||[]).concat([b2bLogEntry(stageSel,'Этап изменён вручную')]);
          }
          return n;
        });
      } else {
        d.leads.push({id:uid(), clientId, stage:'new', ...v, log:[b2bLogEntry('new', `Заявка заведена${v.managerId?' · ответственный: '+empName(v.managerId):''}`)]});
      }
      return d;
    });
    if(ok){ logAudit('b2b_saved', `Заявка «${(newClient&&newClient.name)||(b2bClient(clientId)||{}).name||''}»`); if(lead) await b2bSyncEvent(leadId); closeModal(); toast(lead?'Заявка сохранена':'Заявка добавлена'); render(); }
  };
}

// ---------- шаги воронки ----------
function openB2bStepModal(leadId, kind, toStage){
  const lead = state.b2b.leads.find(l=>l.id===leadId); if(!lead) return;
  const today = todayISO();
  const m = lead.managerId;
  const titles = {kp:'Сразу коммерческое предложение', meet:'Назначить встречу / звонок', done:'Встреча / звонок проведены', sent:'КП отправлено', won:'Сделка состоялась', lost:'Отказ клиента', reopen:'Вернуть в работу'};
  const worksToday = b2bWorks(m,today)!==false;
  const defaults = {
    kp: b2bNextWork(m, today, worksToday), meet: b2bNextWork(m, today, false), done: b2bNextWork(m, today, false),
    sent: b2bNextWork(m, isoAdd(today,2), true), won:'', lost:'', reopen: b2bNextWork(m, today, true),
  };
  const withDate = ['kp','meet','done','sent','reopen'].includes(kind);
  const dateLabel = {kp:'Дедлайн: подготовить КП', meet:'Дата встречи / звонка', done:'Дедлайн: подготовить КП', sent:'Дедлайн: связаться по КП', reopen:'Дедлайн следующего шага'}[kind];
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay"><div class="modal"><h3>${titles[kind]}</h3>
    <div class="subtitle" style="margin-bottom:8px;">${escapeHtml(b2bClientName(lead))}${m?' · '+escapeHtml(empName(m)):''}</div>
    ${kind==='meet'?`<div class="field"><label>Формат</label><select id="b2sKind"><option value="meeting" ${lead.meetingKind!=='call'?'selected':''}>Встреча</option><option value="call" ${lead.meetingKind==='call'?'selected':''}>Звонок</option></select></div>`:''}
    ${withDate?`<div class="field-row"><div class="field"><label>${dateLabel}</label><input type="date" id="b2sDate" value="${defaults[kind]}"><div class="subtitle" id="b2sHint" style="font-size:12px;"></div></div>
      ${kind==='meet'?`<div class="field"><label>Время</label><input type="time" id="b2sTime" value="${lead.meetingTime||''}"></div>`:''}</div>
    <div id="b2sAutoRow" style="display:none;margin-bottom:8px;"><label style="display:flex;gap:6px;align-items:center;font-size:13px;"><input type="checkbox" id="b2sAuto" checked> <span id="b2sAutoTxt"></span></label></div>`:''}
    ${kind==='sent'?`<div class="field"><label>Прогнозная выручка, ₽</label><input type="number" min="0" id="b2sSum" value="${lead.forecast||''}"></div>`:''}
    ${kind==='won'?`<div class="field"><label>Сумма сделки, ₽</label><input type="number" min="0" id="b2sSum" value="${lead.forecast||''}"></div>`:''}
    ${kind==='sent'?`<div class="field"><label>Ссылка на КП (необязательно)</label><input id="b2sLink" placeholder="https://docs.google.com/…"></div>`:''}
    ${kind==='lost'?`<div class="field"><label>Причина отказа *</label><select id="b2sReasonSel"><option value="">— выберите из списка —</option>${b2bReasons().filter(r=>!r.hidden).map(r=>`<option value="${r.id}">${escapeHtml(r.label)}</option>`).join('')}</select>
      <input id="b2sReasonText" placeholder="Что именно (обязательно для «Другое»)" style="margin-top:6px;display:none;"></div>`:''}
    <div class="field"><label>${kind==='done'?'Итог встречи / звонка и задача':'Заметка (необязательно)'}</label><textarea id="b2sNote" rows="2"></textarea></div>
    <div class="modal-actions"><button class="btn ghost" id="b2sCancel">Отмена</button><button class="btn" id="b2sSave">Сохранить</button></div></div></div>`;
  const $ = id=>document.getElementById(id);
  const hint = ()=>{ const el=$('b2sHint'), d=$('b2sDate'); if(!el||!d) return;
    const to = b2bOwnerForDate(lead, d.value), row = $('b2sAutoRow');
    if(to){ row.style.display=''; row.dataset.to=to; $('b2sAutoTxt').textContent = `${fmtDate(d.value)} — рабочий день ${empName(to)}: передать заявку ему`; el.textContent=''; }
    else { row.style.display='none'; row.dataset.to='';
      el.textContent = (m && d.value && b2bWorks(m,d.value)===false) ? `⚠️ у менеджера выходной (ближайший рабочий: ${fmtDate(b2bNextWork(m,d.value,true))})` : ''; } };
  if($('b2sReasonSel')) $('b2sReasonSel').onchange = ()=>{ $('b2sReasonText').style.display = $('b2sReasonSel').value==='other' ? '' : 'none'; };
  if($('b2sDate')) $('b2sDate').onchange = hint; hint();
  $('b2sCancel').onclick = closeModal;
  $('b2sSave').onclick = async ()=>{
    const date = $('b2sDate') ? $('b2sDate').value : '';
    if(withDate && !date){ toast('Укажите дату'); return; }
    let reasonId = '', reasonText = '';
    if(kind==='lost'){
      reasonId = $('b2sReasonSel').value; reasonText = $('b2sReasonText').value.trim();
      if(!reasonId){ toast('Выберите причину отказа'); return; }
      if(reasonId==='other' && !reasonText){ toast('Для «Другое» напишите причину'); return; }
    }
    const autoTo = ($('b2sAuto') && $('b2sAutoRow') && $('b2sAutoRow').style.display!=='none' && $('b2sAuto').checked) ? $('b2sAutoRow').dataset.to : '';
    const linkUrl = $('b2sLink') ? b2bSafeUrl($('b2sLink').value) : '';
    const note = $('b2sNote').value.trim();
    const g = id => $(id) ? $(id).value : '';
    const ok = await mutateB2B(d=>{
      d.leads = d.leads.map(l=>{
        if(l.id!==leadId) return l;
        const n = {...l, log:(l.log||[]).slice()};
        let stage = l.stage, logNote = note;
        if(kind==='kp'){ stage='kp'; n.deadline=date; logNote = 'Сразу КП, без встречи'+(note?' · '+note:''); }
        else if(kind==='meet'){ stage='meet'; n.meetingKind=g('b2sKind'); n.meetingDate=date; n.meetingTime=g('b2sTime'); n.deadline=date;
          logNote = `${n.meetingKind==='call'?'Звонок':'Встреча'} на ${fmtDate(date)}${n.meetingTime?' '+n.meetingTime:''}`+(note?' · '+note:''); }
        else if(kind==='done'){ stage='kp'; n.meetingDoneDate=today; n.deadline=date; logNote = 'Проведена; готовим КП'+(note?' · '+note:''); }
        else if(kind==='sent'){ stage='sent'; n.kpDate=today; n.deadline=date; if($('b2sSum').value!=='') n.forecast=Number($('b2sSum').value)||0; logNote='КП отправлено'+(note?' · '+note:''); }
        else if(kind==='won'){ stage='won'; n.prevStage=l.stage; n.doneAt=today; n.deadline=''; if($('b2sSum').value!=='') n.dealSum=Number($('b2sSum').value)||0; logNote='Сделка'+(note?' · '+note:''); }
        else if(kind==='lost'){ stage='lost'; n.prevStage=l.stage; n.doneAt=today; n.deadline=''; n.lostReasonId=reasonId; n.lostReason=reasonText; logNote='Отказ: '+b2bReasonLabel(n)+(note?' · '+note:''); }
        else if(kind==='reopen'){ stage = (toStage && b2bIsOpen({stage:toStage})) ? toStage : ((l.prevStage && b2bIsOpen({stage:l.prevStage})) ? l.prevStage : 'new'); n.doneAt=null; n.deadline=date; n.lostReason=''; n.lostReasonId=''; logNote='Возвращена в работу'+(note?' · '+note:''); }
        n.stage = stage; n.log.push(b2bLogEntry(stage, logNote));
        if(autoTo && autoTo!==l.managerId){ n.managerId = autoTo; n.log.push(b2bTransferLog(l.managerId, autoTo, 'автоматически: срок выпал на его рабочий день')); }
        if(linkUrl){ n.links = (l.links||[]).concat([{id:uid(), title:'КП', url:linkUrl, date:today, by:state.currentUserId}]); }
        return n;
      });
      return d;
    });
    if(ok){ logAudit('b2b_step', `«${b2bClientName(lead)}»: ${titles[kind]}`); await b2bSyncEvent(leadId); closeModal(); toast('Сохранено'); render(); }
  };
}
