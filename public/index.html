<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Единый журнал · Свободное Пространство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC;
    --paper-line:#E4DCC8;
    --card:#FFFFFF;
    --ink:#2A2822;
    --ink-soft:#79735F;
    --indigo:#33507D;
    --indigo-dark:#20344F;
    --ochre:#B9862B;
    --ochre-bg:#FBF0DC;
    --teal:#3E7D6B;
    --teal-bg:#E4F1EC;
    --brick:#A23E3E;
    --brick-bg:#F7E7E3;
    --plum:#7C5C9E;
    --plum-bg:#EEE7F3;
    --sky:#2E8B9E;
    --sky-bg:#E1F0F2;
    --rose:#C15C7C;
    --rose-bg:#F6E4EA;
    --shadow: 0 1px 2px rgba(42,40,34,0.06), 0 8px 24px rgba(42,40,34,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:
      linear-gradient(var(--paper) 0%, var(--paper) 100%);
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 20px 80px;
  }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
  .wrap{max-width:980px;margin:0 auto;}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}
  .brand h1{font-family:'Space Grotesk',sans-serif;font-size:26px;margin:0;color:var(--indigo-dark);font-weight:700;}
  .icon-btn{
    background:var(--card);border:1px solid var(--paper-line);border-radius:8px;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-soft);font-size:16px;box-shadow:var(--shadow);
  }
  .icon-btn:hover{color:var(--indigo);border-color:var(--indigo);}
  .bell-badge{
    position:absolute;top:-5px;right:-5px;background:var(--brick);color:#fff;font-family:'IBM Plex Mono',monospace;
    font-size:10px;font-weight:600;min-width:16px;height:16px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  }
  .reminder-panel{
    position:absolute;right:20px;top:64px;width:340px;max-width:90vw;background:#fff;border:1px solid var(--paper-line);
    border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,0.18);z-index:60;padding:18px;max-height:70vh;overflow-y:auto;
  }
  .reminder-panel h4{font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:14px 0 8px;}
  .reminder-panel h4:first-child{margin-top:0;}
  .search-cat-label{font-family:'Space Grotesk',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:16px 0 8px;}
  .search-cat-label:first-child{margin-top:0;}
  .reminder-row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #F0EDE3;font-size:13px;cursor:pointer;}
  .reminder-row:last-child{border-bottom:none;}
  .reminder-row:hover{color:var(--indigo);}
  .reminder-row .tag{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .reminder-empty{color:var(--ink-soft);font-size:13px;padding:6px 0;}
  .notify-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--paper-line);font-size:12.5px;}
  .switch{position:relative;width:38px;height:22px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--paper-line);border-radius:20px;cursor:pointer;transition:.15s;}
  .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--indigo);}
  .switch input:checked + .slider:before{transform:translateX(16px);}

  /* Folder tabs */
  nav.tabs{display:flex;gap:4px;margin-top:6px;}
  .tab-btn{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;
    padding:11px 20px 12px;border:1px solid var(--paper-line);border-bottom:none;
    background:#EFEADA;color:var(--ink-soft);cursor:pointer;
    border-radius:10px 10px 0 0;position:relative;top:1px;
    transition:background .15s,color .15s;
  }
  .tab-btn .count{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:rgba(42,40,34,0.08);
    padding:1px 6px;border-radius:20px;margin-left:7px;
  }
  .tab-btn.active{background:var(--card);color:var(--indigo-dark);border-color:var(--paper-line);z-index:2;}
  .tab-btn:not(.active):hover{background:#F3EFE1;color:var(--ink);}

  main.card{
    background:var(--card);border:1px solid var(--paper-line);border-radius:0 12px 12px 12px;
    box-shadow:var(--shadow);min-height:420px;padding:26px;position:relative;
  }
  .ruled{
    background-image: repeating-linear-gradient(var(--card) 0 37px, var(--paper-line) 37px 38px);
  }

  h2.section-title{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 4px;color:var(--indigo-dark);}
  .subtitle{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px;}

  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:9px 16px;
    border-radius:8px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer;
  }
  .btn:hover{background:var(--indigo-dark);}
  .btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--paper-line);}
  .btn.ghost:hover{border-color:var(--indigo);}
  .btn.danger{background:transparent;color:var(--brick);border:1px solid var(--brick-bg);}
  .btn.danger:hover{background:var(--brick-bg);}
  .btn.small{padding:5px 10px;font-size:12.5px;border-radius:6px;}
  select,input,textarea{
    font-family:'Inter',sans-serif;font-size:13.5px;padding:8px 10px;border-radius:7px;
    border:1px solid var(--paper-line);background:#fff;color:var(--ink);width:100%;
  }
  select.invalid,input.invalid,textarea.invalid{
    border-color:var(--brick);box-shadow:0 0 0 3px var(--brick-bg);
  }
  input.mono,textarea.mono{font-family:'IBM Plex Mono',monospace;}
  label{font-size:12px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  .field{margin-bottom:14px;}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;}
  .field-row .field{flex:1;min-width:150px;}

  /* Calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head .month-label{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:var(--indigo-dark);}
  .cal-nav{display:flex;gap:6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:11px;text-align:center;color:var(--ink-soft);font-weight:600;text-transform:uppercase;padding-bottom:4px;}
  .cal-cell{
    border:1px solid var(--paper-line);border-radius:8px;height:84px;padding:6px;cursor:pointer;
    background:#fff;display:flex;flex-direction:column;gap:3px;transition:border-color .15s;overflow:hidden;
  }
  .cal-cell:hover{border-color:var(--indigo);}
  .cal-cell.empty{background:transparent;border:none;cursor:default;}
  .cal-cell.today{background:var(--ochre-bg);border-color:var(--ochre);}
  .cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);flex:none;}
  .cal-cell.today .cal-daynum{color:var(--ochre);font-weight:600;}
  .cal-evt{
    font-size:10.5px;background:var(--indigo);color:#fff;border-radius:4px;padding:2px 5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:none;max-width:100%;
  }
  .cal-evt.cat-planning{background:var(--teal);}
  .cal-evt.cat-meeting{background:var(--ochre);}
  .cal-evt.cat-personal{background:var(--plum);}
  .cal-evt.cat-vacation{background:var(--sky);}
  .cal-evt.cal-task{
    background:#fff;border:1.5px dashed var(--ink-soft);font-weight:600;
  }
  .cal-evt.cal-task.is-done{text-decoration:line-through;opacity:.6;border-style:solid;}
  .cal-more{font-size:10px;color:var(--ink-soft);flex:none;}

  /* Lists */
  .item-list{display:flex;flex-direction:column;gap:10px;}
  .item{
    border:1px solid var(--paper-line);border-radius:9px;padding:12px 14px;display:flex;
    justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;
  }
  .item .main{flex:1;min-width:0;}
  .item .title{font-weight:600;font-size:14.5px;margin-bottom:3px;overflow-wrap:anywhere;word-break:break-word;}
  .item .meta{font-size:12px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere;}
  .item .desc{font-size:13px;color:var(--ink-soft);margin-top:5px;overflow-wrap:anywhere;word-break:break-word;}
  .item .actions{display:flex;gap:6px;flex-wrap:wrap;}
  .task-check{width:19px;height:19px;flex:none;margin-top:2px;accent-color:var(--teal);cursor:pointer;}
  .task-check-locked{opacity:.45;cursor:not-allowed;}
  .task-toggle{
    background:none;border:none;padding:0 5px 0 0;margin:0;cursor:pointer;color:var(--ink-soft);
    font-size:11px;vertical-align:middle;line-height:1;
  }
  .task-toggle:hover{color:var(--indigo);}
  .item.is-done .title{text-decoration:line-through;color:var(--ink-soft);}
  .item.is-done{opacity:.72;}
  .badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .badge.progress{background:var(--ochre-bg);color:var(--ochre);}
  .badge.review{background:rgba(51,80,125,0.12);color:var(--indigo);}
  .badge.done{background:var(--teal-bg);color:var(--teal);}
  .badge.prio-high{background:var(--brick-bg);color:var(--brick);}
  .badge.prio-med{background:var(--ochre-bg);color:var(--ochre);}
  .badge.prio-low{background:var(--paper-line);color:var(--ink-soft);}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filters select{width:auto;min-width:150px;}
  .cat-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .cat-filters.block-row{
    background:var(--rose-bg);border:1px solid var(--rose);border-radius:10px;
    padding:10px 12px;margin-bottom:12px;align-items:center;
  }
  .cat-chip{
    display:flex;align-items:center;gap:7px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;
    padding:6px 13px;border-radius:20px;border:1px solid var(--paper-line);background:#fff;color:var(--ink);
    cursor:pointer;transition:opacity .15s,border-color .15s;
  }
  .cat-chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .cat-chip.off{opacity:.4;border-style:dashed;}
  .cat-chip:hover{border-color:var(--indigo);}

  .subtabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--paper-line);padding-bottom:10px;}
  .subtab-btn{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:6px 14px;
    border-radius:20px;border:1px solid var(--paper-line);background:transparent;color:var(--ink-soft);cursor:pointer;
  }
  .subtab-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}

  /* Funds ledger - receipt style */
  .ledger-summary{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .sum-card{
    flex:1;min-width:150px;border:1px solid var(--paper-line);border-radius:10px;padding:14px 16px;background:#fff;
  }
  .sum-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
  .sum-card .val{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;}
  .sum-card.balance{background:var(--indigo);border-color:var(--indigo);}
  .sum-card.balance .label{color:#cdd8e8;}
  .sum-card.balance .val{color:#fff;}
  .sum-card.issued .val{color:var(--teal);}
  .sum-card.spent .val{color:var(--brick);}

  .ledger{border:1px solid var(--paper-line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative;}
  .ledger::before{
    content:"";display:block;height:7px;
    background:
      conic-gradient(var(--paper) 0 25%, transparent 0 50%) 0 0/16px 14px;
  }

  /* Analytics */
  .an-table{border:1px solid var(--paper-line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.an-table-inner{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;}
  table.an-table-inner th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ink-soft);padding:8px 12px;background:#FAF8F2;border-bottom:1px solid var(--paper-line);
  }
  table.an-table-inner td{padding:10px 12px;border-bottom:1px solid #F0EDE3;vertical-align:middle;overflow-wrap:anywhere;}
  table.an-table-inner tr:last-child td{border-bottom:none;}
  .an-name{font-weight:600;}
  .an-num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .an-bar-wrap{display:flex;align-items:center;gap:8px;}
  .an-bar-track{flex:1;height:6px;background:var(--paper-line);border-radius:4px;overflow:hidden;min-width:50px;}
  .an-bar-fill{height:100%;border-radius:4px;}
  table.ledger-table{width:100%;min-width:560px;border-collapse:collapse;font-size:13px;}
  table.ledger-table th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ink-soft);padding:8px 12px;background:#FAF8F2;border-bottom:1px solid var(--paper-line);
  }
  table.ledger-table td{padding:9px 12px;border-bottom:1px solid #F0EDE3;vertical-align:top;overflow-wrap:anywhere;}
  table.ledger-table tr:last-child td{border-bottom:none;}
  .amt-issue{color:var(--teal);font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .amt-expense{color:var(--brick);font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .amt-balance{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .ledger-actions{display:flex;gap:4px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:17px;color:var(--ink);margin-bottom:6px;}

  .saving-spinner{
    display:inline-block;width:11px;height:11px;border-radius:50%;
    border:2px solid var(--paper-line);border-top-color:var(--indigo);
    animation:saving-spin .7s linear infinite;
  }
  @keyframes saving-spin{ to{ transform:rotate(360deg); } }

  .drag-handle{
    cursor:grab;color:var(--ink-soft);font-size:16px;line-height:1;
    padding:4px 2px;touch-action:none;user-select:none;align-self:flex-start;margin-top:2px;
  }
  .drag-handle:active{cursor:grabbing;}
  .item.dragging{opacity:.45;}
  .item.drag-over-top{border-top:3px solid var(--indigo);}
  .item.drag-over-bottom{border-bottom:3px solid var(--indigo);}

  .overdue-reason-box{
    margin-top:8px;padding:10px 12px;border-radius:8px;
    background:rgba(178,58,42,0.08);border:1px solid rgba(178,58,42,0.25);
  }
  .overdue-reason-label{font-size:12.5px;font-weight:600;color:var(--brick);margin-bottom:5px;}
  .overdue-reason-box textarea{width:100%;font-family:inherit;font-size:13px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(32,30,25,0.45);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal{
    background:#fff;border-radius:14px;padding:24px;max-width:460px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);max-height:88vh;overflow-y:auto;
  }
  .modal h3{font-family:'Space Grotesk',sans-serif;margin:0 0 16px;color:var(--indigo-dark);font-size:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .lock-icon{font-size:34px;text-align:center;margin-bottom:10px;}
  .note{font-size:12px;color:var(--ink-soft);background:#FAF8F2;border:1px solid var(--paper-line);border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.5;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--indigo-dark);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:100;box-shadow:var(--shadow);
  }

  .lock-screen{text-align:center;padding:60px 20px;}
  .lock-screen .lock-icon{font-size:40px;}
  .lock-screen h3{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:6px 0 4px;}
  .lock-screen p{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px;}
  .lock-screen input{max-width:240px;margin:0 auto 10px;}
  .err-msg{color:var(--brick);font-size:12.5px;margin-top:8px;}

  select[multiple]{min-height:84px;}
  .emp-checklist{
    border:1px solid var(--paper-line);border-radius:8px;padding:6px 10px;max-height:190px;
    overflow-y:auto;display:flex;flex-direction:column;gap:1px;background:#fff;
  }
  .emp-checklist label{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:6px 2px;cursor:pointer;}
  .emp-checklist input[type=checkbox]{width:17px;height:17px;flex:none;accent-color:var(--indigo);cursor:pointer;}
  .chip-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .chip{background:var(--paper-line);color:var(--ink);font-size:11.5px;padding:3px 9px;border-radius:20px;}

  @media (max-width:640px){
    body{padding:14px 10px 70px;}
    .wrap{max-width:100%;}
    .cal-grid{gap:3px;}
    .cal-cell{height:58px;padding:4px;}
    .cal-evt{font-size:9px;}
    main.card{padding:14px;border-radius:0 10px 10px 10px;}
    table.ledger-table{font-size:12px;}
    table.ledger-table th,table.ledger-table td{padding:7px 6px;}
    table.an-table-inner{font-size:12px;}
    table.an-table-inner th,table.an-table-inner td{padding:7px 6px;}
    .brand h1{font-size:21px;}
    .tab-btn{padding:9px 13px 10px;font-size:13px;}
    .cat-chip{padding:5px 10px;font-size:11.5px;}
    .subtab-btn{padding:5px 11px;font-size:12px;}
    .btn{padding:8px 13px;}
    .item{padding:10px 11px;gap:8px;}
    .item .actions{width:100%;justify-content:flex-start;}
    .item .actions .btn{flex:none;}
    .field-row{gap:10px;}
    .field-row .field{min-width:130px;}
    .filters select{min-width:0;flex:1 1 140px;}
    .modal{padding:18px;}
    .reminder-panel{right:8px;left:8px;width:auto;max-width:none;}
    .sum-card{min-width:100px;}
    .ledger-summary{gap:8px;}
    #whoAmIBtn{max-width:110px;font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Свободное Пространство</span>
      <h1>Единый журнал</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
      <span id="savingIndicator" style="display:none;font-size:12.5px;color:var(--ink-soft);align-items:center;gap:5px;">
        <span class="saving-spinner"></span>Сохранение…
      </span>
      <button class="icon-btn" id="searchBtn" title="Поиск">🔍</button>
      <button class="btn ghost small" id="whoAmIBtn" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;">🙋 Кто я?</button>
      <button class="icon-btn" id="bellBtn" title="Напоминания" style="position:relative;">🔔<span class="bell-badge" id="bellBadge" style="display:none;"></span></button>
      <button class="icon-btn" id="dataBtn" title="Резервная копия, корзина и архив">🗄️</button>
      <button class="icon-btn" id="staffBtn" title="Сотрудники">👥</button>
    </div>
  </header>

  <nav class="tabs" id="tabsNav"></nav>
  <main class="card" id="appContent">
    <div class="empty-state"><div class="big">Загрузка…</div></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ---------------- storage helpers ---------------- */
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }
let pendingSaveCount = 0;
function updateSavingIndicator(){
  const el = document.getElementById('savingIndicator');
  if(!el) return;
  el.style.display = pendingSaveCount > 0 ? 'inline-flex' : 'none';
}
async function sGet(key, shared){
  if(shared === false){
    try{ return window.localStorage.getItem('lj:'+key); }catch(e){ return null; }
  }
  const maxAttempts = 3;
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    try{
      const r = await fetch('/api/storage/'+encodeURIComponent(key), {credentials:'include'});
      if(r.status===404) return null;
      if(r.status===401){ handleSessionExpired(); return null; }
      if(r.ok){ const data = await r.json(); return data.value; }
      if(r.status>=500 && attempt<maxAttempts){ await sleep(400*attempt); continue; }
      return null;
    }catch(e){
      if(attempt<maxAttempts){ await sleep(400*attempt); continue; }
      return null;
    }
  }
  return null;
}
async function sSet(key, value, shared){
  if(shared === false){
    try{ window.localStorage.setItem('lj:'+key, value); return true; }catch(e){ return false; }
  }
  pendingSaveCount++; updateSavingIndicator();
  try{
    const maxAttempts = 3;
    for(let attempt=1; attempt<=maxAttempts; attempt++){
      try{
        const r = await fetch('/api/storage/'+encodeURIComponent(key), {
          method:'PUT', credentials:'include',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({value}),
        });
        if(r.status===401){ handleSessionExpired(); return false; }
        if(r.ok) return true;
        if(r.status>=500 && attempt<maxAttempts){ await sleep(400*attempt); continue; }
        return false;
      }catch(e){
        if(attempt<maxAttempts){ await sleep(400*attempt); continue; }
        console.error('storage set failed', key, e);
        return false;
      }
    }
    return false;
  } finally {
    pendingSaveCount--; updateSavingIndicator();
  }
}
async function sDelete(key, shared){
  if(shared === false){
    try{ window.localStorage.removeItem('lj:'+key); }catch(e){}
    return true;
  }
  pendingSaveCount++; updateSavingIndicator();
  try{
    const maxAttempts = 3;
    for(let attempt=1; attempt<=maxAttempts; attempt++){
      try{
        const r = await fetch('/api/storage/'+encodeURIComponent(key), {method:'DELETE', credentials:'include'});
        if(r.status===401){ handleSessionExpired(); return false; }
        if(r.ok) return true;
        if(r.status>=500 && attempt<maxAttempts){ await sleep(400*attempt); continue; }
        return false;
      }catch(e){
        if(attempt<maxAttempts){ await sleep(400*attempt); continue; }
        return false;
      }
    }
    return false;
  } finally {
    pendingSaveCount--; updateSavingIndicator();
  }
}
function handleSessionExpired(){
  if(state.sessionExpiredHandled) return;
  state.sessionExpiredHandled = true;
  state.loggedInEmployee = null;
  renderLoginScreen('Сессия истекла — войдите снова.');
}

function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-');
  const months=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
function fmtMoney(n){
  const num = Number(n)||0;
  return num.toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2}) + ' ₽';
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Экранирует текст и превращает ссылки (http/https/www.) в кликабельные <a> — безопасно от XSS,
// т.к. экранирование происходит ДО оборачивания в теги.
function linkifyEscaped(s){
  const escaped = escapeHtml(s);
  const urlRe = /((https?:\/\/|www\.)[^\s<]+)/gi;
  return escaped.replace(urlRe, (match) => {
    // Не захватываем случайную завершающую пунктуацию вроде точки или запятой на конце ссылки
    let url = match;
    let trailing = '';
    while(url.length && /[.,!?;:)\]]$/.test(url)){
      trailing = url.slice(-1) + trailing;
      url = url.slice(0, -1);
    }
    const href = url.startsWith('http') ? url : 'https://' + url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;">${url}</a>${trailing}`;
  });
}
function truncate(str, max){
  if(!str) return '';
  return str.length > max ? str.slice(0, Math.max(1,max-1)).trimEnd()+'…' : str;
}
function isMobileView(){ return window.innerWidth <= 640; }
function calMaxShown(){ return isMobileView() ? 2 : 3; }

  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>el.remove(),2400);
}

/* Custom confirm/prompt dialogs — native window.confirm()/prompt() are blocked
   inside this sandboxed environment, so we render our own. */
function showConfirm(message, confirmLabel){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.className='overlay'; ov.style.zIndex=200;
    ov.innerHTML=`
      <div class="modal" style="max-width:360px;">
        <h3>Подтвердите действие</h3>
        <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;">${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn ghost" id="cfNo">Отмена</button>
          <button class="btn danger" id="cfYes">${escapeHtml(confirmLabel||'Удалить')}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const finish=(val)=>{ ov.remove(); resolve(val); };
    ov.querySelector('#cfNo').onclick=()=>finish(false);
    ov.querySelector('#cfYes').onclick=()=>finish(true);
    ov.onclick=(e)=>{ if(e.target===ov) finish(false); };
    document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ finish(false); document.removeEventListener('keydown', esc); } });
  });
}
function showPrompt(title, defaultValue){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.className='overlay'; ov.style.zIndex=200;
    ov.innerHTML=`
      <div class="modal" style="max-width:360px;">
        <h3>${escapeHtml(title)}</h3>
        <input id="pmInput" value="${escapeHtml(defaultValue||'')}" style="margin-bottom:16px;">
        <div class="modal-actions">
          <button class="btn ghost" id="pmCancel">Отмена</button>
          <button class="btn" id="pmOk">Сохранить</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const input=ov.querySelector('#pmInput');
    setTimeout(()=>{ input.focus(); input.select(); },0);
    const finish=(val)=>{ ov.remove(); resolve(val); };
    ov.querySelector('#pmCancel').onclick=()=>finish(null);
    ov.querySelector('#pmOk').onclick=()=>finish(input.value.trim());
    input.onkeydown=(e)=>{ if(e.key==='Enter') finish(input.value.trim()); if(e.key==='Escape') finish(null); };
    ov.onclick=(e)=>{ if(e.target===ov) finish(null); };
  });
}

/* ---------------- crypto helpers (personal tasks) ---------------- */
function bytesToB64(bytes){ return btoa(String.fromCharCode(...bytes)); }
function b64ToBytes(b64){ return new Uint8Array(atob(b64).split('').map(c=>c.charCodeAt(0))); }

async function deriveKey(password, saltB64){
  const salt = b64ToBytes(saltB64);
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encryptPersonal(tasks, password, saltB64){
  const key = await deriveKey(password, saltB64);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(tasks)));
  return JSON.stringify({iv:bytesToB64(iv), data:bytesToB64(new Uint8Array(ct))});
}
async function decryptPersonal(blobStr, password, saltB64){
  const blob = JSON.parse(blobStr);
  const key = await deriveKey(password, saltB64);
  const iv = b64ToBytes(blob.iv);
  const data = b64ToBytes(blob.data);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return JSON.parse(new TextDecoder().decode(pt));
}

function openEmployeePasswordModal(empId, onDone, hasPw){
  const emp = state.employees.find(e=>e.id===empId);
  if(!emp) return;
  const isSelf = state.currentUserId === empId;
  const needsOldPassword = hasPw && isSelf;
  const ov = document.createElement('div');
  ov.className='overlay'; ov.style.zIndex=200;
  ov.innerHTML = `
    <div class="modal" style="max-width:380px;">
      <h3>${hasPw?'Изменить пароль':'Задать пароль'} — ${escapeHtml(emp.name)}</h3>
      ${needsOldPassword?`<div class="field"><label>Текущий пароль</label><input type="password" id="ep_current"></div>`
        : (hasPw?`<div class="note" style="margin-bottom:14px;">Вы меняете пароль другого сотрудника через раздел «Сотрудники» — старый пароль вводить не нужно.</div>`:'')}
      <div class="field"><label>Новый пароль</label><input type="password" id="ep_new" placeholder="Оставьте пустым, чтобы просто убрать пароль"></div>
      <div class="field"><label>Повторите новый пароль</label><input type="password" id="ep_new2"></div>
      <div class="err-msg" id="ep_err"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="ep_cancel">Отмена</button>
        <button class="btn" id="ep_save">Сохранить</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const finish = ()=>{ ov.remove(); };
  ov.querySelector('#ep_cancel').onclick=finish;
  ov.onclick=(e)=>{ if(e.target===ov) finish(); };
  ov.querySelector('#ep_save').onclick=async ()=>{
    const errEl = ov.querySelector('#ep_err');
    errEl.textContent='';
    const currentPassword = needsOldPassword ? ov.querySelector('#ep_current').value : undefined;
    if(needsOldPassword && !currentPassword){ errEl.textContent='Введите текущий пароль'; return; }
    const newPw = ov.querySelector('#ep_new').value;
    const newPw2 = ov.querySelector('#ep_new2').value;
    if(newPw && newPw !== newPw2){ errEl.textContent='Пароли не совпадают'; return; }
    const r = await fetch(`/api/employees/${encodeURIComponent(empId)}/password`, {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({newPassword: newPw || undefined, currentPassword}),
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok){ errEl.textContent = data.error || 'Не удалось сохранить'; return; }
    toast(newPw ? (hasPw?'Пароль изменён':'Пароль задан') : 'Пароль убран');
    finish(); if(onDone) onDone();
  };
}

/* ---------------- trash (soft delete, 30 days) ---------------- */
async function saveTrash(){ return await sSet('trash:items', JSON.stringify(state.trash), true); }
function trashFor(personal){ return personal ? state.personalTrash : state.trash; }
function setTrashFor(personal, arr){ if(personal) state.personalTrash = arr; else state.trash = arr; }
async function persistTrashFor(personal){ return personal ? await savePersonalData() : await saveTrash(); }
async function moveToTrash(personal, type, data){
  const entry = {trashId: uid(), type, data, deletedAt: Date.now()};
  setTrashFor(personal, trashFor(personal).concat([entry]));
  await persistTrashFor(personal);
}
async function performTaskDeletion(personal, targetTask){
  if(!canDeleteTask(targetTask, personal)){
    toast(whyCantDelete(targetTask));
    return false;
  }
  const all = tasksFor(personal);
  function idsToDelete(rootId){
    let ids=[rootId];
    all.filter(t=>t.parentId===rootId).forEach(c=>{ ids = ids.concat(idsToDelete(c.id)); });
    return ids;
  }
  let idsSet;
  if(targetTask.seriesId){
    const choice = await showSeriesDeleteChoice();
    if(!choice) return false;
    if(choice==='one'){
      idsSet = idsToDelete(targetTask.id);
    } else {
      const seriesTasks = all.filter(t=>t.seriesId===targetTask.seriesId);
      idsSet = [];
      seriesTasks.forEach(st=>{ idsSet = idsSet.concat(idsToDelete(st.id)); });
      idsSet = [...new Set(idsSet)];
    }
  } else {
    const single = idsToDelete(targetTask.id);
    const msg = single.length>1 ? `Удалить задачу вместе с подзадачами (${single.length-1})?` : 'Удалить задачу?';
    if(!(await showConfirm(msg))) return false;
    idsSet = single;
  }
  for(const tid of idsSet){
    const doomed = all.find(x=>x.id===tid);
    if(doomed) await moveToTrash(personal, 'task', doomed);
  }
  setTasksFor(personal, all.filter(t=>!idsSet.includes(t.id)));
  await persistTasksFor(personal);
  return true;
}
async function restoreTrashItem(personal, trashId){
  const trash = trashFor(personal);
  const entry = trash.find(t=>t.trashId===trashId);
  if(!entry) return;
  if(entry.type==='task'){
    setTasksFor(personal, tasksFor(personal).concat([entry.data]));
    await persistTasksFor(personal);
  } else if(entry.type==='project'){
    setProjectsFor(personal, projectsFor(personal).concat([entry.data]));
    await persistProjectsFor(personal);
  } else if(entry.type==='event'){
    setEventsFor(personal, eventsFor(personal).concat([entry.data]));
    await persistEventsFor(personal);
  } else if(entry.type==='fund'){
    const fscope = personal ? 'personal' : 'work';
    setFundsFor(fscope, fundsFor(fscope).concat([entry.data]));
    await persistFundsFor(fscope);
  } else if(entry.type==='idea' && !personal){
    state.ideaBankWork = state.ideaBankWork.concat([entry.data]);
    await saveIdeaBank();
  } else if(entry.type==='employee' && !personal){
    if(!state.employees.some(e=>e.id===entry.data.id)){
      state.employees = state.employees.concat([entry.data]);
      await saveEmployees();
    }
  }
  setTrashFor(personal, trashFor(personal).filter(t=>t.trashId!==trashId));
  await persistTrashFor(personal);
  toast('Восстановлено');
}

  const elapsedDays = (Date.now()-deletedAt)/86400000;

}

/* ---------------- export / import ---------------- */
function csvEscape(val){
  const s = String(val==null?'':val);
  return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadTextFile(filename, mime, text){
  const blob = new Blob([text], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportFundsCSV(scope){
  let entries;
  let label;
  if(scope==='all'){
    entries = state.fundsEntries.concat(personalAccessAllowed() ? state.personalFundsEntries : []);
    label = 'все';
  } else {
    entries = fundsFor(scope).slice();
    label = scope==='personal' ? 'личные' : 'рабочие';
  }
  const sorted = entries.sort((a,b)=> a.date===b.date ? a.createdAt-b.createdAt : a.date.localeCompare(b.date));
  let running = 0;
  const header = ['Дата','Тип','Категория','Сумма','Назначение','Комментарий','Чек','Остаток'];
  const lines = [header.map(csvEscape).join(';')];
  sorted.forEach(f=>{
    running += (f.type==='issue' ? Number(f.amount) : -Number(f.amount));
    lines.push([
      f.date,
      f.type==='issue'?'Доход':'Расход',

function generateRecurrenceDates(startISO, repeatType, weekdaySet, untilISO, maxCount){
  maxCount = maxCount || 300;
  const dates = [];
  const until = new Date((untilISO||startISO)+'T00:00:00');
  if(repeatType==='daily' || repeatType==='weekly'){
    let cur = new Date(startISO+'T00:00:00');
    while(cur<=until && dates.length<maxCount){
      const isoWd = cur.getDay()===0?7:cur.getDay();
      if(weekdaySet.has(isoWd)) dates.push(dateToISO(cur));
      cur.setDate(cur.getDate()+1);
    }
  } else if(repeatType==='monthly'){
    let cur = new Date(startISO+'T00:00:00');
    const day = cur.getDate();
    while(cur<=until && dates.length<maxCount){
      dates.push(dateToISO(cur));
      const y = cur.getFullYear(), mo = cur.getMonth()+1;
      const daysInNext = new Date(y, mo+1, 0).getDate();
      cur = new Date(y, mo, Math.min(day, daysInNext));
    }
  } else if(repeatType==='yearly'){
    let cur = new Date(startISO+'T00:00:00');
    const day = cur.getDate();
    while(cur<=until && dates.length<maxCount){
      dates.push(dateToISO(cur));
      const y = cur.getFullYear()+1, mo = cur.getMonth();
      const daysInMonth = new Date(y, mo+1, 0).getDate();
      cur = new Date(y, mo, Math.min(day, daysInMonth));
    }
  }
  return dates;
}

function canSeeEvent(e){
  // Отпуска — видны всем (информационно, не требует участия).
  if(e.category==='vacation') return true;
  // Дни рождения — тоже видны всем, чтобы никто не забыл поздравить.
  if(e.category==='birthday') return true;

  if(e.category==='personal') return true;
  // Руководитель может включить полное расписание — видит все планёрки/встречи/события.
  if(state.calendarFullView && hasRole('Руководитель')) return true;
  const participants = e.employeeIds || [];
  // Сам участник встречи всегда видит её.
  if(state.currentUserId && participants.includes(state.currentUserId)) return true;
  // Ассистент дополнительно всегда видит всё, где участвует Руководитель.
  if(hasRole('Ассистент')){
    const leaderIds = state.employees.filter(emp=>emp.role==='Руководитель').map(emp=>emp.id);
    if(participants.some(id=>leaderIds.includes(id))) return true;
  }
  return false;
}

  const cutoffDate = new Date(); cutoffDate.setDate(cutoffDate.getDate()-180);
  const cutoffISO = dateToISO(cutoffDate);

    t.status==='done' && t.completedAt && t.completedAt<cutoffISO &&
    !state.personalTasks.some(x=>x.parentId===t.id)

  if(toArchiveTasks.length){
    state.personalArchiveTasks = state.personalArchiveTasks.concat(toArchiveTasks);
    state.personalTasks = state.personalTasks.filter(t=>!toArchiveTasks.includes(t));

    state.personalArchiveEvents = state.personalArchiveEvents.concat(toArchiveEvents);
    state.personalEvents = state.personalEvents.filter(e=>!toArchiveEvents.includes(e));

      state.personalMigrationNeeded = false;
      await sSet('settings:personalMigrated', 'yes', true);
      return true;

    const parsed = await decryptPersonal(blobRaw, password, state.personalSalt);
    if(Array.isArray(parsed)){
      state.personalTasks = parsed;
    } else {
      state.personalTasks = parsed.tasks||[];
      state.personalProjects = parsed.projects||[];
      state.personalTrash = parsed.trash||[];
      state.personalFundsEntries = parsed.funds||[];
      state.personalEvents = parsed.events||[];
      state.personalArchiveTasks = parsed.archiveTasks||[];
      state.personalArchiveEvents = parsed.archiveEvents||[];
    }
    await savePersonalData();
    state.personalMigrationNeeded = false;
    await sSet('settings:personalMigrated', 'yes', true);
    await migrateLegacyPersonalFunds();
    await migrateLegacyPersonalEvents();
    await pruneAndArchivePersonal();
    return true;
  }catch(e){

  }

function withStatus(t, newStatus, comment, completionLink){
  if(newStatus==='done' && t.status!=='done') return {...t, status:newStatus, completedAt: todayISO(), completionComment: comment||t.completionComment||'', completionLink: completionLink!==undefined ? completionLink : (t.completionLink||'')};
  if(newStatus!=='done') return {...t, status:newStatus, completedAt:null, completionComment:'', completionLink:''};
  return {...t, status:newStatus};
}

// Исключение: если человек поставил задачу сам себе (постановщик = исполнитель), проверять
// самого себя бессмысленно — задача сразу становится "Готово".
function withStatusReview(t, comment, completionLink){
  if(t.creatorId && t.assigneeId && t.creatorId===t.assigneeId){
    return withStatus(t, 'done', comment, completionLink);
  }
  return {...t, status:'review', completionComment: comment||t.completionComment||'', completionLink: completionLink!==undefined ? completionLink : (t.completionLink||''), reworkNote:''};
}

async function approveTask(personal, id){
  const before = tasksFor(personal);
  const target = before.find(t=>t.id===id);
  if(!target || !canReviewTask(target, personal)){ toast(whyCantReview(target||{})); return; }
  const updated = before.map(t=>t.id===id?{...t, status:'done', completedAt:todayISO(), reworkNote:''}:t);
  setTasksFor(personal, updated);
  const ok = await persistTasksFor(personal);
  if(!ok){ setTasksFor(personal, before); saveFailedToast(); return; }
  await maybeOfferPurchaseExpense(updated.find(t=>t.id===id), personal);
  toast('Задача принята и закрыта');
  render();
}
async function reworkTask(personal, id){
  const before = tasksFor(personal);
  const target = before.find(t=>t.id===id);
  if(!target || !canReviewTask(target, personal)){ toast(whyCantReview(target||{})); return; }
  const note = await showPrompt('Что нужно доработать? (можно оставить пустым)', '');
  if(note===null) return;
  const updated = before.map(t=>t.id===id?{...t, status:'progress', completedAt:null, reworkNote: note || 'Постановщик вернул задачу на доработку'}:t);
  setTasksFor(personal, updated);
  const ok = await persistTasksFor(personal);
  if(!ok){ setTasksFor(personal, before); saveFailedToast(); return; }
  toast('Задача возвращена на доработку');
  render();
}

async function maybeOfferPurchaseExpense(task, personal){
  if(!task || personal) return;
  if(!task.projectId || !task.purchaseAmount || task.purchaseExpenseId) return;
  const proj = state.projectsWork.find(p=>p.id===task.projectId);
  if(!proj || !isPurchasesProjectName(proj.name)) return;
  const label = `${fmtMoney(task.purchaseAmount)}${task.purchaseStore?` (${task.purchaseStore})`:''}`;
  const ok = await showConfirm(`Задача «${task.title}» выполнена. Создать расход в Финансах на ${label}?`, 'Создать расход');
  if(!ok) return;
  const entry = {
    id: uid(),
    type: 'expense',
    scope: 'work',
    date: todayISO(),
    amount: task.purchaseAmount,
    purpose: task.purchaseStore ? `${task.title} — ${task.purchaseStore}` : task.title,
    receiptUrl: '',
    comment: `Автоматически создано из задачи «${task.title}» (проект «${PURCHASES_PROJECT_NAME}»).`,
    createdAt: Date.now(),
  };
  state.fundsEntries = state.fundsEntries.concat([entry]);
  await saveFunds();
  state.tasksWork = state.tasksWork.map(t=>t.id===task.id?{...t, purchaseExpenseId:entry.id}:t);
  await saveTasksWork();
  toast('Расход добавлен в Финансы');
}

function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function computeReminders(filterAssigneeId){
  const today = todayISO();
  let allTasks = state.tasksWork.concat(personalAccessAllowed() ? state.personalTasks : []);
  if(filterAssigneeId){ allTasks = allTasks.filter(t=>t.assigneeId===filterAssigneeId); }
  const overdueTasks = allTasks.filter(t=>t.deadline && t.deadline<today && t.status==='progress');
  const dueTodayTasks = allTasks.filter(t=>t.deadline===today && t.status==='progress');
  const todayEvents = allVisibleEvents().filter(e=>e.date===today).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
  const soon = new Date(); soon.setDate(soon.getDate()+3);
  const soonISO = soon.toISOString().slice(0,10);
  const upcomingEvents = allVisibleEvents().filter(e=>e.date>today && e.date<=soonISO).sort((a,b)=>a.date.localeCompare(b.date));
  const dueSoonTasks = allTasks.filter(t=>t.deadline && t.deadline>today && t.deadline<=soonISO && t.status==='progress').sort((a,b)=>a.deadline.localeCompare(b.deadline));
  return {overdueTasks, dueTodayTasks, todayEvents, upcomingEvents, dueSoonTasks};
}
function renderBellBadge(){
  const {overdueTasks, dueTodayTasks, todayEvents} = computeReminders();
  const count = overdueTasks.length + dueTodayTasks.length + todayEvents.length;
  const badge = document.getElementById('bellBadge');
  if(!badge) return;
  if(count>0){ badge.style.display='flex'; badge.textContent = count>9?'9+':count; }
  else badge.style.display='none';
}

    state.reminderPanelOpen=false; renderReminderPanel();

    setTimeout(()=>openDayModal(r.dataset.openDay),50);
  });
  document.getElementById('notifyToggle').onchange = async (e)=>{
    if(e.target.checked){
      if(!('Notification' in window)){ toast('Браузер не поддерживает уведомления'); e.target.checked=false; return; }
      const perm = await Notification.requestPermission();
      if(perm!=='granted'){ toast('Разрешение не получено'); e.target.checked=false; return; }
      state.browserNotify = true;
      await sSet('settings:browserNotify','on', false);
      toast('Уведомления браузера включены');
    } else {
      state.browserNotify = false;
      await sSet('settings:browserNotify','off', false);
    }
    renderReminderPanel();
  };
  setTimeout(()=>{
    document.addEventListener('click', function closeOnOutside(ev){
      if(!panel.contains(ev.target) && ev.target.id!=='bellBtn'){
        state.reminderPanelOpen=false; renderReminderPanel();
        document.removeEventListener('click', closeOnOutside);
      }
    });
  },0);
}

function checkNotificationsTick(){
  if(!state.browserNotify || !('Notification' in window) || Notification.permission!=='granted') return;
  const today = todayISO();
  const nowMin = nowHHMM();
  // За 1 час до начала — только события, где текущий пользователь указан участником
  state.events.filter(e=> e.date===today && e.startTime && e.employeeIds && e.employeeIds.includes(state.currentUserId)).forEach(e=>{
    const key = e.id+'|'+e.date;
    if(state.notifiedEventKeys.has(key)) return;
    const [eh,em] = e.startTime.split(':').map(Number);
    const [nh,nm] = nowMin.split(':').map(Number);
    const diff = (eh*60+em) - (nh*60+nm);
    if(diff>=0 && diff<=60){
      new Notification('Через час: '+e.title, {body:(e.startTime||'')+' · '+(CATEGORIES[e.category]||'')});
      state.notifiedEventKeys.add(key);
    }
  });
  const {overdueTasks, dueTodayTasks, dueSoonTasks} = computeReminders();
  if((overdueTasks.length || dueTodayTasks.length || dueSoonTasks.length) && state.lastSummaryDate!==today){
    new Notification('Задачи на сегодня', {body:`Просрочено: ${overdueTasks.length} · На сегодня: ${dueTodayTasks.length} · Через 1–3 дня: ${dueSoonTasks.length}`});
    state.lastSummaryDate = today;
    sSet('settings:notifySummaryDate', today, false);
  }
}
// Раз в минуту незаметно проверяет сервер на новые задачи, назначенные текущему пользователю
// (не им самим поставленные), и присылает браузерное уведомление. Использует ту же настройку
// "Уведомления браузера", что и остальные напоминания.
async function checkNewTasksTick(){
  if(!state.browserNotify || !('Notification' in window) || Notification.permission!=='granted' || !state.currentUserId) return;
  const raw = await sGet('tasks:work', true);
  if(raw===null) return;
  let fresh;
  try{ fresh = JSON.parse(raw); }catch(e){ return; }
  if(!state.knownTaskIds){
    state.knownTaskIds = new Set(fresh.map(t=>t.id));
    return;
  }
  const newAssignedToMe = fresh.filter(t=>
    !state.knownTaskIds.has(t.id) && t.assigneeId===state.currentUserId && t.creatorId!==state.currentUserId
  );
  state.knownTaskIds = new Set(fresh.map(t=>t.id));
  if(!newAssignedToMe.length) return;
  newAssignedToMe.forEach(t=>{
    new Notification('Новая задача: '+t.title, {
      body: `Поставил: ${empName(t.creatorId)}${t.deadline?' · до '+fmtDate(t.deadline):''}`
    });
  });
  state.tasksWork = fresh;
  // Не дёргаем экран, если человек сейчас что-то заполняет в открытом окне — просто обновляем данные тихо
  const modalOpen = document.getElementById('modalRoot') && document.getElementById('modalRoot').innerHTML.trim() !== '';
  if(!modalOpen) render();
}
// Раз в минуту незаметно проверяет сервер на новые события, где текущий пользователь указан участником.
async function checkNewEventsTick(){
  if(!state.browserNotify || !('Notification' in window) || Notification.permission!=='granted' || !state.currentUserId) return;
  const raw = await sGet('calendar:events', true);
  if(raw===null) return;
  let fresh;
  try{ fresh = JSON.parse(raw); }catch(e){ return; }
  if(!state.knownEventIds){
    state.knownEventIds = new Set(fresh.map(e=>e.id));
    return;
  }
  const newForMe = fresh.filter(e=>
    !state.knownEventIds.has(e.id) && e.employeeIds && e.employeeIds.includes(state.currentUserId)
  );
  state.knownEventIds = new Set(fresh.map(e=>e.id));
  if(!newForMe.length) return;
  newForMe.forEach(e=>{
    new Notification('Новое событие: '+e.title, {
      body: `${fmtDate(e.date)}${e.startTime?' · '+e.startTime:''} · ${CATEGORIES[e.category]||''}`
    });
  });
  state.events = fresh;
  const modalOpen = document.getElementById('modalRoot') && document.getElementById('modalRoot').innerHTML.trim() !== '';
  if(!modalOpen) render();
}

function render(){
  renderTabs();
  const root = document.getElementById('appContent');
  if(!state.loaded){ root.innerHTML = `<div class="empty-state"><div class="big">Загрузка…</div></div>`; return; }
  if(state.tab==='overview') renderOverview(root);
  else if(state.tab==='calendar') renderCalendar(root);
  else if(state.tab==='tasks') renderTasks(root);
  else if(state.tab==='funds'){
    if(!hasRole('Руководитель','Ассистент')){
      root.innerHTML = `
        <div class="row-between">
          <div>
            <h2 class="section-title">Финансы</h2>
            <p class="subtitle">Доходы и расходы — отдельно рабочие и личные</p>
          </div>
        </div>
      ` + accessDeniedScreen('Раздел «Финансы» доступен только Руководителю и Ассистенту.');
    } else if(state.personalMigrationNeeded){
      root.innerHTML = `
        <div class="row-between">
          <div>
            <h2 class="section-title">Финансы</h2>
            <p class="subtitle">Доходы и расходы — отдельно рабочие и личные</p>
          </div>
        </div>
      `;
      const migWrap = document.createElement('div');
      root.appendChild(migWrap);
      renderPersonalMigrationScreen(migWrap, render);
    } else {
      renderFunds(root);
    }
  }
  else if(state.tab==='archive') renderArchiveTab(root);
  renderBellBadge();
  renderWhoAmIBtn();
}

/* ================= OVERVIEW ================= */
function renderOverview(root){
  const canChooseWhoToView = hasRole('Руководитель','Ассистент');
  // По умолчанию каждый видит только свои задачи. Руководитель/Ассистент могут выбрать чужой обзор или "Все".
  let viewingId = canChooseWhoToView ? (state.overviewFilterEmployee || state.currentUserId) : state.currentUserId;
  const viewCompanyWide = canChooseWhoToView && viewingId === 'all';
  const {overdueTasks, dueTodayTasks, todayEvents} = computeReminders(viewCompanyWide ? null : viewingId);
  const workBalance = state.fundsEntries.reduce((s,f)=> s + (f.type==='issue'?Number(f.amount):-Number(f.amount)), 0);
  const personalBalance = state.personalFundsEntries.reduce((s,f)=> s + (f.type==='issue'?Number(f.amount):-Number(f.amount)), 0);
  const meEmp = state.currentUserId ? state.employees.find(e=>e.id===state.currentUserId) : null;
  const viewingEmp = viewingId ? state.employees.find(e=>e.id===viewingId) : null;
  const tasksLabel = viewCompanyWide ? 'Все задачи (компания)' : (viewingId===state.currentUserId ? '🙋 Мои задачи' : `Задачи: ${viewingEmp?escapeHtml(viewingEmp.name):''}`);
  const reviewQueue = state.currentUserId ? state.tasksWork.concat(personalAccessAllowed()?state.personalTasks:[])
    .filter(t=>t.status==='review' && t.creatorId===state.currentUserId)
    .sort((a,b)=>(a.completedAt||'').localeCompare(b.completedAt||'')) : [];

  function taskRow(t){
    const overdue = t.deadline && t.deadline<todayISO();
    const personal = state.personalTasks.some(pt=>pt.id===t.id);
    const canComplete = canCompleteTask(t, personal);
    return `<div class="item">
      <input type="checkbox" class="task-check${canComplete?'':' task-check-locked'}" data-ov-done="${t.id}" data-ov-done-personal="${personal?'1':'0'}" ${t.status==='done'?'checked':''} title="${canComplete?'Отметить выполненной':whyCantComplete(t)}">
      <div class="main" style="cursor:pointer;" data-ov-task="${t.id}">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="meta"><span class="badge prio-${t.priority==='high'?'high':t.priority==='med'?'med':'low'}">${PRIORITIES[t.priority]||''}</span>${t.deadline?`<span style="${overdue?'color:var(--brick);font-weight:600;':''}">до ${fmtDate(t.deadline)}</span>`:''}</div>
      </div>
      ${overdue && t.status==='progress' ? `<div style="width:100%;">${renderOverdueReasonBlock(t, personal)}</div>` : ''}
    </div>`;
  }
  function reviewRow(t){
    return `<div class="item">
      <div class="main" style="cursor:pointer;" data-ov-task="${t.id}">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="meta">
          ${t.assigneeId?`<span>Исполнитель: ${escapeHtml(empName(t.assigneeId))}</span>`:''}
          <span>Сдано: ${t.completedAt?fmtDate(t.completedAt):'—'}</span>
        </div>
        ${t.completionComment?`<div class="desc" style="color:var(--teal);">✅ ${linkifyEscaped(t.completionComment)}</div>`:''}
        ${t.completionLink?`<div class="desc">🔗 <a href="${escapeHtml(t.completionLink)}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;" onclick="event.stopPropagation()">Ссылка на результат</a></div>`:''}
      </div>
      <div class="actions">
        <button type="button" class="btn small" data-approve-task="${t.id}">✅ Принять</button>
        <button type="button" class="btn ghost small" data-rework-task="${t.id}">↩️ На доработку</button>
      </div>
    </div>`;
  }
  function eventRow(e){
    return `<div class="item" style="cursor:pointer;" data-ov-day="${e.date}">
      <div class="main"><div class="title">${e.startTime?e.startTime+' · ':''}${escapeHtml(e.title)}</div>
      <div class="meta"><span>${CATEGORIES[e.category]||''}</span></div></div>
    </div>`;
  }

  root.innerHTML = `
    <div class="row-between">
      <div>
        <h2 class="section-title">${meEmp ? `Здравствуйте, ${escapeHtml(meEmp.name)}!` : 'Обзор на сегодня'}</h2>
        <p class="subtitle">${fmtDate(todayISO())}</p>
      </div>
      ${canChooseWhoToView ? `
        <select id="ovWhoSelect" style="width:auto;min-width:200px;">
          <option value="${state.currentUserId||''}" ${viewingId===state.currentUserId?'selected':''}>🙋 Мои задачи</option>
          ${state.employees.filter(e=>e.id!==state.currentUserId).map(e=>`<option value="${e.id}" ${viewingId===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}
          <option value="all" ${viewCompanyWide?'selected':''}>Все сотрудники</option>
        </select>
      ` : ''}
    </div>
    <div class="ledger-summary" style="margin-bottom:24px;">
      <div class="sum-card spent"><div class="label">Просрочено задач</div><div class="val mono">${overdueTasks.length}</div></div>
      <div class="sum-card issued"><div class="label">Задач на сегодня</div><div class="val mono">${dueTodayTasks.length}</div></div>
      <div class="sum-card"><div class="label">Событий сегодня</div><div class="val mono" style="color:var(--indigo);">${todayEvents.length}</div></div>
      ${reviewQueue.length ? `<div class="sum-card"><div class="label">🔍 Нужно проверить</div><div class="val mono" style="color:var(--ochre);">${reviewQueue.length}</div></div>` : ''}
      ${hasRole('Руководитель','Ассистент') ? `
        <div class="sum-card balance"><div class="label">Общий остаток</div><div class="val mono">${fmtMoney(workBalance + personalBalance)}</div></div>
      ` : ''}
    </div>
    ${reviewQueue.length ? `
      <h2 class="section-title" style="font-size:16px;">🔍 Нужно проверить (${reviewQueue.length})</h2>
      <p class="subtitle" style="margin-top:-6px;">Исполнители отметили эти задачи сделанными — проверьте и примите, либо верните на доработку</p>
      <div class="item-list" style="margin-bottom:24px;">
        ${reviewQueue.map(reviewRow).join('')}
      </div>
    ` : ''}
    ${state.currentUserId ? `
      <h2 class="section-title" style="font-size:16px;">${tasksLabel}</h2>
      <div class="item-list" style="margin-bottom:24px;">
        ${(() => {
          const allOpen = state.tasksWork.concat(personalAccessAllowed()?state.personalTasks:[])
            .filter(t=> t.status==='progress' && (viewCompanyWide || t.assigneeId===viewingId));
          const today = todayISO();
          const overdueList = allOpen.filter(t=>t.deadline && t.deadline<today).sort((a,b)=>a.deadline.localeCompare(b.deadline));
          const todayList = allOpen.filter(t=>t.deadline===today);
          const upcomingList = allOpen.filter(t=>t.deadline && t.deadline>today).sort((a,b)=>a.deadline.localeCompare(b.deadline));
          const noDeadlineList = allOpen.filter(t=>!t.deadline);
          const groupLabel = (label)=>`<div class="subtitle" style="margin:14px 0 6px;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;">${label}</div>`;
          let html = '';
          if(overdueList.length) html += groupLabel(`⚠️ Просрочено (${overdueList.length})`) + overdueList.map(taskRow).join('');
          if(todayList.length) html += groupLabel(`Сегодня (${todayList.length})`) + todayList.map(taskRow).join('');
          if(upcomingList.length) html += groupLabel(`Предстоящие (${upcomingList.length})`) + upcomingList.map(taskRow).join('');
          if(noDeadlineList.length) html += groupLabel(`Без дедлайна (${noDeadlineList.length})`) + noDeadlineList.map(taskRow).join('');
          return html || `<p class="subtitle" style="margin:0;">Открытых задач нет 🎉</p>`;
        })()}
      </div>
    ` : `<div class="note" style="margin-bottom:24px;">Нажмите «🙋 Кто я?» в шапке, чтобы видеть здесь свои задачи.</div>`}
    <h2 class="section-title" style="font-size:16px;">Сегодня в календаре</h2>
    <div class="item-list">
      ${todayEvents.length ? todayEvents.map(eventRow).join('') : `<p class="subtitle" style="margin:0;">На сегодня событий не запланировано</p>`}
    </div>
  `;
  const whoSelect = document.getElementById('ovWhoSelect');
  if(whoSelect) whoSelect.onchange=()=>{
    state.overviewFilterEmployee = whoSelect.value;
    render();
  };
  wireOverdueReasonInputs(root);
  wireReviewActions(root);
  root.querySelectorAll('[data-ov-done]').forEach(cb=>{
    cb.onclick = e=>e.stopPropagation();
    cb.onchange = async ()=>{
      const id = cb.dataset.ovDone;
      const personal = cb.dataset.ovDonePersonal==='1';
      const task = tasksFor(personal).find(t=>t.id===id);
      if(cb.checked){
        const result = await requestCompletionComment(task ? task.title : '');
        if(result===null){ cb.checked=false; return; }
        const fresh = await refreshTasksFromServer(personal);
        const before = fresh || tasksFor(personal);
        const updated = before.map(t=>t.id===id?withStatusReview(t,result.comment,result.link):t);
        setTasksFor(personal, updated);
        const ok = await persistTasksFor(personal);
        if(!ok){ setTasksFor(personal, before); cb.checked=false; saveFailedToast(); return; }
        render();
      } else {
        const fresh = await refreshTasksFromServer(personal);
        const before = fresh || tasksFor(personal);
        setTasksFor(personal, before.map(t=>t.id===id?withStatus(t,'progress'):t));
        const ok = await persistTasksFor(personal);
        if(!ok){ setTasksFor(personal, before); cb.checked=true; saveFailedToast(); return; }
        render();
      }
    };
  });
  root.querySelectorAll('[data-ov-task]').forEach(row=>row.onclick=()=>{
    const id = row.dataset.ovTask;
    state.tab='tasks'; state.taskSubtab='work'; render();
    setTimeout(()=>openTaskModal(id, false), 50);
  });
  root.querySelectorAll('[data-ov-day]').forEach(row=>row.onclick=()=>{
    const iso = row.dataset.ovDay;
    state.tab='calendar'; render();
    setTimeout(()=>openDayModal(iso), 50);
  });
}

/* ================= CALENDAR ================= */
function renderCalendar(root){
  const y=state.calYear, m=state.calMonth;
  const monthNames=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const first = new Date(y,m,1);
  let startDow = first.getDay(); startDow = startDow===0?6:startDow-1; // Monday start
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const eventsByDate = {};
  allVisibleEvents().filter(e=>state.calFilters[e.category]!==false).forEach(e=>{ (eventsByDate[e.date]=eventsByDate[e.date]||[]).push(e); });

  const activeEmpIds = state.employees.filter(e=>state.calEmployeeFilters[e.id]).map(e=>e.id);
  const tasksByDate = {};
  if(activeEmpIds.length){
    state.tasksWork.filter(t=>t.deadline && t.assigneeId && activeEmpIds.includes(t.assigneeId)).forEach(t=>{
      (tasksByDate[t.deadline]=tasksByDate[t.deadline]||[]).push(t);
    });
  }

  root.innerHTML = `
    <div class="row-between">
      <div>
        <h2 class="section-title">Общий календарь</h2>
        <p class="subtitle">${hasRole('Руководитель') && state.calendarFullView ? 'Полное расписание — видны все планёрки, встречи и события' : 'Показаны только те планёрки, встречи и события, где вы участвуете'}</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${hasRole('Руководитель') ? `<button class="btn ghost" id="toggleFullScheduleBtn">${state.calendarFullView?'👁 Скрыть до моих':'🔭 Показать общее расписание'}</button>` : ''}
        <button class="btn" id="addEventBtn">+ Событие</button>
      </div>
    </div>
    <div class="cat-filters" id="catFilters">
      ${Object.entries(CATEGORIES).map(([k,v])=>`
        <button class="cat-chip ${state.calFilters[k]?'':'off'}" data-cat="${k}">
          <span class="dot" style="background:${CATEGORY_COLORS[k]};"></span>${v}${k==='personal' && !personalAccessAllowed()?' 🔒':''}
        </button>
      `).join('')}
    </div>
    ${!personalAccessAllowed()?`<div class="note" id="calPersonalNote" style="margin-bottom:16px;">🔒 «Личные дела Карины» видны только Руководителю и Ассистенту. <button class="btn ghost small" id="calUnlockBtn" style="margin-left:6px;">🙋 Войти</button></div>`:''}
    <div class="row-between" style="margin-bottom:6px;">
      <p class="subtitle" style="margin:0;">Показать задачи на календаре:</p>
    </div>
    <div class="cat-filters" id="empFilters" style="margin-bottom:18px;">
      ${state.employees.map(e=>`
        <button class="cat-chip ${state.calEmployeeFilters[e.id]?'':'off'}" data-emp="${e.id}">
          <span class="dot" style="background:${employeeColor(e.id)};"></span>${escapeHtml(e.name)}
        </button>
      `).join('') || `<span class="subtitle" style="margin:0;">Сначала добавьте сотрудников</span>`}
    </div>
    <div class="cal-head">
      <div class="cal-nav"><button class="btn ghost small" id="calPrev">←</button></div>
      <div class="month-label">${monthNames[m]} ${y}</div>
      <div class="cal-nav"><button class="btn ghost small" id="calNext">→</button></div>
    </div>
    <div class="cal-grid">
      ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(d===null) return `<div class="cal-cell empty"></div>`;
        const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = iso===todayISO();
        const evts = (eventsByDate[iso]||[]).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
        const tasks = (tasksByDate[iso]||[]).sort((a,b)=>(a.priority==='high'?-1:1));
        const chipLen = calChipLen();
        const evtChips = evts.map(e=>{
          const label = truncate((e.seriesId?'🔁 ':'')+(e.startTime?e.startTime+' · ':'')+e.title, chipLen);
          return `<div class="cal-evt cat-${e.category}" title="${e.seriesId?'🔁 Повтор — ':''}${escapeHtml(e.title)}">${escapeHtml(label)}</div>`;
        });
        const taskChips = tasks.map(t=>{
          const label = truncate((t.status==='done'?'✓ ':'☐ ')+t.title, chipLen);
          return `<div class="cal-evt cal-task ${t.status==='done'?'is-done':''}" style="border-color:${employeeColor(t.assigneeId)};color:${employeeColor(t.assigneeId)};" title="${escapeHtml(empName(t.assigneeId))}: ${escapeHtml(t.title)}">${escapeHtml(label)}</div>`;
        });
        const allChips = evtChips.concat(taskChips);
        const maxShown = calMaxShown();
        const shown = allChips.slice(0,maxShown);
        const more = allChips.length - shown.length;
        return `<div class="cal-cell ${isToday?'today':''}" data-date="${iso}">
          <div class="cal-daynum">${d}</div>
          ${shown.join('')}
          ${more>0?`<div class="cal-more">+${more} ещё</div>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
  root.querySelector('#calPrev').onclick=()=>{ state.calMonth--; if(state.calMonth<0){state.calMonth=11;state.calYear--;} render(); };
  root.querySelector('#calNext').onclick=()=>{ state.calMonth++; if(state.calMonth>11){state.calMonth=0;state.calYear++;} render(); };
  root.querySelector('#addEventBtn').onclick=()=>openEventModal();
  const toggleFullBtn = document.getElementById('toggleFullScheduleBtn');
  if(toggleFullBtn) toggleFullBtn.onclick=()=>{
    state.calendarFullView = !state.calendarFullView;
    render();
  };
  const calUnlockBtn = document.getElementById('calUnlockBtn');
  if(calUnlockBtn) calUnlockBtn.onclick=()=>openWhoAmIModal();
  root.querySelectorAll('#catFilters .cat-chip').forEach(chip=>{
    chip.onclick=()=>{
      const cat = chip.dataset.cat;
      state.calFilters[cat] = !state.calFilters[cat];
      render();
    };
  });
  root.querySelectorAll('#empFilters .cat-chip').forEach(chip=>{
    chip.onclick=()=>{
      const empId = chip.dataset.emp;
      state.calEmployeeFilters[empId] = !state.calEmployeeFilters[empId];
      render();
    };
  });
  root.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    cell.onclick=()=>openDayModal(cell.dataset.date);
  });
}

function openDayModal(iso){
  if(state.dayModalIso !== iso){ state.dayDoneExpanded = false; }
  state.dayModalIso = iso;
  const evts = allVisibleEvents().filter(e=>e.date===iso).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
  const dayTasks = state.tasksWork.concat(personalAccessAllowed()?state.personalTasks:[]).filter(t=>t.deadline===iso);
  const activeTasks = dayTasks.filter(t=>t.status!=='done').sort((a,b)=> (b.seriesId?1:0) - (a.seriesId?1:0));
  const doneTasks = dayTasks.filter(t=>t.status==='done');
  const isPersonalTaskFn = (id)=> state.personalTasks.some(pt=>pt.id===id);
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal" style="max-width:520px;">
        <h3>${fmtDate(iso)}</h3>
        <h4 style="font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 8px;">События</h4>
        <div class="item-list" style="margin-bottom:16px;">
          ${evts.length? evts.map(e=>`
            <div class="item">
              <div class="main">
                <div class="title">${isPersonalEvent(e.id)?'🔒 ':''}${e.startTime?e.startTime+(e.endTime?'–'+e.endTime:'')+' · ':''}${escapeHtml(e.title)}</div>
                <div class="meta">
                  <span>${CATEGORIES[e.category]||''}</span>
                  ${e.seriesId?'<span>🔁 Повтор</span>':''}
                  <span>${e.format==='online'?'💻 Онлайн':'📍 Оффлайн'}</span>
                  ${e.employeeIds&&e.employeeIds.length?`<span>${e.employeeIds.map(empName).join(', ')}</span>`:''}
                  ${e.manualNames?`<span>(${escapeHtml(e.manualNames)})</span>`:''}
                </div>
                ${e.format==='offline' && e.location?`<div class="desc">📍 ${escapeHtml(e.location)}</div>`:''}
                ${e.format==='online' && e.link?`<div class="desc">🔗 <a href="${escapeHtml(e.link)}" target="_blank" rel="noopener" style="color:var(--indigo);">${escapeHtml(e.link)}</a></div>`:''}
                ${e.extraLink?`<div class="desc">📎 <a href="${escapeHtml(e.extraLink)}" target="_blank" rel="noopener noreferrer" style="color:var(--indigo);text-decoration:underline;">Доп. ссылка</a></div>`:''}
                ${e.notes?`<div class="desc">${linkifyEscaped(e.notes)}</div>`:''}
              </div>
              <div class="actions">
                <button class="btn ghost small" data-edit="${e.id}">Изм.</button>
                <button class="btn danger small" data-del="${e.id}">✕</button>
              </div>
            </div>
          `).join('') : `<p class="subtitle" style="margin:0;">Событий нет</p>`}
        </div>
        <h4 style="font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 8px;">Задачи в работе на этот день</h4>
        <div class="item-list" id="dayTaskListActive" style="margin-bottom:${doneTasks.length?10:16}px;">
          ${activeTasks.length ? activeTasks.map(t=>taskItemHtml(t, isPersonalTaskFn(t.id))).join('')
            : (doneTasks.length ? `<p class="subtitle" style="margin:0;">Активных задач нет — все выполнены 🎉</p>` : `<p class="subtitle" style="margin:0;">Задач с таким сроком нет</p>`)}
        </div>
        ${doneTasks.length ? `
        <button class="btn ghost small" id="toggleDoneTasks">${state.dayDoneExpanded?'Скрыть':'Показать'} выполненные задачи (${doneTasks.length})</button>
        <div class="item-list" id="dayTaskListDone" style="margin:10px 0 16px;${state.dayDoneExpanded?'':'display:none;'}">
          ${doneTasks.map(t=>taskItemHtml(t, isPersonalTaskFn(t.id))).join('')}
        </div>` : ''}
        <div class="modal-actions">
          <button class="btn ghost" id="closeDayModal">Закрыть</button>
          <button class="btn" id="addForDay">+ Добавить событие</button>
        </div>
      </div>
    </div>`;
  document.getElementById('closeDayModal').onclick=()=>{ state.dayModalIso=null; closeModal(); };
  document.getElementById('ov').onclick=(ev)=>{ if(ev.target.id==='ov'){ state.dayModalIso=null; closeModal(); } };
  document.getElementById('addForDay').onclick=()=>openEventModal(null, iso);
  modal.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEventModal(b.dataset.edit));
  modal.querySelectorAll('[data-del]').forEach(b=>b.onclick=async ()=>{
    const evId = b.dataset.del;
    const personal = isPersonalEvent(evId);
    const evObj = eventsFor(personal).find(e=>e.id===evId);
    if(evObj && evObj.seriesId){
      const choice = await showSeriesDeleteChoice();
      if(!choice) return;
      const before = eventsFor(personal);
      if(choice==='one'){
        await moveToTrash(personal, 'event', evObj);
        setEventsFor(personal, before.filter(e=>e.id!==evId));
      } else {
        const seriesEvents = before.filter(e=>e.seriesId===evObj.seriesId);
        for(const se of seriesEvents) await moveToTrash(personal, 'event', se);
        setEventsFor(personal, before.filter(e=>e.seriesId!==evObj.seriesId));
      }
      const ok = await persistEventsFor(personal);
      if(!ok){ setEventsFor(personal, before); saveFailedToast(); return; }
      closeModal(); render();
    } else if(await showConfirm('Удалить событие?')){
      const before = eventsFor(personal);
      if(evObj) await moveToTrash(personal, 'event', evObj);
      setEventsFor(personal, before.filter(e=>e.id!==evId));
      const ok = await persistEventsFor(personal);
      if(!ok){ setEventsFor(personal, before); saveFailedToast(); return; }
      closeModal(); render();
    }
  });
  const activeListEl = document.getElementById('dayTaskListActive');
  if(activeTasks.length) wireDayTaskActions(activeListEl, iso);
  const doneListEl = document.getElementById('dayTaskListDone');
  if(doneListEl) wireDayTaskActions(doneListEl, iso);
  const toggleBtn = document.getElementById('toggleDoneTasks');
  if(toggleBtn) toggleBtn.onclick=()=>{
    state.dayDoneExpanded = !state.dayDoneExpanded;
    closeModal(); openDayModal(iso);
  };
}

function wireDayTaskActions(el, iso){
  wireEventLinks(el);
  wireOverdueReasonInputs(el);
  wireReviewActions(el);
  const isPersonalTask = (id)=> state.personalTasks.some(pt=>pt.id===id);
  el.querySelectorAll('[data-done]').forEach(cb=>{
    cb.onclick = e=>e.stopPropagation();
    cb.onchange = async ()=>{
      const id = cb.dataset.done;
      const personal = isPersonalTask(id);
      const task = tasksFor(personal).find(t=>t.id===id);
      if(!canCompleteTask(task, personal)){
        cb.checked = !cb.checked;
        toast(state.currentUserId ? `Отметить может только исполнитель${task&&task.assigneeId?': '+empName(task.assigneeId):''}` : 'Сначала выберите «Кто я?» в шапке');
        return;
      }
      if(cb.checked){
        const result = await requestCompletionComment(task ? task.title : '');
        if(result===null){ cb.checked=false; return; }
        const fresh = await refreshTasksFromServer(personal);
        const before = fresh || tasksFor(personal);
        const updated = before.map(t=>t.id===id?withStatusReview(t,result.comment,result.link):t);
        setTasksFor(personal, updated);
        const ok = await persistTasksFor(personal);
        if(!ok){ setTasksFor(personal, before); cb.checked=false; saveFailedToast(); return; }
        render();
        closeModal(); openDayModal(iso);
      } else {
        const fresh = await refreshTasksFromServer(personal);
        const before = fresh || tasksFor(personal);
        setTasksFor(personal, before.map(t=>t.id===id?withStatus(t,'progress'):t));
        const ok = await persistTasksFor(personal);
        if(!ok){ setTasksFor(personal, before); cb.checked=true; saveFailedToast(); return; }
        render();
        closeModal(); openDayModal(iso);
      }
    };
  });
  el.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.editTask;
    const personal = isPersonalTask(id);
    const t = tasksFor(personal).find(x=>x.id===id);
    if(!canEditTask(t, personal)){ toast(whyCantEdit(t)); return; }
    openTaskModal(id, personal);
  });
  el.querySelectorAll('[data-add-sub]').forEach(b=>b.onclick=()=>openTaskModal(null, isPersonalTask(b.dataset.addSub), b.dataset.addSub));
  el.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.delTask;
    const personal = isPersonalTask(id);
    const targetTask = tasksFor(personal).find(x=>x.id===id);
    const didDelete = await performTaskDeletion(personal, targetTask);
    if(!didDelete) return;
    render();
    closeModal(); openDayModal(iso);
  });
}

  const initialHasManagerHostess = initialEmpIds.some(eid=>{

        <div class="field"><label>Название</label><input id="f_title" value="${existing?escapeHtml(existing.title):''}" placeholder="Например: Совещание с мастерами"></div>
