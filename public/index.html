    `;
  }

  function attachExpenseModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-expense');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const eventOptions = eventSelectOptions();
    const labelToId = {};
    eventOptions.forEach(o=>{ labelToId[o.label] = o.id; });
    const eventSearchInput = overlay.querySelector('#ex-event-search');
    const eventHidden = overlay.querySelector('#ex-event');
    if(eventSearchInput && eventHidden){
      eventSearchInput.addEventListener('input', ()=>{
        const val = eventSearchInput.value.trim();
        if(val === ''){ eventHidden.value = ''; eventSearchInput.style.borderColor = ''; return; }
        if(labelToId[val]){ eventHidden.value = labelToId[val]; eventSearchInput.style.borderColor = ''; }
      });
      eventSearchInput.addEventListener('blur', ()=>{
        const val = eventSearchInput.value.trim();
        if(val !== '' && !labelToId[val]){
          eventSearchInput.value = '';
          eventHidden.value = '';
        }
      });
    }

    const categorySelect = overlay.querySelector('#ex-category');
    if(categorySelect){
      categorySelect.onchange = ()=>{
        const directionField = overlay.querySelector('#expense-direction-field');
        if(directionField) directionField.style.display = (categorySelect.value === 'Материалы') ? 'block' : 'none';
        const masterField = overlay.querySelector('#expense-master-field');
        if(masterField) masterField.style.display = (categorySelect.value === 'Зарплата') ? 'block' : 'none';
      };
    }

    const delBtn = overlay.querySelector('#btn-del-expense');
    if(delBtn) delBtn.onclick = ()=>{
      const hasLink = !!state.modal.expense.eventId;
      showConfirmDeletePopup(`Удалить этот расход?${hasLink ? ' Он также уберётся из себестоимости привязанного мероприятия.' : ' Действие необратимо.'}`, async ()=>{
        const expToDelete = state.modal.expense;
        state.expenses = state.expenses.filter(x=>x.id !== expToDelete.id);
        if(expToDelete.eventId){
          const ev = state.events.find(e=>e.id===expToDelete.eventId);
          if(ev && Array.isArray(ev.materialsItems)){
            const before = ev.materialsItems.length;
            ev.materialsItems = ev.materialsItems.filter(m=>m.expRef !== expToDelete.id);
            if(ev.materialsItems.length !== before) await saveEvents();
          }
        }
        await saveExpenses();
        state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-expense').onclick = async ()=>{
      ['ex-date','ex-amount','ex-responsible','ex-comment','ex-direction-search'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      const dateVal = overlay.querySelector('#ex-date').value;
      const amountRaw = overlay.querySelector('#ex-amount').value;
      const categoryVal = overlay.querySelector('#ex-category').value;
      const directionVal = overlay.querySelector('#ex-direction-search').value.trim();
      const masterVal = overlay.querySelector('#ex-master-search').value.trim();
      const sourceVal = overlay.querySelector('#ex-source').value;
      const responsibleVal = overlay.querySelector('#ex-responsible').value.trim();
      const commentVal = overlay.querySelector('#ex-comment').value.trim();

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!dateVal) markInvalid('ex-date');
      if(amountRaw === '') markInvalid('ex-amount');
      if(!responsibleVal) markInvalid('ex-responsible');
      if(!commentVal) markInvalid('ex-comment');
      let directionMissing = false;
      if(categoryVal === 'Материалы' && !directionVal){ directionMissing = true; markInvalid('ex-direction-search'); }
      let masterMissing = false;
      if(categoryVal === 'Зарплата' && !masterVal){ masterMissing = true; markInvalid('ex-master-search'); }

      if(!dateVal || amountRaw==='' || !responsibleVal || !commentVal || directionMissing || masterMissing){
        showGapWarningBanner('Заполните все поля перед сохранением расхода.');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const previousExpense = state.modal.expense;
      const updated = {
        id: previousExpense.id,
        date: dateVal,
        category: categoryVal,
        direction: categoryVal==='Материалы' ? directionVal : '',
        master: categoryVal==='Зарплата' ? masterVal : '',
        source: sourceVal,
        amount: parseInt(amountRaw),
        responsible: responsibleVal,
        eventId: overlay.querySelector('#ex-event').value || '',
        comment: commentVal,
      };

      // синхронизация с себестоимостью привязанного мероприятия — кроме категории "Зарплата",
      // которая уже учитывается через зарплату мастера и задвоилась бы
      const prevEventId = previousExpense.eventId || '';
      const affectedExpEventIds = new Set([prevEventId, updated.eventId].filter(Boolean));
      let anyExpEventChanged = false;
      affectedExpEventIds.forEach(eventId=>{
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) return;
        if(!Array.isArray(ev.materialsItems)) ev.materialsItems = [];
        const before = ev.materialsItems.length;
        ev.materialsItems = ev.materialsItems.filter(m=>m.expRef !== updated.id);
        if(eventId === updated.eventId && updated.category !== 'Зарплата'){
          ev.materialsItems.push({ name: `Расход: ${updated.comment || updated.category}`, cost: updated.amount, source: 'studio', expRef: updated.id });
        }
        if(ev.materialsItems.length !== before || (eventId === updated.eventId && updated.category !== 'Зарплата')) anyExpEventChanged = true;
      });
      if(anyExpEventChanged) await saveEvents();

      const idx = state.expenses.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.expenses[idx] = updated; else state.expenses.push(updated);
      await saveExpenses();
      state.modal = null; overlay.remove(); render();
    };
  }

  function attachCertificateModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-cert');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    // журнал списаний по сертификату (мероприятие + дата + сумма), с остатком
    let redemptionsDraft = (state.modal.cert.redemptions || (state.modal.cert.eventId ? [{id:uid(), eventId:state.modal.cert.eventId, date:state.modal.cert.useDate||state.modal.cert.saleDate, amount:state.modal.cert.amount}] : [])).map(r=>({...r, id: r.id||uid()}));
    const redemptionEventOptions = eventSelectOptions();
    const redemptionLabelToId = {};
    redemptionEventOptions.forEach(o=>{ redemptionLabelToId[o.label] = o.id; });

    function syncRedemptionsFromInputs(){
      overlay.querySelectorAll('#cert-redemptions-list [data-rd-idx]').forEach(row=>{
        const i = parseInt(row.dataset.rdIdx);
        const eventInput = row.querySelector('.rd-event');
        const dateInput = row.querySelector('.rd-date');
        const amountInput = row.querySelector('.rd-amount');
        if(redemptionsDraft[i]){
          redemptionsDraft[i] = {
            id: redemptionsDraft[i].id || uid(),
            eventId: redemptionLabelToId[eventInput.value.trim()] || (redemptionsDraft[i].eventId && eventInput.value.trim()===(eventSelectOptions().find(o=>o.id===redemptionsDraft[i].eventId)?.label) ? redemptionsDraft[i].eventId : ''),
            date: dateInput.value,
            amount: amountInput.value !== '' ? parseInt(amountInput.value) : null,
          };
        }
      });
    }
    function updateRemainingHint(){
      const totalAmount = parseInt(overlay.querySelector('#c-amount').value) || 0;
      const spent = redemptionsDraft.reduce((s,r)=> s + ((r.amount!==undefined&&r.amount!==null&&!isNaN(r.amount))?Number(r.amount):0), 0);
      const remaining = totalAmount - spent;
      const hint = overlay.querySelector('#cert-remaining-hint');
      if(hint){
        hint.textContent = `Списано: ${formatMoney(spent)} · Остаток: ${formatMoney(remaining)}`;
        hint.style.color = remaining < 0 ? 'var(--status-red)' : (remaining === 0 ? 'var(--status-green)' : 'var(--ink-soft)');
      }
    }
    function refreshRedemptionsUI(){
      const container = overlay.querySelector('#cert-redemptions-list');
      container.innerHTML = renderRedemptionRows(redemptionsDraft);
      attachRedemptionRowEvents();
      updateRemainingHint();
    }
    function attachRedemptionRowEvents(){
      overlay.querySelectorAll('#cert-redemptions-list [data-rd-idx]').forEach(row=>{
        row.querySelectorAll('input').forEach(inp=>{
          inp.addEventListener('input', ()=>{ syncRedemptionsFromInputs(); updateRemainingHint(); });
        });
      });
      overlay.querySelectorAll('.rd-del').forEach(btn=>{
        btn.onclick = ()=>{
          syncRedemptionsFromInputs();
          redemptionsDraft.splice(parseInt(btn.dataset.idx), 1);
          refreshRedemptionsUI();
        };
      });
    }
    attachRedemptionRowEvents();
    updateRemainingHint();
    const addRedemptionBtn = overlay.querySelector('#btn-add-redemption');
    if(addRedemptionBtn) addRedemptionBtn.onclick = ()=>{
      syncRedemptionsFromInputs();
      redemptionsDraft.push({id: uid(), eventId:'', date: todayStr(), amount: null});
      refreshRedemptionsUI();
    };
    const amountInputForRemaining = overlay.querySelector('#c-amount');
    if(amountInputForRemaining) amountInputForRemaining.addEventListener('input', updateRemainingHint);

    overlay.querySelectorAll('[data-certstatus]').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('[data-certstatus]').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#c-status').value = opt.dataset.certstatus;
        const redemptionsField = overlay.querySelector('#cert-redemptions-field');
        const showRedemptions = (opt.dataset.certstatus === 'used' || opt.dataset.certstatus === 'partial');
        if(redemptionsField) redemptionsField.style.display = showRedemptions ? 'block' : 'none';
        if(showRedemptions && redemptionsDraft.length === 0){
          redemptionsDraft.push({id: uid(), eventId:'', date: todayStr(), amount: null});
          refreshRedemptionsUI();
        }
      };
    });

    overlay.querySelectorAll('.certkind-opt').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('.certkind-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#c-kind').value = opt.dataset.certkind;
        const specificField = overlay.querySelector('#cert-specific-field');
        if(specificField) specificField.style.display = (opt.dataset.certkind === 'specific') ? 'block' : 'none';
      };
    });

    overlay.querySelectorAll('.certpurpose-opt').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('.certpurpose-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#c-purpose').value = opt.dataset.certpurpose;
      };
    });

    const delBtn = overlay.querySelector('#btn-del-cert');
    if(delBtn) delBtn.onclick = ()=>{
      const cascades = state.modal.cert.incomeId || (state.modal.cert.redemptions && state.modal.cert.redemptions.length);
      showConfirmDeletePopup(`Удалить этот сертификат?${cascades ? ' Связанный доход в «Книге» и платежи в привязанных мероприятиях тоже удалятся.' : ' Действие необратимо.'}`, async ()=>{
      const certToDelete = state.modal.cert;
      state.certificates = state.certificates.filter(x=>x.id !== certToDelete.id);
      if(certToDelete.incomeId){
        state.incomes = state.incomes.filter(x=>x.id !== certToDelete.incomeId);
        await saveIncomes();
      }
      // убираем платежи по всем списаниям этого сертификата из мероприятий, куда они были начислены
      const refPrefix = certToDelete.id + ':';
      let anyEventChanged = false;
      state.events.forEach(ev=>{
        if(!Array.isArray(ev.payments)) return;
        const before = ev.payments.length;
        ev.payments = ev.payments.filter(p=>{
          if(p.certRedemptionRef && p.certRedemptionRef.startsWith(refPrefix)){
            ev.price = Math.max(0,(ev.price||0) - (p.amount||0));
            return false;
          }
          return true;
        });
        if(ev.payments.length !== before) anyEventChanged = true;
      });
      if(anyEventChanged) await saveEvents();
      await saveCertificates();
      state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-cert').onclick = async ()=>{
      ['c-number','c-date','c-amount','c-comment','c-specific-mk','c-owner-name','c-owner-contact'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });
      overlay.querySelectorAll('.rd-event, .rd-date, .rd-amount').forEach(el=>{ el.style.borderColor = ''; });

      const numberRaw = overlay.querySelector('#c-number').value;
      const channelVal = overlay.querySelector('#c-channel').value;
      const certTypeVal = overlay.querySelector('#c-type').value;
      const certKindVal = overlay.querySelector('#c-kind').value || 'value';
      const specificVal = overlay.querySelector('#c-specific-mk').value.trim();
      const dateVal = overlay.querySelector('#c-date').value;
      const amountRaw = overlay.querySelector('#c-amount').value;
      const statusVal = overlay.querySelector('#c-status').value || 'in_progress';
      const ownerNameVal = overlay.querySelector('#c-owner-name').value.trim();
      const ownerContactVal = overlay.querySelector('#c-owner-contact').value.trim();
      const commentVal = overlay.querySelector('#c-comment').value.trim();

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(numberRaw === '') markInvalid('c-number');
      if(!channelVal) markInvalid('c-channel');
      if(!certTypeVal) markInvalid('c-type');
      if(!dateVal) markInvalid('c-date');
      if(amountRaw === '') markInvalid('c-amount');
      if(!ownerNameVal) markInvalid('c-owner-name');
      if(!ownerContactVal) markInvalid('c-owner-contact');
      if(!commentVal) markInvalid('c-comment');
      let specificMissing = false, redemptionsMissing = false, redemptionsIncomplete = false;
      if(certKindVal === 'specific' && !specificVal){ specificMissing = true; markInvalid('c-specific-mk'); }

      syncRedemptionsFromInputs();
      const cleanedRedemptions = redemptionsDraft.filter(r=> r.eventId || r.date || (r.amount!==undefined&&r.amount!==null));
      if(statusVal === 'used' || statusVal === 'partial'){
        if(cleanedRedemptions.length === 0){
          redemptionsMissing = true;
        } else {
          overlay.querySelectorAll('#cert-redemptions-list [data-rd-idx]').forEach(row=>{
            const i = parseInt(row.dataset.rdIdx);
            const r = redemptionsDraft[i];
            if(!r) return;
            if(!r.eventId){ redemptionsIncomplete = true; row.querySelector('.rd-event').style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = row.querySelector('.rd-event'); }
            if(!r.date){ redemptionsIncomplete = true; row.querySelector('.rd-date').style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = row.querySelector('.rd-date'); }
            if(r.amount===undefined||r.amount===null){ redemptionsIncomplete = true; row.querySelector('.rd-amount').style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = row.querySelector('.rd-amount'); }
          });
        }
      }
      const spentTotal = cleanedRedemptions.reduce((s,r)=> s + ((r.amount!==undefined&&r.amount!==null&&!isNaN(r.amount))?Number(r.amount):0), 0);
      const totalAmountNum = parseInt(amountRaw) || 0;
      const overspent = spentTotal > totalAmountNum;
      if(overspent){
        const remainingEl = overlay.querySelector('#cert-remaining-hint');
        if(remainingEl && !firstInvalid) firstInvalid = remainingEl;
      }

      if(numberRaw==='' || !channelVal || !certTypeVal || !dateVal || amountRaw==='' || !ownerNameVal || !ownerContactVal || !commentVal || specificMissing || redemptionsMissing || redemptionsIncomplete || overspent){
        let msg = 'Заполните все поля перед сохранением сертификата.';
        if(redemptionsMissing) msg = 'Статус «Использован»/«Частично использован» — добавьте хотя бы одно списание.';
        else if(redemptionsIncomplete) msg = 'Заполните мероприятие, дату и сумму в каждой строке списания.';
        else if(overspent) msg = `Списано больше, чем номинал сертификата (списано ${formatMoney(spentTotal)} из ${formatMoney(totalAmountNum)}).`;
        showGapWarningBanner(msg);
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const previousCert = state.modal.cert;
      const previousRedemptions = previousCert.redemptions || [];

      const updated = {
        id: previousCert.id,
        number: parseInt(numberRaw) || previousCert.number,
        channel: channelVal,
        certType: certTypeVal,
        certKind: certKindVal,
        purpose: overlay.querySelector('#c-purpose').value || 'sale',
        specificEventType: specificVal,
        saleDate: dateVal,
        amount: totalAmountNum,
        status: statusVal,
        redemptions: (statusVal==='used'||statusVal==='partial') ? cleanedRedemptions : [],
        // старые поля оставляем в синхроне с первым списанием — для обратной совместимости мест, которые их ещё читают
        useDate: cleanedRedemptions.length ? (cleanedRedemptions[cleanedRedemptions.length-1].date||'') : '',
        eventId: cleanedRedemptions.length ? (cleanedRedemptions[cleanedRedemptions.length-1].eventId||'') : '',
        ownerName: ownerNameVal,
        ownerContact: ownerContactVal,
        incomeId: previousCert.incomeId || '',
        comment: commentVal,
      };

      // 1) синхронизация с "Книга → Доходы": продажа сертификата = доход студии в момент продажи
      if(updated.purpose === 'sale'){
        const incomeEntry = {
          id: updated.incomeId || uid(), date: updated.saleDate, operation: 'Оплата', product: 'Сертификат',
          account: 'Точка', eventId: '', amount: updated.amount, masterName: '', itemSaleId: '', orderId: '',
          comment: `Сертификат №${updated.number} — ${updated.ownerName}`,
        };
        updated.incomeId = incomeEntry.id;
        const incIdx = state.incomes.findIndex(x=>x.id===incomeEntry.id);
        if(incIdx >= 0) state.incomes[incIdx] = incomeEntry; else state.incomes.push(incomeEntry);
        await saveIncomes();
      } else if(updated.incomeId){
        // маркетинговый сертификат — не доход, убираем ранее созданную запись
        state.incomes = state.incomes.filter(x=>x.id !== updated.incomeId);
        await saveIncomes();
        updated.incomeId = '';
      }

      // 2) синхронизация списаний с журналом платежей конкретных мероприятий
      const oldById = {}; previousRedemptions.forEach(r=>{ if(r.id) oldById[r.id] = r; });
      const newById = {}; updated.redemptions.forEach(r=>{ if(r.id) newById[r.id] = r; });
      const affectedEventIds = new Set();
      Object.values(oldById).forEach(r=>{ if(r.eventId) affectedEventIds.add(r.eventId); });
      Object.values(newById).forEach(r=>{ if(r.eventId) affectedEventIds.add(r.eventId); });

      let anyEventChanged = false;
      affectedEventIds.forEach(eventId=>{
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) return;
        if(!Array.isArray(ev.payments)) ev.payments = [];
        let changedThisEvent = false;

        // убираем платежи по списаниям, которых больше нет здесь (удалены или перенесены на другое мероприятие)
        ev.payments = ev.payments.filter(p=>{
          if(p.certRedemptionRef && p.certRedemptionRef.startsWith(updated.id+':')){
            const rid = p.certRedemptionRef.split(':')[1];
            const stillHere = newById[rid] && newById[rid].eventId === eventId;
            if(!stillHere){ ev.price = Math.max(0,(ev.price||0) - (p.amount||0)); changedThisEvent = true; return false; }
          }
          return true;
        });

        // добавляем/обновляем платежи по списаниям, которые сейчас указывают сюда
        Object.values(newById).forEach(r=>{
          if(r.eventId !== eventId) return;
          const ref = updated.id + ':' + r.id;
          const existing = ev.payments.find(p=>p.certRedemptionRef===ref);
          if(existing){
            if(existing.amount !== r.amount){
              ev.price = Math.max(0,(ev.price||0) - (existing.amount||0)) + (r.amount||0);
              existing.amount = r.amount;
              changedThisEvent = true;
            }
          } else {
            ev.payments.push({ amount: r.amount, source:'Сертификат', type:'balance', ts: Date.now(), certRedemptionRef: ref });
            ev.price = (ev.price||0) + (r.amount||0);
            changedThisEvent = true;
          }
        });

        if(changedThisEvent) anyEventChanged = true;
      });
      if(anyEventChanged) await saveEvents();

      const idx = state.certificates.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.certificates[idx] = updated; else state.certificates.push(updated);
      await saveCertificates();
      state.modal = null; overlay.remove(); render();
    };
  }

  function attachRefundModalEvents(overlay){
    const cancelBtn = overlay.querySelector('#btn-cancel-refund');
    if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal = null; overlay.remove(); };

    const refundEventOptions = eventSelectOptions();
    const refundLabelToId = {};
    refundEventOptions.forEach(o=>{ refundLabelToId[o.label] = o.id; });
    const refundEventSearchInput = overlay.querySelector('#r-event-search');
    const refundEventHidden = overlay.querySelector('#r-event');
    if(refundEventSearchInput && refundEventHidden){
      refundEventSearchInput.addEventListener('input', ()=>{
        const val = refundEventSearchInput.value.trim();
        if(val === ''){ refundEventHidden.value = ''; refundEventSearchInput.style.borderColor = ''; return; }
        if(refundLabelToId[val]){ refundEventHidden.value = refundLabelToId[val]; refundEventSearchInput.style.borderColor = ''; }
      });
      refundEventSearchInput.addEventListener('blur', ()=>{
        const val = refundEventSearchInput.value.trim();
        if(val !== '' && !refundLabelToId[val]){
          refundEventSearchInput.value = '';
          refundEventHidden.value = '';
        }
      });
    }

    const sourceSelect = overlay.querySelector('#r-source');
    if(sourceSelect){
      sourceSelect.onchange = ()=>{
        const tochkaField = overlay.querySelector('#refund-tochka-field');
        if(tochkaField) tochkaField.style.display = (sourceSelect.value === 'Точка') ? 'block' : 'none';
      };
    }

    overlay.querySelectorAll('[data-refundstatus]').forEach(opt=>{
      opt.onclick = ()=>{
        overlay.querySelectorAll('[data-refundstatus]').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        overlay.querySelector('#r-status').value = opt.dataset.refundstatus;
      };
    });

    const delBtn = overlay.querySelector('#btn-del-refund');
    if(delBtn) delBtn.onclick = ()=>{
      const hasLink = !!state.modal.refund.eventId;
      showConfirmDeletePopup(`Удалить эту запись о возврате?${hasLink ? ' Выручка привязанного мероприятия также вернётся к прежней сумме.' : ' Действие необратимо.'}`, async ()=>{
        const refundToDelete = state.modal.refund;
        state.refunds = state.refunds.filter(x=>x.id !== refundToDelete.id);
        if(refundToDelete.eventId){
          const ev = state.events.find(e=>e.id===refundToDelete.eventId);
          if(ev && Array.isArray(ev.payments)){
            const before = ev.payments.length;
            ev.payments = ev.payments.filter(p=>{
              if(p.refundRef === refundToDelete.id){
                ev.price = (ev.price||0) + Math.abs(p.amount||0);
                return false;
              }
              return true;
            });
            if(ev.payments.length !== before) await saveEvents();
          }
        }
        await saveRefunds();
        state.modal = null; overlay.remove(); render();
      });
    };

    overlay.querySelector('#btn-save-refund').onclick = async ()=>{
      ['r-request-date','r-amount','r-payment-date','r-reason','r-fullname','r-account','r-bank','r-bik'].forEach(id=>{
        const el = overlay.querySelector('#'+id);
        if(el) el.style.borderColor = '';
      });

      const requestDateVal = overlay.querySelector('#r-request-date').value;
      const amountRaw = overlay.querySelector('#r-amount').value;
      const paymentDateVal = overlay.querySelector('#r-payment-date').value;
      const reasonVal = overlay.querySelector('#r-reason').value.trim();
      const statusVal = overlay.querySelector('#r-status').value || 'in_progress';
      const source = overlay.querySelector('#r-source').value;
      const fullNameVal = overlay.querySelector('#r-fullname').value.trim();
      const accountVal = overlay.querySelector('#r-account').value.trim();
      const bankVal = overlay.querySelector('#r-bank').value.trim();
      const bikVal = overlay.querySelector('#r-bik').value.trim();

      let firstInvalid = null;
      const markInvalid = (id)=>{
        const el = overlay.querySelector('#'+id);
        if(el){ el.style.borderColor = 'var(--danger)'; if(!firstInvalid) firstInvalid = el; }
      };
      if(!requestDateVal) markInvalid('r-request-date');
      if(amountRaw === '') markInvalid('r-amount');
      if(!paymentDateVal) markInvalid('r-payment-date');
      if(!reasonVal) markInvalid('r-reason');
      let tochkaMissing = false;
      if(source === 'Точка'){
        if(!fullNameVal){ tochkaMissing = true; markInvalid('r-fullname'); }
        if(!accountVal){ tochkaMissing = true; markInvalid('r-account'); }
        if(!bankVal){ tochkaMissing = true; markInvalid('r-bank'); }
        if(!bikVal){ tochkaMissing = true; markInvalid('r-bik'); }
      }

      if(!requestDateVal || amountRaw==='' || !paymentDateVal || !reasonVal || tochkaMissing){
        showGapWarningBanner('Заполните все поля перед сохранением возврата.');
        if(firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({block:'center', behavior:'smooth'});
        return;
      }

      const previousRefund = state.modal.refund;
      const updated = {
        id: previousRefund.id,
        requestDate: requestDateVal,
        amount: parseInt(amountRaw),
        paymentDate: paymentDateVal,
        reason: reasonVal,
        status: statusVal,
        source: source,
        eventId: overlay.querySelector('#r-event').value || '',
        fullName: source==='Точка' ? fullNameVal : '',
        accountNumber: source==='Точка' ? accountVal : '',
        bank: source==='Точка' ? bankVal : '',
        bik: source==='Точка' ? bikVal : '',
      };

      // синхронизация с выручкой привязанного мероприятия — только для реально возвращённых (не "в процессе")
      const prevRefundEventId = previousRefund.eventId || '';
      const affectedRefundEventIds = new Set([prevRefundEventId, updated.eventId].filter(Boolean));
      let anyRefundEventChanged = false;
      affectedRefundEventIds.forEach(eventId=>{
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) return;
        if(!Array.isArray(ev.payments)) ev.payments = [];
        const before = ev.payments.length;
        ev.payments = ev.payments.filter(p=>{
          if(p.refundRef === updated.id){ ev.price = (ev.price||0) + Math.abs(p.amount||0); return false; }
          return true;
        });
        if(eventId === updated.eventId && updated.status === 'refunded'){
          ev.payments.push({ amount: -updated.amount, source:'Возврат', type:'refund', ts: Date.now(), refundRef: updated.id });
          ev.price = Math.max(0, (ev.price||0) - updated.amount);
        }
        if(ev.payments.length !== before || (eventId === updated.eventId && updated.status === 'refunded')) anyRefundEventChanged = true;
      });
      if(anyRefundEventChanged) await saveEvents();

      const idx = state.refunds.findIndex(x=>x.id===updated.id);
      if(idx >= 0) state.refunds[idx] = updated; else state.refunds.push(updated);
      await saveRefunds();
      state.modal = null; overlay.remove(); render();
    };
  }

  function attachCalendarEvents(){
    document.querySelectorAll('.space-tab').forEach(t=>{
      t.onclick = (ev)=>{
        if(ev.target.classList.contains('rename')) return;
        state.activeSpaceId = t.dataset.space; render();
      };
      const label = t.querySelector('[data-role="label"]');
      if(!label) return;
      label.ondblclick = (ev)=>{
        ev.stopPropagation();
        const sp = getSpace(t.dataset.space);
        const input = document.createElement('input');
        input.className = 'rename'; input.value = sp.name;
        label.replaceWith(input); input.focus(); input.select();
        const commit = ()=>{
          sp.name = input.value.trim() || sp.name;
          saveSpaces(); render();
        };
        input.onblur = commit;
        input.onkeydown = (e)=>{ if(e.key==='Enter'){ input.blur(); } if(e.key==='Escape'){ render(); } };
      };
    });
    const prev = document.getElementById('btn-prev');
    const next = document.getElementById('btn-next');

    if(next) next.onclick = ()=>{ state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth()+1, 1); render(); };

  function getMonthEvents(cursor){

  function computeQuickSummary(cursor){

    const totalProfit = evts.reduce((s,e)=> s+eventProfitForecast(e),0);

  function deltaHtml(cur, prev, isMoney){
    const diff = cur - prev;
    const sign = diff > 0 ? '+' : (diff < 0 ? '' : '±');
    const color = diff > 0 ? 'var(--status-green)' : (diff < 0 ? 'var(--status-red)' : 'var(--ink-soft)');
    let pctStr = '';
    if(prev !== 0){
      pctStr = ` (${sign}${Math.round(diff/Math.abs(prev)*100)}%)`;
    } else if(cur !== 0){
      pctStr = ' (новое)';
    }
    const diffStr = isMoney ? formatMoney(Math.abs(diff)) : Math.abs(diff);
    return `<span style="color:${color};font-family:var(--font-mono);font-size:12px;">${sign}${diffStr}${pctStr}</span>`;
  }

  const WEEKDAY_CAPACITY = 20; // будни: все 4 пространства
  const WEEKEND_CAPACITY = 16; // выходные: 3 пространства
  function computeMonthCapacity(cursor){
    const year = cursor.getFullYear(), month = cursor.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    let weekdays = 0, weekends = 0;
    for(let d=1; d<=daysInMonth; d++){
      const dow = new Date(year, month, d).getDay(); // 0=вс, 6=сб
      if(dow===0 || dow===6) weekends++; else weekdays++;
    }
    return {
      weekdays, weekends,
      total: weekdays*WEEKDAY_CAPACITY + weekends*WEEKEND_CAPACITY,
    };
  }

  function formatMoney(n){
    return Math.round(n).toLocaleString('ru-RU') + ' ₽';
  }

  const DEFAULT_MASTER_PAY_RATES = { tier1Max: 3, tier1Flat: 1300, tier2Max: 8, tier2Flat: 1500, tier3PerGuest: 200 };
  function getMasterRates(masterName){
    const name = (masterName||'').trim();
    if(name && state.masterPayOverrides && state.masterPayOverrides[name]) return state.masterPayOverrides[name];
    return state.masterPayRates || DEFAULT_MASTER_PAY_RATES;
  }
  function masterPayForGuests(guests, masterName){
    const g = Number(guests) || 0;
    const r = getMasterRates(masterName);
    if(g <= r.tier1Max) return r.tier1Flat;
    if(g <= r.tier2Max) return r.tier2Flat;
    return g * r.tier3PerGuest;
  }
  function findMaterialsCatalogMatch(title){
    const t = (title||'').trim().toLowerCase();
    if(!t) return null;
    // сначала ищем точное совпадение, потом — по вхождению названия в любую сторону
    let match = state.materialsCatalog.find(m=>m.name.toLowerCase() === t);
    if(match) return match;
    match = state.materialsCatalog.find(m=> m.name.toLowerCase().includes(t) || t.includes(m.name.toLowerCase()));
    return match || null;
  }
  function eventMaterialsCost(e){
    if(Array.isArray(e.materialsItems) && e.materialsItems.length > 0){
      // источник "мастер" считается реальным расходом студии, только если указано "кому платить" —
      // без этого поля строка чисто информационная (мастер принёс материал сам, компенсация нигде не считается)
      return e.materialsItems.reduce((s,m)=> s + ((m.source!=='master' || (m.payTo && m.payTo.trim())) ? (Number(m.cost)||0) : 0), 0);
    }
    if(e.materialsCost !== undefined && e.materialsCost !== null && !isNaN(e.materialsCost)) return Number(e.materialsCost); // старые мероприятия до перехода на построчный учёт
    return 0;
  }
  function eventMasterMaterialPayments(e){
    // строки материалов с источником "мастер" и указанным получателем — реальная компенсация, попадает в зарплату этого человека
    if(!Array.isArray(e.materialsItems)) return [];
    return e.materialsItems
      .filter(m=>m.source==='master' && m.payTo && m.payTo.trim() && m.cost>0)
      .map(m=>({ name: m.payTo.trim(), amount: Number(m.cost) }));
  }
  // сумма материалов, которые принёс сам мастер (не влияет на прибыль студии, но фиксируется для прозрачности)
  function eventMasterSuppliedMaterialsCost(e){
    if(!Array.isArray(e.materialsItems)) return 0;
    return e.materialsItems.reduce((s,m)=> s + (m.source==='master' ? (Number(m.cost)||0) : 0), 0);
  }
  function eventMasterPay(e){
    if(!e.host || !e.host.trim()) return 0;
    if(e.masterPay !== undefined && e.masterPay !== null && !isNaN(e.masterPay)) return Number(e.masterPay);
    return masterPayForGuests(e.guests, e.host);
  }
  // все ведущие мероприятия (основной + дополнительные) с их индивидуальной оплатой
  function eventHostsWithPay(e){
    const list = [];
    if(e.host && e.host.trim()){
      list.push({ name: e.host.trim(), pay: eventMasterPay(e) });
    }
    (e.additionalHosts || []).forEach(h=>{
      if(h.name && h.name.trim()){
        const pay = (h.masterPay !== undefined && h.masterPay !== null && !isNaN(h.masterPay)) ? Number(h.masterPay) : masterPayForGuests(e.guests, h.name);
        list.push({ name: h.name.trim(), pay });
      }
    });
    return list;
  }
  function eventTotalMasterPay(e){
    return eventHostsWithPay(e).reduce((s,h)=>s+h.pay, 0);
  }
  function eventProfit(e){
    const revenue = (e.price!==undefined && e.price!==null && !isNaN(e.price)) ? Number(e.price) : 0;
    return revenue - eventMaterialsCost(e) - eventTotalMasterPay(e);
  }
  // прогнозная выручка мероприятия — полная ожидаемая сумма (включает уже внесённую предоплату), используется в аналитике как "факт"
  function eventRevenueForecast(e){
    const price = (e.price!==undefined && e.price!==null && !isNaN(e.price)) ? Number(e.price) : 0;
    const agreed = (e.agreedPrice!==undefined && e.agreedPrice!==null && !isNaN(e.agreedPrice)) ? Number(e.agreedPrice) : 0;
    return Math.max(price, agreed);
  }
  function eventProfitForecast(e){
    return eventRevenueForecast(e) - eventMaterialsCost(e) - eventTotalMasterPay(e);
  }

  function renderAnalytics(){
    const cursor = state.analyticsCursor;
    const monthLabel = MONTHS[cursor.getMonth()] + ' ' + cursor.getFullYear();
    const evts = getMonthEvents(cursor);
    const total = evts.length;
    const statusCounts = {};
    Object.keys(STATUS_LABEL).forEach(k=>statusCounts[k]=0);
    evts.forEach(e=>{ const s = e.status || 'confirmed'; statusCounts[s] = (statusCounts[s]||0)+1; });
    const totalGuests = evts.reduce((sum,e)=> sum + ((e.guests!==undefined && e.guests!==null && !isNaN(e.guests)) ? Number(e.guests) : 0), 0);
    const MONTH_CAPACITY_EVENTS = 200;
    const occupiedCount = evts.filter(e=>e.status!=='offsite').length; // выезды не занимают пространство студии
    const occupancyPct = Math.round(occupiedCount/MONTH_CAPACITY_EVENTS*100);

    // заполняемость по каждому пространству студии (без учёта "Выезда" — у него нет ограничения по вместимости)
    const studioSpacesForOccupancy = state.spaces.filter(s=>s.id !== 's5');
    const perSpaceCapacity = studioSpacesForOccupancy.length > 0 ? MONTH_CAPACITY_EVENTS / studioSpacesForOccupancy.length : MONTH_CAPACITY_EVENTS;
    const spaceOccupancyList = studioSpacesForOccupancy.map(s=>{
      const count = evts.filter(e=>e.spaceId===s.id && e.status!=='offsite').length;
      return { space: s, count, pct: Math.round(count/perSpaceCapacity*100) };
    });

    // юр.лица — контроль документов
    const legalEvts = evts.filter(e=>e.payerType === 'legal');
    const legalIncomplete = legalEvts.filter(e=>missingDocs(e).length > 0);
    const legalComplete = legalEvts.length - legalIncomplete.length;

    // отчёты мастеров — контроль, у каких мероприятий с мастером нет отчёта
    const reportableEvts = evts.filter(e=> e.host && e.host.trim() && e.date <= todayStr());
    const missingReportEvts = reportableEvts.filter(e=> !hasMasterReport(e))
      .sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
    const missingReportsByHost = {};
    missingReportEvts.forEach(e=>{
      const h = e.host.trim();
      missingReportsByHost[h] = (missingReportsByHost[h]||0) + 1;
    });
    const missingReportsByHostList = Object.entries(missingReportsByHost).sort((a,b)=>b[1]-a[1]);

    // сводка по оценкам из сданных отчётов
    const submittedReports = reportableEvts.filter(e=> hasMasterReport(e));
    const ratingValues = submittedReports.map(e=>e.masterReport.rating);
    const avgRating = ratingValues.length ? (ratingValues.reduce((a,b)=>a+b,0)/ratingValues.length) : null;
    const badReports = submittedReports.filter(e=> e.masterReport.rating < 5)
      .sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
    const goodReportsCount = submittedReports.length - badReports.length;
    // выручка месяца в аналитике = прогнозная (полная ожидаемая сумма по мероприятию, включая уже внесённую предоплату) —
    // считаем это "фактом" по всей аналитике, даже если деньги ещё не поступили целиком
    const totalRevenue = evts.reduce((sum,e)=> sum + eventRevenueForecast(e), 0);
    const totalRevenueActual = evts.reduce((sum,e)=> sum + ((e.price!==undefined && e.price!==null && !isNaN(e.price)) ? Number(e.price) : 0), 0);
    const totalProfit = evts.reduce((sum,e)=> sum + eventProfitForecast(e), 0);

    // выполнение плана — сравниваем факт с ежедневным темпом, который нужен, чтобы уложиться в план к концу месяца
    const planYm = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1);
    const currentPlan = (state.monthlyPlans && state.monthlyPlans[planYm]) || {};
    const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
    const isCurrentMonth = planYm === (new Date()).getFullYear()+'-'+pad((new Date()).getMonth()+1);
    const isPastMonth = cursor < new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    const daysElapsed = isPastMonth ? daysInMonth : (isCurrentMonth ? new Date().getDate() : 0);
    const planMonthLeads = state.leads.filter(l=> l.requestDate && l.requestDate.startsWith(planYm));
    const planLeadsCount = planMonthLeads.length;
    const planSoldCount = planMonthLeads.filter(l=>l.sold).length;
    const planConversionPct = planLeadsCount>0 ? Math.round(planSoldCount/planLeadsCount*100) : 0;

    const PLAN_METRICS = [
      {key:'revenue', label:'Выручка', value: totalRevenue, format:'money'},
      {key:'profit', label:'Прибыль', value: totalProfit, format:'money'},
      {key:'eventsCount', label:'Мероприятий', value: total, format:'int'},
      {key:'guestsCount', label:'Гостей', value: totalGuests, format:'int'},
      {key:'leadsCount', label:'Заявки', value: planLeadsCount, format:'int'},
      {key:'conversionPct', label:'Конверсия по продажам', value: planConversionPct, format:'pct'},
    ];
    const planProgress = PLAN_METRICS.map(m=>{
      const target = currentPlan[m.key];
      if(target === undefined || target === null || target === '') return {...m, target: null};
      if(m.format === 'pct'){
        // для процентных показателей темп по дням не применим — просто сравниваем факт с целью
        const paceStatus = daysElapsed===0 ? 'notstarted' : (m.value >= target ? 'ahead' : 'behind');
        return {...m, target, pctOfTarget: target>0?Math.round(m.value/target*100):0, expectedByNow: null, paceStatus, projected: null};
      }
      const pctOfTarget = target>0 ? Math.round(m.value/target*100) : 0;
      const expectedByNow = daysElapsed>0 ? Math.round(target * daysElapsed / daysInMonth) : 0;
      const paceStatus = daysElapsed===0 ? 'notstarted' : (m.value >= expectedByNow ? 'ahead' : 'behind');
      const projected = daysElapsed>0 ? Math.round(m.value / daysElapsed * daysInMonth) : null;
      return {...m, target, pctOfTarget, expectedByNow, paceStatus, projected};
    });
    // свои показатели — факт по ним вносится вручную, а не считается автоматически
    const customPlanProgress = (currentPlan.custom || []).filter(m=>m.name && m.target!==null && m.target!==undefined).map(m=>{
      const value = (m.actual!==undefined && m.actual!==null) ? Number(m.actual) : 0;
      const target = Number(m.target);
      const pctOfTarget = target>0 ? Math.round(value/target*100) : 0;
      const expectedByNow = daysElapsed>0 ? Math.round(target * daysElapsed / daysInMonth) : 0;
      const paceStatus = daysElapsed===0 ? 'notstarted' : (value >= expectedByNow ? 'ahead' : 'behind');
      const projected = daysElapsed>0 ? Math.round(value / daysElapsed * daysInMonth) : null;
      return { key:'custom', label: m.name, value, format:'int', target, pctOfTarget, expectedByNow, paceStatus, projected, isCustom:true };
    });
    const hasAnyPlan = planProgress.some(p=>p.target !== null) || customPlanProgress.length > 0;

    // прогноз по будущим месяцам: сколько уже забронировано вперёд (билеты/мероприятия проданы заранее)
    const todayReal = new Date();
    const forwardMonths = [1,2,3].map(offset=>{
      const monthDate = new Date(todayReal.getFullYear(), todayReal.getMonth()+offset, 1);
      const fym = monthDate.getFullYear()+'-'+pad(monthDate.getMonth()+1);
      const monthEvts = state.events.filter(e=> e.date && e.date.startsWith(fym));
      let factRevenue = 0, forecastRevenue = 0;
      monthEvts.forEach(e=>{
        const price = (e.price!==undefined&&e.price!==null&&!isNaN(e.price)) ? Number(e.price) : 0;
        const agreed = (e.agreedPrice!==undefined&&e.agreedPrice!==null&&!isNaN(e.agreedPrice)) ? Number(e.agreedPrice) : 0;
        factRevenue += price;
        // прогнозная выручка — это ПОЛНАЯ ожидаемая сумма (уже включает внесённую предоплату), а не остаток к доплате
        forecastRevenue += Math.max(price, agreed);
      });
      const fTarget = (state.monthlyPlans && state.monthlyPlans[fym] && state.monthlyPlans[fym].revenue) || null;
      return {
        label: MONTHS[monthDate.getMonth()].charAt(0).toUpperCase()+MONTHS[monthDate.getMonth()].slice(1)+' '+monthDate.getFullYear(),
        eventsCount: monthEvts.length,
        factRevenue,
        forecastRevenue,
        target: fTarget,
        pctOfTarget: fTarget ? Math.round(forecastRevenue/fTarget*100) : null,
      };
    });

    // сводка по годам: сравнительная таблица месяцев текущего просматриваемого года
    const summaryYear = cursor.getFullYear();
    const yearSummaryManualData = state.yearSummaryManual || {};
    function computeYearMonthsData(year){
      return Array.from({length:12}, (_,mIdx)=>{
        const ym = year+'-'+pad(mIdx+1);
        const mEvts = state.events.filter(e=> e.date && e.date.startsWith(ym));
        const mGuests = mEvts.reduce((s,e)=> s + ((e.guests!==undefined&&e.guests!==null&&!isNaN(e.guests))?Number(e.guests):0), 0);
        const mEventsRevenue = mEvts.reduce((s,e)=> s + eventRevenueForecast(e), 0);
        const mProfit = mEvts.reduce((s,e)=> s + eventProfitForecast(e), 0);
        const mItemSalesRevenue = state.itemSales.filter(x=>x.date && x.date.startsWith(ym)).reduce((s,x)=> s + ((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0), 0);
        const mCertSalesRevenue = state.certificates.filter(c=>c.purpose==='sale' && c.saleDate && c.saleDate.startsWith(ym)).reduce((s,c)=> s + ((c.amount!==undefined&&c.amount!==null&&!isNaN(c.amount))?Number(c.amount):0), 0);
        const mOrdersRevenue = state.orders.filter(x=>x.date && x.date.startsWith(ym)).reduce((s,x)=> s + ((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0), 0);
        const mFullRevenue = mEventsRevenue + mItemSalesRevenue + mCertSalesRevenue + mOrdersRevenue;
        const mLeads = state.leads.filter(l=> l.requestDate && l.requestDate.startsWith(ym));
        const mSoldLeads = mLeads.filter(l=>l.sold).length;
        const mOccupied = mEvts.filter(e=>e.status!=='offsite').length;
        // расходы по месяцу — только уже открытые везде категории (не то, что скрыто в "Чистой прибыли")
        const mMaterialsCost = mEvts.reduce((s,e)=> s + eventMaterialsCost(e), 0);
        const mMastersSalary = mEvts.reduce((s,e)=> s + eventTotalMasterPay(e) + eventMasterMaterialPayments(e).reduce((s2,p)=>s2+p.amount,0), 0)
          + state.itemSales.filter(x=>x.date && x.date.startsWith(ym)).reduce((s,x)=> s + Math.round(((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0) * ITEM_SALE_MASTER_PCT / 100), 0)
          + state.orders.filter(x=>x.date && x.date.startsWith(ym)).reduce((s,x)=> s + ((x.masterShare!==undefined&&x.masterShare!==null&&!isNaN(x.masterShare))?Number(x.masterShare):0), 0)
          + state.salaryAdjustments.filter(a=>a.date && a.date.startsWith(ym)).reduce((s,a)=> s + (Number(a.amount)||0), 0);
        let mHostessSalary = 0;
        {
          const daysInM = new Date(year, mIdx+1, 0).getDate();
          for(let d=1; d<=daysInM; d++){
            const dateObj = new Date(year, mIdx, d);
            const dow = dateObj.getDay();
            const rate = (dow===0 || dow===6) ? HOSTESS_WEEKEND_RATE : HOSTESS_WEEKDAY_RATE;
            const dateStr = fmtDate(dateObj);
            const dayShifts = state.hostessShifts[dateStr];
            if(!dayShifts) continue;
            SHIFT_DEFS.forEach(s=>{
              const rawEntry = dayShifts[s.key];
              const entry = normalizeShiftEntry(rawEntry, s);
              if(entry && entry.name){
                const extra = shiftExtraHours(rawEntry, s);
                mHostessSalary += rate + extra*HOSTESS_EXTRA_HOUR_RATE;
              }
            });
          }
        }
        const mMarketingCost = state.expenses.filter(e=>e.date && e.date.startsWith(ym) && !e.eventId && e.category==='Маркетинг').reduce((s,e)=> s + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0), 0);
        const mManual = (yearSummaryManualData[ym]) || {};
        return {
          label: MONTHS[mIdx].charAt(0).toUpperCase()+MONTHS[mIdx].slice(1),
          ym,
          count: mEvts.length,
          guests: mGuests,
          revenue: mFullRevenue,
          eventsRevenue: mEventsRevenue,
          profit: mProfit,
          avgCheck: mGuests>0 ? Math.round(mEventsRevenue/mGuests) : 0,
          leads: mLeads.length,
          conversionPct: mLeads.length>0 ? Math.round(mSoldLeads/mLeads.length*100) : null,
          profitabilityPct: mFullRevenue>0 ? Math.round(mProfit/mFullRevenue*100) : null,
          occupancyPct: Math.round(mOccupied/MONTH_CAPACITY_EVENTS*100),
          newGuests: (mManual.newGuests!==undefined && mManual.newGuests!==null) ? Number(mManual.newGuests) : null,
          materialsCost: mMaterialsCost,
          marketingCost: mMarketingCost,
          mastersSalary: mMastersSalary,
          hostessSalary: mHostessSalary,
        };
      });
    }
    const yearMonthsSummary = computeYearMonthsData(summaryYear);
    const prevYearMonthsSummary = computeYearMonthsData(summaryYear - 1);
    yearMonthsSummary.forEach((m,i)=>{
      const prevRevenue = prevYearMonthsSummary[i].revenue;
      m.growthPct = prevRevenue > 0 ? Math.round((m.revenue - prevRevenue) / prevRevenue * 100) : null;
    });
    const yearTotals = yearMonthsSummary.reduce((acc,m)=>({
      count: acc.count+m.count, guests: acc.guests+m.guests, revenue: acc.revenue+m.revenue, profit: acc.profit+m.profit,
      leads: acc.leads+m.leads, newGuests: acc.newGuests+(m.newGuests||0),
      materialsCost: acc.materialsCost+m.materialsCost, marketingCost: acc.marketingCost+m.marketingCost,
      mastersSalary: acc.mastersSalary+m.mastersSalary, hostessSalary: acc.hostessSalary+m.hostessSalary,
    }), {count:0, guests:0, revenue:0, profit:0, leads:0, newGuests:0, materialsCost:0, marketingCost:0, mastersSalary:0, hostessSalary:0});
    yearTotals.avgCheck = yearTotals.guests>0 ? Math.round(yearMonthsSummary.reduce((s,m)=>s+m.eventsRevenue,0)/yearTotals.guests) : 0;
    yearTotals.profitabilityPct = yearTotals.revenue>0 ? Math.round(yearTotals.profit/yearTotals.revenue*100) : null;
    const prevYearTotalRevenue = prevYearMonthsSummary.reduce((s,m)=>s+m.revenue,0);
    yearTotals.growthPct = prevYearTotalRevenue > 0 ? Math.round((yearTotals.revenue - prevYearTotalRevenue) / prevYearTotalRevenue * 100) : null;

    // детализация выручки по продуктам, по месяцам года
    const yearProductMatrix = PRODUCTS.map(p=>{
      const monthValues = Array.from({length:12}, (_,mIdx)=>{
        const ym = summaryYear+'-'+pad(mIdx+1);
        return state.events
          .filter(e=> e.date && e.date.startsWith(ym) && e.product === p)
          .reduce((s,e)=> s + eventRevenueForecast(e), 0);
      });
      return { name: p, monthValues, total: monthValues.reduce((s,v)=>s+v,0) };
    });
    const yearProductMonthTotals = Array.from({length:12}, (_,mIdx)=> yearProductMatrix.reduce((s,row)=>s+row.monthValues[mIdx], 0));
    const yearProductGrandTotal = yearProductMatrix.reduce((s,row)=>s+row.total, 0);

    // ЗП по сотрудникам (мастера + хостес), по месяцам года — чтобы видеть рост/просадку зарплаты каждого человека
    const staffMonthlyPay = {}; // { name: [12 значений] }
    const addStaffPay = (name, mIdx, amount)=>{
      if(!name || !amount) return;
      const n = name.trim();
      if(!n) return;
      if(!staffMonthlyPay[n]) staffMonthlyPay[n] = Array(12).fill(0);
      staffMonthlyPay[n][mIdx] += amount;
    };
    for(let mIdx=0; mIdx<12; mIdx++){
      const ym = summaryYear+'-'+pad(mIdx+1);
      state.events.filter(e=> e.date && e.date.startsWith(ym)).forEach(e=>{
        eventHostsWithPay(e).forEach(h=> addStaffPay(h.name, mIdx, h.pay));
        eventMasterMaterialPayments(e).forEach(p=> addStaffPay(p.name, mIdx, p.amount));
      });
      state.itemSales.filter(x=>x.date && x.date.startsWith(ym)).forEach(x=>{
        const share = Math.round(((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0) * ITEM_SALE_MASTER_PCT / 100);
        addStaffPay(x.masterName, mIdx, share);
      });
      state.orders.filter(x=>x.date && x.date.startsWith(ym)).forEach(x=>{
        addStaffPay(x.masterName, mIdx, (x.masterShare!==undefined&&x.masterShare!==null&&!isNaN(x.masterShare))?Number(x.masterShare):0);
      });
      state.salaryAdjustments.filter(a=>a.date && a.date.startsWith(ym)).forEach(a=>{
        addStaffPay(a.masterName, mIdx, Number(a.amount)||0);
      });
      const daysInM = new Date(summaryYear, mIdx+1, 0).getDate();
      for(let d=1; d<=daysInM; d++){
        const dateObj = new Date(summaryYear, mIdx, d);
        const dow = dateObj.getDay();
        const rate = (dow===0 || dow===6) ? HOSTESS_WEEKEND_RATE : HOSTESS_WEEKDAY_RATE;
        const dateStr = fmtDate(dateObj);
        const dayShifts = state.hostessShifts[dateStr];
        if(!dayShifts) continue;
        SHIFT_DEFS.forEach(s=>{
          const rawEntry = dayShifts[s.key];
          const entry = normalizeShiftEntry(rawEntry, s);
          if(entry && entry.name){
            const extra = shiftExtraHours(rawEntry, s);
            addStaffPay(entry.name, mIdx, rate + extra*HOSTESS_EXTRA_HOUR_RATE);
          }
        });
      }
    }
    const yearStaffMatrix = Object.entries(staffMonthlyPay)
      .map(([name, monthValues])=>({ name, monthValues, total: monthValues.reduce((s,v)=>s+v,0) }))
      .filter(row=>row.total>0)
      .sort((a,b)=>b.total-a.total);
    const yearStaffMonthTotals = Array.from({length:12}, (_,mIdx)=> yearStaffMatrix.reduce((s,row)=>s+row.monthValues[mIdx], 0));
    const yearStaffGrandTotal = yearStaffMatrix.reduce((s,row)=>s+row.total, 0);

    // единая сводка по всей выручке бизнеса за месяц (мероприятия + сертификаты + "Книга")
    const monthYm = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1);
    const certMonthSales = state.certificates
      .filter(c=> c.saleDate && c.saleDate.startsWith(monthYm) && c.purpose !== 'marketing')
      .reduce((s,c)=> s + ((c.amount!==undefined&&c.amount!==null&&!isNaN(c.amount))?Number(c.amount):0), 0);
    const incomesMonthTotal = state.incomes
      .filter(i=> i.date && i.date.startsWith(monthYm))
      .reduce((s,i)=> s + ((i.amount!==undefined&&i.amount!==null&&!isNaN(i.amount))?Number(i.amount):0), 0);
    const grandTotalRevenue = totalRevenue + certMonthSales + incomesMonthTotal;
    // возвраты за месяц — по фактической дате возврата (paymentDate), иначе по дате заявки на возврат
    const monthRefunds = state.refunds.filter(r=>{
      const d = r.paymentDate || r.requestDate;
      return d && d.startsWith(monthYm) && r.status === 'refunded';
    });
    const refundsLinkedAmount = monthRefunds.filter(r=>r.eventId).reduce((s,r)=> s + ((r.amount!==undefined&&r.amount!==null&&!isNaN(r.amount))?Number(r.amount):0), 0);
    const refundsUnlinkedAmount = monthRefunds.filter(r=>!r.eventId).reduce((s,r)=> s + ((r.amount!==undefined&&r.amount!==null&&!isNaN(r.amount))?Number(r.amount):0), 0);
    const refundsTotalAmount = refundsLinkedAmount + refundsUnlinkedAmount;

    // ЧИСТАЯ ПРИБЫЛЬ (только для владельца) = Выручка − Расходы
    // Выручка = мероприятия + изделия + сертификаты + заказы
    const npEventsRevenue = totalRevenue; // мероприятия, прогнозная (см. eventRevenueForecast)
    const npItemSalesRevenue = state.itemSales
      .filter(x=> x.date && x.date.startsWith(monthYm))
      .reduce((s,x)=> s + ((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0), 0);
    const npCertSalesRevenue = certMonthSales; // сертификаты, уже посчитаны выше
    const npOrdersRevenue = state.orders
      .filter(x=> x.date && x.date.startsWith(monthYm))
      .reduce((s,x)=> s + ((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0), 0);
    const npTotalRevenue = npEventsRevenue + npItemSalesRevenue + npCertSalesRevenue + npOrdersRevenue;

    // Расходы = материалы + маркетинг + зп мастеров + зп хостес + зп менеджеров (вручную) + аренда (вручную)
    //          + прочие сотрудники (вручную) + свои статьи расходов (вручную)
    // "Материалы" уже включает всё, что привязано к конкретному мероприятию (расходы, доплаты мастерам) —
    // чтобы не задвоить, "зп мастеров" ниже считает только то, что НЕ привязано ни к одному мероприятию.
    const npMaterialsCost = evts.reduce((s,e)=> s + eventMaterialsCost(e), 0);
    const npMarketingCost = state.expenses
      .filter(e=> e.date && e.date.startsWith(monthYm) && !e.eventId && e.category === 'Маркетинг')
      .reduce((s,e)=> s + ((e.amount!==undefined&&e.amount!==null&&!isNaN(e.amount))?Number(e.amount):0), 0);
    const npMastersBasePay = evts.reduce((s,e)=> s + eventTotalMasterPay(e), 0);
    const npMastersItemShare = state.itemSales
      .filter(x=> x.date && x.date.startsWith(monthYm))
      .reduce((s,x)=> s + Math.round(((x.revenue!==undefined&&x.revenue!==null&&!isNaN(x.revenue))?Number(x.revenue):0) * ITEM_SALE_MASTER_PCT / 100), 0);
    const npMastersOrderShare = state.orders
      .filter(x=> x.date && x.date.startsWith(monthYm))
      .reduce((s,x)=> s + ((x.masterShare!==undefined&&x.masterShare!==null&&!isNaN(x.masterShare))?Number(x.masterShare):0), 0);
    const npUnlinkedAdjustments = state.salaryAdjustments
      .filter(a=> a.date && a.date.startsWith(monthYm) && !a.eventId)
      .reduce((s,a)=> s + (Number(a.amount)||0), 0);
    const npMastersSalary = npMastersBasePay + npMastersItemShare + npMastersOrderShare + npUnlinkedAdjustments;
    // зп хостес — по графику смен (будни/выходные + переработка), как и в разделе "ЗП хостес"
    let npHostessSalary = 0;
    {
      const y = cursor.getFullYear(), m = cursor.getMonth();
      const daysInM = new Date(y, m+1, 0).getDate();
      for(let d=1; d<=daysInM; d++){
        const dateObj = new Date(y, m, d);
        const dow = dateObj.getDay();
        const rate = (dow===0 || dow===6) ? HOSTESS_WEEKEND_RATE : HOSTESS_WEEKDAY_RATE;
        const dateStr = fmtDate(dateObj);
        const dayShifts = state.hostessShifts[dateStr];
        if(!dayShifts) continue;
        SHIFT_DEFS.forEach(s=>{
          const rawEntry = dayShifts[s.key];
          const entry = normalizeShiftEntry(rawEntry, s);
          if(entry && entry.name){
            const extra = shiftExtraHours(rawEntry, s);
            npHostessSalary += rate + extra*HOSTESS_EXTRA_HOUR_RATE;
          }
        });
      }
    }
    const npManual = (state.netProfitManual && state.netProfitManual[monthYm]) || {};
    const npManagerSalary = (npManual.managerSalary!==undefined && npManual.managerSalary!==null) ? Number(npManual.managerSalary) : 0;
    const npRent = (npManual.rent!==undefined && npManual.rent!==null) ? Number(npManual.rent) : 0;
    const npStaffList = npManual.staff || [];
    const npStaffTotal = npStaffList.reduce((s,x)=> s + (Number(x.amount)||0), 0);
    const npCustomList = npManual.customExpenses || [];
    const npCustomTotal = npCustomList.reduce((s,x)=> s + (Number(x.amount)||0), 0);

    const npTotalExpenses = npMaterialsCost + npMarketingCost + npMastersSalary + npHostessSalary + npManagerSalary + npRent + npStaffTotal + npCustomTotal;
    const netProfit = npTotalRevenue - npTotalExpenses;

    const certUsedThisMonth = state.certificates.reduce((sum,c)=>{
      if(!Array.isArray(c.redemptions)) return sum;
      const monthSpent = c.redemptions
        .filter(r=> r.date && r.date.startsWith(monthYm))
        .reduce((s,r)=> s + ((r.amount!==undefined&&r.amount!==null&&!isNaN(r.amount))?Number(r.amount):0), 0);
      return sum + monthSpent;
    }, 0);

    const PLAN_STATUS_LABEL = { ahead:'✅ в темпе', behind:'⚠ отстаём', notstarted:'—' };
    const forwardForecastHtml = `
      <div class="analytics-section" style="border-top:1px solid var(--line);padding-top:16px;margin-top:4px;">
        <h4 style="margin-top:0;">Забронировано вперёд</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;">Факт — уже полученные деньги. Прогноз — полная ожидаемая сумма по уже запланированным мероприятиям (включает внесённую предоплату + то, что должны доплатить). Не зависит от того, какой месяц вы сейчас смотрите.</div>
        ${forwardMonths.map(f=>`
          <div class="stat-row">
            <div class="stat-label" style="width:130px;text-transform:capitalize;">${escapeHtml(f.label)}</div>
            <div style="flex:1;font-family:var(--font-mono);font-size:13px;">Факт: ${formatMoney(f.factRevenue)} · Прогноз: ${formatMoney(f.forecastRevenue)}${f.target?' из '+formatMoney(f.target)+' ('+f.pctOfTarget+'%)':''}</div>
            <div style="width:auto;font-size:11.5px;color:var(--ink-soft);">${f.eventsCount} меропр.</div>
          </div>
        `).join('')}
      </div>
    `;
    const analyticsPanel_plan = (hasAnyPlan ? `        <div style="font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-bottom:10px;">День ${daysElapsed} из ${daysInMonth}. «Нужно к этому дню» — темп, при котором план выполнится ровно к концу месяца. «Прогноз» — куда придём, если сохраним текущий темп.</div>
        ${[...planProgress.filter(p=>p.target!==null), ...customPlanProgress].map(p=>`
          <div style="margin-bottom:16px;padding:10px 12px;background:var(--paper-2);border-radius:var(--radius);border-left:3px solid ${p.paceStatus==='ahead'?'var(--status-green)':(p.paceStatus==='behind'?'var(--status-red)':'var(--line-strong)')};">
            <div style="display:flex;justify-content:space-between;align-items:baseline;">
              <b style="font-family:var(--font-display);">${escapeHtml(p.label)}${p.isCustom?' <span style="font-weight:400;font-size:10.5px;color:var(--ink-soft);">(факт вручную)</span>':''}</b>
              <span style="font-size:12px;color:${p.paceStatus==='ahead'?'var(--status-green)':(p.paceStatus==='behind'?'var(--status-red)':'var(--ink-soft)')};">${PLAN_STATUS_LABEL[p.paceStatus]}</span>
            </div>
            <div style="font-family:var(--font-mono);font-size:15px;margin-top:4px;">${p.format==='money'?formatMoney(p.value):(p.format==='pct'?p.value+'%':p.value)} <span style="color:var(--ink-soft);font-size:12px;">из ${p.format==='money'?formatMoney(p.target):(p.format==='pct'?p.target+'%':p.target)}${p.format!=='pct'?' ('+p.pctOfTarget+'%)':''}</span></div>
            <div class="stat-bar-track" style="margin-top:6px;"><div class="stat-bar-fill" style="width:${Math.min(100,p.format==='pct'?(p.target>0?Math.round(p.value/p.target*100):0):p.pctOfTarget)}%;background:${p.paceStatus==='behind'?'var(--status-red)':'var(--status-green)'};"></div></div>
            ${daysElapsed>0 && p.format!=='pct' ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">Нужно к этому дню: ${p.format==='money'?formatMoney(p.expectedByNow):p.expectedByNow} · Прогноз на конец месяца: ${p.format==='money'?formatMoney(p.projected):p.projected}</div>` : ''}
          </div>
        `).join('')}
      </div>
` : `        <div style="color:var(--ink-soft);font-size:13px;">План на этот месяц ещё не задан. Нажмите «🎯 План» вверху, чтобы задать целевые показатели.</div>
      </div>
`) + forwardForecastHtml;


    const analyticsPanel_yearsummary = `
      <div class="analytics-section">
        <h4 style="margin-top:0;">${summaryYear} год — по месяцам</h4>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;">Выручка (мероприятия + изделия + сертификаты + заказы) и прибыль — прогнозные. Рентабельность = прибыль / выручка. Заполняемость — от вместимости студии в месяц (без учёта «Выезда»). «Новые гости» вносятся вручную.</div>

    const ceramicsEvts = evts.filter(e=> isCeramicsEvent(e.title));
