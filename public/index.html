// ---------- в стиле amoCRM: сроки по задачам, перенос по этапам, карточка сделки ----------
const B2B_COLORS = {new:'var(--sky)', meet:'var(--indigo)', kp:'var(--ochre)', sent:'var(--plum)', won:'var(--teal)', lost:'var(--brick)'};
const B2B_TASK_TYPES = {call:'📞 Звонок', meeting:'🤝 Встреча', mail:'✉️ Письмо', kp:'📄 КП', other:'• Другое'};
function b2bOpenTasks(l){ return (l.tasks||[]).filter(t=>!t.done); }
// ближайший срок: основной дедлайн шага или любая невыполненная задача
function b2bDue(l){
  if(!b2bIsOpen(l)) return '';
  return [l.deadline].concat(b2bOpenTasks(l).map(t=>t.deadline)).filter(Boolean).sort()[0] || '';
}
async function b2bUpdateLead(id, fn){
  return mutateB2B(d=>{ d.leads = d.leads.map(l=> l.id===id ? fn({...l}) : l); return d; });
}
function b2bMoveTo(id, target){
  const l = state.b2b.leads.find(x=>x.id===id); if(!l || l.stage===target) return;
  if(!b2bIsOpen(l)){
    if(B2B_OPEN.includes(target)) openB2bStepModal(id,'reopen',target); else toast('Сначала верните заявку в работу');
    return;
  }
  if(target==='new'){
    b2bUpdateLead(id, n=>({...n, stage:'new', log:(n.log||[]).concat([b2bLogEntry('new','Возвращена на этап «Новая заявка»')])})).then(async ok=>{ if(ok){ await b2bSyncEvent(id); render(); } });
  } else if(target==='meet') openB2bStepModal(id,'meet');
  else if(target==='kp') openB2bStepModal(id, l.stage==='meet'?'done':'kp');
  else openB2bStepModal(id, target); // sent / won / lost
}
// компактная карточка для доски (как в amoCRM): подробности, «Отказ», «Передать», «Изм.» — в карточке сделки по клику
function b2bLeadCardCompact(l, today){
  const c = b2bClient(l.clientId) || {};
  const due = b2bDue(l);
  const over = !!due && due<today, isToday = due===today;
  const off = !!due && l.managerId && b2bWorks(l.managerId,due)===false;
  const prim = {
    new: `<button class="btn small" data-b2-act="${l.id}:kp" title="Сразу коммерческое предложение">КП</button><button class="btn small" data-b2-act="${l.id}:meet">Встреча</button>`,
    meet: `<button class="btn small" data-b2-act="${l.id}:done">Проведена → КП</button><button class="btn ghost small" data-b2-act="${l.id}:meet" title="Перенести встречу / звонок">↻</button>`,
    kp: `<button class="btn small" data-b2-act="${l.id}:sent">КП отправлено</button>`,
    sent: `<button class="btn small" data-b2-act="${l.id}:won">Сделка ✓</button>`,
  }[l.stage] || `<button class="btn ghost small" data-b2-act="${l.id}:reopen">↩ В работу</button>`;
  const rs = b2bClientStats(l.clientId, l.id);
  const extra = [ (l.stage==='won' ? '💰 '+b2bMoney(l.dealSum||l.forecast) : (l.forecast?'💰 '+b2bMoney(l.forecast):'')),
    (l.unread?'<b style="color:var(--brick)">💬'+l.unread+'</b>':((l.msgs||[]).length?'💬':'')), rs.others.length?'🔁':'', (l.links||[]).length?'📎'+l.links.length:'', b2bOpenTasks(l).length?'☑'+b2bOpenTasks(l).length:'' ].filter(Boolean).join(' · ');
  return `<div class="item" style="display:block;padding:8px 9px;margin-bottom:6px;" data-b2-id="${l.id}" draggable="true">
    <div style="display:flex;justify-content:space-between;gap:4px;align-items:baseline;">
      <input type="checkbox" data-b2-sel="${l.id}" style="margin:0 2px 0 0;flex:none;">
      <strong style="flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" data-b2-toggle="${l.id}" title="${escapeHtml(c.name||'')}">${escapeHtml(c.name||'(клиент удалён)')}</strong>
      <span title="${l.direction==='out'?'исходящая':'входящая'}" style="font-size:12px;">${l.direction==='out'?'⬆':'⬇'}</span></div>
    <div class="subtitle" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml([l.managerId?empName(l.managerId):'не назначен', l.source].filter(Boolean).join(' · '))}</div>
    ${b2bIsOpen(l)?`<div style="font-size:12.5px;line-height:1.25;margin-top:2px;">${escapeHtml(b2bNextAction(l))}</div>`:''}
    ${b2bIsOpen(l)&&!due?`<div style="font-size:12px;color:var(--brick);font-weight:600;">⚠ нет следующего шага</div>`:''}
    ${due?`<div style="font-size:12px;${over?'color:var(--brick);font-weight:600;':isToday?'color:var(--ochre);font-weight:600;':'color:var(--ink-soft);'}">⏰ ${isToday?'сегодня':fmtDate(due)}${over?' · просрочено':''}${off?' ⚠️':''}</div>`:''}
    ${l.stage==='lost'?`<div class="subtitle" style="font-size:12px;">${escapeHtml(b2bReasonLabel(l))}</div>`:''}
    ${(l.tags||[]).length?`<div style="margin-top:2px;">${b2bTagChips(l)}</div>`:''}
    ${extra?`<div class="subtitle" style="font-size:12px;">${extra}</div>`:''}
    <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;">${prim}</div>
  </div>`;
}
function b2bFunnelHTML(open, closed, today){
  const st = state.b2bState;
  const sumOf = (arr,f)=>arr.reduce((s,l)=>s+(Number(f(l))||0),0);
  const byDue = (a,b)=>(b2bDue(a)||'9999').localeCompare(b2bDue(b)||'9999');
  const cols = B2B_OPEN.map(s=>{ const items=open.filter(l=>l.stage===s).sort(byDue); return {s, items, sum:sumOf(items,l=>l.forecast)}; });
  const byDone = (a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'');
  const wonL = closed.filter(l=>l.stage==='won').sort(byDone);
  const lostL = closed.filter(l=>l.stage==='lost').sort(byDone);
  cols.push({s:'won', items:wonL, sum:sumOf(wonL,l=>l.dealSum||l.forecast)});
  cols.push({s:'lost', items:lostL, sum:sumOf(lostL,l=>l.forecast)});
  const col = c=>`<div data-b2-drop="${c.s}" style="flex:1 1 0;min-width:175px;display:flex;flex-direction:column;min-height:0;background:${c.s==='won'?'var(--teal-bg)':'var(--paper,#faf8f3)'};border:1px solid var(--paper-line);border-top:4px solid ${B2B_COLORS[c.s]};border-radius:10px;">
      <div style="padding:8px 9px 4px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:4px;"><label style="display:flex;gap:5px;align-items:baseline;cursor:pointer;"><input type="checkbox" data-b2-selcol="${c.s}" title="Выбрать все в колонке" style="margin:0;"><strong style="font-size:13.5px;">${B2B_STAGES[c.s]}</strong></label><span class="count">${c.items.length}</span></div>
        <div class="subtitle" style="font-size:12px;">${c.s==='lost'?'потеряно ':''}${b2bMoney(c.sum)}</div>
        ${c.s==='new'?`<div style="display:flex;gap:3px;margin-top:6px;"><input id="b2QName" placeholder="＋ Быстро: компания" style="flex:1;min-width:0;padding:5px 7px;font-size:12.5px;"><input id="b2QPhone" placeholder="Тел." style="width:62px;padding:5px 6px;font-size:12.5px;"><button class="btn small" id="b2QAdd">＋</button></div>`:''}
      </div>
      <div style="overflow-y:auto;flex:1;padding:4px 7px 7px;">
        ${c.items.length?c.items.slice(0,60).map(l=>b2bLeadCardCompact(l,today)).join(''):'<div class="subtitle" style="font-size:12px;padding:4px;">Перетащите заявку сюда</div>'}
      </div></div>`;
  const total = open.length + closed.length;
  const bar = Object.keys(B2B_STAGES).map(s=>{ const n = (b2bIsOpen({stage:s})?open:closed).filter(l=>l.stage===s).length;
    return n ? `<div title="${B2B_STAGES[s]}: ${n}" style="flex:${n};background:${B2B_COLORS[s]};color:#fff;font-size:11px;padding:2px 6px;overflow:hidden;white-space:nowrap;">${B2B_STAGES[s]} · ${n}</div>` : ''; }).join('');
  return `<div id="b2Bar" style="display:none;gap:10px;align-items:center;background:var(--paper,#faf8f3);border:1px solid var(--paper-line);border-radius:8px;padding:6px 10px;margin-bottom:8px;"></div>
    <div style="display:flex;border-radius:7px;overflow:hidden;margin-bottom:8px;min-height:18px;">${bar}</div>
    <div class="b2b-board" style="display:flex;gap:8px;overflow-x:auto;align-items:stretch;height:calc(100vh - 372px);min-height:360px;">${cols.map(col).join('')}</div>`;
}
function b2bWireFunnel(root){
  b2bWireSelection(root);
  root.querySelectorAll('[data-b2-id][draggable]').forEach(c=>{
    c.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', c.dataset.b2Id); e.dataTransfer.effectAllowed='move'; });
  });
  root.querySelectorAll('[data-b2-drop]').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.style.outline='2px dashed var(--indigo)'; });
    col.addEventListener('dragleave', ()=>{ col.style.outline=''; });
    col.addEventListener('drop', e=>{ e.preventDefault(); col.style.outline=''; const id=e.dataTransfer.getData('text/plain'); if(id) b2bMoveTo(id, col.dataset.b2Drop); });
  });
  const qa = root.querySelector('#b2QAdd');
  if(qa){
    const go = async ()=>{
      const name = root.querySelector('#b2QName').value.trim(), phone = root.querySelector('#b2QPhone').value.trim();
      if(!name){ toast('Укажите название компании'); return; }
      const today = todayISO(); const mgr = b2bPickManager(today); const dl = b2bNextWork(mgr, today, false);
      const ok = await mutateB2B(d=>{
        let c = d.clients.find(x=>(x.name||'').trim().toLowerCase()===name.toLowerCase() || (b2bPhoneKey(phone) && b2bPhoneKey(x.phone)===b2bPhoneKey(phone)));
        if(!c){ c = {id:uid(), name, phone, createdAt:today}; d.clients.push(c); }
        d.leads.push({id:uid(), clientId:c.id, stage:'new', direction:'in', source:'', createdAt:today, managerId:mgr, deadline:dl, forecast:0, comment:'', tasks:[], tags:[], pipelineId:state.b2bState.pipe,
          log:[b2bLogEntry('new', `Заявка заведена${mgr?' · ответственный: '+empName(mgr):''}`)]});
        return d; });
      if(ok){ toast('Заявка добавлена'); render(); }
    };
    qa.onclick = go;
    root.querySelector('#b2QName').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  }
}

// ---------- карточка сделки (как в amoCRM: этапы сверху, слева контакт, справа задачи и лента) ----------
function openB2bCardModal(leadId){
  const l = state.b2b.leads.find(x=>x.id===leadId); if(!l) return;
  const c = b2bClient(l.clientId) || {};
  const today = todayISO();
  const root = document.getElementById('modalRoot');
  const all = [...B2B_OPEN, 'won', 'lost'];
  const tasks = (l.tasks||[]).slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0) || (a.deadline||'9999').localeCompare(b.deadline||'9999'));
  const feed = (l.log||[]).slice().reverse();
  const info = [['Должность',c.position],['Ниша',c.niche],['Деятельность',c.activity],['Штат',c.staff],['Адрес',c.address],['Instagram',c.instagram],['Источник',l.source],['Прогноз',l.forecast?b2bMoney(l.forecast):''],['Сумма сделки',l.dealSum?b2bMoney(l.dealSum):'']].concat(b2bCustomRows(l)).filter(x=>x[1]);
  const hhmm = ts=> ts ? ' '+new Date(ts).toTimeString().slice(0,5) : '';
  root.innerHTML = `<div class="overlay"><div class="modal" style="max-width:900px;width:96vw;">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;">
      <div><h3 style="margin:0;">${escapeHtml(c.name||'(клиент удалён)')}</h3>
        <div class="subtitle">${l.direction==='out'?'⬆ исходящая':'⬇ входящая'} · заведена ${fmtDate(l.createdAt)} · 👤 ${escapeHtml(l.managerId?empName(l.managerId):'не назначен')} · воронка «${escapeHtml(b2bPipeName(b2bPipeOf(l)))}»</div>${(l.tags||[]).length?`<div style="margin-top:3px;">${b2bTagChips(l)}</div>`:''}</div>
      <div style="display:flex;gap:6px;"><button class="btn ghost small" id="b2kTransfer">↔ Передать</button><button class="btn ghost small" id="b2kEdit">Изм. заявку</button>${c.name?`<button class="btn ghost small" id="b2kClient">Изм. клиента</button>`:''}<button class="btn ghost small" id="b2kClose">Закрыть</button></div>
    </div>
    <div style="display:flex;margin:12px 0;border-radius:8px;overflow:hidden;">
      ${all.map(s=>`<button data-b2k-stage="${s}" style="flex:1;border:none;padding:8px 4px;font-size:12px;cursor:pointer;color:#fff;background:${B2B_COLORS[s]};opacity:${l.stage===s?1:.35};${l.stage===s?'font-weight:700;':''}">${B2B_STAGES[s]}</button>`).join('')}
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;">
      <div style="flex:1;min-width:230px;">
        <strong>Контакт</strong>
        <div style="font-size:13.5px;margin:4px 0;">${escapeHtml([c.person,c.position].filter(Boolean).join(', '))||'<span class="subtitle">имя не указано</span>'}</div>
        ${c.phone?`<div><a href="tel:${escapeHtml(String(c.phone).replace(/[^\d+]/g,''))}">${escapeHtml(c.phone)}</a></div>`:''}
        <div style="font-size:13px;margin-top:8px;">${info.map(x=>`<div><span class="subtitle">${x[0]}:</span> ${escapeHtml(String(x[1]))}</div>`).join('')}</div>
        ${l.comment?`<div style="font-size:13px;margin-top:8px;">💬 ${escapeHtml(l.comment)}</div>`:''}
        ${b2bRepeatHTML(l.clientId, l.id)}
        <div style="margin-top:12px;"><strong>Документы и КП</strong>
          ${(l.links||[]).map(x=>`<div style="display:flex;gap:6px;align-items:center;font-size:13px;padding:2px 0;"><a href="${escapeHtml(x.url)}" target="_blank" rel="noopener noreferrer" style="flex:1;overflow:hidden;text-overflow:ellipsis;">📎 ${escapeHtml(x.title||'Документ')}</a><span class="subtitle">${fmtDate(x.date)}</span><button class="btn ghost small" data-b2k-dellink="${x.id}">×</button></div>`).join('')||'<div class="subtitle" style="font-size:12.5px;">Пока нет</div>'}
          <div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;"><input id="b2kLinkTitle" placeholder="Название (КП №1)" style="flex:1;min-width:90px;"><input id="b2kLinkUrl" placeholder="Ссылка" style="flex:2;min-width:110px;"><button class="btn small" id="b2kAddLink">＋</button></div></div>
        ${b2bIsOpen(l)&&l.deadline?`<div style="font-size:13px;margin-top:8px;">⏰ Следующий шаг: ${escapeHtml(b2bNextAction(l))} — ${fmtDate(l.deadline)}</div>`:''}
      </div>
      <div style="flex:2;min-width:290px;">
        <strong>Задачи</strong>
        <div style="margin:6px 0;">${tasks.length?tasks.map(t=>{ const over=!t.done&&t.deadline&&t.deadline<today; return `<div style="display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13.5px;${t.done?'opacity:.55;text-decoration:line-through;':''}">
          <input type="checkbox" data-b2k-done="${t.id}" ${t.done?'checked':''}>
          <span style="flex:1;">${escapeHtml(B2B_TASK_TYPES[t.type]||'')} ${escapeHtml(t.text||'')} <span class="subtitle" style="${over?'color:var(--brick);font-weight:600;':''}">· ${t.deadline===today?'сегодня':fmtDate(t.deadline)}${t.time?' '+escapeHtml(t.time):''}</span></span>
          <select data-b2k-taskmgr="${t.id}" style="width:auto;max-width:120px;font-size:12px;"><option value="">—</option>${state.employees.filter(e=>e.role==='Менеджер'||['Руководитель','Ассистент'].includes(e.role)||e.id===t.managerId).map(e=>`<option value="${e.id}" ${e.id===t.managerId?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select>
          <button class="btn ghost small" data-b2k-deltask="${t.id}">×</button></div>`; }).join('') : '<div class="subtitle" style="font-size:12.5px;">Задач пока нет</div>'}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;">
          <select id="b2kType" style="width:auto;">${Object.entries(B2B_TASK_TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
          <input id="b2kText" placeholder="Что сделать" style="flex:1;min-width:120px;">
          <input type="date" id="b2kDate" value="${b2bNextWork(l.managerId, today, true)}" style="width:auto;">
          <input type="time" id="b2kTime" style="width:auto;">
          <select id="b2kMgr" style="width:auto;max-width:130px;">${state.employees.filter(e=>e.role==='Менеджер'||['Руководитель','Ассистент'].includes(e.role)||e.id===l.managerId).map(e=>`<option value="${e.id}" ${e.id===(b2bPickManager(b2bNextWork(l.managerId,today,true))||l.managerId)?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select>
          <button class="btn small" id="b2kAddTask">＋ Задача</button>
        </div>
        ${b2bChatHTML(l,c)}
        <strong>Заметки и история</strong>
        <div style="display:flex;gap:4px;margin:6px 0;"><input id="b2kNote" placeholder="Написать заметку (итог звонка, договорённости…)" style="flex:1;"><button class="btn small" id="b2kAddNote">Добавить</button></div>
        <div style="max-height:240px;overflow-y:auto;font-size:13px;">${feed.map(m=>`<div style="padding:4px 0;border-bottom:1px solid var(--paper-line);${m.kind==='note'?'background:var(--paper,#faf8f3);padding:6px;border-radius:6px;margin:3px 0;':''}">
          <span class="subtitle">${fmtDate(m.date)}${hhmm(m.ts)}${m.by?' · '+escapeHtml(empName(m.by)):''}</span><br>${m.kind==='note'?'📝 ':(m.stage?'<b>'+escapeHtml(B2B_STAGES[m.stage]||'')+'</b> · ':'')}${escapeHtml(m.note||'')}</div>`).join('')||'<div class="subtitle">Пусто</div>'}</div>
      </div>
    </div></div></div>`;
  const $ = id=>document.getElementById(id);
  const reopen = ()=>{ render(); openB2bCardModal(leadId); };
  $('b2kClose').onclick = closeModal;
  b2bWireChat(leadId, l, c, reopen);
  $('b2kEdit').onclick = ()=>openB2bLeadModal(leadId);
  $('b2kTransfer').onclick = ()=>openB2bTransferModal(leadId);
  const kc = $('b2kClient'); if(kc) kc.onclick = ()=>openB2bClientModal(l.clientId);
  root.querySelectorAll('[data-b2k-stage]').forEach(b=>b.onclick=()=>{ if(b.dataset.b2kStage!==l.stage){ b2bMoveTo(leadId, b.dataset.b2kStage); } });
  $('b2kAddNote').onclick = async ()=>{
    const t = $('b2kNote').value.trim(); if(!t){ toast('Напишите заметку'); return; }
    const ok = await b2bUpdateLead(leadId, n=>({...n, log:(n.log||[]).concat([{...b2bLogEntry(null,t), kind:'note'}])}));
    if(ok) reopen();
  };
  $('b2kDate').onchange = ()=>{ const pick = b2bPickManager($('b2kDate').value); if(pick && [...$('b2kMgr').options].some(o=>o.value===pick)) $('b2kMgr').value = pick; };
  $('b2kAddLink').onclick = async ()=>{
    const url = b2bSafeUrl($('b2kLinkUrl').value); if(!url){ toast('Вставьте ссылку на документ'); return; }
    const title = $('b2kLinkTitle').value.trim() || 'КП';
    const ok = await b2bUpdateLead(leadId, n=>({...n, links:(n.links||[]).concat([{id:uid(), title, url, date:today, by:state.currentUserId}]), log:(n.log||[]).concat([b2bLogEntry(null,`Добавлен документ: ${title}`)])}));
    if(ok) reopen(); };
  root.querySelectorAll('[data-b2k-dellink]').forEach(b=>b.onclick = async ()=>{ const id=b.dataset.b2kDellink;
    const ok = await b2bUpdateLead(leadId, n=>({...n, links:(n.links||[]).filter(x=>x.id!==id)})); if(ok) reopen(); });
  root.querySelectorAll('[data-b2k-taskmgr]').forEach(sel=>sel.onchange = async ()=>{ const id=sel.dataset.b2kTaskmgr, to=sel.value;
    const ok = await b2bUpdateLead(leadId, n=>({...n, tasks:(n.tasks||[]).map(t=>t.id===id?{...t,managerId:to}:t), log:(n.log||[]).concat([b2bLogEntry(null,`Задача «${((n.tasks||[]).find(t=>t.id===id)||{}).text||''}» передана: ${to?empName(to):'никому'}`)])})); if(ok) reopen(); });
  $('b2kAddTask').onclick = async ()=>{
    const text = $('b2kText').value.trim(), date = $('b2kDate').value;
    if(!text || !date){ toast('Укажите, что сделать, и срок'); return; }
    const task = {id:uid(), type:$('b2kType').value, text, deadline:date, time:$('b2kTime').value, managerId:$('b2kMgr').value||l.managerId||'', done:false};
    const ok = await b2bUpdateLead(leadId, n=>({...n, tasks:(n.tasks||[]).concat([task]), log:(n.log||[]).concat([b2bLogEntry(null,`Новая задача: ${B2B_TASK_TYPES[task.type]} ${text} (до ${fmtDate(date)})`)])}));
    if(ok) reopen();
  };
  root.querySelectorAll('[data-b2k-done]').forEach(cb=>cb.onchange = async ()=>{
    const tid = cb.dataset.b2kDone; const done = cb.checked;
    const ok = await b2bUpdateLead(leadId, n=>({...n, tasks:(n.tasks||[]).map(t=>t.id===tid?{...t, done, doneAt: done?today:null}:t),
      log:(n.log||[]).concat([b2bLogEntry(null, `${done?'Задача выполнена':'Задача снова открыта'}: ${((n.tasks||[]).find(t=>t.id===tid)||{}).text||''}`)])}));
    if(ok) reopen();
  });
  root.querySelectorAll('[data-b2k-deltask]').forEach(b=>b.onclick = async ()=>{
    const tid = b.dataset.b2kDeltask;
    const ok = await b2bUpdateLead(leadId, n=>({...n, tasks:(n.tasks||[]).filter(t=>t.id!==tid)}));
    if(ok) reopen();
  });
}

// ---------- причины отказа (список), передача, повторные клиенты, документы ----------
const B2B_LOST_DEFAULTS = [
  {id:'price', label:'Дорого'}, {id:'competitor', label:'Выбрали другую студию / площадку'},
  {id:'noanswer', label:'Не выходит на связь'}, {id:'later', label:'Отложили / нет бюджета сейчас'},
  {id:'notfit', label:'Не подходит формат или услуга'}, {id:'self', label:'Решили организовать сами'},
  {id:'other', label:'Другое'}];
function b2bReasons(){ const l = state.b2b && state.b2b.lostReasons; return (l&&l.length) ? l : B2B_LOST_DEFAULTS; }
function b2bReasonLabel(l){
  if(l.lostReasonId){ const r = b2bReasons().find(x=>x.id===l.lostReasonId); const base = r?r.label:'Другое';
    return (l.lostReasonId==='other' && l.lostReason) ? `${base}: ${l.lostReason}` : base; }
  return l.lostReason || 'Не указана';
}
function openB2bReasonsModal(){
  const list = b2bReasons().map(x=>({...x}));
  const root = document.getElementById('modalRoot');
  const draw = ()=>{
    root.innerHTML = `<div class="overlay"><div class="modal"><h3>⚙ Причины отказа</h3>
      <div class="subtitle" style="margin-bottom:8px;">Этот список менеджеры видят при отказе. Причину нельзя удалить — только скрыть, чтобы старая статистика не потерялась. «Другое» остаётся всегда.</div>
      ${list.map((r,i)=>`<div style="display:flex;gap:6px;align-items:center;margin:4px 0;">
        <input data-rs-label="${i}" value="${escapeHtml(r.label)}" style="flex:1;${r.hidden?'opacity:.5;':''}" ${r.id==='other'?'disabled':''}>
        ${r.id==='other'?'':`<button class="btn ghost small" data-rs-hide="${i}">${r.hidden?'Показать':'Скрыть'}</button>`}</div>`).join('')}
      <div style="display:flex;gap:6px;margin-top:10px;"><input id="rsNew" placeholder="Новая причина" style="flex:1;"><button class="btn ghost small" id="rsAdd">＋ Добавить</button></div>
      <div class="modal-actions"><button class="btn ghost" id="rsCancel">Отмена</button><button class="btn" id="rsSave">Сохранить</button></div></div></div>`;
    const sync = ()=>root.querySelectorAll('[data-rs-label]').forEach(i=>{ list[+i.dataset.rsLabel].label = i.value.trim() || list[+i.dataset.rsLabel].label; });
    root.querySelectorAll('[data-rs-hide]').forEach(b=>b.onclick=()=>{ sync(); const r=list[+b.dataset.rsHide]; r.hidden=!r.hidden; draw(); });
    document.getElementById('rsAdd').onclick = ()=>{ sync(); const v=document.getElementById('rsNew').value.trim(); if(!v) return;
      const other = list.findIndex(x=>x.id==='other'); const item = {id:'r_'+uid(), label:v}; if(other>=0) list.splice(other,0,item); else list.push(item); draw(); };
    document.getElementById('rsCancel').onclick = closeModal;
    document.getElementById('rsSave').onclick = async ()=>{ sync();
      const ok = await mutateB2B(d=>{ d.lostReasons = list; return d; });
      if(ok){ closeModal(); toast('Причины сохранены'); render(); } };
  };
  draw();
}
function b2bLostStatsHTML(all){
  const lost = all.filter(l=>l.stage==='lost');
  if(!lost.length) return '';
  const groups = {};
  lost.forEach(l=>{ const k = l.lostReasonId || (l.lostReason?'_text':'_none'); (groups[k]=groups[k]||[]).push(l); });
  const label = k=> k==='_text' ? 'Указана вручную (старые)' : k==='_none' ? 'Не указана' : ((b2bReasons().find(x=>x.id===k)||{}).label || 'Другое');
  const rows = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length).map(k=>{ const g=groups[k];
    return `<tr><td>${escapeHtml(label(k))}</td><td>${g.length}</td><td>${Math.round(g.length/lost.length*100)}%</td><td>${b2bMoney(g.reduce((s,l)=>s+(Number(l.forecast)||0),0))}</td></tr>`; }).join('');
  return `<div style="overflow-x:auto;margin-top:16px;"><strong>Почему теряем клиентов</strong>
    <table style="width:100%;border-collapse:collapse;font-size:13.5px;"><tr><th style="text-align:left;">Причина</th><th>Отказов</th><th>Доля</th><th>Потеряно (прогноз)</th></tr>${rows}</table></div>`;
}

// кому достанется заявка, если шаг стоит на дату: менеджер на смене в этот день (если текущий в этот день не работает)
function b2bOwnerForDate(l, date){
  if(!date) return '';
  const cur = l.managerId;
  if(cur && b2bWorks(cur,date)!==false) return '';
  const pick = b2bPickManager(date);
  return (pick && pick!==cur) ? pick : '';
}
function b2bTransferLog(from,to,why){ return b2bLogEntry(null, `Ответственный: ${from?empName(from):'не назначен'} → ${to?empName(to):'не назначен'}${why?' ('+why+')':''}`); }
function openB2bTransferModal(leadId){
  const l = state.b2b.leads.find(x=>x.id===leadId); if(!l) return;
  const people = state.employees.filter(e=>e.role==='Менеджер' || ['Руководитель','Ассистент'].includes(e.role) || e.id===l.managerId);
  const today = todayISO();
  const root = document.getElementById('modalRoot');
  const openT = b2bOpenTasks(l).length;
  root.innerHTML = `<div class="overlay"><div class="modal"><h3>Передать заявку</h3>
    <div class="subtitle" style="margin-bottom:8px;">${escapeHtml(b2bClientName(l))} · сейчас: ${escapeHtml(l.managerId?empName(l.managerId):'не назначен')}</div>
    <div class="field"><label>Новый ответственный</label><select id="b2tTo">${people.map(e=>`<option value="${e.id}" ${e.id===l.managerId?'selected':''}>${escapeHtml(e.name)}${e.role!=='Менеджер'?' — '+escapeHtml(e.role):''}${b2bWorks(e.id,today)===true?' · сегодня на смене':''}</option>`).join('')}</select></div>
    ${openT?`<label style="display:flex;gap:6px;align-items:center;font-size:13px;margin-bottom:8px;"><input type="checkbox" id="b2tTasks" checked> Передать и открытые задачи заявки (${openT})</label>`:''}
    <div class="field"><label>Комментарий</label><textarea id="b2tNote" rows="2" placeholder="Например: заболела, передаю по графику"></textarea></div>
    <div class="modal-actions"><button class="btn ghost" id="b2tCancel">Отмена</button><button class="btn" id="b2tSave">Передать</button></div></div></div>`;
  document.getElementById('b2tCancel').onclick = closeModal;
  document.getElementById('b2tSave').onclick = async ()=>{
    const to = document.getElementById('b2tTo').value; const note = document.getElementById('b2tNote').value.trim();
    const withTasks = !!(document.getElementById('b2tTasks') && document.getElementById('b2tTasks').checked);
    if(to===l.managerId){ toast('Ответственный не изменился'); return; }
    const ok = await b2bUpdateLead(leadId, n=>({...n, managerId:to,
      tasks: withTasks ? (n.tasks||[]).map(t=>t.done?t:{...t, managerId:to}) : n.tasks,
      log:(n.log||[]).concat([b2bTransferLog(n.managerId,to,'вручную'+(note?': '+note:''))])}));
    if(ok){ logAudit('b2b_transfer', `«${b2bClientName(l)}» → ${empName(to)}`); await b2bSyncEvent(leadId); closeModal(); toast('Заявка передана'); render(); }
  };
}
// повторные клиенты
function b2bClientStats(clientId, exceptId){
  const ls = (state.b2b?state.b2b.leads:[]).filter(l=>l.clientId===clientId && l.id!==exceptId);
  const won = ls.filter(l=>l.stage==='won');
  return {others:ls, won:won.length, sum:won.reduce((s,l)=>s+(Number(l.dealSum||l.forecast)||0),0),
    open:ls.filter(b2bIsOpen).length, lost:ls.filter(l=>l.stage==='lost').length, last:won.map(l=>l.doneAt||'').sort().pop()||''};
}
function b2bRepeatHTML(clientId, leadId){
  const s = b2bClientStats(clientId, leadId);
  if(!s.others.length) return '';
  return `<div style="background:var(--teal-bg);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px;">🔁 <strong>Клиент уже есть в базе</strong>
    <div>Сделок: ${s.won}${s.won?` на ${b2bMoney(s.sum)}${s.last?', последняя '+fmtDate(s.last):''}`:''}</div>
    <div class="subtitle" style="font-size:12.5px;">Других заявок: ${s.others.length} (в работе ${s.open}, отказов ${s.lost})</div></div>`;
}
// ссылки на КП и документы
function b2bSafeUrl(u){ u=String(u||'').trim(); if(!u) return ''; if(/^(javascript|data|vbscript):/i.test(u)) return ''; return /^https?:\/\//i.test(u) ? u : 'https://'+u; }
// мои шаги B2B — блок во вкладке «Задачи»
function b2bTasksSectionHTML(){
  if(!b2bAccess() || !state.b2b) return '';
  const uidMe = (hasRole('Руководитель','Ассистент') && state.taskFilterEmployee && state.taskFilterEmployee!=='all') ? state.taskFilterEmployee : state.currentUserId;
  const today = todayISO(), lim = isoAdd(today,3);
  const rows = state.b2b.leads.filter(l=>b2bIsOpen(l) && l.managerId===uidMe && b2bDue(l) && b2bDue(l)<=lim)
    .sort((a,b)=>b2bDue(a).localeCompare(b2bDue(b)));
  if(!rows.length) return '';
  const od = rows.filter(l=>b2bDue(l)<today).length;
  return `<details open style="margin-bottom:14px;border:1px solid var(--paper-line);border-radius:10px;padding:8px 12px;background:var(--paper,#faf8f3);">
    <summary style="cursor:pointer;"><strong>🤝 B2B: шаги по заявкам</strong> <span class="count">${rows.length}</span>${od?` <span style="color:var(--brick);font-size:13px;font-weight:600;">· просрочено ${od}</span>`:''}</summary>
    <div style="margin-top:6px;">${rows.map(l=>{ const d=b2bDue(l); const t=b2bOpenTasks(l).find(x=>x.deadline===d); 
      return `<div data-b2t-open="${l.id}" style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;cursor:pointer;font-size:13.5px;">
        <span><strong>${escapeHtml(b2bClientName(l))}</strong> <span class="subtitle">· ${escapeHtml(t?(B2B_TASK_TYPES[t.type]||'')+' '+t.text:b2bNextAction(l))}</span></span>
        <span style="${d<today?'color:var(--brick);font-weight:600;':d===today?'color:var(--ochre);font-weight:600;':''}white-space:nowrap;">${d===today?'сегодня':fmtDate(d)}</span></div>`; }).join('')}</div></details>`;
}

// ---------- импорт заявок из таблицы (вставка из Google Таблиц или файл .tsv / .csv) ----------
function b2bParseTable(text){
  text = String(text||'').replace(/^﻿/,'');
  const first = text.split('\n')[0] || '';
  const delim = first.includes('\t') ? '\t' : (first.split(';').length>first.split(',').length ? ';' : ',');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"' && cell==='') q=true;
    else if(ch===delim){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; rows.push(row); row=[]; }
    else cell+=ch;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function b2bParseDate(v){
  v = String(v||'').trim(); if(!v) return '';
  let m = v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if(m){ const y = m[3].length===2 ? '20'+m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : '';
}
// сопоставление столбцов по заголовкам (как в вашей таблице «ВОРОНКА ПРОДАЖ B2B»)
function b2bMapColumns(header){
  const map = {}; let results = 0;
  header.forEach((h,i)=>{
    const t = String(h||'').toLowerCase().replace(/\s+/g,' ').trim();
    const set = (k)=>{ if(map[k]===undefined) map[k]=i; };
    if(t.startsWith('источник')) set('source');
    else if(t.startsWith('менеджер')) set('manager');
    else if(t.startsWith('ниша')) set('niche');
    else if(t.startsWith('название')) set('name');
    else if(t.startsWith('имя')) set('person');
    else if(t.startsWith('должность')) set('position');
    else if(t.startsWith('инстаграм')||t.startsWith('instagram')) set('instagram');
    else if(t.startsWith('описание')) set('activity');
    else if(t.startsWith('штат')) set('staff');
    else if(t.startsWith('адрес')) set('address');
    else if(t.startsWith('контакт')||t.startsWith('телефон')) set('phone');
    else if(t.startsWith('дата заведения')) set('created');
    else if(t.startsWith('дата назначения')) set('dSet');
    else if(t.startsWith('дата проведения')) set('dDone');
    else if(t.startsWith('дата отправки')) set('dKp');
    else if(t.startsWith('прогноз')) set('forecast');
    else if(t.startsWith('статус')) set('status');
    else if(t.startsWith('комментарий')) set('comment');
    else if(t.startsWith('результат')){ results++; set('res'+results); }
  });
  return map;
}
function b2bRowsToLeads(rows, pipelineId){
  if(rows.length<2) return {items:[], error:'Не нашёл строк с данными. Вставьте таблицу вместе со строкой заголовков.'};
  const map = b2bMapColumns(rows[0]);
  const cfIdx = {}; b2bFields().forEach(f=>{ const i = rows[0].findIndex(h=>String(h||'').toLowerCase().replace(/\s+/g,' ').trim()===f.label.toLowerCase()); if(i>=0) cfIdx[f.id]=i; });
  if(map.name===undefined) return {items:[], error:'Не нашёл столбец «название». Скопируйте таблицу вместе со строкой заголовков.'};
  const today = todayISO();
  const g = (r,k)=> map[k]===undefined ? '' : String(r[map[k]]==null?'':r[map[k]]).trim();
  const items = [];
  rows.slice(1).forEach(r=>{
    const name = g(r,'name'); if(!name) return;
    const created = b2bParseDate(g(r,'created')) || today;
    const mgrName = g(r,'manager').toLowerCase();
    const mgr = mgrName ? (state.employees.find(e=>e.role==='Менеджер' && (e.name||'').toLowerCase().includes(mgrName))||{}).id||'' : '';
    const dSet=b2bParseDate(g(r,'dSet')), dDone=b2bParseDate(g(r,'dDone')), dKp=b2bParseDate(g(r,'dKp'));
    const res1=g(r,'res1'), res2=g(r,'res2'), res3=g(r,'res3');
    const st = g(r,'status').toLowerCase();
    let stage='new', deadline='', meetingDate='', meetingDoneDate='';
    if(/отказ/.test(st)) stage='lost'; else if(/(сделк|оплач|успех|выигр)/.test(st)) stage='won';
    else if(dDone){
      if(dDone>today){ stage='meet'; meetingDate=dDone; deadline=dDone; }
      else { stage='kp'; meetingDoneDate=dDone; deadline=dKp||b2bNextWork(mgr, dDone, false); }
    }
    else if(dKp){ stage='kp'; deadline=dKp; }
    else if(/^\s*кп/i.test(res1)){ stage='kp'; deadline=b2bNextWork(mgr, created, false); }
    else { stage='new'; deadline=dSet||b2bNextWork(mgr, created, false); }
    const closedNow = !b2bIsOpen({stage});
    const phoneRaw = g(r,'phone').replace(/\.0$/,'');
    const srcRaw = g(r,'source');
    const source = /^мероприят/i.test(srcRaw) ? 'Мероприятие' : srcRaw;
    const forecast = Number(String(g(r,'forecast')).replace(/[^\d.]/g,''))||0;
    const notes = [res2&&('Результат: '+res2), res3&&('Результат: '+res3), g(r,'comment')&&('Комментарий: '+g(r,'comment'))].filter(Boolean);
    items.push({
      client:{name, person:g(r,'person'), position:g(r,'position'), phone:phoneRaw, instagram:g(r,'instagram'), niche:g(r,'niche'), activity:g(r,'activity'), staff:g(r,'staff'), address:g(r,'address')},
      lead:{custom:(()=>{ const o={}; b2bFields().forEach(f=>{ if(cfIdx[f.id]===undefined) return; const raw=String(r[cfIdx[f.id]]==null?'':r[cfIdx[f.id]]).trim(); if(raw==='') return; o[f.id] = f.type==='date' ? b2bParseDate(raw) : f.type==='number' ? (Number(raw.replace(/[^\d.]/g,''))||'') : raw; }); return o; })(), direction:'in', source, createdAt:created, managerId:mgr, stage, deadline: closedNow?'':deadline, forecast, comment:'', pipelineId, meetingDate, meetingDoneDate, meetingKind: meetingDate?'meeting':'', tags:[], links:[],
        doneAt: closedNow?today:null},
      task: res1 ? {text:res1, deadline: closedNow?today:deadline} : null,
      notes,
    });
  });
  return {items, error:''};
}

// ---------- связка B2B → календарь: назначили встречу / звонок — событие появилось в календаре ----------
async function b2bSyncEvent(leadId){
  try{
    const l = state.b2b.leads.find(x=>x.id===leadId);
    await refreshEventsFromServer(false);
    const idx = state.events.findIndex(e=>e.b2bLeadId===leadId);
    const today = todayISO();
    let changed = false, created = false;
    if(!l || ((l.stage==='lost' || l.stage==='new') && idx>=0 && state.events[idx].date>=today)){
      // заявку удалили, отказ или вернули на «Новая заявка» — будущую встречу из календаря убираем
      if(idx>=0){ state.events.splice(idx,1); changed = true; }
    } else if(l.stage==='meet' && l.meetingDate){
      const call = l.meetingKind==='call';
      const c = b2bClient(l.clientId) || {};
      const ev = {title:`${call?'Звонок':'Встреча'}: ${c.name||'клиент B2B'}`, date:l.meetingDate, startTime:l.meetingTime||'', endTime:'',
        category:'work', purpose:'info', purposeText:'', format: call?'online':'offline', location:'', link:'', extraLink:'',
        employeeIds: l.managerId?[l.managerId]:[], manualNames:'',
        notes:`B2B${c.phone?' · '+c.phone:''}${c.person?' · '+c.person:''}`, seriesId:null, b2bLeadId:leadId};
      if(idx>=0) state.events[idx] = {...state.events[idx], ...ev, id:state.events[idx].id};
      else { state.events.push({id:uid(), ...ev}); created = true; }
      changed = true;
    } else if(idx>=0 && l.managerId && !(state.events[idx].employeeIds||[]).includes(l.managerId)){
      state.events[idx] = {...state.events[idx], employeeIds:[l.managerId]}; changed = true;
    }
    if(changed){
      const ok = await saveEvents();
      if(!ok) toast('⚠️ Не удалось обновить событие в календаре');
      else if(created) toast('📅 Встреча добавлена в календарь');
    }
  }catch(e){ console.warn('b2bSyncEvent', e); }
}

// ---------- связка B2B → «Задачи»: у каждой открытой заявки есть настоящая задача «следующий шаг» ----------
// Задача создаётся на исполнителя-менеджера со сроком шага; при смене шага/срока/ответственного она обновляется
// (и снова открывается), при закрытии заявки — отмечается выполненной. Задачи не удаляются.
async function b2bReconcileTasks(){
  try{
    if(!state.b2b) return;
    await refreshTasksFromServer(false);
    const tasks = state.tasksWork.slice();
    const today = todayISO();
    const proj = (state.projectsWork||[]).find(p=>!p.archived && /b2b/i.test(p.name||''));
    const byLead = new Map(); tasks.forEach((t,i)=>{ if(t.b2bLeadId) byLead.set(t.b2bLeadId,i); });
    const ids = new Set(state.b2b.leads.map(l=>l.id));
    let changed = false;
    state.b2b.leads.forEach(l=>{
      const open = b2bIsOpen(l);
      const due = open ? b2bDue(l) : '';
      const nt = open ? b2bOpenTasks(l).find(t=>t.deadline===due) : null;
      const assignee = (nt && nt.managerId) || l.managerId || null;
      const what = nt ? `${B2B_TASK_TYPES[nt.type]||''} ${nt.text}`.trim() : b2bNextAction(l);
      const title = `B2B: ${b2bClientName(l)} — ${what}`;
      const time = nt ? (nt.time||'') : (l.stage==='meet' ? (l.meetingTime||'') : '');
      const key = `${l.stage}|${due}|${assignee||''}|${title}`;
      const i = byLead.get(l.id);
      if(i===undefined){
        if(!open || !due) return;
        tasks.push({id:uid(), title, description:'Заявка B2B. Подробности, историю и действия смотрите во вкладке «🤝 B2B» → карточка клиента. Когда шаг сделан, переведите заявку на следующий этап там — задача обновится сама.',
          projectId:proj?proj.id:null, parentId:null, assigneeId:assignee, creatorId:state.currentUserId, createdDate:today, deadline:due, deadlineTime:time,
          priority:'med', status:'progress', completedAt:null, eventId:null, purchaseAmount:null, purchaseStore:'', purchaseExpenseId:null, b2bLeadId:l.id, b2bKey:key});
        changed = true;
      } else {
        const t = tasks[i];
        if(!open){ if(t.status!=='done'){ tasks[i] = {...t, status:'done', completedAt:today, b2bKey:key}; changed = true; } }
        else if(due && t.b2bKey!==key){ tasks[i] = {...t, title, deadline:due, deadlineTime:time, assigneeId:assignee, status:'progress', completedAt:null, b2bKey:key}; changed = true; }
      }
    });
    tasks.forEach((t,i)=>{ if(t.b2bLeadId && !ids.has(t.b2bLeadId) && t.status!=='done'){ tasks[i] = {...t, status:'done', completedAt:today}; changed = true; } });
    if(changed){
      setTasksFor(false, tasks);
      const ok = await persistTasksFor(false);
      if(!ok) toast('⚠️ Не удалось обновить задачу по заявке B2B');
    }
  }catch(e){ console.warn('b2bReconcileTasks', e); }
}

// ---------- автосценарии («роботы») ----------
function b2bStageEntered(l){ const e=(l.log||[]).filter(m=>m.stage===l.stage && !m.kind).map(m=>m.date).sort().pop(); return e || l.createdAt || todayISO(); }
function b2bRobotCond(r){
  const c = [];
  if(r.cSource) c.push(`источник «${r.cSource}»`); if(r.cTag) c.push(`тег #${r.cTag}`);
  if(r.cDir) c.push(r.cDir==='in'?'входящая':'исходящая'); if(Number(r.cMin)>0) c.push(`прогноз от ${Number(r.cMin).toLocaleString('ru-RU')} ₽`);
  return c.length ? ` (только если: ${c.join(', ')})` : '';
}
function b2bRobotAction(r){
  const act = r.action || 'task';
  if(act==='owner'){ const who = r.ownerTo==='leader' ? 'Руководителя' : (r.ownerTo==='onshift' || !r.ownerTo) ? 'менеджера, который сегодня на смене' : empName(r.ownerTo); return `назначить ответственным ${who}`; }
  if(act==='tag') return `поставить тег #${r.tagText}`;
  if(act==='field'){ const f = b2bFields().find(x=>x.id===r.fieldId); return `заполнить поле «${f?f.label:'?'}» значением «${r.fieldValue}»`; }
  const who = r.to==='leader' ? 'Руководителю' : 'ответственному менеджеру';
  const unit = r.offsetUnit==='h' ? 'ч.' : 'дн.';
  return `поставить задачу «${r.text}» ${who}${Number(r.offset)?` со сроком через ${r.offset} ${unit}`:' на ближайший рабочий день'}`;
}
function b2bRobotText(r){
  const when = r.trigger==='stuck' ? `Если заявка на этапе «${B2B_STAGES[r.stage]}» уже ${r.days} дн.` : `Когда заявка переходит на этап «${B2B_STAGES[r.stage]}»`;
  return `${when}${b2bRobotCond(r)} → ${b2bRobotAction(r)}`;
}
function b2bRobotMatches(r, l){
  if(r.cSource && String(l.source||'').trim().toLowerCase()!==String(r.cSource).trim().toLowerCase()) return false;
  if(r.cTag && !(l.tags||[]).includes(r.cTag)) return false;
  if(r.cDir && (l.direction||'in')!==r.cDir) return false;
  if(Number(r.cMin)>0 && (Number(l.forecast)||0) < Number(r.cMin)) return false;
  return true;
}
// применяет сценарии к данным d; dry=true — только посчитать, сколько действий выполнилось бы
function b2bApplyRobots(d, dry){
  // несколько проходов: действие одного сценария (например, тег) может включить условие другого
  let total = 0;
  for(let i=0;i<3;i++){ const k = b2bApplyRobotsOnce(d, dry); total += k; if(!k || dry) break; }
  return total;
}
function b2bApplyRobotsOnce(d, dry){
  const robots = (Array.isArray(d.robots)?d.robots:B2B_ROBOT_DEFAULTS).filter(r=>r.enabled);
  const today = todayISO(); let n = 0;
  const leader = state.employees.find(e=>e.role==='Руководитель');
  const leads = d.leads.map(l=>{
    let cur = l;
    // автозакрытие: задачи сценария закрываются, когда заявка ушла с этапа (или закрыта)
    const open0 = b2bIsOpen(cur);
    if((cur.tasks||[]).some(t=>t.robot && !t.done && (!open0 || (t.fromStage && t.fromStage!==cur.stage)))){
      n++;
      if(!dry) cur = {...cur, tasks:cur.tasks.map(t=> (t.robot && !t.done && (!open0 || (t.fromStage && t.fromStage!==cur.stage))) ? {...t, done:true, doneAt:today, auto:true} : t)};
    }
    if(!open0) return cur;
    robots.forEach(r=>{
      if(r.stage!==cur.stage) return;
      if(!b2bRobotMatches(r, cur)) return;
      const ent = b2bStageEntered(cur), key = `${r.id}|${cur.stage}|${ent}`;
      if((cur.fired||[]).includes(key)) return;
      if(r.trigger==='stuck'){ if(isoDiff(today,ent) < (Number(r.days)||0)) return; }
      else if(ent < (r.since||'0000-00-00')) return;
      n++; if(dry) return;
      const fired = (cur.fired||[]).concat([key]);
      const act = r.action || 'task';
      const logIt = txt => (cur.log||[]).concat([{date:today, ts:Date.now(), stage:null, note:`🤖 ${r.name||'Автосценарий'}: ${txt}`, by:null}]);
      if(act==='owner'){
        const to = r.ownerTo==='leader' ? (leader?leader.id:cur.managerId) : (r.ownerTo==='onshift'||!r.ownerTo) ? (b2bPickManager(today)||cur.managerId) : r.ownerTo;
        cur = {...cur, fired, managerId:to, log:logIt(`ответственный → ${to?empName(to):'не назначен'}`)};
      } else if(act==='tag'){
        cur = {...cur, fired, tags:[...new Set((cur.tags||[]).concat([r.tagText]))], log:logIt(`тег #${r.tagText}`)};
      } else if(act==='field'){
        const f = b2bFields().find(x=>x.id===r.fieldId);
        cur = {...cur, fired, custom:{...(cur.custom||{}), [r.fieldId]: (f&&f.type==='number') ? (Number(r.fieldValue)||0) : r.fieldValue}, log:logIt(`поле «${f?f.label:'?'}» = ${r.fieldValue}`)};
      } else {
        const to = r.to==='leader' ? (leader?leader.id:'') : cur.managerId;
        let deadline, time = '';
        if(r.offsetUnit==='h'){ const dt = new Date(Date.now() + (Number(r.offset)||0)*3600000); deadline = isoOf(dt); time = String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0'); }
        else deadline = b2bNextWork(to||cur.managerId, isoAdd(today, Number(r.offset)||0), true);
        cur = {...cur, fired, tasks:(cur.tasks||[]).concat([{id:uid(), type:r.type||'other', text:r.text, deadline, time, managerId:to||'', done:false, robot:r.id, fromStage:cur.stage}]),
          log:logIt(`задача «${r.text}» до ${fmtDate(deadline)}${time?' '+time:''}`)};
      }
    });
    return cur;
  });
  if(!dry) d.leads = leads;
  return n;
}
function b2bMaybeRunRobots(){
  const st = state.b2bState;
  if(!state.b2b || st.robotsRunning || Date.now()-(st.robotsAt||0) < 300000) return;
  if(b2bApplyRobots(state.b2b, true) === 0){ st.robotsAt = Date.now(); return; }
  st.robotsAt = Date.now(); st.robotsRunning = true;
  mutateB2B(d=> b2bApplyRobots(d,false) ? d : null, {skipRobots:true}).then(ok=>{ st.robotsRunning=false; if(ok) render(); });
}

// ---------- дубли клиентов ----------
function b2bPhoneKey(p){ const dg = String(p||'').replace(/\D/g,''); return dg.length>=10 ? dg.slice(-10) : ''; }
function b2bFindDupClient(name, phone, exceptId){
  const pk = b2bPhoneKey(phone), nm = String(name||'').trim().toLowerCase();
  return (state.b2b?state.b2b.clients:[]).find(c=> c.id!==exceptId && ((pk && b2bPhoneKey(c.phone)===pk) || (nm && String(c.name||'').trim().toLowerCase()===nm)));
}
function b2bDupGroups(){
  const cl = state.b2b.clients, parent = cl.map((_,i)=>i);
  const find = i=>{ while(parent[i]!==i){ parent[i]=parent[parent[i]]; i=parent[i]; } return i; };
  const seen = {};
  cl.forEach((c,i)=>{ [b2bPhoneKey(c.phone)&&'p'+b2bPhoneKey(c.phone), String(c.name||'').trim().toLowerCase()&&'n'+String(c.name).trim().toLowerCase()].filter(Boolean).forEach(k=>{
    if(seen[k]===undefined) seen[k]=i; else parent[find(i)] = find(seen[k]); }); });
  const groups = {}; cl.forEach((c,i)=>{ (groups[find(i)] = groups[find(i)]||[]).push(c); });
  return Object.values(groups).filter(g=>g.length>1);
}
function openB2bDupsModal(){
  const groups = b2bDupGroups();
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay"><div class="modal" style="max-width:640px;width:96vw;"><h3>🔍 Дубли клиентов</h3>
    <div class="subtitle" style="margin-bottom:8px;">Считаются дублями клиенты с одинаковым телефоном (по последним 10 цифрам) или одинаковым названием. При объединении все заявки переходят к одному клиенту, пустые поля дозаполняются.</div>
    ${groups.length ? groups.map((g,i)=>`<div style="border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;margin:6px 0;">
      ${g.map(c=>`<div style="font-size:13.5px;"><strong>${escapeHtml(c.name)}</strong> <span class="subtitle">${escapeHtml([c.phone,c.person].filter(Boolean).join(' · '))} · заявок: ${state.b2b.leads.filter(l=>l.clientId===c.id).length}</span></div>`).join('')}
      ${b2bLeader()?`<button class="btn small" data-dup-merge="${i}" style="margin-top:6px;">Объединить в «${escapeHtml(g[0].name)}»</button>`:''}</div>`).join('') : '<div class="empty" style="padding:16px;text-align:center;">Дублей не найдено 👍</div>'}
    <div class="modal-actions"><button class="btn ghost" id="dpClose">Закрыть</button></div></div></div>`;
  document.getElementById('dpClose').onclick = closeModal;
  root.querySelectorAll('[data-dup-merge]').forEach(b=>b.onclick = async ()=>{
    const g = groups[+b.dataset.dupMerge]; const keep = g.slice().sort((a,b2)=>state.b2b.leads.filter(l=>l.clientId===b2.id).length - state.b2b.leads.filter(l=>l.clientId===a.id).length)[0];
    const drop = g.filter(c=>c.id!==keep.id).map(c=>c.id);
    if(!await showConfirm(`Объединить ${g.length} карточки в «${keep.name}»? Заявки перейдут к ней.`, 'Объединить')) return;
    const ok = await mutateB2B(d=>{
      const k = d.clients.find(c=>c.id===keep.id);
      d.clients.filter(c=>drop.includes(c.id)).forEach(c=>{ Object.keys(c).forEach(f=>{ if(f!=='id' && f!=='createdAt' && !k[f] && c[f]) k[f]=c[f]; }); });
      d.leads = d.leads.map(l=> drop.includes(l.clientId) ? {...l, clientId:keep.id} : l);
      d.clients = d.clients.filter(c=>!drop.includes(c.id));
      return d; });
    if(ok){ toast('Клиенты объединены'); openB2bDupsModal(); render(); }
  });
}

    <div id="bkDelete" class="subtitle" style="display:none;color:var(--brick);">Заявки будут удалены безвозвратно, клиенты в базе останутся.</div>
    <div class="modal-actions"><button class="btn ghost" id="bkCancel">Отмена</button><button class="btn" id="bkGo">Применить</button></div></div></div>`;
  const $ = id=>document.getElementById(id);
  const show = ()=>{ ['transfer','tag','pipe','lost','delete'].forEach(k=>{ $('bk'+k[0].toUpperCase()+k.slice(1)).style.display = $('bkAct').value===k ? '' : 'none'; }); };
  $('bkAct').onchange = show; show();
  $('bkReason').onchange = ()=>{ $('bkReasonText').style.display = $('bkReason').value==='other' ? '' : 'none'; };
  $('bkCancel').onclick = closeModal;
  $('bkGo').onclick = async ()=>{
    const act = $('bkAct').value, today = todayISO(), set = new Set(ids);
    let note = '', fn = null, sync = false;
    if(act==='transfer'){ const to=$('bkTo').value, wt=$('bkTasks').checked; sync=true;
      fn = l=>({...l, managerId:to, tasks: wt ? (l.tasks||[]).map(t=>t.done?t:{...t,managerId:to}) : l.tasks, log:(l.log||[]).concat([b2bTransferLog(l.managerId,to,'массово')])}); }
    else if(act==='tag'){ const tg=$('bkTagIn').value.trim().replace(/^#/,''); if(!tg){ toast('Введите тег'); return; }
      fn = l=>({...l, tags:[...new Set((l.tags||[]).concat([tg]))], log:(l.log||[]).concat([b2bLogEntry(null,'Добавлен тег #'+tg)])}); }
    else if(act==='pipe'){ const pid=$('bkPipeSel').value; fn = l=>({...l, pipelineId:pid, log:(l.log||[]).concat([b2bLogEntry(null,'Перенесена в воронку «'+b2bPipeName(pid)+'»')])}); }
    else if(act==='lost'){ const rid=$('bkReason').value, rt=$('bkReasonText').value.trim();
      if(!rid){ toast('Выберите причину отказа'); return; } if(rid==='other' && !rt){ toast('Для «Другое» напишите причину'); return; } sync=true;
      fn = l=>{ if(!b2bIsOpen(l)) return l; const n={...l, prevStage:l.stage, stage:'lost', doneAt:today, deadline:'', lostReasonId:rid, lostReason:rt}; n.log=(l.log||[]).concat([b2bLogEntry('lost','Отказ: '+b2bReasonLabel(n)+' (массово)')]); return n; }; }
    else if(act==='delete'){ if(!await showConfirm(`Удалить заявок: ${ids.length}?`, 'Удалить')) return; sync=true; }
    const ok = await mutateB2B(d=>{ if(act==='delete') d.leads = d.leads.filter(l=>!set.has(l.id)); else d.leads = d.leads.map(l=> set.has(l.id) ? fn({...l}) : l); return d; });
    if(ok){ if(sync){ for(const id of ids) await b2bSyncEvent(id); }
      logAudit('b2b_bulk', `Массовое действие «${act}»: ${ids.length}`); state.b2bState.sel.clear(); closeModal(); toast('Готово'); render(); }
  };
}

// ---------- Telegram: переписка с клиентом в карточке заявки ----------
async function b2bTgStatus(force){
  const st = state.b2bState;
  if(st.tg && !force && Date.now()-st.tg.at < 60000) return st.tg;
  try{
    const r = await fetch('/api/integrations/telegram/status', {credentials:'include'});
    const j = await r.json().catch(()=>({}));
    st.tg = r.ok ? {...j, at:Date.now()} : {connected:false, denied:true, at:Date.now()};
  }catch(e){ st.tg = {connected:false, offline:true, at:Date.now()}; }
  return st.tg;
}
function b2bChatHTML(l, c){
  const msgs = l.msgs||[];
  const hasChat = !!(c.tg && c.tg.chatId);
  const tg = state.b2bState.tg;
  const bubble = m=>`<div style="display:flex;justify-content:${m.dir==='out'?'flex-end':'flex-start'};margin:3px 0;"><div style="max-width:82%;padding:6px 9px;border-radius:10px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;background:${m.dir==='out'?'var(--teal-bg,#e3f1ee)':'var(--paper,#faf8f3)'};border:1px solid var(--paper-line);">${escapeHtml(m.text||'')}<div class="subtitle" style="font-size:11px;margin-top:2px;">${escapeHtml(m.dir==='out'?(m.by?empName(m.by):'студия'):(m.from||'клиент'))} · ${fmtDate(new Date(m.ts).toISOString().slice(0,10))} ${new Date(m.ts).toTimeString().slice(0,5)}</div></div></div>`;
  if(!msgs.length && !hasChat && !(tg&&tg.connected)) return '';
  return `<div style="margin-bottom:14px;"><strong>💬 Переписка (Telegram)</strong>
    <div id="b2kChat" style="max-height:230px;overflow-y:auto;margin:6px 0;padding:4px;border:1px solid var(--paper-line);border-radius:8px;">${msgs.length?msgs.map(bubble).join(''):'<div class="subtitle" style="font-size:12.5px;padding:4px;">Сообщений пока нет</div>'}</div>
    ${hasChat ? `<div style="display:flex;gap:4px;"><textarea id="b2kMsg" rows="2" placeholder="Ответ клиенту в Telegram…" style="flex:1;"></textarea><button class="btn small" id="b2kSendMsg">Отправить</button></div>`
      : `<div class="subtitle" style="font-size:12.5px;">Клиент ещё не писал боту. Отправьте ему ссылку — после нажатия «Запустить» переписка привяжется к этой заявке. <button class="btn ghost small" id="b2kTgLink">Скопировать ссылку</button></div>`}</div>`;
}
function b2bWireChat(leadId, l, c, reopen){
  const chat = document.getElementById('b2kChat'); if(chat) chat.scrollTop = chat.scrollHeight;
  if(l.unread){ b2bUpdateLead(leadId, n=>({...n, unread:0})); }
  if(!state.b2bState.tg) b2bTgStatus().then(t=>{ if(t.connected && document.getElementById('modalRoot').querySelector('#b2kClose') && !document.getElementById('b2kChat')) reopen(); });
  const send = document.getElementById('b2kSendMsg');
  if(send) send.onclick = async ()=>{
    const ta = document.getElementById('b2kMsg'); const text = ta.value.trim(); if(!text){ toast('Напишите сообщение'); return; }
    send.disabled = true;
    try{
      const r = await fetch('/api/integrations/telegram/send', {method:'POST', credentials:'include', headers:{'content-type':'application/json'}, body:JSON.stringify({leadId, text})});
      const j = await r.json().catch(()=>({}));
      if(!r.ok){ toast('⚠️ '+(j.error||'Не удалось отправить')); send.disabled=false; return; }
    }catch(e){ toast('⚠️ Нет связи с сервером'); send.disabled=false; return; }
    await loadB2B(true); reopen();
  };
  const lk = document.getElementById('b2kTgLink');
  if(lk) lk.onclick = async ()=>{
    const t = await b2bTgStatus(true);
    if(!t.connected || !t.username){ toast('Сначала подключите Telegram: ⚙ Настройки → 💬 Мессенджеры'); return; }
    const url = `https://t.me/${t.username}?start=L_${leadId}`;
    try{ await navigator.clipboard.writeText(url); toast('Ссылка скопирована'); }catch(e){ prompt('Скопируйте ссылку:', url); }
  };
}

  const maxMin = Math.max(1, ...rows.map(r=>r.totalMin));

  const noEndCount = new Set(rows.flatMap(r=>r.list.filter(e=>eventDurationMin(e)===null).map(e=>e.id))).size;
  const MODES = {week:'Неделя', month:'Месяц', quarter:'Квартал', year:'Год'};

    return `

        ${open ? `<div style="margin-top:8px;border-top:1px solid var(--line,#ddd);padding-top:6px;">

            <span>${fmtDate(e.date)} ${e.startTime?escapeHtml(e.startTime)+(e.endTime?'–'+escapeHtml(e.endTime):''):''} · ${escapeHtml(e.title||'')} <span class="subtitle">(${escapeHtml(PURPOSE_LABELS[purposeKey(e)])}${e.purpose==='other'&&e.purposeText?': '+escapeHtml(e.purposeText):''})</span></span>

    if(st.cats[c]!==false && !othersOn){ toast('Должна остаться выбрана хотя бы одна категория'); return; }
    st.cats[c] = st.cats[c]===false ? true : false; render();
  });
  document.getElementById('anPrev').onclick=()=>{ st.anchor=shiftAnalyticsAnchor(st.mode, st.anchor, -1); st.openEmp=null; render(); };
  document.getElementById('anNext').onclick=()=>{ st.anchor=shiftAnalyticsAnchor(st.mode, st.anchor, 1); st.openEmp=null; render(); };
  document.getElementById('anNow').onclick=()=>{ st.anchor=todayISO(); st.openEmp=null; render(); };
  document.getElementById('anPast').onchange=(ev)=>{ st.pastOnly=ev.target.checked; render(); };
  root.querySelectorAll('[data-an-emp]').forEach(el=>el.onclick=()=>{ st.openEmp = st.openEmp===el.dataset.anEmp ? null : el.dataset.anEmp; render(); });
  document.getElementById('anCsv').onclick=()=>{

    rows.forEach(r=>lines.push([r.emp.name, r.emp.role||'', r.count].concat(MEETING_CATS.map(k=>r.by[k]), [r.totalMin, (r.totalMin/60).toFixed(2).replace('.',','), r.unknown]).map(csvEscape).join(';')));
    downloadTextFile(`vstrechi-${range.from}_${range.to}.csv`, 'text/csv;charset=utf-8', '﻿'+lines.join('\n'));
  };
}

function renderFunds(root){
  const scope = state.fundsScope;
  let scoped;
  if(scope==='all'){
    scoped = state.fundsEntries.slice().concat(state.personalFundsEntries.slice());
  } else {
    scoped = fundsFor(scope).slice();
  }
  const sorted = scoped.sort((a,b)=> a.date===b.date ? a.createdAt-b.createdAt : a.date.localeCompare(b.date));
  let running = 0;
  const rows = sorted.map(f=>{
    running += (f.type==='issue' ? Number(f.amount) : -Number(f.amount));
    return {...f, runningBalance: running};
  });
  const totalIncome = sorted.filter(f=>f.type==='issue').reduce((s,f)=>s+Number(f.amount),0);
  const totalExpense = sorted.filter(f=>f.type==='expense').reduce((s,f)=>s+Number(f.amount),0);
  const balance = totalIncome - totalExpense;
  const showScopeCol = scope==='all';

  root.innerHTML = `
    <div class="row-between">
      <div>
        <h2 class="section-title">Финансы</h2>
        <p class="subtitle">Доходы и расходы — отдельно рабочие и личные</p>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" id="exportCsvBtn">📊 Экспорт CSV</button>
        <button class="btn" id="addFundBtn">+ Запись</button>
      </div>
    </div>
    <div class="subtabs">
      <button class="subtab-btn ${scope==='work'?'active':''}" data-fscope="work">Рабочие</button>
      <button class="subtab-btn ${scope==='personal'?'active':''}" data-fscope="personal">🔒 Личные</button>
      <button class="subtab-btn ${scope==='all'?'active':''}" data-fscope="all">Всего</button>
    </div>
    <div class="ledger-summary">
      <div class="sum-card issued"><div class="label">Доходы</div><div class="val mono">${fmtMoney(totalIncome)}</div></div>
      <div class="sum-card spent"><div class="label">Расходы</div><div class="val mono">${fmtMoney(totalExpense)}</div></div>
      <div class="sum-card balance"><div class="label">${showScopeCol?'Общий остаток':'Текущий остаток'}</div><div class="val mono">${fmtMoney(balance)}</div></div>
    </div>
    <div class="ledger">
      <table class="ledger-table">
        <thead><tr><th>Дата</th><th>Тип</th>${showScopeCol?'<th>Категория</th>':''}<th>Сумма</th><th>Назначение</th><th>Чек</th><th>Остаток</th><th></th></tr></thead>
        <tbody>
          ${rows.length ? rows.slice().reverse().map(f=>`
            <tr>
              <td class="mono">${fmtDate(f.date)}</td>
              <td>${f.type==='issue'?'Доход':'Расход'}</td>
              ${showScopeCol?`<td>${(f.scope||'work')==='personal'?'🔒 Личные':'Рабочие'}</td>`:''}
              <td class="${f.type==='issue'?'amt-issue':'amt-expense'}">${f.type==='issue'?'+':'−'}${fmtMoney(f.amount)}</td>
              <td>${escapeHtml(f.purpose||'')}${f.comment?`<div class="desc" style="margin-top:2px;">${escapeHtml(f.comment)}</div>`:''}</td>
              <td>${f.receiptUrl?`<a href="${escapeHtml(f.receiptUrl)}" target="_blank" rel="noopener" style="color:var(--indigo);">🧾 Чек</a>`:'—'}</td>
              <td class="amt-balance">${fmtMoney(f.runningBalance)}</td>
              <td>
                <div class="ledger-actions">
                  <button class="btn ghost small" data-edit-fund="${f.id}" data-fund-scope="${f.scope||'work'}">Изм.</button>
                  <button class="btn danger small" data-del-fund="${f.id}" data-fund-scope="${f.scope||'work'}">✕</button>
                </div>
              </td>
            </tr>
          `).join('') : `<tr><td colspan="${showScopeCol?8:7}"><div class="empty-state"><div class="big">Записей пока нет</div><p>Добавьте первый доход или расход</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  root.querySelectorAll('.subtab-btn').forEach(b=>b.onclick=()=>{ state.fundsScope=b.dataset.fscope; render(); });
  root.querySelector('#addFundBtn').onclick=()=>openFundModal(null, scope==='all'?'work':scope);
  root.querySelector('#exportCsvBtn').onclick=()=>exportFundsCSV(scope);
  root.querySelectorAll('[data-edit-fund]').forEach(b=>b.onclick=()=>openFundModal(b.dataset.editFund, b.dataset.fundScope));
  root.querySelectorAll('[data-del-fund]').forEach(b=>b.onclick=async ()=>{
    if(!(await showConfirm('Удалить запись?'))) return;
    const fscope = b.dataset.fundScope;
    await refreshFundsFromServer(fscope);
    const doomed = fundsFor(fscope).find(f=>f.id===b.dataset.delFund);
    if(doomed) await moveToTrash(fscope==='personal', 'fund', doomed);
    async function saveFundDeletion(){
      await refreshFundsFromServer(fscope);
      const before = fundsFor(fscope);
      setFundsFor(fscope, before.filter(f=>f.id!==b.dataset.delFund));
      const ok = await persistFundsFor(fscope);
      if(!ok){ setFundsFor(fscope, before); saveFailedToast(saveFundDeletion); return; }
      render();
    }
    await saveFundDeletion();
  });
}

function openFundModal(id, scope){
  scope = scope || 'work';
  const existing = id ? fundsFor(scope).find(f=>f.id===id) : null;
  if(existing) scope = existing.scope || 'work';
  const initialType = existing ? existing.type : 'expense';
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal">
        <h3>${existing?'Изменить запись':'Новая запись'} · ${scope==='personal'?'🔒 личная':'рабочая'}</h3>
        <div class="field-row">
          <div class="field"><label>Тип</label>
            <select id="fn_type">
              <option value="issue" ${initialType==='issue'?'selected':''}>Доход</option>
              <option value="expense" ${initialType==='expense'?'selected':''}>Расход</option>
            </select>
          </div>
          <div class="field"><label>Дата</label><input type="date" id="fn_date" value="${existing?existing.date:todayISO()}"></div>
          <div class="field"><label>Сумма, ₽</label><input type="number" min="0" step="0.01" class="mono" id="fn_amount" value="${existing?existing.amount:''}"></div>
        </div>
        <div class="field"><label>Назначение</label><input id="fn_purpose" value="${existing?escapeHtml(existing.purpose||''):''}" placeholder="Например: закупка глины"></div>
        <div class="field" id="fn_receipt_wrap" style="${initialType==='expense'?'':'display:none;'}">
          <label>Ссылка на чек</label>
          <input id="fn_receipt" value="${existing?escapeHtml(existing.receiptUrl||''):''}" placeholder="https://...">
        </div>
        <div class="field"><label>Комментарий</label><textarea id="fn_comment" rows="2">${existing?escapeHtml(existing.comment||''):''}</textarea></div>
        <div class="modal-actions">
          <button class="btn ghost" id="cancelFund">Отмена</button>
          <button class="btn" id="saveFund">Сохранить</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelFund').onclick=closeModal;
  document.getElementById('ov').onclick=(ev)=>{ if(ev.target.id==='ov') closeModal(); };
  document.getElementById('fn_type').onchange=(e)=>{
    document.getElementById('fn_receipt_wrap').style.display = e.target.value==='expense' ? '' : 'none';
  };
  document.getElementById('saveFund').onclick=async function retry(){
    const amount = parseFloat(document.getElementById('fn_amount').value);
    if(!amount || amount<=0){ toast('Укажите сумму'); return; }
    const type = document.getElementById('fn_type').value;
    const data = {
      id: existing?existing.id:uid(),
      type,
      scope,
      date: document.getElementById('fn_date').value || todayISO(),
      amount,
      purpose: document.getElementById('fn_purpose').value.trim(),
      receiptUrl: type==='expense' ? document.getElementById('fn_receipt').value.trim() : '',
      comment: document.getElementById('fn_comment').value.trim(),
      createdAt: existing?existing.createdAt:Date.now(),
    };
    await refreshFundsFromServer(scope);
    const before = fundsFor(scope);
    if(existing) setFundsFor(scope, before.map(f=>f.id===existing.id?data:f));
    else setFundsFor(scope, before.concat([data]));
    const ok = await persistFundsFor(scope);
    if(!ok){ setFundsFor(scope, before); saveFailedToast(retry); return; }
    closeModal(); render();
    toast('Запись сохранена');
  };
}

// Список задач всей студии для поиска (только чтение). Кэшируется на минуту.
async function loadAllTasksReadonly(){
  const c = state.allTasksReadonly;
  if(c && Date.now()-c.at < 60000) return c.list;
  try{
    const r = await fetch('/api/tasks/search-all', {credentials:'include'});
    if(!r.ok) return c ? c.list : [];
    const j = await r.json();
    state.allTasksReadonly = {at:Date.now(), list:j.tasks||[]};
    return state.allTasksReadonly.list;
  }catch(e){ return c ? c.list : []; }
}

async function openTaskFromSearch(taskId, personal){
  if(personal && !personalAccessAllowed()) return false;
  let t = tasksFor(personal).find(x=>x.id===taskId);
  if(!t && !personal){
    // Чужая задача из общего поиска — открываем для просмотра.
    const ro = (state.allTasksReadonly ? state.allTasksReadonly.list : []).find(x=>x.id===taskId);
    if(ro){ openTaskViewModal(ro); return false; }
  }
  if(!t) return false;
  if(!canEditTask(t, personal)){ if(!personal){ openTaskViewModal(t); return false; } toast(whyCantEdit(t)); return false; }
  state.tab='tasks'; state.taskSubtab = personal?'personal':'work';
  render();
  setTimeout(()=>openTaskModal(taskId, personal), 50);
  return true;
}
function performGlobalSearch(query){
  const q = query.trim().toLowerCase();
  if(q.length<2) return null;
  const match = (s)=> s && String(s).toLowerCase().includes(q);
  const allTasks = state.tasksWork.map(t=>({...t, __personal:false}))
    .concat(personalAccessAllowed() ? state.personalTasks.map(t=>({...t, __personal:true})) : []);
  // К задачам, доступным мне по оргструктуре, добавляем задачи всей студии «только для просмотра»
  // (без переписки и отчётов исполнителей).
  const knownIds = new Set(allTasks.map(t=>t.id));
  const roTasks = (state.allTasksReadonly ? state.allTasksReadonly.list : []).filter(t=>!knownIds.has(t.id)).map(t=>({...t, __personal:false, __ro:true}));
  const tasks = allTasks.concat(roTasks).filter(t=> match(t.title) || match(t.description) || match(t.purchaseStore) || (t.__ro && match(empName(t.assigneeId)))).slice(0,12);

  const allEvents = allVisibleEvents().map(e=>({...e, __personal: isPersonalEvent(e.id)}));
  const events = allEvents.filter(e=> match(e.title) || match(e.notes) || match(e.location)).slice(0,8);

  const allFunds = hasRole('Руководитель','Ассистент')
    ? state.fundsEntries.map(f=>({...f, __personal:false})).concat(personalAccessAllowed() ? state.personalFundsEntries.map(f=>({...f, __personal:true})) : [])
    : [];
  const funds = allFunds.filter(f=> match(f.purpose) || match(f.comment)).slice(0,8);

  const allProjects = state.projectsWork.map(p=>({...p, __personal:false}))
    .concat(personalAccessAllowed() ? state.personalProjects.map(p=>({...p, __personal:true})) : []);
  const projects = allProjects.filter(p=> match(p.name)).slice(0,8);

  const ideas = state.ideaBankWork.filter(i=> match(i.name)).slice(0,8);

  return {tasks, events, funds, projects, ideas};
}
function openSearchModal(){
  const ov = document.createElement('div');
  ov.className='overlay'; ov.style.zIndex=150;
  ov.innerHTML = `
    <div class="modal" style="max-width:560px;">
      <h3>Поиск по всему приложению</h3>
      <input type="text" id="globalSearchInput" placeholder="Задача, проект, событие, расход..." autocomplete="off">
      <div id="globalSearchResults" style="margin-top:16px;max-height:55vh;overflow-y:auto;"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="closeSearch">Закрыть</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const finish=()=>ov.remove();
  ov.querySelector('#closeSearch').onclick=finish;
  ov.onclick=(e)=>{ if(e.target===ov) finish(); };
  const input = ov.querySelector('#globalSearchInput');
  const resultsEl = ov.querySelector('#globalSearchResults');
  setTimeout(()=>input.focus(),0);
  loadAllTasksReadonly().then(()=>{ if(input.value.trim().length>=2) renderResults(); });

  function renderResults(){
    const q = input.value;
    if(q.trim().length<2){
      resultsEl.innerHTML = `<p class="subtitle" style="margin:0;">Введите минимум 2 символа</p>`;
      return;
    }
    const res = performGlobalSearch(q);
    const totalCount = res.tasks.length+res.events.length+res.funds.length+res.projects.length+res.ideas.length;
    if(!totalCount){
      resultsEl.innerHTML = `<div class="empty-state"><div class="big">Ничего не найдено</div></div>`;
      return;
    }
    let html = '';
    if(res.tasks.length){
      html += `<div class="search-cat-label">Задачи</div><div class="item-list" style="margin-bottom:8px;">`;
      html += res.tasks.map(t=>`
        <div class="item" style="cursor:pointer;" data-sr-task="${t.id}" data-sr-personal="${t.__personal?'1':'0'}">
          <div class="main"><div class="title">${t.__personal?'🔒 ':''}${escapeHtml(t.title)}</div>
          <div class="meta"><span class="badge ${t.status||'progress'}">${STATUSES[t.status]||''}</span>${t.assigneeId?`<span>${escapeHtml(empName(t.assigneeId))}</span>`:''}${t.deadline?`<span>до ${fmtDeadline(t)}</span>`:''}${t.__ro?'<span>👁 просмотр</span>':''}</div></div>
        </div>`).join('');
      html += `</div>`;
    }
    if(res.events.length){
      html += `<div class="search-cat-label">Календарь</div><div class="item-list" style="margin-bottom:8px;">`;
      html += res.events.map(e=>`
        <div class="item" style="cursor:pointer;" data-sr-day="${e.date}">
          <div class="main"><div class="title">${e.__personal?'🔒 ':''}${escapeHtml(e.title)}</div>
          <div class="meta"><span>${catLabel(e.category)}</span><span>${fmtDate(e.date)}</span></div></div>
        </div>`).join('');
      html += `</div>`;
    }
    if(res.funds.length){
      html += `<div class="search-cat-label">Финансы</div><div class="item-list" style="margin-bottom:8px;">`;
      html += res.funds.map(f=>`
        <div class="item" style="cursor:pointer;" data-sr-fund="${f.id}" data-sr-fund-scope="${f.__personal?'personal':'work'}">
          <div class="main"><div class="title">${f.__personal?'🔒 ':''}${escapeHtml(f.purpose||(f.type==='issue'?'Доход':'Расход'))}</div>
          <div class="meta"><span class="${f.type==='issue'?'amt-issue':'amt-expense'}">${f.type==='issue'?'+':'−'}${fmtMoney(f.amount)}</span><span>${fmtDate(f.date)}</span></div></div>
        </div>`).join('');
      html += `</div>`;
    }

      html += `<div class="search-cat-label">Проекты</div><div class="item-list" style="margin-bottom:8px;">`;
      html += res.projects.map(p=>`
        <div class="item" style="cursor:pointer;" data-sr-project="${p.id}" data-sr-project-personal="${p.__personal?'1':'0'}">
          <div class="main"><div class="title">${p.__personal?'🔒 ':''}${escapeHtml(p.name)}</div></div>
        </div>`).join('');
      html += `</div>`;
    }
    if(res.ideas.length){
      html += `<div class="search-cat-label">Банк идей-проектов</div><div class="item-list" style="margin-bottom:8px;">`;
      html += res.ideas.map(i=>`
        <div class="item" style="cursor:pointer;" data-sr-idea="${i.id}">
          <div class="main"><div class="title">${escapeHtml(i.name)}</div><div class="meta"><span>${(i.tasks||[]).length} задач(и) в плане</span></div></div>
        </div>`).join('');
      html += `</div>`;
    }
    resultsEl.innerHTML = html;

    resultsEl.querySelectorAll('[data-sr-task]').forEach(row=>row.onclick=async ()=>{
      const ok = await openTaskFromSearch(row.dataset.srTask, row.dataset.srPersonal==='1');
      if(ok) finish();
    });
    resultsEl.querySelectorAll('[data-sr-day]').forEach(row=>row.onclick=()=>{
      finish();
      state.tab='calendar'; render();
      setTimeout(()=>openDayModal(row.dataset.srDay), 50);
    });
    resultsEl.querySelectorAll('[data-sr-fund]').forEach(row=>row.onclick=()=>{
      finish();
      const fscope = row.dataset.srFundScope;
      state.fundsScope = fscope; state.tab='funds'; render();
      setTimeout(()=>openFundModal(row.dataset.srFund, fscope), 50);
    });
    resultsEl.querySelectorAll('[data-sr-project]').forEach(row=>row.onclick=()=>{
      finish();
      const personal = row.dataset.srProjectPersonal==='1';
      const key = personal?'personal':'work';
      state.tab='tasks'; state.taskSubtab = key;
      state.taskFilterProjectIds[key] = new Set([row.dataset.srProject]);
      state.taskFilterNoProject[key] = false;
      state.taskFilterBlockId[key] = null;
      render();
    });
    resultsEl.querySelectorAll('[data-sr-idea]').forEach(row=>row.onclick=()=>{
      finish();
      state.tab='tasks'; state.taskSubtab='work'; render();
      setTimeout(()=>openProjectsModal(false), 50);
    });
  }
  input.oninput = renderResults;
  input.onkeydown = (e)=>{ if(e.key==='Escape') finish(); };
  renderResults();
}

    document.getElementById('exportBtn').onclick=()=>exportAllData();

      try{
        const text = await file.text();

        if(payload.app!=='studio-journal'){ toast('Файл не похож на резервную копию этого приложения'); return; }
        if(!(await showConfirm('Восстановление заменит текущие рабочие данные (задачи, проекты, календарь, финансы, сотрудников). Продолжить?', 'Восстановить'))) return;
        await importAllData(payload);
        modal.innerHTML = body(); wire(); render();
        toast('Данные восстановлены');

    document.getElementById('importProjectsBlocksFile').onchange=async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const text = await file.text();
        const payload = JSON.parse(text);
        if(payload.type!=='studio-journal-blocks-projects'){ toast('Файл не похож на файл блоков и проектов'); return; }
        const result = await importProjectsAndBlocksOnly(payload);
        modal.innerHTML = body(); wire(); render();
        toast(`Добавлено: блоков ${result.addedBlocks}, проектов ${result.addedProjects}${result.skipped?` (пропущено как уже существующие: ${result.skipped})`:''}`);
      }catch(err){
        toast('Не удалось прочитать файл — проверьте, что это корректный файл блоков и проектов');
      }
    };
    document.getElementById('importEventsFile').onchange=async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      let payload;
      try{
        payload = JSON.parse(await file.text());
      }catch(err){
        toast('Не удалось прочитать файл — проверьте, что это корректный файл событий'); return;
      }
      if(payload.type!=='studio-journal-events'){ toast('Файл не похож на файл событий календаря'); return; }
      try{
        const result = await importEventsOnly(payload);
        modal.innerHTML = body(); wire(); render();
        toast(result.added
          ? `Добавлено событий: ${result.added}${result.skipped?` (пропущено как уже существующие: ${result.skipped})`:''}`
          : `Новых событий нет — все ${result.skipped} уже есть в календаре`);
      }catch(err){
        toast('Не удалось сохранить события — ничего не изменено, попробуйте ещё раз');
      }
    };
    modal.querySelectorAll('[data-restore-personal-archive-task]').forEach(b=>b.onclick=async ()=>{
      await restorePersonalArchiveTask(b.dataset.restorePersonalArchiveTask);
      modal.innerHTML = body(); wire(); render();
    });
    modal.querySelectorAll('[data-restore-personal-archive-event]').forEach(b=>b.onclick=async ()=>{
      await restorePersonalArchiveEvent(b.dataset.restorePersonalArchiveEvent);
      modal.innerHTML = body(); wire(); render();
    });
    modal.querySelectorAll('[data-restore-archive-task]').forEach(b=>b.onclick=async ()=>{
      await restoreArchiveTask(b.dataset.restoreArchiveTask);
      modal.innerHTML = body(); wire(); render();
    });
    modal.querySelectorAll('[data-restore-archive-event]').forEach(b=>b.onclick=async ()=>{
      await restoreArchiveEvent(b.dataset.restoreArchiveEvent);
      modal.innerHTML = body(); wire(); render();
    });
    modal.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async ()=>{
      await restoreTrashItem(false, b.dataset.restore);
      modal.innerHTML = body(); wire(); render();
    });
    modal.querySelectorAll('[data-restore-personal]').forEach(b=>b.onclick=async ()=>{
      await restoreTrashItem(true, b.dataset.restorePersonal);
      modal.innerHTML = body(); wire(); render();
    });
    modal.querySelectorAll('[data-download-autobackup]').forEach(b=>b.onclick=async ()=>{
      const key = b.dataset.downloadAutobackup;
      try{
        const raw = await sGet(key, true);
        if(raw===null){ toast('Не удалось скачать — попробуйте ещё раз'); return; }
        const parsed = JSON.parse(raw);
        downloadTextFile(`${key.replace(/:/g,'-')}.json`, 'application/json', JSON.stringify(parsed.data||parsed, null, 2));
      }catch(e){ toast('Не удалось скачать бэкап'); }
    });
    const sendEmailBackupBtn = document.getElementById('sendEmailBackupNow');
    if(sendEmailBackupBtn) sendEmailBackupBtn.onclick=async ()=>{
      emailBackupSending = true;
      modal.innerHTML = body(); wire();
      try{
        const r = await fetch('/api/email-backup/send-now', {method:'POST', credentials:'same-origin'});
        const data = await r.json().catch(()=>({}));
        if(r.ok){ toast('Письмо с резервной копией отправлено'); }
        else{ toast(data.error || 'Не удалось отправить письмо'); }
      }catch(e){ toast('Не удалось отправить письмо'); }
      emailBackupSending = false;
      modal.innerHTML = body(); wire();
    };
  }
  wire();
  if(hasRole('Руководитель','Ассистент')){
    fetch('/api/auto-backups', {credentials:'same-origin'})
      .then(r=>r.ok?r.json():{backups:[],frequentBackups:[]})
      .then(data=>{ autoBackups = data.backups||[]; frequentBackups = data.frequentBackups||[]; modal.innerHTML = body(); wire(); })
      .catch(()=>{ autoBackups = []; frequentBackups = []; modal.innerHTML = body(); wire(); });
    fetch('/api/email-backup/status', {credentials:'same-origin'})
      .then(r=>r.ok?r.json():{enabled:false})
      .then(data=>{ emailBackupStatus = data; modal.innerHTML = body(); wire(); })
      .catch(()=>{ emailBackupStatus = {enabled:false}; modal.innerHTML = body(); wire(); });
  }
}
