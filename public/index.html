    return `
      <div class="overlay" id="ov">
        <div class="modal">
          <h3>Сотрудники</h3>
          <div class="item-list" id="empList" style="margin-bottom:16px;">
            ${state.employees.map(e=>`
              <div class="item">
                <div class="main">
                  <div class="title">${escapeHtml(e.name)}</div>
                  <div class="meta"><span>${escapeHtml(e.role||'')}</span>${pwStatus[e.id]?'<span>🔒 пароль задан</span>':''}</div>
                </div>
                <div class="actions">
                  <button class="btn ghost small" data-view-tasks="${e.id}">Задачи</button>
                  <button class="btn ghost small" data-edit-emp="${e.id}">✎ Изменить</button>
                  <button class="btn ghost small" data-pw-emp="${e.id}">${pwStatus[e.id]?'🔒 Сменить пароль':'🔒 Задать пароль'}</button>
                  <button class="btn danger small" data-del-emp="${e.id}">✕</button>
                </div>
              </div>
            `).join('') || `<p class="subtitle" style="margin:0;">Пока нет сотрудников</p>`}
          </div>
          <div class="field-row">
            <div class="field"><label>Имя</label><input id="emp_name" placeholder="Имя сотрудника"></div>
            <div class="field"><label>Роль</label><input id="emp_role" placeholder="Например: Мастер"></div>
          </div>
          <div class="modal-actions">
            <button class="btn ghost" id="closeStaff">Закрыть</button>
            <button class="btn" id="addEmp">Добавить</button>
          </div>
        </div>
      </div>`;
  }
  modal.innerHTML = body();
  function wire(){
    document.getElementById('closeStaff').onclick=closeModal;
    document.getElementById('ov').onclick=(ev)=>{ if(ev.target.id==='ov') closeModal(); };
    document.getElementById('addEmp').onclick=async function retry(){
      const name = document.getElementById('emp_name').value.trim();
      if(!name){ toast('Введите имя'); return; }
      const role = document.getElementById('emp_role').value.trim();
      await refreshEmployeesFromServer();
      const before = state.employees;
      state.employees = before.concat([{id:uid(), name, role}]);
      const ok = await saveEmployees();
      if(!ok){ state.employees = before; saveFailedToast(retry); return; }
      logAudit('employee_added', `«${name}»${role?` (${role})`:''}`);
      modal.innerHTML = body(); wire(); render();
    };
    modal.querySelectorAll('[data-view-tasks]').forEach(b=>b.onclick=()=>{
      const empId = b.dataset.viewTasks;
      closeModal();
      state.tab='tasks'; state.taskSubtab='work';
      state.taskFilterEmployee=empId;
      state.taskFilterProjectIds.work = new Set();
      state.taskFilterNoProject.work = false;
      state.taskFilterBlockId.work = null;
      render();
    });
    modal.querySelectorAll('[data-edit-emp]').forEach(b=>b.onclick=()=>{
      openEditEmployeeModal(b.dataset.editEmp, ()=>{ modal.innerHTML = body(); wire(); render(); });
    });
    modal.querySelectorAll('[data-pw-emp]').forEach(b=>b.onclick=()=>{
      openEmployeePasswordModal(b.dataset.pwEmp, ()=>{ refreshAndRender(); }, pwStatus[b.dataset.pwEmp]);
    });
    modal.querySelectorAll('[data-del-emp]').forEach(b=>b.onclick=async ()=>{
      if(!(await showConfirm('Удалить сотрудника? Задачи и события останутся, но без привязки к нему. Можно будет вернуть через корзину (🗄️).'))) return;
      await refreshEmployeesFromServer();
      const doomedEmp = state.employees.find(e=>e.id===b.dataset.delEmp);
      if(doomedEmp) await moveToTrash(false, 'employee', doomedEmp);
      async function saveEmpDeletion(){
        await refreshEmployeesFromServer();
        const before = state.employees;
        state.employees = before.filter(e=>e.id!==b.dataset.delEmp);
        const ok = await saveEmployees();
        if(!ok){ state.employees = before; saveFailedToast(saveEmpDeletion); return; }
        if(doomedEmp) logAudit('employee_deleted', `«${doomedEmp.name}»`);
        modal.innerHTML = body(); wire(); render();
      }
      await saveEmpDeletion();
    });
  }
  function refreshAndRender(){
    fetchPublicEmployees().then(({employees})=>{
      pwStatus = {};
      employees.forEach(e=>{ pwStatus[e.id] = e.hasPassword; });
      modal.innerHTML = body(); wire(); render();
    });
  }
  fetchPublicEmployees().then(({employees})=>{
    pwStatus = {};
    employees.forEach(e=>{ pwStatus[e.id] = e.hasPassword; });
    modal.innerHTML = body(); wire();
  });
  wire();
}
function openEditEmployeeModal(empId, onDone){
  const emp = state.employees.find(e=>e.id===empId);
  if(!emp) return;
  const ov = document.createElement('div');
  ov.className='overlay'; ov.style.zIndex=200;
  ov.innerHTML = `
    <div class="modal" style="max-width:380px;">
      <h3>Изменить сотрудника</h3>
      <div class="field"><label>Имя</label><input id="edit_emp_name" value="${escapeHtml(emp.name)}"></div>
      <div class="field"><label>Роль</label><input id="edit_emp_role" value="${escapeHtml(emp.role||'')}"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="editEmpCancel">Отмена</button>
        <button class="btn" id="editEmpSave">Сохранить</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const nameInput = ov.querySelector('#edit_emp_name');
  setTimeout(()=>{ nameInput.focus(); nameInput.select(); }, 0);
  const finish = ()=>ov.remove();
  ov.querySelector('#editEmpCancel').onclick = finish;
  ov.onclick = (e)=>{ if(e.target===ov) finish(); };
  ov.querySelector('#editEmpSave').onclick = async function retry(){
    const name = nameInput.value.trim();
    if(!name){ toast('Введите имя'); return; }
    const role = ov.querySelector('#edit_emp_role').value.trim();
    await refreshEmployeesFromServer();
    const before = state.employees;
    state.employees = before.map(e=>e.id===empId?{...e, name, role}:e);
    const ok = await saveEmployees();
    if(!ok){ state.employees = before; saveFailedToast(retry); return; }
    toast('Сотрудник обновлён');
    finish();
    if(onDone) onDone();
  };
}

/* ---------------- modal helpers ---------------- */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
// Окна создания/редактирования задачи и события нельзя закрыть случайным кликом мимо окна или
// клавишей Esc — сначала спрашиваем «Закрыть?». Кнопка «Отмена» закрывает сразу, без вопроса.
let closeConfirmOpen = false;
async function confirmCloseModal(){
  if(closeConfirmOpen) return;
  closeConfirmOpen = true;
  try{
    if(await showConfirm('Закрыть окно без сохранения?\nВведённые данные пропадут.', 'Закрыть')) closeModal();
  } finally { closeConfirmOpen = false; }
}
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Escape') return;
  if(document.querySelector('body > .overlay')) return; // открыто окно подтверждения — Esc относится к нему
  const guarded = document.querySelector('#modalRoot #ov[data-guard-close]');
  if(guarded){ confirmCloseModal(); return; }
  closeModal();
});

/* ---------------- режим «Семья»: только просмотр календаря Руководителя ---------------- */
function isFamilyRoleName(role){
  const r = String(role||'').trim().toLowerCase();
  return r==='муж' || r==='семья';
}
async function startFamilyApp(){
  // Прячем всё рабочее: вкладки, поиск, напоминания, резервные копии, сотрудников.
  ['searchBtn','bellBtn','dataBtn','staffBtn','tabsNav'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display='none'; });
  const who = document.getElementById('whoAmIBtn');
  if(who){ who.textContent='Выйти'; who.onclick = async ()=>{ try{ await fetch('/api/logout',{method:'POST',credentials:'include'}); }catch(e){} location.reload(); }; }
  const root = document.getElementById('appContent');
  root.innerHTML = `<div class="empty-state"><div class="big">Загрузка…</div></div>`;
  let data = null;
  for(let i=0;i<5 && !data;i++){
    try{
      const r = await fetch('/api/family/calendar', {credentials:'include'});
      if(r.status===401){ location.reload(); return; }
      if(r.ok) data = await r.json(); else await sleep(1500);
    }catch(e){ await sleep(1500); }
  }
  if(!data){ root.innerHTML = `<div class="empty-state"><div class="big">Не удалось загрузить календарь. Обновите страницу.</div></div>`; return; }
  const events = (data.events||[]).slice().sort((a,b)=> a.date===b.date ? (a.startTime||'').localeCompare(b.startTime||'') : a.date.localeCompare(b.date));
  const ownerName = data.owner && data.owner.name ? data.owner.name : 'Календарь';
  const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const now = new Date();
  let year = now.getFullYear(), month = now.getMonth(), selected = null;
  function draw(){
    const first = new Date(year, month, 1);
    const startOffset = (first.getDay()+6)%7;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const pad = n=>String(n).padStart(2,'0');
    const iso = d=>`${year}-${pad(month+1)}-${pad(d)}`;
    const byDay = {};
    events.forEach(e=>{ (byDay[e.date] = byDay[e.date] || []).push(e); });
    let cells = '';
    for(let i=0;i<startOffset;i++) cells += `<div></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const key = iso(d), has = (byDay[key]||[]).length;
      const isToday = key===dateToISO(now), isSel = key===selected;
      cells += `<button data-fday="${key}" style="border:1px solid ${isSel?'var(--ink)':'var(--line,#ddd)'};background:${isToday?'var(--rose-bg,#fde)':'var(--card,#fff)'};border-radius:8px;padding:6px 2px;min-height:44px;cursor:pointer;font:inherit;">
        <div>${d}</div>${has?`<div style="font-size:11px;color:var(--plum,#738);">● ${has}</div>`:''}</button>`;
    }
    const monthPrefix = `${year}-${pad(month+1)}`;
    const list = events.filter(e=> selected ? e.date===selected : e.date.startsWith(monthPrefix));
    root.innerHTML = `
      <div class="row-between"><div>
        <h2 class="section-title">Календарь: ${escapeHtml(ownerName)}</h2>
        <p class="subtitle">Только просмотр</p></div></div>
      <div style="display:flex;gap:8px;align-items:center;margin:12px 0;">
        <button class="btn ghost small" id="famPrev">←</button>
        <strong style="min-width:150px;text-align:center;">${MONTHS[month]} ${year}</strong>
        <button class="btn ghost small" id="famNext">→</button>
        <button class="btn ghost small" id="famToday">Сегодня</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:6px;font-size:12px;color:var(--ink-soft);">${WD.map(w=>`<div>${w}</div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px;">${cells}</div>
      <h3 class="section-title" style="font-size:15px;">${selected ? fmtDate(selected) : 'События месяца'} ${selected?`<button class="btn ghost small" id="famAll" style="margin-left:8px;">показать весь месяц</button>`:''}</h3>
      <div class="item-list">
        ${list.length ? list.map(e=>`
          <div class="item"><div class="main">
            <div class="title">${escapeHtml(e.title||'')}</div>
            <div class="meta"><span>${fmtDate(e.date)}</span>${e.startTime?`<span>${escapeHtml(e.startTime)}${e.endTime?'–'+escapeHtml(e.endTime):''}</span>`:'<span>весь день</span>'}${catLabel(e.category)?`<span>${escapeHtml(catLabel(e.category))}</span>`:''}${e.location?`<span>📍 ${escapeHtml(e.location)}</span>`:''}</div>
            ${e.notes?`<div class="desc">${escapeHtml(e.notes)}</div>`:''}
          </div></div>`).join('') : `<p class="subtitle" style="margin:0;">Событий нет</p>`}
      </div>`;
    document.getElementById('famPrev').onclick=()=>{ month--; if(month<0){month=11;year--;} selected=null; draw(); };
    document.getElementById('famNext').onclick=()=>{ month++; if(month>11){month=0;year++;} selected=null; draw(); };
    document.getElementById('famToday').onclick=()=>{ year=now.getFullYear(); month=now.getMonth(); selected=dateToISO(now); draw(); };
    const all = document.getElementById('famAll'); if(all) all.onclick=()=>{ selected=null; draw(); };
    root.querySelectorAll('[data-fday]').forEach(b=>b.onclick=()=>{ selected = selected===b.dataset.fday ? null : b.dataset.fday; draw(); });
  }
  draw();
}
async function startApp(){
  if(isFamilyRoleName(state.currentUserRole)) return startFamilyApp();
  const loaded = await loadAll();
  if(loaded === false) return; // сессия истекла — handleSessionExpired уже показал вход
  if(!state.taskFilterEmployee && state.currentUserId) state.taskFilterEmployee = state.currentUserId;
  state.knownTaskIds = new Set(state.tasksWork.map(t=>t.id));
  state.knownEventIds = new Set(state.events.map(e=>e.id));
  state.knownApprovedIds = new Set(state.tasksWork.filter(t=>t.approvedAt).map(t=>t.id));
  render();
  if(state.browserNotify && 'Notification' in window && Notification.permission==='granted'){
    checkNotificationsTick();
  }
  if(!state.notifyIntervalSet){
    state.notifyIntervalSet = true;
    setInterval(checkNotificationsTick, 60000);
    setInterval(checkNewTasksTick, 60000);
    setInterval(checkNewEventsTick, 60000);
    setInterval(checkTaskApprovedTick, 60000);
  }
}
(async function init(){
  const emp = await checkSession();
  if(!emp){
    renderLoginScreen();
    return;
  }
  state.currentUserId = emp.id;
  state.currentUserRole = emp.role;
  await startApp();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }
})();

/* ---------- защита от повторных нажатий ----------
   Пока сохранение после нажатия кнопки не завершилось (тост «сохранено» / «не удалось сохранить»),
   повторное нажатие той же кнопки игнорируется — иначе задача/доход/событие создаются дважды. */
(function(){
  const GUARDED = 'button.btn:not(.ghost), button[data-approve-task], button[data-rework-task]';
  const isGuarded = (b)=> b && b.matches(GUARDED) && !(b.classList.contains('small') && b.classList.contains('danger'));
  const netBusy = ()=> pendingSaveCount + readsInFlight > 0;
  let warnedAt = 0;
  document.addEventListener('click', (e)=>{
    const btn = e.target.closest && e.target.closest('button');
    if(!isGuarded(btn)) return;
    if(btn.dataset.busy){
      e.preventDefault(); e.stopImmediatePropagation();
      if(Date.now()-warnedAt>1500){ warnedAt = Date.now(); toast('Подождите — идёт сохранение…'); }
      return;
    }
    btn.dataset.busy = '1';
    btn.classList.add('is-busy');
    const started = Date.now();
    let quiet = 0;
    const timer = setInterval(()=>{
      quiet = netBusy() ? 0 : quiet+1;
      // отпускаем кнопку, когда обмен с сервером завершён (две проверки подряд) и прошло минимум 0.5 с;
      // страховка — не дольше 30 с, чтобы кнопка не «зависла» навсегда
      if((quiet>=2 && Date.now()-started>500) || Date.now()-started>30000){
        clearInterval(timer);
        delete btn.dataset.busy;
        btn.classList.remove('is-busy');
      }
    }, 150);
  }, true);
})();

  const fab = document.getElementById('fabAddTask');

  const visible = state.loaded && !!state.currentUserId && !isFamilyRoleName(state.currentUserRole);
  fab.classList.toggle('show', visible);

  fab.id = 'fabAddTask'; fab.type = 'button'; fab.title = 'Поставить задачу'; fab.setAttribute('aria-label','Добавить задачу');
  fab.textContent = '+ Задача';

  fab.onclick = ()=>{

    const personal = state.tab==='tasks' && state.taskSubtab==='personal';
    if(personal && !personalAccessAllowed()){ toast('Личные задачи доступны только Руководителю и Ассистенту'); return; }

/* ---------- кнопка «наверх» ---------- */
(function(){
  const btn = document.createElement('button');
  btn.id = 'scrollTopBtn'; btn.type = 'button'; btn.title = 'Наверх'; btn.setAttribute('aria-label','Наверх');
  btn.textContent = '↑';
  document.body.appendChild(btn);
  const update = ()=>btn.classList.toggle('show', (window.scrollY || document.documentElement.scrollTop) > 400);
  window.addEventListener('scroll', update, {passive:true});
  btn.onclick = ()=>window.scrollTo({top:0, behavior:'smooth'});
  update();
})();
