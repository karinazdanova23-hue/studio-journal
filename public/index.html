    const weekdaysWrap = document.getElementById('t_weekdays_wrap');
    const untilWrap = document.getElementById('t_repeat_until_wrap');
    document.querySelectorAll('#t_weekdays .cat-chip').forEach(chip=>{
      chip.onclick=()=>chip.classList.toggle('off');
    });
    repeatEl.onchange=(e)=>{
      const val = e.target.value;
      if(val==='none'){ weekdaysWrap.style.display='none'; untilWrap.style.display='none'; return; }
      untilWrap.style.display='';
      if(val==='daily' || val==='weekly'){
        weekdaysWrap.style.display='';
        const startDate = document.getElementById('t_deadline').value || todayISO();
        const startWdRaw = new Date(startDate+'T00:00:00').getDay();
        const startWd = startWdRaw===0?7:startWdRaw;
        document.querySelectorAll('#t_weekdays .cat-chip').forEach(chip=>{
          const wd = parseInt(chip.dataset.wd, 10);
          if(val==='daily') chip.classList.remove('off');
          else chip.classList.toggle('off', wd!==startWd);
        });
      } else {
        weekdaysWrap.style.display='none';
      }
      const untilInput = document.getElementById('t_repeat_until');
      if(!untilInput.value){
        const startDate = document.getElementById('t_deadline').value || todayISO();
        const d = new Date(startDate+'T00:00:00'); d.setMonth(d.getMonth()+3);
        untilInput.value = dateToISO(d);
      }
    };
  }

  const existingEvent = existing && existing.eventId ? state.events.find(x=>x.id===existing.eventId) : null;
  const initialEvCat = existingEvent ? existingEvent.category : '';
  document.getElementById('t_event').value = existing && existing.eventId ? existing.eventId : '';

  function renderEventItems(cat){
    const wrap = document.getElementById('t_event_items');
    if(!cat){ wrap.innerHTML=''; return; }
    if(cat==='personal' && !personalAccessAllowed()){
      wrap.innerHTML = `<span class="subtitle" style="margin:0;">🔒 Доступно только Руководителю и Ассистенту</span>`;
      return;
    }
    const source = cat==='personal' ? state.personalEvents : state.events.filter(canSeeEvent);
    const evs = source.filter(ev=>ev.category===cat).sort((a,b)=>a.date.localeCompare(b.date));
    const currentVal = document.getElementById('t_event').value;
    wrap.innerHTML = evs.length
      ? evs.map(ev=>`<button type="button" class="cat-chip ${currentVal===ev.id?'':'off'}" data-evid="${ev.id}">${fmtDate(ev.date)} · ${escapeHtml(ev.title)}</button>`).join('')
      : `<span class="subtitle" style="margin:0;">Нет мероприятий в этой категории</span>`;
    wrap.querySelectorAll('[data-evid]').forEach(btn=>{
      btn.onclick=()=>{
        document.getElementById('t_event').value = btn.dataset.evid;
        wrap.querySelectorAll('[data-evid]').forEach(b=>b.classList.toggle('off', b!==btn));
        const ev = source.find(x=>x.id===btn.dataset.evid);
        const deadlineInput = document.getElementById('t_deadline');
        if(ev && !deadlineInput.value){
          deadlineInput.value = ev.date;
          deadlineInput.classList.remove('invalid');
        }
      };
    });
  }

  document.querySelectorAll('#t_event_cats .cat-chip').forEach(chip=>{
    chip.classList.toggle('off', chip.dataset.evcat !== initialEvCat);
    chip.onclick=()=>{
      const cat = chip.dataset.evcat;
      document.querySelectorAll('#t_event_cats .cat-chip').forEach(c=>c.classList.toggle('off', c!==chip));
      if(!cat){
        document.getElementById('t_event').value = '';
        document.getElementById('t_event_items').innerHTML = '';
      } else {
        renderEventItems(cat);
      }
    };
  });
  if(initialEvCat) renderEventItems(initialEvCat);

  function projectOptionsForBlock(blockId, selectedId){
    const scoped = blockId ? projects.filter(p=>p.blockId===blockId) : projects;
    const opts = [`<option value="">${!personal?'— выберите проект —':'Без проекта'}</option>`]
      .concat(scoped.map(p=>`<option value="${p.id}" ${selectedId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`));
    return opts.join('');
  }
  const tBlockEl = document.getElementById('t_block');
  const tProjectEl = document.getElementById('t_project');
  if(tBlockEl && tProjectEl){
    tBlockEl.onchange=()=>{
      // Смена блока сужает список проектов до его состава; сохраняем текущий выбор,
      // если выбранный проект всё ещё принадлежит новому блоку (иначе сбрасываем).
      const currentProjId = tProjectEl.value;
      const stillValid = currentProjId && projects.some(p=>p.id===currentProjId && p.blockId===tBlockEl.value);
      tProjectEl.innerHTML = projectOptionsForBlock(tBlockEl.value, stillValid ? currentProjId : null);
      handleProjectSelectPurchases(tProjectEl.value);
    };
    tProjectEl.onchange=()=>{
      // Если проект выбрали напрямую (например, до этого блок не выбирали) — подставляем его блок автоматически.
      const projId = tProjectEl.value;
      if(projId){
        const proj = projects.find(p=>p.id===projId);
        if(proj && proj.blockId && tBlockEl.value!==proj.blockId){
          tBlockEl.value = proj.blockId;
          tProjectEl.innerHTML = projectOptionsForBlock(proj.blockId, projId);
        }
      }
      handleProjectSelectPurchases(tProjectEl.value);
    };
  } else if(tProjectEl){
    // Личные задачи: блока нет, но переключение проекта всё ещё должно обновлять блок «Покупки» (если применимо).
    tProjectEl.onchange=()=>handleProjectSelectPurchases(tProjectEl.value);
  }
  const tNewProjBtn = document.getElementById('t_new_proj_btn');
  if(tNewProjBtn) tNewProjBtn.onclick=async ()=>{
    const blockId = tBlockEl ? tBlockEl.value : '';
    if(!blockId){ toast('Сначала выберите блок — новый проект создастся сразу в нём'); return; }
    const name = await showPrompt('Название нового проекта', '');
    if(name===null || !name.trim()) return;
    async function saveNewInlineProject(){
      await refreshProjectsAndBlocksFromServer();
      const before = state.projectsWork;
      const newProj = {id:uid(), name:name.trim(), blockId};
      state.projectsWork = before.concat([newProj]);
      const ok = await saveProjectsWork();
      if(!ok){ state.projectsWork = before; saveFailedToast(saveNewInlineProject); return; }
      logAudit('project_created', `«${newProj.name}» — блок «${blockName(blockId)}»`);
      notifySelfSaved('✅ Проект создан', newProj.name);
      projects.push(newProj);
      tProjectEl.innerHTML = projectOptionsForBlock(blockId, newProj.id);
    }
    await saveNewInlineProject();
  };

  if(simpleMode){
    const hideField = id=>{ const e=document.getElementById(id); if(!e) return; const f=e.closest('.field')||e; f.style.display='none'; };
    ['t_links_list','t_creator','t_self_assigned','t_in_report','t_createdDate','t_priority','t_mgmt_stage','t_event','t_project'].forEach(hideField);
    const pw = document.getElementById('t_purchase_wrap'); if(pw) pw.style.display='none';
    const cw = document.getElementById('t_completion_wrap'); if(cw) cw.style.display='none';
    const st = document.getElementById('t_status'); if(st) st.addEventListener('change', ()=>{ if(cw) cw.style.display='none'; });
    const dl = document.querySelector('#t_desc'); const dlab = dl && dl.closest('.field') && dl.closest('.field').querySelector('label');
    if(dlab) dlab.textContent = 'Описание (необязательно)';
    // блок: только те, где включены упрощённые задачи (плюс блок самой задачи); проект «Задачи» подставляется сам
    const bsel = document.getElementById('t_block');
    if(bsel){
      const curB = bsel.value;
      const list = simpleBlocks().filter(b=>true);
      if(curB && !list.some(b=>b.id===curB)){ const cb = state.blocksWork.find(b=>b.id===curB); if(cb) list.push(cb); }
      bsel.innerHTML = list.map(b=>`<option value="${b.id}" ${b.id===curB?'selected':''}>📦 ${escapeHtml(b.name)}</option>`).join('');
      const syncSimpleProject = ()=>{
        if(existing && bsel.value===existing.blockId) return;
        const pr = ensureSimpleProject(bsel.value);
        const ps = document.getElementById('t_project');
        if(ps){ ps.innerHTML = `<option value="${pr.id}" selected>${escapeHtml(pr.name)}</option>`; ps.value = pr.id; }
      };
      bsel.addEventListener('change', syncSimpleProject);
      if(!existing) syncSimpleProject();
    }
    const toExt = document.getElementById('toExtended');
    if(toExt) toExt.onclick = ()=>{
      const v = id=>{ const e=document.getElementById(id); return e?e.value:''; };
      if(existing){ closeModal(); openTaskModal(existing.id, personal, null, null, onDone, {extended:true}); return; }
      const o = Object.assign({}, opts, {simple:false, assigneeId:v('t_assignee'), deadline:v('t_deadline'), description:v('t_desc'), blockId:v('t_block')});
      const pr = o.blockId ? simpleProjectOfBlock(o.blockId) : null; if(pr) o.projectId = pr.id;
      const ttl = v('t_title');
      closeModal(); openTaskModal(null, personal, null, ttl, onDone, o);
    };
  }
  const toSimpleBtn = document.getElementById('toSimple');
  if(toSimpleBtn) toSimpleBtn.onclick = ()=>{
    const v = id=>{ const e=document.getElementById(id); return e?e.value:''; };
    const o = Object.assign({}, opts, {simple:true, assigneeId:v('t_assignee'), deadline:v('t_deadline'), description:v('t_desc')});
    const ttl = v('t_title');
    closeModal(); openTaskModal(null, personal, null, ttl, onDone, o);
  };

  function flagInvalid(elId){
    const elm = document.getElementById(elId);
    elm.classList.add('invalid');
    const clear = ()=>elm.classList.remove('invalid');
    elm.addEventListener('input', clear, {once:true});
    elm.addEventListener('change', clear, {once:true});
    return elm;
  }

  const saveTaskBtn = document.getElementById('saveTask');
  if(saveTaskBtn) saveTaskBtn.onclick=async ()=>{
    if(existing && !canEditTask(existing, personal)){ toast(whyCantEdit(existing)); return; }
    const title = document.getElementById('t_title').value.trim();
    const description = document.getElementById('t_desc').value.trim();
    const links = Array.from(document.querySelectorAll('.t-link-input'))
      .map(i=>i.value.trim())
      .filter(Boolean)
      .map(l=>/^https?:\/\//i.test(l) ? l : 'https://'+l);
    const link = links[0] || ''; // держим первое поле в старом виде для совместимости со старым кодом/экспортом
    const creatorId = document.getElementById('t_creator').value;
    const assigneeEl = document.getElementById('t_assignee');
    const assigneeId = assigneeEl ? assigneeEl.value : null;
    const createdDate = document.getElementById('t_createdDate').value;
    const deadline = document.getElementById('t_deadline').value;
    const deadlineTime = document.getElementById('t_deadlineTime').value || '';

    let firstInvalid = null;
    if(!title) firstInvalid = flagInvalid('t_title');
    if(!description && !simpleMode) firstInvalid = firstInvalid || flagInvalid('t_desc');
    if(!creatorId) firstInvalid = firstInvalid || flagInvalid('t_creator');
    if(!personal && !assigneeId) firstInvalid = firstInvalid || flagInvalid('t_assignee');
    if(!createdDate) firstInvalid = firstInvalid || flagInvalid('t_createdDate');
    if(!deadline) firstInvalid = firstInvalid || flagInvalid('t_deadline');
    if(!parentId && !personal){
      const projectEl = document.getElementById('t_project');
      const blockEl = document.getElementById('t_block');
      if(projectEl && !projectEl.value) firstInvalid = firstInvalid || flagInvalid('t_project');
      if(blockEl && !blockEl.value) firstInvalid = firstInvalid || flagInvalid('t_block');
    }
    const statusVal = document.getElementById('t_status').value;
    const completionCommentVal = document.getElementById('t_completion_comment').value.trim();
    if(statusVal==='done' && !completionCommentVal && !simpleMode) firstInvalid = firstInvalid || flagInvalid('t_completion_comment');
    if(firstInvalid){
      toast('Заполните все обязательные поля (отмечены *)');
      firstInvalid.focus();
      return;
    }
    if(deadline < createdDate){
      toast('Дедлайн не может быть раньше даты постановки');
      flagInvalid('t_deadline');
      return;
    }
    if(parentId && parentTask && parentTask.deadline && deadline > parentTask.deadline){
      toast(`Дедлайн подзадачи не может быть позже дедлайна задачи (до ${fmtDeadline(parentTask)})`);
      flagInvalid('t_deadline');
      return;
    }
    if(!parentId && existing){
      const childTasks = tasksFor(personal).filter(c=>c.parentId===existing.id);
      const violatingChild = childTasks.find(c=>c.deadline && c.deadline > deadline);
      if(violatingChild){
        toast(`Дедлайн задачи не может быть раньше дедлайна подзадачи «${violatingChild.title}» (до ${fmtDeadline(violatingChild)})`);
        flagInvalid('t_deadline');
        return;
      }
    }
    if(draftSubs){
      for(const r of draftSubs){
        const eff = r.deadline || deadline;
        if(!r.title.trim()){ toast('У одной из подзадач пустое название — откройте «Редактировать подзадачи»'); return; }
        if(eff > deadline){ toast(`Дедлайн подзадачи «${r.title}» не может быть позже дедлайна главной задачи`); return; }
        if(eff < createdDate){ toast(`Дедлайн подзадачи «${r.title}» не может быть раньше даты постановки`); return; }
      }
    }
    if(statusVal==='done' && (!existing || existing.status!=='done')){
      const effectiveAssignee = personal ? null : assigneeId;
      const wouldBeTask = {assigneeId: effectiveAssignee, id: existing?existing.id:undefined};
      if(!canCompleteTask(wouldBeTask, personal)){
        toast(whyCantComplete(wouldBeTask, personal));
        return;
      }
    }

    if(assigneeId){
      const vi = findVacationInfo(assigneeId, deadline);
      if(vi && vi.inside){
        const rng = `${fmtDate(vi.start)}${vi.end!==vi.start?' — '+fmtDate(vi.end):''}`;
        const choice = await showVacationChoice(
          `У сотрудника «${empName(assigneeId)}» отпуск: ${rng}.\nДедлайн задачи (${fmtDate(deadline)}) попадает на отпуск.\n\nТочно сохранить с этим сроком или перенести дедлайн на первый день после отпуска?`,
          `Перенести дедлайн на ${fmtDate(vi.after)}`, 'Всё равно сохранить');
        if(choice==='move'){
          document.getElementById('t_deadline').value = vi.after;
          toast(`Дедлайн перенесён на ${fmtDate(vi.after)}`);
          return saveTaskBtn.onclick();
        }
        if(choice!=='keep') return;
      } else if(vi){
        const proceed = await showConfirm(`⚠️ ${vi.text} Всё равно поставить задачу с этим сроком?`, 'Всё равно поставить');
        if(!proceed) return;
      }
    }

    const projectId = parentId
      ? (parentTask ? parentTask.projectId : (existing?existing.projectId||null:null))
      : (document.getElementById('t_project').value || null);
    const blockId = parentId
      ? (parentTask ? parentTask.blockId : (existing?existing.blockId||null:null))
      : ((!personal && document.getElementById('t_block')) ? (document.getElementById('t_block').value || null) : (existing ? (existing.blockId||null) : null));
    const chosenStatus = statusVal;
    const completedAt = chosenStatus==='done'
      ? (existing && existing.status==='done' ? existing.completedAt : todayISO())
      : null;
    const data = {
      id: existing?existing.id:uid(),
      title,
      description,
      link,
      links,
      projectId,
      blockId,
      parentId: parentId||null,
      assigneeId: assigneeId || null,
      creatorId,
      createdDate,
      deadline,
      deadlineTime,
      priority: document.getElementById('t_priority').value,
      managementStage: document.getElementById('t_mgmt_stage') ? (document.getElementById('t_mgmt_stage').value || null) : (existing ? (existing.managementStage||null) : null),
      status: chosenStatus,
      completedAt,
      completionComment: chosenStatus==='done' ? completionCommentVal : '',
      completionLink: existing ? (existing.completionLink||'') : '',
      eventId: document.getElementById('t_event').value || null,
      purchaseAmount: document.getElementById('t_purchase_amount').value ? parseFloat(document.getElementById('t_purchase_amount').value) : null,
      purchaseStore: document.getElementById('t_purchase_store').value.trim(),
      purchaseExpenseId: existing ? (existing.purchaseExpenseId||null) : null,
      seriesId: existing ? (existing.seriesId||null) : null,
      // Если дедлайн перенесён — старая причина задержки больше не актуальна, потребуется новая при следующей просрочке.
      overdueReason: (existing && existing.deadline===deadline) ? (existing.overdueReason||'') : '',
      reworkNote: existing ? (existing.reworkNote||'') : '',
      approvedAt: existing ? (existing.approvedAt||null) : null,
      approvedBy: existing ? (existing.approvedBy||null) : null,
      comments: existing ? (existing.comments||[]) : [],
      sortOrder: existing ? (existing.sortOrder||0) : 0,
      selfAssigned: document.getElementById('t_self_assigned') ? document.getElementById('t_self_assigned').checked : !!(existing && existing.selfAssigned),
      fromChecklist: existing ? !!existing.fromChecklist : !!draftSubs,
      b2bLeadId: existing ? existing.b2bLeadId : undefined,
      b2bKey: existing ? existing.b2bKey : undefined,
      simple: existing ? !!existing.simple : simpleMode,
      inReport: document.getElementById('t_in_report') ? document.getElementById('t_in_report').checked : !!(existing && existing.inReport),
    };

    // Список задач — общий, и его сохраняют вперемешку с разных устройств/вкладок. Подтягиваем
    // самую свежую версию прямо перед записью, иначе форма, которая давно была открыта (например,
    // на телефоне), при сохранении затирает всё, что успели сохранить другие с тех пор.
    await refreshTasksFromServer(personal);

    if(!existing && repeatEl && repeatEl.value!=='none'){
      const repeatType = repeatEl.value;
      const untilVal = document.getElementById('t_repeat_until').value || deadline;
      const weekdaySet = new Set(Array.from(document.querySelectorAll('#t_weekdays .cat-chip:not(.off)')).map(c=>parseInt(c.dataset.wd,10)));
      let dates = generateRecurrenceDates(deadline, repeatType, weekdaySet, untilVal, 300);
      if(!dates.length) dates = [deadline];
      const seriesId = uid();
      const newTasks = dates.map(d=>({...data, id: uid()+d, deadline: d, seriesId}));
      async function saveRepeatingTasks(){
        await refreshTasksFromServer(personal);
        const arr = tasksFor(personal);
        setTasksFor(personal, arr.concat(newTasks));
        const ok = await persistTasksFor(personal);
        if(!ok){ setTasksFor(personal, arr); saveFailedToast(saveRepeatingTasks); return; }
        closeModal(); render();
        toast(`Добавлено задач: ${newTasks.length}`);
        if(onDone) onDone();
      }
      await saveRepeatingTasks();
      return;
    }

    if(existing && existing.seriesId){
      const choice = await showSeriesEditChoice();
      if(!choice) return;
      async function saveSeriesTaskEdit(){
        // Пока был открыт выбор «одну / всю серию», кто-то другой мог успеть сохранить свои
        // изменения — подтягиваем ещё раз перед самой записью.
        await refreshTasksFromServer(personal);
        const before = tasksFor(personal);
        if(choice==='one'){
          setTasksFor(personal, before.map(t=>t.id===existing.id?data:t));
        } else {
          setTasksFor(personal, before.map(t=>{
            if(t.seriesId===existing.seriesId){
              return {...data, id:t.id, deadline:t.deadline, status:t.status, completedAt:t.completedAt, completionComment:t.completionComment, completionLink:t.completionLink, createdDate:t.createdDate, parentId:t.parentId, seriesId:t.seriesId, purchaseExpenseId:t.purchaseExpenseId, b2bLeadId:t.b2bLeadId, b2bKey:t.b2bKey};
            }
            return t;
          }));
        }
        const ok = await persistTasksFor(personal);
        if(!ok){ setTasksFor(personal, before); saveFailedToast(saveSeriesTaskEdit); return; }
        if(chosenStatus==='done' && existing.status!=='done'){
          await maybeOfferPurchaseExpense(data, personal);
        }
        closeModal(); render();
        toast(choice==='series' ? 'Изменения применены ко всей серии' : 'Задача сохранена');
      }
      await saveSeriesTaskEdit();
      return;
    }

    async function saveTaskMain(){
      await refreshTasksFromServer(personal);
      const arr = tasksFor(personal);
      const beforeTasks = arr;
      let toSave = existing ? arr.map(t=>t.id===existing.id?data:t) : arr.concat([data]);
      if(draftSubs && !existing){
        // Пустые поля подзадачи = как у главной: исполнитель, дедлайн (и время).
        toSave = toSave.concat(draftSubs.map((r,i)=>({
          id: uid()+i, title: r.title.trim(), description: (r.description||'').trim() || '—', link:'', links:[],
          projectId: data.projectId, blockId: data.blockId, parentId: data.id,
          assigneeId: r.assigneeId || data.assigneeId, creatorId: data.creatorId, createdDate: data.createdDate,
          deadline: r.deadline || data.deadline, deadlineTime: r.deadline ? (r.deadlineTime||'') : (r.deadlineTime || data.deadlineTime || ''),
          priority: data.priority, managementStage: null, status: 'progress', completedAt: null, completionComment: '', completionLink: '',
          eventId: data.eventId, purchaseAmount: null, purchaseStore: '', purchaseExpenseId: null, seriesId: null,
          overdueReason: '', reworkNote: '', approvedAt: null, approvedBy: null, comments: [], sortOrder: i, selfAssigned: data.selfAssigned, fromChecklist: true, inReport: data.inReport,
        })));
      }
      // Если у самой задачи (не подзадачи) поменялся проект или блок — подтягиваем все подзадачи следом.
      if(existing && !data.parentId && (existing.projectId!==data.projectId || existing.blockId!==data.blockId)){
        function collectDescendantIds(rootId, list){
          let ids=[];
          list.filter(t=>t.parentId===rootId).forEach(c=>{ ids.push(c.id); ids = ids.concat(collectDescendantIds(c.id, list)); });
          return ids;
        }
        const descendantIds = collectDescendantIds(data.id, toSave);
        if(descendantIds.length){
          toSave = toSave.map(t=>descendantIds.includes(t.id) ? {...t, projectId:data.projectId, blockId:data.blockId} : t);
        }
      }
      setTasksFor(personal, toSave);
      const ok = await persistTasksFor(personal);
      if(!ok){ setTasksFor(personal, beforeTasks); saveFailedToast(saveTaskMain); return; }
      if(!existing){
        if(!personal) logAudit('task_created', `«${data.title}»${data.assigneeId?` для ${empName(data.assigneeId)}`:''}${draftSubs?` (из чек-листа, подзадач: ${draftSubs.length})`:''}`);
      } else if(existing.deadline !== data.deadline){
        if(!personal) logAudit('deadline_changed', `«${data.title}»: ${existing.deadline?fmtDeadline(existing):'—'} → ${data.deadline?fmtDeadline(data):'—'}`);
      }
      if(chosenStatus==='done' && (!existing || existing.status!=='done')){
        await maybeOfferPurchaseExpense(data, personal);
      }
      if(draftSubs){
        state.taskSubtab = 'work';
        state.taskFilterProjectIds.work = new Set();
        state.taskFilterNoProject.work = false;
      }
      closeModal(); render();
      toast(draftSubs ? `Задача создана с подзадачами: ${draftSubs.length}` : 'Задача сохранена');
      if(!existing){
        notifySelfSaved('✅ Задача создана', data.title);
        if(onDone) onDone(data.id);
      }
    }
    await saveTaskMain();
  };
}

// Редактор подзадач: список подзадач с полями «название, описание, исполнитель, дедлайн, время».
// cfg.mainValues — функция, отдающая текущие значения главной задачи (для режима «пусто = как у главной»);
// null — режим редактирования уже сохранённых подзадач (там все поля обязательны).
function openSubtasksEditor(cfg){
  const inherit = !!cfg.mainValues;
  const employees = state.employees.filter(e=>!cfg.personal || e.role==='Руководитель' || e.role==='Ассистент');
  let rows = cfg.rows.map(r=>({...r}));
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.style.zIndex = 210;
  document.body.appendChild(ov);
  function hint(){
    if(!inherit) return '';
    const m = cfg.mainValues();
    const who = m.assigneeId ? empName(m.assigneeId) : 'не выбран';
    return `<p class="subtitle" style="margin:0 0 10px;">Пустые поля подзадачи берутся из главной задачи: исполнитель — ${escapeHtml(who)}, дедлайн — ${m.deadline?escapeHtml(fmtDate(m.deadline))+(m.deadlineTime?', '+escapeHtml(m.deadlineTime):''):'пока не указан'}. Описание по умолчанию — «—».</p>`;
  }
  function rowHtml(r, i){
    const dis = r.readonly ? 'disabled' : '';
    return `<div class="item" data-sub-row="${i}" style="display:block;margin-bottom:10px;">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
        <span class="subtitle" style="margin:0;">${i+1}.</span>
        <input class="sub-title" value="${escapeHtml(r.title)}" placeholder="Название подзадачи" style="flex:1;" ${dis}>
        ${cfg.allowAdd && !r.readonly ? `<button type="button" class="btn danger small" data-sub-remove="${i}" title="Убрать подзадачу">✕</button>` : ''}
      </div>
      <textarea class="sub-desc" rows="2" placeholder="Описание" ${dis}>${escapeHtml(r.description||'')}</textarea>
      <div class="field-row" style="margin-top:6px;">
        <div class="field"><label>Исполнитель</label>
          <select class="sub-assignee" ${dis}>
            <option value="">${inherit?'— как у главной задачи —':'— выберите —'}</option>
            ${employees.map(e=>`<option value="${e.id}" ${r.assigneeId===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Дедлайн${inherit?' (пусто — как у главной)':''}</label><input type="date" class="sub-deadline" value="${escapeHtml(r.deadline||'')}" ${dis}></div>
        <div class="field"><label>Время</label><input type="time" class="sub-time" value="${escapeHtml(r.deadlineTime||'')}" ${dis}></div>
      </div>
    </div>`;
  }
  function collect(){
    ov.querySelectorAll('[data-sub-row]').forEach(el=>{
      const i = +el.dataset.subRow;
      if(!rows[i] || rows[i].readonly) return;
      rows[i].title = el.querySelector('.sub-title').value;
      rows[i].description = el.querySelector('.sub-desc').value;
      rows[i].assigneeId = el.querySelector('.sub-assignee').value;
      rows[i].deadline = el.querySelector('.sub-deadline').value;
      rows[i].deadlineTime = el.querySelector('.sub-time').value;
    });
  }
  function draw(){
    ov.innerHTML = `<div class="modal" style="max-width:640px;">
      <div class="modal-topbar">
        <h3>${escapeHtml(cfg.heading)}</h3>
        <div class="modal-topbar-btns">
          ${cfg.allowAdd && !cfg.readonly ? '<button type="button" class="btn ghost" id="subAdd">+ Создать подзадачу</button>' : ''}
          ${!cfg.allowAdd && cfg.parentTask && canEditTask(cfg.parentTask, cfg.personal) ? '<button type="button" class="btn ghost" id="subCreate">+ Создать подзадачу</button>' : ''}
          <button class="btn ghost" id="subCancel">Отмена</button>
          ${cfg.readonly ? '' : '<button class="btn" id="subDone">Сохранить</button>'}
        </div>
      </div>
      ${hint()}
      <div id="subRows">${rows.map(rowHtml).join('') || '<p class="subtitle">Подзадач нет</p>'}</div>
    </div>`;
    const createNew = ov.querySelector('#subCreate');
    if(createNew) createNew.onclick=()=>{ ov.remove(); closeModal(); openTaskModal(null, cfg.personal, cfg.parentTask.id); };
    ov.querySelectorAll('[data-sub-remove]').forEach(b=>b.onclick=()=>{ collect(); rows.splice(+b.dataset.subRemove,1); draw(); });
    const add = ov.querySelector('#subAdd');
    if(add) add.onclick=()=>{ collect(); rows.push({key:'n'+Date.now(), title:'', description:'—', assigneeId:'', deadline:'', deadlineTime:''}); draw(); };
    ov.querySelector('#subCancel').onclick=()=>ov.remove();
    const done = ov.querySelector('#subDone');
    if(done) done.onclick=async ()=>{
      collect();
      if(rows.some(r=>!r.readonly && !r.title.trim())){ toast('У каждой подзадачи должно быть название'); return; }
      const ok = await cfg.onSave(rows.filter(r=>r.readonly || true));
      if(ok){ ov.remove(); }
    };
  }
  draw();
}
// Сохранение правок уже существующих подзадач (из окна «Редактировать подзадачи»).
async function saveExistingSubtasks(personal, parent, rows){
  for(const r of rows){
    if(r.readonly) continue;
    if(!r.description.trim()){ toast(`У подзадачи «${r.title}» не заполнено описание`); return false; }
    if(!personal && !r.assigneeId){ toast(`У подзадачи «${r.title}» не выбран исполнитель`); return false; }
    if(!r.deadline){ toast(`У подзадачи «${r.title}» не указан дедлайн`); return false; }
    if(parent.deadline && r.deadline > parent.deadline){ toast(`Дедлайн подзадачи «${r.title}» не может быть позже дедлайна задачи (до ${fmtDeadline(parent)})`); return false; }
    const orig = tasksFor(personal).find(t=>t.id===r.key);
    if(orig && orig.createdDate && r.deadline < orig.createdDate){ toast(`Дедлайн подзадачи «${r.title}» не может быть раньше даты постановки`); return false; }
  }
  await refreshTasksFromServer(personal);
  const before = tasksFor(personal);
  const changes = [];
  const updated = before.map(t=>{
    const r = rows.find(x=>x.key===t.id && !x.readonly);
    if(!r) return t;
    const next = {...t, title:r.title.trim(), description:r.description.trim(), assigneeId:r.assigneeId||null, deadline:r.deadline, deadlineTime:r.deadlineTime||'',
      overdueReason: t.deadline===r.deadline ? (t.overdueReason||'') : ''};
    if(t.deadline!==next.deadline || (t.deadlineTime||'')!==next.deadlineTime) changes.push(`«${next.title}»: ${t.deadline?fmtDeadline(t):'—'} → ${fmtDeadline(next)}`);
    return next;
  });
  setTasksFor(personal, updated);
  const ok = await persistTasksFor(personal);
  if(!ok){ setTasksFor(personal, before); saveFailedToast(()=>saveExistingSubtasks(personal, parent, rows)); return false; }
  if(!personal) changes.forEach(c=>logAudit('deadline_changed', c));
  toast('Подзадачи сохранены');
  render();
  return true;
}

          <button class="btn ghost small" id="addBlockBtn">+ Добавить блок</button>
        </div>
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:0 0 12px;cursor:pointer;">

        </label>
        <button class="btn ghost small" id="syncBlocksBtn" style="${canDeleteProject?'':'opacity:.4;'}" ${canDeleteProject?'':'disabled'} title="${canDeleteProject?'Привести существующие задачи в соответствие: если у задачи есть проект без блока — подставить блок этого проекта; подзадачи подтянуть за родителем':'Доступно только Руководителю и Ассистенту'}">🔄 Обновить блоки/проекты у существующих задач</button>
      </div>
    `;
    // Сколько задач внутри проекта и сколько из них выполнено (подзадачи считаются)
    const projTaskCounts = {};
    tasksFor(personal).forEach(t=>{
      if(!t.projectId) return;
      const c = projTaskCounts[t.projectId] || (projTaskCounts[t.projectId] = {total:0, done:0});
      c.total++; if(t.status==='done') c.done++;
    });
    const taskWord = n => { const a=n%10, b=n%100; return (a===1&&b!==11)?'задача':(a>=2&&a<=4&&(b<10||b>=20))?'задачи':'задач'; };
    function projectRow(p){
      const c = projTaskCounts[p.id] || {total:0, done:0};
      return `
        <div class="item" style="display:block;">
          <div class="title" style="font-weight:600;font-size:14.5px;overflow-wrap:break-word;word-break:normal;">${escapeHtml(p.name)}</div>
          <div class="subtitle" style="font-size:12px;margin:2px 0 8px;">${c.total} ${taskWord(c.total)}, ${c.done} выполнено</div>

            ${!personal ? `
              <select data-proj-block="${p.id}" style="width:auto;max-width:190px;flex:0 1 190px;padding:5px 8px;font-size:12.5px;">

            <button class="btn ghost small" data-arch-proj="${p.id}" title="${p.archived?'Вернуть из архива':'Отправить в архив'}">${p.archived?'↩ Из архива':'📥 В архив'}</button>

            <button class="btn danger small" data-del-proj="${p.id}" style="${canDeleteProject?'':'opacity:.4;'}" title="${canDeleteProject?'Удалить':'Удалять проекты может только Руководитель или Ассистент'}">✕</button>
          </div>
        </div>
      `;
    }
    const projectsListHtml = personal ? projects.map(projectRow).join('') || `<p class="subtitle" style="margin:0;">Проектов пока нет</p>` : (() => {
      let html = '';
      state.blocksWork.forEach(b=>{
        const inBlock = projectsInBlock(b.id);
        if(!inBlock.length) return;
        html += `<div class="subtitle" style="font-weight:700;margin:10px 0 4px;color:var(--rose);">📦 ${escapeHtml(b.name)}</div>`;
        html += inBlock.map(projectRow).join('');
      });
      const noBlock = projectsWithoutBlock();
      if(noBlock.length){
        if(state.blocksWork.length) html += `<div class="subtitle" style="font-weight:700;margin:10px 0 4px;">Без блока</div>`;
        html += noBlock.map(projectRow).join('');
      }
      return html || `<p class="subtitle" style="margin:0;">Проектов пока нет</p>`;
    })();
    return `
      <div class="overlay" id="ov">
        <div class="modal">
          <h3>Проекты${personal?' (личные)':''}</h3>
          ${blockSection}
          <div class="item-list" style="margin-bottom:16px;">
            ${projectsListHtml}
          </div>
          <div class="field-row">
            <div class="field" style="flex:2;"><label>Название нового проекта</label><input id="proj_name" placeholder="Например: Запуск нового курса"></div>
            ${!personal?`
            <div class="field"><label>Блок *</label>
              <select id="proj_block">
                <option value="">— выберите блок —</option>
                ${state.blocksWork.map(b=>`<option value="${b.id}" ${quickBlockId===b.id?'selected':''}>📦 ${escapeHtml(b.name)}</option>`).join('')}
              </select>
            </div>`:''}
          </div>
          <div class="modal-actions">
            <button class="btn ghost" id="closeProj">Закрыть</button>
            <button class="btn" id="addProj">Добавить</button>
          </div>
          ${!personal?`
          <h4 style="font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:20px 0 8px;">Банк идей-проектов</h4>
          <p class="subtitle" style="margin:0 0 10px;">Копилка идей на будущее — своих типовых проектов с набором задач. Выберите идею, чтобы превратить её в проект.</p>
          <div class="item-list" style="margin-bottom:12px;">
            ${state.ideaBankWork.map(idea=>`
              <div class="item">
                <div class="main">
                  <div class="title">${escapeHtml(idea.name)}</div>
                  <div class="meta"><span>${(idea.tasks||[]).length} задач(и) в плане</span></div>
                </div>
                <div class="actions">
                  <button class="btn ghost small" data-apply-idea="${idea.id}">Создать проект</button>
                  <button class="btn ghost small" data-edit-idea="${idea.id}">✎</button>
                  <button class="btn danger small" data-del-idea="${idea.id}">✕</button>
                </div>
              </div>
            `).join('') || `<p class="subtitle" style="margin:0;">Идей пока нет — добавьте первую</p>`}
          </div>
          <button class="btn ghost small" id="addIdeaBtn">+ Добавить идею</button>

  function wire(){
    document.getElementById('closeProj').onclick=closeModal;
    document.getElementById('ov').onclick=(ev)=>{ if(ev.target.id==='ov') closeModal(); };
    document.getElementById('addProj').onclick=async function retry(){
      const name = document.getElementById('proj_name').value.trim();
      if(!name){ toast('Введите название'); return; }
      await refreshProjectsAndBlocksFromServer(personal);
      let blockIdForProj = null;
      if(!personal){
        const blockEl = document.getElementById('proj_block');
        blockIdForProj = blockEl ? blockEl.value : '';
        if(!blockIdForProj){
          toast(state.blocksWork.length ? 'Выберите блок для проекта' : 'Сначала создайте блок — без него нельзя добавить проект');
          return;
        }
      }
      const before = projectsFor(personal);
      const newProj = {id:uid(), name, blockId: blockIdForProj || null};
      setProjectsFor(personal, before.concat([newProj]));
      const ok = await persistProjectsFor(personal);
      if(!ok){ setProjectsFor(personal, before); saveFailedToast(retry); return; }
      if(!personal) logAudit('project_created', `«${name}»${blockIdForProj?` — блок «${blockName(blockIdForProj)}»`:''}`);
      notifySelfSaved('✅ Проект создан', name);
      quickBlockId = null;
      modal.innerHTML = body(); wire(); render();
    };
    modal.querySelectorAll('[data-quick-add-proj]').forEach(b=>b.onclick=()=>{
      quickBlockId = b.dataset.quickAddProj;
      modal.innerHTML = body(); wire();
      const nameInput = document.getElementById('proj_name');
      if(nameInput){ nameInput.focus(); if(nameInput.scrollIntoView) nameInput.scrollIntoView({block:'center'}); }
    });
    const addBlockBtn = document.getElementById('addBlockBtn');

      const before = state.blocksWork;
      const simple = !!(document.getElementById('block_simple') && document.getElementById('block_simple').checked);
      const newBlock = {id:uid(), name};
      if(simple) newBlock.simpleTasks = true;
      state.blocksWork = before.concat([newBlock]);
      const ok = await saveBlocksWork();
      if(!ok){ state.blocksWork = before; saveFailedToast(retry); return; }
      if(simple){
        ensureSimpleProject(newBlock.id);
        await saveProjectsWork();
        logAudit('block_simple_on', `«${name}»`);
      }
      modal.innerHTML = body(); wire(); render();
    };
    modal.querySelectorAll('[data-simple-block]').forEach(b=>b.onclick=async function retry(){
      const bid = b.dataset.simpleBlock;
      await refreshProjectsAndBlocksFromServer();
      const cur = state.blocksWork.find(x=>x.id===bid); if(!cur) return;
      const to = !cur.simpleTasks;
      const before = state.blocksWork;
      state.blocksWork = before.map(x=>x.id===bid ? {...x, simpleTasks:to} : x);
      const ok = await saveBlocksWork();
      if(!ok){ state.blocksWork = before; saveFailedToast(retry); return; }
      if(to){ ensureSimpleProject(bid); await saveProjectsWork(); }
      logAudit(to?'block_simple_on':'block_simple_off', `«${cur.name}»`);
      toast(to ? 'Упрощённые задачи включены — проект «Задачи» создан' : 'Упрощённые задачи выключены (старые задачи остались)');
      modal.innerHTML = body(); wire(); render();
    });
    const syncBlocksBtn = document.getElementById('syncBlocksBtn');
    if(syncBlocksBtn) syncBlocksBtn.onclick=async ()=>{
      if(!hasRole('Руководитель','Ассистент')){ toast('Доступно только Руководителю и Ассистенту'); return; }
      if(!(await showConfirm('Проставить блок по проекту (где есть проект, но нет блока) и подтянуть проект/блок подзадачам от родителя — для всех существующих задач разом?', 'Обновить'))) return;
      async function runSync(){
        const result = await syncTaskBlocksAndProjects();
        if(result===null){ saveFailedToast(runSync); return; }
        toast(result.changed ? `Обновлено задач: ${result.changed}` : 'Обновлять было нечего — всё уже согласовано');
        modal.innerHTML = body(); wire(); render();
      }
      await runSync();
    };
    modal.querySelectorAll('[data-arch-block]').forEach(b=>b.onclick=async ()=>{
      const bid = b.dataset.archBlock;
      const cur = state.blocksWork.find(x=>x.id===bid);
      const to = !(cur && cur.archived);
      if(to && !(await showConfirm('Отправить блок в архив? Он пропадёт из активных, вернуть можно в любой момент.', 'В архив'))) return;
      if(await setBlockArchived(bid, to)){ modal.innerHTML = body(); wire(); render(); }
    });
    modal.querySelectorAll('[data-arch-proj]').forEach(b=>b.onclick=async ()=>{
      const pid = b.dataset.archProj;
      const cur = projectsFor(personal).find(x=>x.id===pid);
      const to = !(cur && cur.archived);
      if(to && !(await showConfirm('Отправить проект в архив? Он пропадёт из активных, вернуть можно в любой момент.', 'В архив'))) return;
      if(await setProjectArchived(personal, pid, to)){ modal.innerHTML = body(); wire(); render(); }
    });
    modal.querySelectorAll('[data-rename-block]').forEach(b=>b.onclick=async ()=>{
      const bid = b.dataset.renameBlock;
      const current = state.blocksWork.find(x=>x.id===bid);
      const newName = await showPrompt('Название блока', current?current.name:'');
      if(newName===null || !newName) return;
      async function saveRename(){
        await refreshProjectsAndBlocksFromServer();
        const before = state.blocksWork;
        state.blocksWork = before.map(x=>x.id===bid?{...x,name:newName}:x);
        const ok = await saveBlocksWork();
        if(!ok){ state.blocksWork = before; saveFailedToast(saveRename); return; }
        modal.innerHTML = body(); wire(); render();
      }
      await saveRename();
    });
    modal.querySelectorAll('[data-del-block]').forEach(b=>b.onclick=async ()=>{
      if(!canDeleteProject){ toast('Удалять блоки может только Руководитель или Ассистент'); return; }
      if(!(await showConfirm('Удалить блок? Проекты внутри останутся, но станут «без блока».'))) return;
      async function saveBlockDeletion(){
        await refreshProjectsAndBlocksFromServer();
        const bid = b.dataset.delBlock;
        const doomedBlock = state.blocksWork.find(x=>x.id===bid);
        const beforeBlocks = state.blocksWork;
        const beforeProjects = state.projectsWork;
        state.blocksWork = beforeBlocks.filter(x=>x.id!==bid);
        state.projectsWork = beforeProjects.map(p=>p.blockId===bid?{...p,blockId:null}:p);
        const ok1 = await saveBlocksWork();
        const ok2 = await saveProjectsWork();
        if(!ok1 || !ok2){ state.blocksWork = beforeBlocks; state.projectsWork = beforeProjects; saveFailedToast(saveBlockDeletion); return; }
        if(doomedBlock) logAudit('block_deleted', `«${doomedBlock.name}»`);
        modal.innerHTML = body(); wire(); render();
      }
      await saveBlockDeletion();
    });
    modal.querySelectorAll('[data-proj-block]').forEach(sel=>sel.onchange=async function retry(){
      const pid = sel.dataset.projBlock;
      const newBlockId = sel.value || null;
      await refreshProjectsAndBlocksFromServer();
      const before = state.projectsWork;
      state.projectsWork = before.map(p=>p.id===pid?{...p,blockId:newBlockId}:p);
      const ok = await saveProjectsWork();
      if(!ok){ state.projectsWork = before; saveFailedToast(retry); sel.value = before.find(p=>p.id===pid).blockId || ''; return; }
      render();
    });
    modal.querySelectorAll('[data-rename-proj]').forEach(b=>b.onclick=async ()=>{
      const pid = b.dataset.renameProj;
      const current = projectsFor(personal).find(p=>p.id===pid);
      const newName = await showPrompt('Название проекта', current?current.name:'');
      if(newName===null || !newName) return;
      async function saveProjRename(){
        await refreshProjectsAndBlocksFromServer(personal);
        const before = projectsFor(personal);
        const finalName = isPurchasesProjectName(newName) ? PURCHASES_PROJECT_NAME : newName;
        setProjectsFor(personal, before.map(p=>p.id===pid?{...p,name:finalName}:p));
        const ok = await persistProjectsFor(personal);
        if(!ok){ setProjectsFor(personal, before); saveFailedToast(saveProjRename); return; }
        modal.innerHTML = body(); wire(); render();
      }
      await saveProjRename();
    });
    modal.querySelectorAll('[data-del-proj]').forEach(b=>b.onclick=async ()=>{
      if(!canDeleteProject){ toast('Удалять проекты может только Руководитель или Ассистент'); return; }
      if(!(await showConfirm('Удалить проект? Задачи останутся, но будут перемещены в «Без проекта».'))) return;
      await refreshProjectsAndBlocksFromServer(personal);
      await refreshTasksFromServer(personal);
      const pid = b.dataset.delProj;
      const doomedProj = projectsFor(personal).find(p=>p.id===pid);
      if(doomedProj) await moveToTrash(personal, 'project', doomedProj);
      async function saveProjDeletion(){
        const beforeProjects = projectsFor(personal);
        const beforeTasks = tasksFor(personal);
        setProjectsFor(personal, beforeProjects.filter(p=>p.id!==pid));
        setTasksFor(personal, beforeTasks.map(t=>t.projectId===pid?{...t,projectId:null}:t));
        const ok1 = await persistProjectsFor(personal);
        const ok2 = personal ? true : await saveTasksWork();
        if(!ok1 || !ok2){ setProjectsFor(personal, beforeProjects); setTasksFor(personal, beforeTasks); saveFailedToast(saveProjDeletion); return; }
        if(doomedProj && !personal) logAudit('project_deleted', `«${doomedProj.name}»`);
        if(state.taskFilterProjectIds[selKey]) state.taskFilterProjectIds[selKey].delete(pid);
        modal.innerHTML = body(); wire(); render();
      }
      await saveProjDeletion();
    });
    if(!personal){
      const ideaBtn = document.getElementById('addIdeaBtn');
      if(ideaBtn) ideaBtn.onclick=()=>openIdeaModal(null, ()=>{ modal.innerHTML = body(); wire(); });
      modal.querySelectorAll('[data-edit-idea]').forEach(b=>b.onclick=()=>openIdeaModal(b.dataset.editIdea, ()=>{ modal.innerHTML = body(); wire(); }));
      modal.querySelectorAll('[data-del-idea]').forEach(b=>b.onclick=async ()=>{
        if(!(await showConfirm('Удалить идею из банка?'))) return;
        await refreshIdeaBankFromServer();
        const doomedIdea = state.ideaBankWork.find(i=>i.id===b.dataset.delIdea);
        if(doomedIdea) await moveToTrash(false, 'idea', doomedIdea);
        state.ideaBankWork = state.ideaBankWork.filter(i=>i.id!==b.dataset.delIdea);
        await saveIdeaBank();
        modal.innerHTML = body(); wire();
      });
      modal.querySelectorAll('[data-apply-idea]').forEach(b=>b.onclick=async ()=>{
        const idea = state.ideaBankWork.find(i=>i.id===b.dataset.applyIdea);
        if(!idea) return;
        const taskCount = (idea.tasks||[]).length;
        if(!(await showConfirm(`Создать проект «${idea.name}»${taskCount?` с ${taskCount} задачами`:''}?`, 'Создать'))) return;
        await applyIdeaToProject(idea);
        closeModal(); render();
      });
    }
  }
  wire();
}

// Разбор каждого проекта по исполнителям: объём, нагрузка и «эффективность» — кто двигает проект, а кто тормозит.
function computeProjectEmployeeBreakdown(tasks, projects, employees, today){
  const daysBetween = (a,b)=> Math.max(0,(new Date(b)-new Date(a))/86400000);
  return projects.map(p=>{
    const pt = tasks.filter(t=>t.projectId===p.id);
    if(!pt.length) return null;
    const openAll = pt.filter(t=>t.status!=='done');
    const groups = employees.map(e=>({emp:e, ts:pt.filter(t=>t.assigneeId===e.id)}));
    groups.push({emp:null, ts:pt.filter(t=>!t.assigneeId || !employees.some(e=>e.id===t.assigneeId))});
    const rows = groups.filter(g=>g.ts.length).map(g=>{
      const done = g.ts.filter(t=>t.status==='done');
      const open = g.ts.filter(t=>t.status!=='done');
      const review = open.filter(t=>t.status==='review').length;
      // Задачи «на проверке» ждут постановщика, а не исполнителя — просрочкой исполнителя не считаются.
      const overdue = open.filter(t=>t.status!=='review' && t.deadline && t.deadline<today).length;
      const withDl = done.filter(t=>t.deadline && t.completedAt);
      const onTime = withDl.filter(t=>t.completedAt.slice(0,10)<=t.deadline).length;
      const durs = done.filter(t=>t.createdDate && t.completedAt).map(t=>daysBetween(t.createdDate, t.completedAt));
      return {emp:g.emp, total:g.ts.length, done:done.length, open:open.length, review, overdue,
        onTimePct: withDl.length ? Math.round(onTime/withDl.length*100) : null,
        avgDays: durs.length ? durs.reduce((a,b)=>a+b,0)/durs.length : null,
        openShare: openAll.length ? Math.round(open.length/openAll.length*100) : 0};
    }).sort((a,b)=> b.overdue-a.overdue || b.open-a.open || b.total-a.total);
    // «Тормозит проект»: у кого больше всего просроченных открытых задач (если просрочек нет — у кого больше всего открытых).
    let bottleneck = null;
    const worstOverdue = rows.filter(r=>r.overdue>0).sort((a,b)=>b.overdue-a.overdue || b.open-a.open)[0];
    if(worstOverdue) bottleneck = {row:worstOverdue, kind:'overdue'};
    else {
      const byOpen = rows.filter(r=>r.open>0).sort((a,b)=>b.open-a.open);
      // Показываем только если лидер по открытым задачам один (при равенстве «виноватого» нет).
      if(byOpen.length>1 && byOpen[0].open>byOpen[1].open) bottleneck = {row:byOpen[0], kind:'open'};
    }
    const done = pt.filter(t=>t.status==='done').length;
    return {project:p, total:pt.length, done, open:openAll.length, overdue:openAll.filter(t=>t.status!=='review' && t.deadline && t.deadline<today).length,
      pct: Math.round(done/pt.length*100), rows, bottleneck};
  }).filter(Boolean).sort((a,b)=> b.overdue-a.overdue || b.open-a.open || a.project.name.localeCompare(b.project.name,'ru'));
}
// Детализация: у каждого сотрудника — сколько задач в каждом проекте (всего / в работе / готово / просрочено).
function computeEmployeeProjectStats(tasks, employees, projects, today){
  const projName = id => { const p = projects.find(x=>x.id===id); return p ? p.name : 'Без проекта'; };
  const groups = employees.map(e=>({key:e.id, emp:e, tasks:tasks.filter(t=>t.assigneeId===e.id)}));
  groups.push({key:'none', emp:null, tasks:tasks.filter(t=>!t.assigneeId || !employees.some(e=>e.id===t.assigneeId))});
  return groups.filter(g=>g.tasks.length).map(g=>{
    const by = {};
    g.tasks.forEach(t=>{
      const name = t.projectId ? projName(t.projectId) : 'Без проекта';
      const r = by[name] = by[name] || {name, total:0, open:0, done:0, overdue:0};
      r.total++;
      if(t.status==='done') r.done++; else { r.open++; if(t.deadline && t.deadline<today) r.overdue++; }
    });
    const list = Object.values(by).sort((a,b)=> (a.name==='Без проекта') - (b.name==='Без проекта') || b.total-a.total || a.name.localeCompare(b.name,'ru'));
    return {emp:g.emp, total:g.tasks.length, open:list.reduce((n,r)=>n+r.open,0), done:list.reduce((n,r)=>n+r.done,0), overdue:list.reduce((n,r)=>n+r.overdue,0), projects:list};
  }).sort((a,b)=>b.total-a.total);
}

  const stats = computeEmployeeProjectStats(state.tasksWork, state.employees, state.projectsWork, todayISO());
  const lines = [['Сотрудник','Роль','Проект','Всего задач','В работе','Готово','Просрочено'].map(csvEscape).join(';')];

  downloadTextFile(`zadachi-po-proektam-${todayISO()}.csv`, 'text/csv;charset=utf-8', '\uFEFF'+lines.join('\n'));
}

/* ================= «ЗА ДЕНЬ»: что сотрудник сделал в выбранный день ================= */
// Задача считается «сданной в этот день», если исполнитель нажал «выполнено» в этот день (submittedAt).
// У задач, закрытых до появления этой отметки, берём дату закрытия (completedAt).
function taskSubmitDate(t){
  if(t.submittedAt) return t.submittedAt;
  if(t.status==='done' && t.completedAt) return String(t.completedAt).slice(0,10);
  return null;
}
function computeDayReview(tasks, employees, dayISO, today){
  const isOpen = t=> t.status==='progress' || t.status==='approval';
  const groups = employees.map(e=>({emp:e, ts:tasks.filter(t=>t.assigneeId===e.id)}));
  return groups.map(g=>{
    const submitted = g.ts.filter(t=> taskSubmitDate(t)===dayISO && (t.status==='review' || t.status==='done'))
      .sort((a,b)=>(a.title||'').localeCompare(b.title||'','ru'));
    // Что осталось: открытые задачи, срок которых наступил к концу выбранного дня (на сегодня и раньше).
    const left = g.ts.filter(t=> isOpen(t) && t.deadline && t.deadline<=dayISO);
    const dueDay = left.filter(t=>t.deadline===dayISO);
    const overdue = left.filter(t=>t.deadline<dayISO);
    const reworked = g.ts.filter(t=> t.status==='progress' && t.reworkNote && t.deadline && t.deadline<=dayISO).length;
    return {emp:g.emp, submitted, dueDay, overdue, left, reworked,
      waiting: submitted.filter(t=>t.status==='review').length, accepted: submitted.filter(t=>t.status==='done').length};
  }).filter(r=> r.submitted.length || r.left.length)
    .sort((a,b)=> b.submitted.length-a.submitted.length || b.left.length-a.left.length || a.emp.name.localeCompare(b.emp.name,'ru'));
}
